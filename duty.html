<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 지도 당번표 — 2026학년도 2학기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
    --shadow: 0 1px 0 rgba(38,43,37,0.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 20px 80px;
  }

  /* ---------- Header ---------- */
  header.page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.page-head h1{
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.page-head .term{
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Today hero ---------- */
  .hero{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 28px 26px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .hero-top{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .hero-date{
    font-family: 'Noto Serif KR', serif;
    display:flex;
    align-items: baseline;
    gap: 10px;
  }
  .hero-date .num{
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
  }
  .hero-date .rest{
    font-size: 17px;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }
  .stamp{
    font-family: 'Noto Serif KR', serif;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding-top: 5px;
    width: 58px;
    height: 66px;
    background: var(--stamp);
    clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%);
    color: #F8F4E8;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .event-badge{
    display:inline-block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--stamp);
    background: var(--stamp-soft);
    border: 1px solid rgba(158,58,44,0.25);
    border-radius: 3px;
    padding: 3px 9px;
    margin-bottom: 14px;
  }

  .duty-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule-soft);
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .duty-cell{
    background: var(--paper-card);
    padding: 14px 12px 16px;
    min-height: 92px;
  }
  .duty-cell .label{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .duty-cell .names{
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
  }
  .duty-cell .names .empty{
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .duty-cell .sub{
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .off-state{
    text-align:center;
    padding: 20px 10px 6px;
  }
  .off-state .big{
    font-family:'Noto Serif KR', serif;
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .off-state .reason{
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  /* ---------- Nav row ---------- */
  .nav-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .nav-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 8px 14px;
    cursor:pointer;
  }
  .nav-btn:hover{ border-color: var(--ink); }
  .nav-btn.primary{
    background: var(--ink);
    color: var(--paper-card);
    border-color: var(--ink);
  }
  .date-jump{
    margin-left: auto;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .date-jump input[type=date]{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 7px 8px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--paper-card);
    color: var(--ink);
  }

  /* ---------- Search ---------- */
  .search-block{
    border-top: 1px solid var(--rule);
    padding-top: 22px;
    margin-bottom: 26px;
  }
  .search-block h2{
    font-family:'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .search-block p.hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }
  .search-row{
    display:flex;
    gap: 8px;
  }
  .search-row input[type=text]{
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--paper-card);
    color: var(--ink);
  }
  .search-results{
    margin-top: 14px;
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .search-results .empty-msg{
    font-size: 13px;
    color: var(--ink-soft);
    padding: 6px 2px;
  }
  .result-row{
    display:flex;
    align-items:baseline;
    gap: 10px;
    font-size: 13.5px;
    padding: 8px 10px;
    background: var(--paper-card);
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
  }
  .result-row .rdate{
    font-family:'Noto Serif KR', serif;
    font-weight: 600;
    flex-shrink:0;
    width: 92px;
  }
  .result-row .rrole{
    color: var(--brass);
    font-weight: 600;
    background: var(--brass-soft);
    border-radius: 2px;
    padding: 1px 6px;
    font-size: 12px;
    flex-shrink:0;
  }
  .result-row .rother{
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  /* ---------- Full list ---------- */
  .list-block h2{
    font-family:'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 14px;
    border-top: 1px solid var(--rule);
    padding-top: 22px;
  }
  details.month-group{
    border-bottom: 1px solid var(--rule-soft);
  }
  details.month-group summary{
    list-style:none;
    cursor:pointer;
    padding: 12px 4px;
    font-family:'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 14.5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  details.month-group summary::-webkit-details-marker{ display:none; }
  details.month-group summary .count{
    font-family:'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-soft);
  }
  details.month-group summary::after{
    content: '▾';
    color: var(--ink-soft);
    font-size: 11px;
    margin-left: 8px;
  }
  details.month-group[open] summary::after{ content:'▴'; }

  table.duty-table{
    width:100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-bottom: 10px;
  }
  table.duty-table th{
    text-align:left;
    font-weight: 500;
    color: var(--ink-soft);
    font-size: 11.5px;
    padding: 5px 6px;
    border-bottom: 1px solid var(--rule);
  }
  table.duty-table td{
    padding: 6px 6px;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }
  table.duty-table tr.is-today td{
    background: var(--stamp-soft);
  }
  table.duty-table tr.is-match td{
    background: var(--brass-soft);
  }
  table.duty-table td.d{
    white-space:nowrap;
    font-weight: 600;
    font-family:'Noto Serif KR', serif;
  }
  table.duty-table td.wd{
    color: var(--ink-soft);
    width: 22px;
  }
  table.duty-table td.holiday-note{
    color: var(--ink-soft);
    font-style: italic;
  }

  footer{
    margin-top: 40px;
    font-size: 11.5px;
    color: var(--ink-soft);
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }

  @media (max-width: 520px){
    .duty-grid{ grid-template-columns: repeat(2, 1fr); }
    .hero-date .num{ font-size: 40px; }
    .date-jump{ margin-left:0; width:100%; }
    table.duty-table{ font-size: 11.5px; }
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
</head>

  </div>

</div>

function pad(n){ return n.toString().padStart(2,'0'); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}

const byDate = {};
DUTY_DATA.forEach(d => byDate[d.date] = d);
const sortedDates = DUTY_DATA.map(d => d.date);

let currentKey = toKey(new Date());
if(!byDate[currentKey]){
  // if today isn't in the dataset (weekend/out of range), find nearest upcoming or most recent entry for the hero fallback logic
}

function nearestIndex(key){
  // binary-ish search for closest date <= key, else first
  let idx = sortedDates.findIndex(k => k >= key);
  if(idx === -1) idx = sortedDates.length - 1;
  return idx;
}

function renderHero(key){
  const hero = document.getElementById('hero');
  const entry = byDate[key];
  const dateObj = parseKey(key);
  const isToday = key === toKey(new Date());
  const wdNames = ['일','월','화','수','목','금','토'];

  if(!entry){
    hero.innerHTML = `
      <div class="hero-top">
        <div class="hero-date">
          <span class="num">${dateObj.getMonth()+1}.${dateObj.getDate()}</span>
          <span class="rest">${wdNames[dateObj.getDay()]}요일</span>
        </div>
        ${isToday ? '<div class="stamp">오늘</div>' : ''}
      </div>
      <div class="off-state">
        <div class="big">등록된 지도 일정이 없는 날입니다</div>
        <div class="reason">주말이거나 2학기 지도 일정표(8/17~2/5) 범위 밖의 날짜예요.</div>
      </div>`;
    return;
  }

  const allEmpty = !entry.front1 && !entry.front2 && !entry.back && !entry.lunch1 && !entry.lunch2 && !entry.night;

  let inner = `
    <div class="hero-top">
      <div class="hero-date">
        <span class="num">${dateObj.getMonth()+1}.${dateObj.getDate()}</span>
        <span class="rest">${entry.weekday}요일</span>
      </div>
      ${isToday ? '<div class="stamp">오늘</div>' : ''}
    </div>`;

  if(entry.event){
    inner += `<div class="event-badge">${entry.event}</div>`;
  }

  if(allEmpty){
    const reason = entry.nightNote || entry.event || '학사일정';
    inner += `
      <div class="off-state">
        <div class="big">지도 당번이 없는 날입니다</div>
        <div class="reason">사유: ${reason}</div>
      </div>`;
  } else {
    const cell = (label, names, subNote) => {
      const list = names.filter(Boolean);
      const body = list.length
        ? `<div class="names">${list.join('<br>')}</div>`
        : `<div class="names"><span class="empty">배정 없음</span></div>`;
      const sub = subNote ? `<div class="sub">${subNote}</div>` : '';
      return `<div class="duty-cell"><div class="label">${label}</div>${body}${sub}</div>`;
    };
    inner += `<div class="duty-grid">
      ${cell('정문', [entry.front1, entry.front2])}
      ${cell('후문', [entry.back])}
      ${cell('중식', [entry.lunch1, entry.lunch2])}
      ${cell('야자', [entry.night], entry.nightNote && !entry.night ? entry.nightNote : (entry.nightNote || ''))}
    </div>`;
  }

  hero.innerHTML = inner;
}

function stepDay(delta){
  const idx = sortedDates.indexOf(currentKey);
  let newIdx;
  if(idx === -1){
    newIdx = nearestIndex(currentKey) + (delta > 0 ? 0 : -1);
  } else {
    newIdx = idx + delta;
  }
  newIdx = Math.max(0, Math.min(sortedDates.length - 1, newIdx));
  currentKey = sortedDates[newIdx];
  document.getElementById('datePick').value = currentKey;
  renderHero(currentKey);
  highlightTable();
}

document.getElementById('btnPrev').addEventListener('click', () => stepDay(-1));
document.getElementById('btnNext').addEventListener('click', () => stepDay(1));
document.getElementById('btnToday').addEventListener('click', () => {
  currentKey = toKey(new Date());
  document.getElementById('datePick').value = currentKey;
  renderHero(currentKey);
  highlightTable();
});
document.getElementById('datePick').addEventListener('change', (e) => {
  if(e.target.value){
    currentKey = e.target.value;
    renderHero(currentKey);
    highlightTable();
  }
});

const byMonth = {};
DUTY_DATA.forEach(d => {
  const [y,m] = d.date.split('-');
  const mk = y+'-'+m;
  if(!byMonth[mk]) byMonth[mk] = [];
  byMonth[mk].push(d);
});

const todayKey = toKey(new Date());

Object.keys(byMonth).sort().forEach(mk => {
  const [y,m] = mk.split('-').map(Number);
  const entries = byMonth[mk];
  const details = document.createElement('details');
  details.className = 'month-group';
  details.dataset.monthKey = mk;
  if(entries.some(e => e.date === todayKey)) details.open = true;

  const summary = document.createElement('summary');
  summary.innerHTML = `<span>${y}년 ${MONTH_NAMES[m]}</span><span class="count">${entries.length}일</span>`;
  details.appendChild(summary);

  const table = document.createElement('table');
  table.className = 'duty-table';
  table.innerHTML = `<thead><tr>
    <th>날짜</th><th></th><th>정문</th><th>후문</th><th>중식</th><th>야자</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');

  entries.forEach(e => {
    const tr = document.createElement('tr');
    tr.dataset.date = e.date;
    const dateObj = parseKey(e.date);
    const allEmpty = !e.front1 && !e.front2 && !e.back && !e.lunch1 && !e.lunch2 && !e.night;
    if(allEmpty){
      tr.innerHTML = `<td class="d">${dateObj.getMonth()+1}/${dateObj.getDate()}</td>
        <td class="wd">${e.weekday}</td>
        <td colspan="4" class="holiday-note">${e.nightNote || e.event || '지도 없음'}</td>`;
    } else {
      const fmt = (v) => v ? v : '<span style="color:var(--ink-soft)">-</span>';
      const gate = [e.front1, e.front2].filter(Boolean).join(', ') || '<span style="color:var(--ink-soft)">-</span>';
      const lunch = [e.lunch1, e.lunch2].filter(Boolean).join(', ') || '<span style="color:var(--ink-soft)">-</span>';
      const night = e.night ? e.night : (e.nightNote ? `<span style="color:var(--ink-soft);font-style:italic;">${e.nightNote}</span>` : '<span style="color:var(--ink-soft)">-</span>');
      tr.innerHTML = `<td class="d">${dateObj.getMonth()+1}/${dateObj.getDate()}</td>
        <td class="wd">${e.weekday}</td>
        <td>${gate}</td>
        <td>${fmt(e.back)}</td>
        <td>${lunch}</td>
        <td>${night}</td>`;
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  details.appendChild(table);
  monthGroupsEl.appendChild(details);
});

function highlightTable(){
  document.querySelectorAll('table.duty-table tr').forEach(tr => {
    tr.classList.toggle('is-today', tr.dataset.date === todayKey);
  });
  const details = document.querySelector(`details.month-group[data-month-key="${currentKey.slice(0,7)}"]`);
  if(details) details.open = true;
  const tr = document.querySelector(`table.duty-table tr[data-date="${currentKey}"]`);
  if(tr && typeof tr.scrollIntoView === 'function') tr.scrollIntoView({block:'nearest'});
}

// ---------- Name search ----------
const nameSearchEl = document.getElementById('nameSearch');
const searchResultsEl = document.getElementById('searchResults');

function runSearch(name){
  document.querySelectorAll('table.duty-table tr').forEach(tr => tr.classList.remove('is-match'));
  searchResultsEl.innerHTML = '';
  const q = name.trim();
  if(!q){
    return;
  }
  const roleLabel = {front1:'정문', front2:'정문', back:'후문', lunch1:'중식', lunch2:'중식', night:'야자'};
  const matches = [];
  DUTY_DATA.forEach(e => {
    ['front1','front2','back','lunch1','lunch2','night'].forEach(field => {
      if(e[field] && e[field] === q){
        matches.push({date: e.date, weekday: e.weekday, role: roleLabel[field]});
      }
    });
  });

  if(matches.length === 0){
    searchResultsEl.innerHTML = `<div class="empty-msg">"${q}" 님의 지도 일정을 찾을 수 없습니다. 이름을 정확히 입력했는지 확인해 주세요.</div>`;
    return;
  }

  searchResultsEl.innerHTML = `<div class="empty-msg">총 ${matches.length}건</div>`;
  matches.forEach(m => {
    const dateObj = parseKey(m.date);
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `<span class="rdate">${dateObj.getMonth()+1}.${dateObj.getDate()}(${m.weekday})</span><span class="rrole">${m.role}</span>`;
    row.addEventListener('click', () => {
      currentKey = m.date;
      document.getElementById('datePick').value = currentKey;
      renderHero(currentKey);
      highlightTable();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    searchResultsEl.appendChild(row);

    const tr = document.querySelector(`table.duty-table tr[data-date="${m.date}"]`);
    if(tr) tr.classList.add('is-match');
  });
}

nameSearchEl.addEventListener('input', (e) => runSearch(e.target.value));

// ---------- init ----------
document.getElementById('datePick').value = currentKey;
renderHero(currentKey);
highlightTable();
nameSearchEl.value = '';
</script>
</body>
</html>
