<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22;
    --crest-red-soft: rgba(238,46,34,0.08);
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 1440px; margin: 0 auto; padding: 24px 24px 60px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px; margin-bottom: 16px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:20px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head a.back{ font-size: 12.5px; color: var(--ink-soft); text-decoration:none; }
  header.page-head a.back:hover{ color: var(--ink); }

  .view-switch{ display:flex; width:fit-content; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; margin-bottom:14px; }
  .view-switch a{ font-family:'Noto Sans KR', sans-serif; font-size:13px; font-weight:700; padding:8px 20px; text-decoration:none; color:var(--ink); background:var(--paper-card); }
  .view-switch a.active{ background:var(--ink); color:#fff; cursor:default; }

  .toggle-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .toggle-btn{
    font-family:'Noto Sans KR', sans-serif; font-size:13px; font-weight:700;
    background: var(--paper-card); color: var(--ink-soft); border:1.5px solid var(--rule);
    border-radius: 20px; padding: 8px 16px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .toggle-btn .sw{ width:9px; height:9px; border-radius:50%; background:var(--rule); display:inline-block; }
  .toggle-btn.tg-tasks.active{ background: var(--crest-red-soft); color: var(--crest-red); border-color: var(--crest-red); }
  .toggle-btn.tg-tasks.active .sw{ background: var(--crest-red); }
  .toggle-btn.tg-gcal.active{ background: var(--stamp-soft); color: var(--stamp); border-color: var(--stamp); }
  .toggle-btn.tg-gcal.active .sw{ background: var(--stamp); }
  .toggle-btn.tg-academic.active{ background: var(--brass-soft); color: var(--brass); border-color: var(--brass); }
  .toggle-btn.tg-academic.active .sw{ background: var(--brass); }

  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px; gap: 10px;
  }
  .week-nav .title{
    font-family:'Noto Sans KR', sans-serif; font-size: 17px; font-weight:700;
    min-width: 160px; text-align:center;
  }
  .nav-btns{ display:flex; gap:8px; align-items:center; }
  .nav-btn{
    font-family:'Noto Sans KR', sans-serif; font-size:13.5px; font-weight:500;
    color: var(--paper-card); background: var(--ink);
    border: none; border-radius: 6px; padding: 9px 14px; cursor:pointer;
  }
  .nav-btn.arrow{ padding: 9px 12px; font-size:15px; }
  .nav-btn.today{ background: var(--stamp); }

  .task-section{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; margin-bottom:18px; }
  .task-section h2{ font-family:'Noto Sans KR', sans-serif; font-size:15px; margin:0 0 10px; }
  .task-day-group{ margin-bottom:8px; }
  .task-day-group:last-child{ margin-bottom:0; }
  .task-day-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .task-item{
    display:flex; align-items:center; gap:8px; font-size:12.5px; padding:3px 0;
  }
  .task-item .src{
    font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:10px;
    background: var(--crest-red-soft); color: var(--crest-red); white-space:nowrap;
  }
  .task-item .time{ font-size:11px; color:var(--ink-soft); min-width:38px; }
  .task-empty{ font-size:12px; color:#C4C0AC; }

  .week-grid{
    display:flex; flex-direction:column;
    border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--paper-card);
  }
  .week-row{ display:flex; }
  .week-gutter{ flex:0 0 52px; }
  .week-day-head{
    flex:1; min-width:0; text-align:center; padding:8px 2px;
    border-left:1px solid var(--rule-soft); border-bottom:1px solid var(--rule);
    background: var(--brass-soft);
  }
  .week-day-head.clickable{ cursor:pointer; }
  .week-day-head.clickable:hover{ background: var(--stamp-soft); }
  .week-day-head .wd{ font-size:11px; font-weight:600; color:var(--ink-soft); }
  .week-day-head .dnum{ font-size:15px; font-weight:700; }
  .week-day-head.sun .dnum{ color:var(--crest-red); }
  .week-day-head.sat .dnum{ color:var(--stamp); }
  .week-day-head.today{ background: var(--stamp-soft); }
  .week-day-head.today .dnum{ color:var(--stamp); }

  .week-allday-row{ border-bottom:1px solid var(--rule); min-height:26px; }
  .week-allday-cell{
    flex:1; min-width:0; border-left:1px solid var(--rule-soft); padding:2px 3px;
  }
  .week-allday-tag{
    display:block; font-size:10px; font-weight:600; line-height:1.4;
    border-radius:3px; padding:1px 5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .week-allday-tag.tag-academic{ background: var(--brass-soft); color: var(--brass); }
  .week-allday-tag.tag-gcal{ background: var(--stamp-soft); color: var(--stamp); }

  .week-body-row{ position:relative; }
  .week-hourlabels{ flex:0 0 52px; }
  .week-hour-label{
    height: 44px; font-size:10px; color:var(--ink-soft); text-align:right; padding:2px 6px 0 0;
    border-top:1px solid var(--rule-soft); box-sizing:border-box;
  }
  .week-daycol-wrap{ flex:1; display:flex; }
  .week-day-col{
    flex:1; min-width:0; position:relative; border-left:1px solid var(--rule-soft);
    background-image: repeating-linear-gradient(180deg, var(--rule-soft), var(--rule-soft) 1px, transparent 1px, transparent 44px);
  }
  .week-event{
    position:absolute;
    background: var(--stamp-soft); border-left:3px solid var(--stamp); border-radius:4px;
    padding:2px 4px; font-size:10px; line-height:1.3; overflow:hidden; cursor:pointer;
  }
  .week-event .t{ font-weight:700; display:block; }
  .week-allday-tag{ cursor:pointer; }

  .footnote{ margin-top: 16px; font-size: 11px; color: var(--ink-soft); line-height:1.6; }

  .event-modal-overlay{ position:fixed; inset:0; background:rgba(38,43,37,0.45); z-index:10000; }
  .event-modal{
    position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
    width:min(360px, 88vw); background:var(--paper-card); border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.25); z-index:10001; padding:18px 20px;
  }
  .event-modal .em-badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; margin-bottom:8px; }
  .event-modal .em-badge.tag-academic{ background: var(--brass-soft); color: var(--brass); }
  .event-modal .em-badge.tag-gcal{ background: var(--stamp-soft); color: var(--stamp); }
  .event-modal .em-title{ font-size:15px; font-weight:700; margin-bottom:6px; word-break:keep-all; }
  .event-modal .em-time{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .event-modal .em-close{ display:block; margin-left:auto; }

  /* 대시보드의 주간 캘린더 위젯이 이 페이지를 ?widget=1 로 iframe에 넣을 때: 헤더·
     안내문·보기 전환·필터·할 일 목록을 걷어내고 주 이동과 시간표만 꽉 채워 보여줘요. */
  body.widget-mode{ background:var(--paper-card); }
  body.widget-mode .wrap{ max-width:none; padding:10px; height:100vh; display:flex; flex-direction:column; }
  body.widget-mode header.page-head, body.widget-mode .footnote,
  body.widget-mode .view-switch, body.widget-mode .toggle-row, body.widget-mode .task-section{ display:none; }
  body.widget-mode .week-grid{ flex:1; min-height:0; overflow:auto; }
  /* 위젯 칸은 화면보다 훨씬 좁으니, 이동 버튼과 시간표 글자 크기를 줄여서 좁은 칸
     안에서도 더 잘 보이게 해요. */
  body.widget-mode .week-nav{ margin-bottom:8px; }
  body.widget-mode .week-nav .title{ font-size:13px; min-width:110px; }
  body.widget-mode .nav-btn{ font-size:11px; padding:6px 9px; }
  body.widget-mode .nav-btn.arrow{ padding:6px 8px; font-size:12px; }
  body.widget-mode .week-day-head .dnum{ font-size:12px; }
  body.widget-mode .week-hour-label{ font-size:9px; }
</style>

<style>
  :root{
    --ks-bg: #F3F5FC; --ks-card: #FFFFFF; --ks-ink: #1F2440; --ks-ink-soft: #6B7290;
    --ks-line: #E3E6F5; --ks-line-soft: #EEF0FA; --ks-primary: #4C5FF0; --ks-primary-dark: #3747C9;
    --ks-primary-soft: #EEF0FF; --ks-purple: #8B5CF6; --ks-purple-soft: #F3ECFE;
    --ks-shadow-sm: 0 1px 2px rgba(31,36,64,0.04), 0 1px 3px rgba(31,36,64,0.06);
    --ks-sidebar-w: 238px;
  }
  .ks-app{ display:flex; min-height:100vh; background:var(--ks-bg);
    background-image: radial-gradient(640px 420px at 100% -10%, rgba(124,108,240,0.10), transparent 60%),
                       radial-gradient(520px 360px at -5% 100%, rgba(91,110,245,0.08), transparent 60%);
    background-attachment: fixed; font-family:'Noto Sans KR', sans-serif;
  }
  .ks-sidebar{ width: var(--ks-sidebar-w); flex-shrink:0; background: var(--ks-card);
    border-right: 1px solid var(--ks-line); display:flex; flex-direction:column;
    padding: 20px 14px; position: sticky; top:0; height:100vh; }
  .ks-brand{ display:flex; align-items:center; gap:10px; padding: 4px 8px 20px; }
  .ks-brand-icon{ width:34px; height:34px; border-radius:11px; flex-shrink:0;
    background: linear-gradient(120deg, #5B6EF5, #7C6CF0); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; }
  .ks-brand-text{ font-weight:800; font-size:15px; letter-spacing:-0.01em; color:var(--ks-ink); }
  .ks-nav{ display:flex; flex-direction:column; gap:3px; }
  .ks-nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px;
    text-decoration:none; font-size:13.5px; font-weight:600; color: var(--ks-ink-soft); }
  .ks-nav-item:hover{ background: var(--ks-line-soft); color: var(--ks-ink); }
  .ks-nav-item.active{ background: var(--ks-primary-soft); color: var(--ks-primary-dark); }
  .ks-nav-ico{ width:20px; text-align:center; font-size:14.5px; flex-shrink:0; }
  .ks-nav-sep{ height:1px; background: var(--ks-line-soft); margin:10px 4px; }
  .ks-sidebar-foot{ margin-top:auto; display:flex; align-items:flex-start; gap:8px; font-size:11.5px;
    color: var(--ks-ink-soft); padding:12px 8px 2px; border-top:1px solid var(--ks-line-soft); }
  .ks-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .ks-topbar{ display:flex; align-items:center; gap:14px; padding: 14px 28px;
    background: var(--ks-card); border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:5; }
  .ks-search{ flex:1; max-width:460px; display:flex; align-items:center; gap:8px;
    background: var(--ks-bg); border:1px solid var(--ks-line); border-radius:14px; padding: 9px 14px; }
  .ks-search input{ border:none; outline:none; background:none; flex:1; font-family:inherit; font-size:13.5px; color:var(--ks-ink); }
  .ks-search input::placeholder{ color: var(--ks-ink-soft); }
  .ks-bell{ position:relative; width:38px; height:38px; border-radius:12px; border:1px solid var(--ks-line);
    background:var(--ks-card); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0; }
  .ks-bell-dot{ position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background:#EE4B4B; border:1.5px solid var(--ks-card); }
  .ks-user{ display:flex; align-items:center; gap:9px; flex-shrink:0; white-space:nowrap; color:var(--ks-ink); }
  .ks-user-avatar{ width:30px; height:30px; border-radius:50%; background: var(--ks-purple-soft); color: var(--ks-purple);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0; }
  .ks-user a.login-link{ font-weight:700; color: var(--ks-primary); text-decoration:none; font-size:13.5px; }
  .ks-user-name{ font-size:13px; font-weight:700; }
  .ks-mobile-topbar{ display:none; }
  .ks-content-inner{ flex:1; min-width:0; }
  @media (max-width: 880px){
    .ks-app{ flex-direction:column; } .ks-sidebar{ display:none; } .ks-topbar{ display:none; }
    .ks-mobile-topbar{ display:flex; align-items:center; gap:4px; padding:10px 14px; background: var(--ks-card);
      border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:6; }
    .ks-mobile-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      font-size:16px; background:none; border:none; cursor:pointer; text-decoration:none; color:var(--ks-ink); }
    .ks-mobile-icon:hover{ background: var(--ks-line-soft); }
    .ks-mobile-spacer{ flex:1; }
    .ks-mobile-login{ font-size:12.5px; font-weight:700; color: var(--ks-primary); text-decoration:none; padding:0 6px; }
    .ks-sidebar.ks-mobile-open{ display:flex; position:fixed; z-index:30; top:0; left:0; height:100vh;
      box-shadow: 0 0 0 9999px rgba(20,24,50,0.45); }
  }
  .gsnav-burger, .gsnav-home-btn, .gsnav-mypage-btn, .gsnav-search-btn, #site-login-badge{ display:none !important; }

  /* 글꼴 + 모서리 둥글게 */
  *, *::before, *::after{ font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif !important; }

  /* 버튼: 밋밋한 흰색 보조 버튼에 은은한 색(인디고 20% 배경 + 진한 인디고 글자) */
  .btn.secondary, .btn-secondary, .nav-btn:not(.primary){
    background: rgba(76,95,240,0.2) !important; color:#20296B !important;
    border-color: rgba(76,95,240,0.3) !important; border-radius:9px !important;
  }
</style>

<style>
  /* 이 페이지가 다른 페이지 안에 ?widget= 로 iframe 임베드될 때는(이미 그 페이지
     자신의 JS가 body에 widget-mode 클래스를 붙여요) 새 셸도 함께 숨겨서, 원래의
     "헤더 없이 내용만 꽉 채우는" 위젯 레이아웃이 그대로 유지되게 해요. */
  body.widget-mode .ks-sidebar, body.widget-mode .ks-topbar, body.widget-mode .ks-mobile-topbar{ display:none !important; }
  body.widget-mode .ks-app{ display:block !important; min-height:0 !important; background:none !important; background-image:none !important; }
  body.widget-mode .ks-content-inner{ padding:0 !important; }
</style>
</head>

  <div class="ks-main">
    <header class="ks-topbar">
      <div class="ks-search"><span>🔍</span><input type="text" id="ksTopSearch" placeholder="메뉴명 또는 키워드를 검색하세요." autocomplete="off" readonly></div>

    <div class="ks-content-inner">

  <div class="wrap">
    <header class="page-head">
      <h1>주간 캘린더</h1>
      <a class="back" href="./index.html">← 메인으로</a>

    <div class="view-switch">
      <a href="./calendar.html" id="viewSwitchMonth">월보기</a>
      <a href="#" id="viewSwitchWeek">주보기</a>

    <div class="week-nav">

      "내 할일"은 로그인 상태와, Microsoft To Do·Google Tasks를 이전에 연결한 적이 있는지에 따라 표시되는 항목이 달라질 수 있어요. 시간표는 07:00~21:00 범위로 표시돼요. 칸이 좁아 잘린 일정은 눌러서 전체 내용을 볼 수 있어요.

  <div class="event-modal-overlay" id="eventModalOverlay" style="display:none;"></div>
  <div class="event-modal" id="eventModal" style="display:none;">
    <span class="em-badge" id="emBadge"></span>
    <div class="em-title" id="emTitle"></div>
    <div class="em-time" id="emTime"></div>
    <button type="button" class="btn secondary small em-close" id="eventModalClose">닫기</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="./cal-shared.js"></script>
<script>
// 대시보드의 주간 캘린더 위젯이 iframe으로 이 페이지를 ?widget=1로 불러오면,
// 헤더·안내문을 숨기고 시간표만 꽉 채워 보여줘요.
if(new URLSearchParams(location.search).get('widget') === '1'){
  document.body.classList.add('widget-mode');
}
const wdNames = ['일','월','화','수','목','금','토'];
const HOUR_START = 7, HOUR_END = 21; // 07:00 ~ 21:00 표시
const HOUR_PX = 44;

function pad(n){ return String(n).padStart(2,'0'); }
function fmtKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function keyOf(d){ return fmtKey(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseQueryDate(){
  const params = new URLSearchParams(location.search);
  const d = params.get('d');
  if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const [y,m,dd] = d.split('-').map(Number);
    return new Date(y, m-1, dd);
  }
  return new Date();
}

let anchor = parseQueryDate();
const isDayView = new URLSearchParams(location.search).get('view') === 'day';
let toggles = { tasks: true, gcal: true, academic: true };
let gcalByDate = {};
let taskByDate = {};
let loadToken = 0;

const EVENTS_BY_DATE = {"2025-03-02": ["대체공휴일"], "2025-03-03": ["입학식시업식"], "2025-04-01": ["수련수학"], "2025-04-02": ["수련수학자율"], "2025-04-03": ["수련수학체험"], "2025-04-23": ["중간"], "2025-04-24": ["중간"], "2025-04-27": ["중간"], "2025-04-28": ["중간"], "2025-04-29": ["중간"], "2025-05-01": ["근로자의날"], "2025-05-04": ["재량휴업일"], "2025-05-05": ["어린이날"], "2025-05-15": ["체육한마당"], "2025-05-25": ["대체공휴일"], "2025-06-03": ["지방선거일"], "2025-07-01": ["기말"], "2025-07-02": ["기말"], "2025-07-03": ["기말"], "2025-07-06": ["기말"], "2025-07-07": ["기말"], "2025-07-17": ["제헌절"], "2025-07-22": ["여름방학"], "2025-07-23": ["여름방학"], "2025-07-24": ["여름방학"], "2026-08-10": ["여름방학"], "2026-08-11": ["여름방학"], "2026-08-12": ["여름방학"], "2026-08-13": ["여름방학"], "2026-08-14": ["여름방학"], "2026-08-17": ["대체휴일"], "2026-08-18": ["개학식"], "2026-09-24": ["추석연휴"], "2026-09-25": ["추석"], "2026-09-28": ["중간고사"], "2026-09-29": ["중간고사"], "2026-09-30": ["중간고사"], "2026-10-01": ["중간고사"], "2026-10-02": ["중간고사"], "2026-10-05": ["대체휴일"], "2026-10-09": ["한글날"], "2026-10-22": ["용마제"], "2026-10-23": ["개교기념일"], "2026-11-19": ["대수능"], "2026-11-20": ["재량휴업일"], "2026-11-24": ["기말"], "2026-11-25": ["기말"], "2026-11-26": ["기말"], "2026-11-27": ["기말"], "2026-11-30": ["기말"], "2026-12-14": ["기말고사"], "2026-12-15": ["기말고사"], "2026-12-16": ["기말고사"], "2026-12-17": ["기말고사"], "2026-12-18": ["기말고사"], "2026-12-25": ["성탄절"], "2027-01-01": ["신정"], "2026-01-26": ["겨울방학"], "2026-01-27": ["겨울방학"], "2026-01-28": ["겨울방학"], "2026-01-29": ["겨울방학"], "2026-01-30": ["겨울방학"], "2026-11-18": ["수능준비"], "2026-12-31": ["겨울방학"], "2027-01-26": ["겨울방학"], "2027-01-27": ["겨울방학"], "2027-01-28": ["겨울방학"], "2027-01-29": ["겨울방학"], "2027-01-30": ["겨울방학"], "2027-02-05": ["종업식"]};

function weekDays(){
  const start = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  start.setDate(start.getDate() - start.getDay()); // 이번 주 일요일부터
  const days = [];
  for(let i = 0; i < 7; i++){ const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  return days;
}

// 일보기 모드에서는 요일 전체가 아니라 anchor 날짜 하루만 보여줘요.
function visibleDays(){
  return isDayView ? [new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate())] : weekDays();
}

function renderToggleButtons(){
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.classList.toggle('active', !!toggles[btn.dataset.key]);
  });
}

function renderTaskSection(days){
  const tKey = todayKey();
  const wrap = document.getElementById('taskList');
  if(!toggles.tasks){
    wrap.innerHTML = '<div class="task-empty">"내 할일" 표시가 꺼져 있어요.</div>';
    return;
  }
  let any = false;
  const html = days.map(d => {
    const key = keyOf(d);
    const items = (taskByDate[key] || []).slice().sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
    if(!items.length) return '';
    any = true;
    return `<div class="task-day-group">
      <div class="task-day-label">${d.getMonth()+1}/${d.getDate()} (${wdNames[d.getDay()]})${key===tKey?' · 오늘':''}</div>
      ${items.map(it => `<div class="task-item">${it.time ? `<span class="time">${it.time}</span>` : '<span class="time"></span>'}<span class="src">${escapeHtml(it.source)}</span><span>${escapeHtml(it.title)}</span></div>`).join('')}
    </div>`;
  }).join('');
  wrap.innerHTML = any ? html : '<div class="task-empty">이번주에 마감인 할 일이 없습니다.</div>';
}

function renderGrid(days){
  const tKey = todayKey();
  const grid = document.getElementById('weekGrid');

  const headRow = `<div class="week-row">
    <div class="week-gutter"></div>
    ${days.map(d => {
      const wd = d.getDay();
      let cls = 'week-day-head';
      if(wd===0) cls += ' sun'; else if(wd===6) cls += ' sat';
      if(keyOf(d)===tKey) cls += ' today';
      if(!isDayView) cls += ' clickable';
      return `<div class="${cls}" data-date="${keyOf(d)}"><div class="wd">${wdNames[wd]}</div><div class="dnum">${d.getDate()}</div></div>`;
    }).join('')}
  </div>`;

  const alldayRow = `<div class="week-row week-allday-row">
    <div class="week-gutter"></div>
    ${days.map(d => {
      const key = keyOf(d);
      const tags = [];
      if(toggles.academic) (EVENTS_BY_DATE[key]||[]).forEach(e => tags.push({cls:'tag-academic', label:'학사일정', text:e}));
      if(toggles.gcal) (gcalByDate[key]||[]).filter(e=>e.isAllDay).forEach(e => tags.push({cls:'tag-gcal', label:'학교 캘린더', text:e.summary}));
      return `<div class="week-allday-cell">${tags.map(t=>`<span class="week-allday-tag ${t.cls}" data-title="${escapeHtml(t.text)}" data-time="종일" data-badge="${t.label}" data-badge-cls="${t.cls}">${escapeHtml(t.text)}</span>`).join('')}</div>`;
    }).join('')}
  </div>`;

  const hourCount = HOUR_END - HOUR_START;
  const hourLabelsHtml = Array.from({length: hourCount}).map((_, i) => {
    const h = HOUR_START + i;
    return `<div class="week-hour-label">${pad(h)}:00</div>`;
  }).join('');

  // 방문자 브라우저의 시간대가 한국 시간이 아닐 수도 있어서(예: UTC), 항상 Asia/Seoul
  // 기준 시:분으로 명시적으로 변환해요. d.getHours()처럼 로컬 시간대에 의존하면
  // 다른 시간대 브라우저에서 일정 위치가 어긋나게 됩니다.
  function minutesFromGridStart(iso){
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(iso));
    const hh = Number(parts.find(p => p.type === 'hour').value) % 24;
    const mm = Number(parts.find(p => p.type === 'minute').value);
    return (hh - HOUR_START) * 60 + mm;
  }

  // 같은 날 시간이 겹치는 일정들을 나란히 배치할 수 있도록 "레인(lane)"을 배정해요.
  // 서로 겹치는 일정끼리 묶은 뒤(클러스터), 각 클러스터 안에서만 폭을 나눠 쓰도록 해서
  // 겹치지 않는 다른 시간대 일정은 원래 폭 그대로 넓게 표시돼요.
  function layoutDayEvents(events){
    const sorted = events.slice().sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);
    const clusters = [];
    let current = [], clusterEnd = -Infinity;
    sorted.forEach(ev => {
      if(current.length && ev.startMin >= clusterEnd){
        clusters.push(current);
        current = [];
        clusterEnd = -Infinity;
      }
      current.push(ev);
      clusterEnd = Math.max(clusterEnd, ev.endMin);
    });
    if(current.length) clusters.push(current);

    const placed = [];
    clusters.forEach(cluster => {
      const lanes = []; // lane index -> 그 레인 마지막 일정의 endMin
      cluster.forEach(ev => {
        let laneIdx = lanes.findIndex(endMin => endMin <= ev.startMin);
        if(laneIdx === -1){ laneIdx = lanes.length; lanes.push(ev.endMin); }
        else { lanes[laneIdx] = ev.endMin; }
        ev._lane = laneIdx;
      });
      const colCount = lanes.length;
      cluster.forEach(ev => placed.push(Object.assign({}, ev, { lane: ev._lane, colCount })));
    });
    return placed;
  }

  const dayColsHtml = days.map(d => {
    const key = keyOf(d);
    const totalMin = (HOUR_END - HOUR_START) * 60;
    const rawEvents = toggles.gcal ? (gcalByDate[key]||[]).filter(e => !e.isAllDay) : [];
    const prepped = rawEvents.map(e => {
      let startMin = e.startISO ? minutesFromGridStart(e.startISO) : 0;
      let endMin = e.endISO ? minutesFromGridStart(e.endISO) : (startMin + 30);
      startMin = Math.max(0, Math.min(totalMin, startMin));
      endMin = Math.max(startMin + 15, Math.min(totalMin, endMin));
      return Object.assign({}, e, { startMin, endMin });
    });
    const laidOut = layoutDayEvents(prepped);
    const evHtml = laidOut.map(e => {
      const top = (e.startMin / 60) * HOUR_PX;
      const height = ((e.endMin - e.startMin) / 60) * HOUR_PX;
      const posStyle = e.colCount > 1
        ? `left:calc(${(e.lane / e.colCount) * 100}% + 1px); width:calc(${100 / e.colCount}% - 2px);`
        : `left:2px; right:2px;`;
      const endTime = e.endISO ? e.endISO.slice(11, 16) : '';
      const timeRange = endTime ? `${e.time || ''} ~ ${endTime}` : (e.time || '');
      return `<div class="week-event" style="top:${top}px; height:${height}px; ${posStyle}" data-title="${escapeHtml(e.summary)}" data-time="${escapeHtml(timeRange)}" data-badge="학교 캘린더" data-badge-cls="tag-gcal"><span class="t">${e.time||''}</span>${escapeHtml(e.summary)}</div>`;
    }).join('');
    return `<div class="week-day-col" style="height:${hourCount * HOUR_PX}px;">${evHtml}</div>`;
  }).join('');

  const bodyRow = `<div class="week-row week-body-row">
    <div class="week-hourlabels">${hourLabelsHtml}</div>
    <div class="week-daycol-wrap">${dayColsHtml}</div>
  </div>`;

  grid.innerHTML = headRow + alldayRow + bodyRow;
}

function updateTitle(days){
  if(isDayView){
    const d = days[0];
    document.getElementById('weekTitle').textContent =
      `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${wdNames[d.getDay()]})`;
    return;
  }
  const first = days[0], last = days[6];
  document.getElementById('weekTitle').textContent =
    `${first.getFullYear()}.${pad(first.getMonth()+1)}.${pad(first.getDate())} ~ ${pad(last.getMonth()+1)}.${pad(last.getDate())}`;
}

function updateViewSwitchHref(){
  document.getElementById('viewSwitchMonth').href = `./calendar.html?y=${anchor.getFullYear()}&m=${anchor.getMonth() + 1}`;
  const weekTab = document.getElementById('viewSwitchWeek');
  const dayTab = document.getElementById('viewSwitchDay');
  if(isDayView){
    weekTab.href = './calendar-week.html?d=' + keyOf(anchor);
    weekTab.classList.remove('active');
    dayTab.style.display = '';
    dayTab.classList.add('active');
    dayTab.href = '#';
  } else {
    weekTab.href = '#';
    weekTab.classList.add('active');
    dayTab.style.display = 'none';
    dayTab.classList.remove('active');
  }
}

async function loadAndRender(){
  const myToken = ++loadToken;
  const days = visibleDays();
  updateTitle(days);
  updateViewSwitchHref();
  renderTaskSection(days); // 캐시된 데이터로 먼저 그려두고, 로드 완료되면 다시 그림
  renderGrid(days);

  const startKey = keyOf(days[0]), endKey = keyOf(days[days.length - 1]);
  const [gcal, tasks] = await Promise.all([
    window.KsCal ? KsCal.fetchGcalEvents(startKey, endKey) : {},
    window.KsCal ? KsCal.fetchAllMyTasks(startKey, endKey) : {}
  ]);
  if(myToken !== loadToken) return;
  gcalByDate = gcal;
  taskByDate = tasks;
  renderTaskSection(days);
  renderGrid(days);
}

document.getElementById('btnPrev').addEventListener('click', () => { anchor.setDate(anchor.getDate() - (isDayView ? 1 : 7)); loadAndRender(); });
document.getElementById('btnNext').addEventListener('click', () => { anchor.setDate(anchor.getDate() + (isDayView ? 1 : 7)); loadAndRender(); });
document.getElementById('btnToday').addEventListener('click', () => { anchor = new Date(); loadAndRender(); });

document.getElementById('toggleRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.toggle-btn');
  if(!btn) return;
  const key = btn.dataset.key;
  toggles[key] = !toggles[key];
  if(window.KsCal) KsCal.saveToggles(toggles);
  renderToggleButtons();
  renderTaskSection(visibleDays());
  renderGrid(visibleDays());
});

// 칸이 좁거나 짧아서 글자가 잘린 일정도 눌러서 전체 내용을 확인할 수 있게 해요.
function openEventModal(el){
  const badge = document.getElementById('emBadge');
  badge.textContent = el.dataset.badge || '';
  badge.className = 'em-badge ' + (el.dataset.badgeCls || '');
  document.getElementById('emTitle').textContent = el.dataset.title || '';
  document.getElementById('emTime').textContent = el.dataset.time || '';
  document.getElementById('eventModalOverlay').style.display = 'block';
  document.getElementById('eventModal').style.display = 'block';
}
function closeEventModal(){
  document.getElementById('eventModalOverlay').style.display = 'none';
  document.getElementById('eventModal').style.display = 'none';
}
document.getElementById('weekGrid').addEventListener('click', (e) => {
  const dayHead = e.target.closest('.week-day-head.clickable');
  if(dayHead){
    location.href = './calendar-week.html?d=' + dayHead.dataset.date + '&view=day';
    return;
  }
  const el = e.target.closest('.week-event, .week-allday-tag');
  if(!el) return;
  openEventModal(el);
});
document.getElementById('eventModalOverlay').addEventListener('click', closeEventModal);
document.getElementById('eventModalClose').addEventListener('click', closeEventModal);

(function init(){
  if(isDayView) document.getElementById('btnToday').textContent = '오늘';
  if(window.KsCal) toggles = KsCal.loadToggles();
  renderToggleButtons();
  loadAndRender();
})();
</script>

  </div>
</div>

})();
