<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교실 사용 신청 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --brass: #6E6234;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 560px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Serif KR', serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head a.back{ font-size: 12.5px; color: var(--ink-soft); text-decoration:none; }
  header.page-head a.back:hover{ color: var(--ink); }

  .form-card{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 24px 22px;
  }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block; font-size: 13px; font-weight:600; color: var(--ink); margin-bottom: 6px;
  }
  .field .hint{ font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .field input[type=text],
  .field input[type=date],
  .field input[type=time],
  .field select,
  .field textarea{
    width:100%;
    font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding: 10px 11px; border:1px solid var(--rule); border-radius:6px;
    background:#fff; color: var(--ink);
  }
  .field textarea{ resize: vertical; min-height: 64px; }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }

  .applicant-box{
    background: var(--brass-soft, rgba(110,98,52,0.08));
    border: 1px dashed var(--rule);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .applicant-box b{ color: var(--ink); }

  .submit-btn{
    width:100%;
    font-family:'Noto Serif KR', serif; font-size:15px; font-weight:700;
    color: var(--paper-card); background: var(--ink);
    border:none; border-radius:6px; padding: 13px; cursor:pointer;
    margin-top: 6px;
  }
  .submit-btn:disabled{ opacity:0.5; cursor:default; }

  .state-msg{
    text-align:center; padding: 20px 10px; font-size: 14px;
  }
  .state-msg.success{ color: var(--brass); }
  .state-msg.error{ color: var(--stamp); }
  .state-msg .big{
    font-family:'Noto Serif KR', serif; font-size: 16px; font-weight:700; margin-bottom:6px;
  }

  .footnote{
    margin-top: 18px; font-size: 11px; color: var(--ink-soft); line-height:1.6;
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <header class="page-head">
      <h1>교실 사용 신청</h1>
      <a class="back" href="./index.html">← 메인으로</a>
    </header>

    <div class="applicant-box" id="applicantBox">
      <div id="applicantAuto">신청자 확인 중…</div>
      <div id="applicantManual" style="display:none;">
        <label for="fApplicantName" style="display:block; font-size:12.5px; font-weight:600; margin-bottom:5px;">신청자 이름</label>
        <input type="text" id="fApplicantName" placeholder="이름을 입력해주세요" style="width:100%; font-family:'Noto Sans KR', sans-serif; font-size:14px; padding:9px 10px; border:1px solid var(--rule); border-radius:6px;">
      </div>
    </div>

    <div id="formArea">
      <div class="form-card">
        <div class="field">
          <label for="fDate">사용 날짜</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="fStart">시작 시각</label>
            <input type="time" id="fStart" required>
          </div>
          <div class="field">
            <label for="fEnd">종료 시각</label>
            <input type="time" id="fEnd" required>
          </div>
        </div>
        <div class="field">
          <label for="fRoom">사용 교실</label>
          <select id="fRoom" required>
            <option value="">선택해주세요</option>
            <option>작은 수학 교실</option>
            <option>큰 수학 교실</option>
            <option>영어 교실</option>
            <option>공용 교과</option>
            <option>컴퓨터실</option>
            <option>AI 교실</option>
            <option>꿈담 카페 1</option>
            <option>꿈담 카페 2</option>
            <option>꿈담 카페 3</option>
            <option>회의실</option>
            <option>도서관</option>
            <option>문화카페</option>
            <option>영어교과실</option>
            <option>수학교과실</option>
            <option>기타(직접입력)</option>
          </select>
        </div>
        <div class="field" id="fRoomOtherField" style="display:none">
          <label for="fRoomOther">교실 이름 직접 입력</label>
          <input type="text" id="fRoomOther" placeholder="예: 시청각실">
        </div>
        <div class="field">
          <label for="fPurpose">사용 목적 / 수업(활동)명</label>
          <input type="text" id="fPurpose" placeholder="예: 2학년 기초반 수업, OCC 진학컨설팅 등" required>
        </div>
        <div class="field">
          <label for="fNote">참고사항 (선택)</label>
          <textarea id="fNote" placeholder="필요한 경우 추가로 전달할 내용을 적어주세요"></textarea>
        </div>
        <button class="submit-btn" id="submitBtn">신청하기</button>
        <div class="hint" style="margin-top:10px;">신청 내용은 '교실 사용 일정' 시트의 <b>웹 신청 접수</b> 탭에 기록됩니다. 실제 시간표 반영은 별도 확인이 필요할 수 있어요.</div>
      </div>
    </div>

    <div class="footnote">
      제출 시 신청자 정보(이름·이메일)가 로그인 계정 기준으로 함께 기록됩니다.
    </div>
  </div>
</div>

<script>
// TODO: Apps Script 배포 후 발급되는 웹 앱 URL로 교체하세요.
const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

function waitForAuth(cb){
  if(window.__gsAuth){ cb(); } else { setTimeout(() => waitForAuth(cb), 150); }
}

waitForAuth(() => {
  const session = window.__gsAuth.getSession();
  const autoBox = document.getElementById('applicantAuto');
  const manualBox = document.getElementById('applicantManual');
  if(session){
    autoBox.innerHTML = '신청자: <b>' + (session.name || '') + '</b> (' + session.email + ')';
  } else {
    autoBox.style.display = 'none';
    manualBox.style.display = '';
  }
});

document.getElementById('fRoom').addEventListener('change', (e) => {
  document.getElementById('fRoomOtherField').style.display = (e.target.value === '기타(직접입력)') ? '' : 'none';
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  const session = window.__gsAuth ? window.__gsAuth.getSession() : null;
  let applicantName = session ? (session.name || '') : document.getElementById('fApplicantName').value.trim();
  const applicantEmail = session ? (session.email || '') : '';
  if(!applicantName){
    alert('신청자 이름을 입력해주세요.');
    return;
  }
  const date = document.getElementById('fDate').value;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  let room = document.getElementById('fRoom').value;
  const roomOther = document.getElementById('fRoomOther').value.trim();
  const purpose = document.getElementById('fPurpose').value.trim();
  const note = document.getElementById('fNote').value.trim();

  if(room === '기타(직접입력)'){ room = roomOther; }

  if(!date || !start || !end || !room || !purpose){
    alert('필수 항목을 모두 입력해주세요.');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '제출 중…';

  const payload = {
    date, start, end, room, purpose, note,
    applicantName: applicantName,
    applicantEmail: applicantEmail,
    credential: session ? (session.credential || '') : ''
  };

  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // Apps Script 웹앱은 단순 요청(text/plain)이 CORS에 안전합니다.
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data && data.result === 'ok'){
      document.getElementById('formArea').innerHTML =
        '<div class="form-card"><div class="state-msg success"><div class="big">신청이 접수되었습니다</div><div>' + room + ' · ' + date + ' ' + start + '~' + end + '</div></div></div>';
    } else {
      throw new Error((data && data.message) || '알 수 없는 오류');
    }
  } catch(err){
    document.getElementById('formArea').insertAdjacentHTML('afterbegin',
      '<div class="form-card" style="margin-bottom:12px;"><div class="state-msg error"><div class="big">제출에 실패했습니다</div><div>' + err.message + '</div></div></div>');
    btn.disabled = false;
    btn.textContent = '신청하기';
  }
});
</script>
</body>
</html>
