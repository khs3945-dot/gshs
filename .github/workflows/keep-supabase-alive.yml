name: Keep Supabase project awake

# Supabase 무료 플랜은 7일 동안 API/DB 요청이 전혀 없으면 프로젝트를 자동으로
# 일시정지시켜요(방학처럼 접속이 뜸한 기간에 특히 위험). 여기서 3일마다 가벼운
# 조회 요청을 하나 보내서, 이 "비활성" 타이머가 절대 7일에 닿지 않도록 해요.
# 여기서 쓰는 키는 공개용(anon/publishable) 키라서 이 저장소 다른 파일들처럼
# 코드에 그대로 적어도 안전해요(비밀키 아님).
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://tmssupuskkajahpuswcj.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W" \
            -H "Authorization: Bearer sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W")
          echo "Supabase 응답 코드: $code"
          if [ "$code" -ge 500 ]; then
            echo "::warning::Supabase 응답이 5xx예요 — 프로젝트가 일시정지됐을 수 있어요. 대시보드를 확인해주세요."
          fi
