<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>챗봇 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F3EC; --paper-card: #FFFFFF; --ink: #1C2230; --ink-soft: #5B6170;
    --rule: #DCD6C8; --rule-soft: #EFEAE0; --stamp: #23407A; --stamp-soft: rgba(35,64,122,0.08);
    --crest-red: #B8432F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background: var(--paper); color: var(--ink); font-family:'IBM Plex Sans KR', system-ui, sans-serif; line-height:1.5; display:flex; flex-direction:column; min-height:100vh; }
  .wrap{ max-width: 640px; margin:0 auto; padding: 28px 18px; width:100%; flex:1; display:flex; flex-direction:column; }
  h1{ font-family:'Gowun Batang', serif; font-weight:700; font-size:19px; margin:0 0 4px; }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:16px; padding:24px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field label{ font-size:13px; font-weight:700; }
  .field input[type=text], .field input[type=password]{ font-family:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--rule); border-radius:8px; }
  .btn{ font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--stamp); border:none; border-radius:8px; padding:11px 18px; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.info{ background:var(--stamp-soft); color:var(--stamp); }

  .chat-shell{ display:flex; flex-direction:column; flex:1; min-height:0; background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  .chat-messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .chat-empty{ margin:auto; text-align:center; font-size:13px; color:var(--ink-soft); }
  .chat-msg{ max-width:82%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .chat-msg.user{ align-self:flex-end; background:var(--stamp); color:#fff; border-bottom-right-radius:3px; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--paper); border:1px solid var(--rule-soft); border-bottom-left-radius:3px; }
  .chat-typing{ align-self:flex-start; font-size:12.5px; color:var(--ink-soft); padding:6px 14px; }
  .chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--rule-soft); }
  .chat-input-row textarea{ flex:1; resize:none; font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; max-height:120px; }
  .chat-input-row button{ flex-shrink:0; font-family:inherit; font-size:13.5px; font-weight:700; border-radius:8px; border:1px solid var(--rule); background:#fff; cursor:pointer; padding:0 14px; }
  .chat-input-row button#btnSend{ background:var(--stamp); color:#fff; border-color:var(--stamp); }
  #btnMic.listening{ background:var(--crest-red); border-color:var(--crest-red); color:#fff; animation:mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  .tts-btn{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-top:4px; border:none; background:none; cursor:pointer; font-size:13px; opacity:0.6; padding:0; }
  .tts-btn:hover{ opacity:1; }
  .suggested-row{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; }
  .suggested-btn{ font-family:inherit; font-size:12.5px; padding:6px 12px; border-radius:14px; border:1px solid var(--rule); background:#fff; cursor:pointer; color:var(--stamp); }
  .suggested-btn:hover{ background:var(--stamp-soft); }
</style>
</head>
<body>
<div class="wrap">
  <div id="pinView">
    <h1 id="pinTitle">챗봇 이용하기</h1>
    <div class="sub">선생님이 알려주신 암호를 입력하면 대화를 시작할 수 있어요.</div>
    <div class="card">
      <div id="pinMsg"></div>
      <div class="field">
        <label>암호(PIN)</label>
        <input type="password" id="pinInput" inputmode="numeric" placeholder="선생님이 알려주신 암호">
      </div>
      <button type="button" class="btn" id="btnPinSubmit">확인</button>
    </div>
  </div>

  <div id="startView" style="display:none;">
    <h1 id="startTitle">챗봇</h1>
    <div class="sub" id="startDesc"></div>
    <div class="card">
      <div id="startMsg"></div>
      <div class="field" id="nameField" style="display:none;">
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력해주세요">
      </div>
      <div class="field" id="noField" style="display:none;">
        <label>학번</label>
        <input type="text" id="noInput" placeholder="학번을 입력해주세요">
      </div>
      <button type="button" class="btn" id="btnStartSubmit">대화 시작하기</button>
    </div>
  </div>

  <div id="chatView" style="display:none; flex:1; display:flex; flex-direction:column; min-height:0;">
    <h1 id="chatTitle">챗봇</h1>
    <div class="chat-shell">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty" id="chatEmptyHint">궁금한 걸 물어보세요!</div></div>
      <div class="suggested-row" id="suggestedRow" style="display:none;"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" rows="1" placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)"></textarea>
        <button type="button" id="btnMic" title="음성으로 말하기">🎤</button>
        <button type="button" id="btnSend">보내기</button>
      </div>
    </div>
  </div>

  <div id="notFoundView" style="display:none;">
    <h1>챗봇을 찾을 수 없어요</h1>
    <div class="sub">링크가 올바른지 다시 확인해주세요.</div>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const FUNCTIONS_BASE = SUPABASE_URL + '/functions/v1';

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${escapeHtml(text)}</div>` : ''; }
  function show(id){ ['pinView','startView','chatView','notFoundView'].forEach(v => { el(v).style.display = v === id ? (v === 'chatView' ? 'flex' : 'block') : 'none'; }); }

  const slug = new URLSearchParams(location.search).get('b') || '';
  if(!slug){ show('notFoundView'); return; }
  const sessionKey = 'ks_bot_session_' + slug;

  async function callBot(action, body){
    const res = await fetch(FUNCTIONS_BASE + '/student-bot-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action }, body)),
    });
    return res.json();
  }

  let verifiedPin = '';
  let verifiedBot = null;

  el('btnPinSubmit').addEventListener('click', async () => {
    const pin = el('pinInput').value.trim();
    if(!pin){ setMsg('pinMsg', '암호를 입력해주세요.', 'error'); return; }
    el('btnPinSubmit').disabled = true;
    setMsg('pinMsg', '', '');
    try{
      const data = await callBot('verify', { slug, pin });
      if(!data.ok){ setMsg('pinMsg', data.error || '확인하지 못했어요.', 'error'); return; }
      verifiedPin = pin;
      verifiedBot = data.bot;
      el('startTitle').textContent = data.bot.title || '챗봇';
      el('startDesc').textContent = data.bot.description || '';
      el('nameField').style.display = data.bot.collectName ? 'flex' : 'none';
      el('noField').style.display = data.bot.collectStudentNo ? 'flex' : 'none';
      show('startView');
    }catch(e){
      setMsg('pinMsg', '서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.', 'error');
    }finally{
      el('btnPinSubmit').disabled = false;
    }
  });
  el('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') el('btnPinSubmit').click(); });

  el('btnStartSubmit').addEventListener('click', async () => {
    const studentName = el('nameInput').value.trim();
    const studentNo = el('noInput').value.trim();
    el('btnStartSubmit').disabled = true;
    setMsg('startMsg', '', '');
    try{
      const data = await callBot('start', { slug, pin: verifiedPin, studentName, studentNo });
      if(!data.ok){ setMsg('startMsg', data.error || '시작하지 못했어요.', 'error'); return; }
      try{ sessionStorage.setItem(sessionKey, data.sessionToken); }catch(e){}
      el('chatTitle').textContent = data.bot.title || '챗봇';
      renderSuggestedQuestions(data.bot.suggestedQuestions);
      show('chatView');
      initVoice();
    }catch(e){
      setMsg('startMsg', '서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.', 'error');
    }finally{
      el('btnStartSubmit').disabled = false;
    }
  });

  // ---------- 채팅 ----------
  let sending = false;
  function clearEmptyHint(){ const h = el('chatEmptyHint'); if(h) h.remove(); }
  function appendMessage(role, text){
    clearEmptyHint();
    const wrap = el('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (role === 'user' ? 'user' : 'assistant');
    div.textContent = text;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }
  function addTtsButton(div, text){
    if(!window.speechSynthesis || !text) return;
    const ttsBtn = document.createElement('button');
    ttsBtn.type = 'button'; ttsBtn.className = 'tts-btn'; ttsBtn.title = '읽어주기'; ttsBtn.textContent = '🔊';
    ttsBtn.addEventListener('click', () => speakText(text));
    div.appendChild(ttsBtn);
  }
  function appendTyping(){
    const wrap = el('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-typing'; div.id = 'chatTyping'; div.textContent = '생각하는 중...';
    wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  }
  function removeTyping(){ const t = el('chatTyping'); if(t) t.remove(); }
  function speakText(text){
    if(!('speechSynthesis' in window) || !text) return;
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; speechSynthesis.speak(u); }catch(e){}
  }
  function renderSuggestedQuestions(list){
    const row = el('suggestedRow');
    if(!Array.isArray(list) || !list.length){ row.style.display = 'none'; row.innerHTML = ''; return; }
    row.innerHTML = list.map((q, i) => `<button type="button" class="suggested-btn" data-i="${i}">${escapeHtml(q)}</button>`).join('');
    row.style.display = 'flex';
    row.querySelectorAll('.suggested-btn').forEach(btn => btn.addEventListener('click', () => {
      el('chatInput').value = list[Number(btn.dataset.i)] || '';
      sendMessage();
    }));
  }

  async function sendMessage(){
    const input = el('chatInput');
    const text = input.value.trim();
    if(!text || sending) return;
    const token = sessionStorage.getItem(sessionKey);
    if(!token){ appendMessage('assistant', '세션이 만료됐어요. 페이지를 새로고침해서 암호를 다시 입력해주세요.'); return; }
    sending = true;
    el('btnSend').disabled = true;
    input.value = ''; input.style.height = 'auto';
    el('suggestedRow').style.display = 'none';
    appendMessage('user', text);
    appendTyping();
    try{
      const res = await fetch(FUNCTIONS_BASE + '/student-bot-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'chat', sessionToken: token, message: text }),
      });
      removeTyping();
      if(!res.ok || !res.body){
        let errMsg = '알 수 없는 오류가 발생했어요.';
        try{ const errData = await res.json(); errMsg = errData.error || errMsg; }catch(e){}
        appendMessage('assistant', '오류: ' + errMsg);
        return;
      }
      // 스트리밍 응답: 도착하는 대로 한 글자씩 이어 붙여 보여줘요(전체 다 받을 때까지
      // 기다리지 않아서 체감 속도가 훨씬 빨라요).
      const bubble = appendMessage('assistant', '');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        full += decoder.decode(value, { stream: true });
        bubble.textContent = full;
        el('chatMessages').scrollTop = el('chatMessages').scrollHeight;
      }
      if(full) addTtsButton(bubble, full);
    }catch(e){
      removeTyping();
      appendMessage('assistant', '오류: 서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.');
    }finally{
      sending = false;
      el('btnSend').disabled = false;
    }
  }
  el('btnSend').addEventListener('click', sendMessage);
  el('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
  el('chatInput').addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

  function initVoice(){
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognitionImpl){ el('btnMic').style.display = 'none'; return; }
    const recognizer = new SpeechRecognitionImpl();
    recognizer.lang = 'ko-KR'; recognizer.continuous = false; recognizer.interimResults = false; recognizer.maxAlternatives = 1;
    let listening = false;
    function setListening(v){
      listening = v;
      el('btnMic').classList.toggle('listening', v);
      el('btnMic').textContent = v ? '⏹' : '🎤';
    }
    recognizer.addEventListener('result', (e) => {
      const t = e.results[0][0].transcript;
      if(t && t.trim()){ el('chatInput').value = t.trim(); sendMessage(); }
    });
    recognizer.addEventListener('error', () => setListening(false));
    recognizer.addEventListener('end', () => setListening(false));
    el('btnMic').addEventListener('click', () => {
      if(listening){ recognizer.stop(); return; }
      try{ recognizer.start(); setListening(true); }catch(e){}
    });
  }

  // PIN을 입력하기 전에도 어떤 챗봇인지(선생님이 지은 이름) 바로 보이도록, 민감하지 않은
  // 제목만 먼저 가볍게 조회해요.
  (async () => {
    try{
      const info = await callBot('info', { slug });
      if(info.ok && info.title){
        el('pinTitle').textContent = info.title + ' 이용하기';
        el('chatTitle').textContent = info.title;
      }
    }catch(e){ /* 조용히 기본 문구 유지 */ }
  })();

  // 새로고침해도 같은 탭에서는 세션을 다시 쓸 수 있게(암호를 또 입력하지 않도록) 해요.
  // (지난 대화 내용은 화면엔 다시 안 보이지만, 챗봇은 서버에 저장된 이전 대화를 계속 참고해요.)
  const existingToken = sessionStorage.getItem(sessionKey);
  if(existingToken){
    show('chatView');
    initVoice();
  } else {
    show('pinView');
  }
})();
</script>
</body>
</html>
