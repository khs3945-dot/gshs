<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>챗봇 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; display:flex; flex-direction:column; min-height:100vh; }
  .wrap{ max-width: 640px; margin:0 auto; padding: 28px 18px; width:100%; flex:1; display:flex; flex-direction:column; min-height:0; }
  /* 채팅 중엔 문서 자체가 메시지 수에 따라 늘어나지 않도록 뷰포트 높이로 완전히
     고정해요 — 이게 없으면 .chat-messages의 overflow-y:auto는 무의미해지고
     (내부가 아니라 문서 전체가 스크롤돼버려서) 대화가 길어질수록 옆/아래의 메모
     패널이 화면 밖으로 밀려나는 문제가 생겨요. height:100dvh는 모바일 브라우저의
     주소창이 접히고 펴지는 것까지 반영한 값이고, 지원하지 않는 브라우저는 그냥
     바로 위 100vh 선언을 그대로 써요(뒤에 온 선언이 지원될 때만 이김).
  */
  body.bot-chat-active{ height:100vh; height:100dvh; overflow:hidden; }
  h1{ font-weight:700; font-size:19px; margin:0 0 4px; }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:24px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field label{ font-size:13px; font-weight:700; }
  .field input[type=text], .field input[type=password]{ font-family:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--rule); border-radius:8px; }
  .btn{ font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--stamp); border:none; border-radius:8px; padding:11px 18px; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.info{ background:var(--stamp-soft); color:var(--stamp); }

  .chat-shell{ display:flex; flex-direction:column; flex:1; min-height:0; background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  .chat-messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .chat-empty{ margin:auto; text-align:center; font-size:13px; color:var(--ink-soft); }
  .chat-msg{ max-width:82%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .chat-msg.user{ align-self:flex-end; background:var(--stamp); color:#fff; border-bottom-right-radius:3px; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--paper); border:1px solid var(--rule-soft); border-bottom-left-radius:3px; }
  .chat-typing{ align-self:flex-start; font-size:12.5px; color:var(--ink-soft); padding:6px 14px; }
  .ks-typing-dots{ display:inline-flex; align-items:center; gap:3px; }
  .ks-typing-dots .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0.3; animation: ksTypingDotPulse 1.2s infinite ease-in-out; }
  .ks-typing-dots .dot:nth-child(2){ animation-delay:0.2s; }
  .ks-typing-dots .dot:nth-child(3){ animation-delay:0.4s; }
  @keyframes ksTypingDotPulse{ 0%,80%,100%{ opacity:0.25; transform:scale(0.85); } 40%{ opacity:1; transform:scale(1.15); } }
  .chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--rule-soft); }
  .chat-input-row textarea{ flex:1; resize:none; font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; max-height:120px; }
  .chat-input-row button{ flex-shrink:0; font-family:inherit; font-size:13.5px; font-weight:700; border-radius:8px; border:1px solid var(--rule); background:#fff; cursor:pointer; padding:0 14px; }
  .chat-input-row button#btnSend{ background:var(--stamp); color:#fff; border-color:var(--stamp); }
  #btnMic.listening{ background:var(--crest-red); border-color:var(--crest-red); color:#fff; animation:mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  .tts-btn{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-top:4px; border:none; background:none; cursor:pointer; font-size:13px; opacity:0.6; padding:0; }
  .tts-btn:hover{ opacity:1; }
  .suggested-row{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; }
  .suggested-btn{ font-family:inherit; font-size:12.5px; padding:6px 12px; border-radius:14px; border:1px solid var(--rule); background:#fff; cursor:pointer; color:var(--stamp); }
  .suggested-btn:hover{ background:var(--stamp-soft); }

  /* 채팅 중엔 오른쪽에 조사 자료 메모장을 나란히 두므로 카드 폭을 더 넓게 써요. */
  body.bot-chat-active .wrap{ max-width: 1060px; }
  .chat-layout{ display:flex; gap:16px; flex:1; min-height:0; }
  .chat-layout .chat-shell{ flex:1.15; min-width:0; }
  /* 오른쪽 칸(right-col) 하나에 "활동 탭"(선생님이 설계했을 때만)과 메모장이
     세로로 함께 들어간다 — 메모 패널 자체는 그냥 평범한 flex 자식이에요. "채팅이
     길어지면 메모가 화면 밖으로 밀려나는" 문제는 여기서 sticky 같은 걸로 때우는
     게 아니라, 위 body.bot-chat-active가 문서 전체를 뷰포트 높이로 고정해버려서
     처음부터 생기지 않게 막았어요. 그 덕에 .chat-messages만 내부 스크롤되고,
     옆(또는 아래)의 이 칸은 대화 길이와 무관하게 항상 화면에 그대로 보여요. */
  .right-col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; min-height:0; }
  /* 활동 탭이 설계돼 있으면(activityPanel이 보일 때) 메모장보다 조금 더 넓게
     차지한다 — 활동 하위항목이 보통 메모보다 입력량이 많기 때문. 설계된 탭이
     없으면 activityPanel 자체가 display:none이라 메모장(flex:1)이 칸 전체를
     그대로 차지해, 기존(활동 탭 기능 추가 이전)과 똑같은 레이아웃이 된다. */
  .activity-panel{ flex:1.3; min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  .activity-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px 0; flex-shrink:0; flex-wrap:wrap; }
  .activity-panel-head h2{ font-size:14.5px; margin:0; }
  .activity-dl-buttons{ display:flex; gap:6px; flex-wrap:wrap; }
  .activity-dl-btn{ font-family:inherit; font-size:11.3px; font-weight:700; padding:5px 11px; border-radius:999px; border:1px solid; cursor:pointer; }
  .activity-dl-btn.pdf{ color:#e11d48; border-color:#fecdd3; background:#fff1f2; }
  .activity-dl-btn.word{ color:#2563eb; border-color:#bfdbfe; background:#eff6ff; }
  .activity-tabs{ display:flex; gap:4px; padding:10px 10px 0; flex-shrink:0; flex-wrap:wrap; }
  .activity-tab-btn{ font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border:1px solid var(--rule); border-bottom:none; border-radius:8px 8px 0 0; background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .activity-tab-btn.active{ background:var(--paper-card); color:var(--stamp); border-color:var(--stamp); }
  .activity-fields{ flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--rule-soft); }
  .activity-field-block label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; }
  .activity-field-block input[type=text], .activity-field-block textarea{ font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; width:100%; }
  .activity-field-block textarea{ resize:vertical; min-height:60px; }
  .activity-checklist-item{ display:flex; align-items:center; gap:7px; font-size:13px; padding:3px 0; }
  .activity-char-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:4px; }
  .activity-char-note{ font-size:11px; color:var(--crest-red); }
  .activity-char-count{ font-size:11.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
  .activity-char-row.invalid .activity-char-count{ color:var(--crest-red); }
  .activity-field-block input[type=text].invalid, .activity-field-block textarea.invalid{ border-color:var(--crest-red); background:rgba(238,46,34,0.04); }
  .activity-save-msg{ font-size:11px; color:var(--ink-soft); padding:0 14px 8px; flex-shrink:0; }
  .notes-panel{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
  .notes-panel-head{ padding:14px 16px 0; }
  .notes-panel-head h2{ font-size:14.5px; margin:0 0 3px; }
  .notes-panel-hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
  .notes-form{ padding:0 16px 12px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--rule-soft); flex-shrink:0; }
  .notes-form input, .notes-form textarea{ font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; width:100%; }
  .notes-form textarea{ resize:vertical; min-height:52px; }
  .notes-form-actions{ display:flex; justify-content:flex-end; }
  .notes-form-actions button{ font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:6px; border:1px solid var(--stamp); background:var(--stamp); color:#fff; cursor:pointer; }
  .notes-form-actions button:disabled{ opacity:0.5; cursor:default; }
  #notesMsg .msg{ margin:8px 16px 0; }
  .notes-list{ flex:1; min-height:0; overflow-y:auto; padding:10px 16px 16px; display:flex; flex-direction:column; gap:8px; }
  .notes-empty{ margin:auto; text-align:center; font-size:12.5px; color:var(--ink-soft); }
  .note-item{ border:1px solid var(--rule-soft); border-radius:8px; overflow:hidden; }
  .note-item-title{ padding:10px 12px; font-size:13px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .note-item-title:hover{ background:var(--stamp-soft); }
  .note-item-title-text{ flex:1; word-break:break-word; }
  .note-item-caret{ flex-shrink:0; font-size:11px; color:var(--ink-soft); transition:transform 0.15s; }
  .note-item.open .note-item-caret{ transform:rotate(90deg); }
  .note-item-body{ display:none; padding:0 12px 12px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
  .note-item.open .note-item-body{ display:block; }
  .note-item-source{ font-size:11px; color:var(--ink-soft); margin-top:8px; }
  .note-item-del{ font-size:11px; color:var(--crest-red); cursor:pointer; border:none; background:none; padding:0; margin-top:8px; }

  @media (max-width: 760px){
    body.bot-chat-active .wrap{ max-width: 640px; }
    .chat-layout{ flex-direction:column; }
    /* 좁은 화면에서는 오른쪽 칸이 채팅 아래로 세로로 쌓여요 — 데스크톱처럼 둘을
       나란히 둘 폭이 없으니까요. 하지만 둘 다 body.bot-chat-active가 고정한
       뷰포트 높이 안에서 나눠 가지므로(채팅이 더 크게, 오른쪽 칸이 작게), 모바일에서도
       대화가 아무리 길어져도 오른쪽 칸이 화면 밖으로 밀려나지 않고 항상 그 자리에
       보여요 — 채팅 쪽만 내부 스크롤되고, 문서 자체는 스크롤되지 않아요. */
    .chat-layout .chat-shell{ flex:1.6; }
    .right-col{ flex:1; max-height:46vh; }
  }

  /* "PDF로 저장" 버튼은 window.print()를 호출하기 전에 이 숨겨진 뷰에 활동지
     내용을 채워 넣는다 — 평소(화면)에는 display:none이고, 인쇄 시에만
     body의 다른 모든 자식(.wrap)을 가리고 이 뷰만 보여줘서, 화면에 떠 있는
     채팅/메모 레이아웃이 아니라 활동지 내용 하나만 종이에 찍히게 한다.
     mock-interview.html/grade-estimate.html이 이미 쓰는 "@media print로 화면
     UI를 지우고 인쇄용 콘텐츠만 남긴다"는 관행을 그대로 따른 것. */
  #activityPrintView{ display:none; }
  @media print{
    body > *:not(#activityPrintView){ display:none !important; }
    #activityPrintView{ display:block !important; padding:28px; color:#1e293b; }
  }
</style>
<style id="ks-theme">
  /* 메인 페이지와 같은 디자인: 연회색 배경 · 진한 글씨 · 남색 강조 · 둥근 흰 카드(가벼운 그림자) */
  :root{
    --paper:#F4F5F7; --paper-card:#FFFFFF; --ink:#05070D; --ink-soft:#4A5064; --rule:#E3E5EA; --rule-soft:#EDEEF1;
    --stamp:#2B3A7E; --stamp-soft:#E9ECF5; --ks-shadow-sm:0 1px 2px rgba(31,36,64,0.04), 0 1px 3px rgba(31,36,64,0.06);
  }
  body{ background:var(--paper); }
  .bot-brand{ display:flex; align-items:center; gap:10px; margin:0 0 18px; font-size:15px; font-weight:800; color:var(--ink); }
  .bot-brand .bot-logo{ width:34px; height:34px; border-radius:11px; background:#ece5fe; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .bot-brand .bot-logo svg{ stroke:#8B5CF6; }
  .bot-brand small{ font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  h1{ font-size:24px; font-weight:800; letter-spacing:-0.01em; margin:0 0 6px; }
  .sub{ font-size:14px; }
  .card, .chat-shell, .activity-panel, .notes-panel{ border:1px solid var(--rule); border-radius:18px; box-shadow:var(--ks-shadow-sm); }
  .card{ padding:24px 22px; }
  .field label{ font-size:14px; }
  .field input[type=text], .field input[type=password]{ font-size:16px; padding:12px 14px; border-radius:12px; border:1.5px solid #D5DAE6; }
  .field input:focus, .chat-input-row textarea:focus, .notes-form input:focus, .notes-form textarea:focus{ outline:none; border-color:var(--stamp); box-shadow:0 0 0 3px var(--stamp-soft); }
  .btn{ border-radius:12px; padding:13px 18px; font-size:15px; background:var(--stamp); }
  .btn:hover:not(:disabled){ background:#22306B; }
  .chat-msg{ border-radius:16px; font-size:14.5px; }
  .chat-msg.user{ background:var(--stamp); border-bottom-right-radius:4px; }
  .chat-msg.assistant{ background:#F4F5F7; border:1px solid var(--rule-soft); border-bottom-left-radius:4px; }
  .chat-input-row{ border-top:1px solid var(--rule-soft); }
  .chat-input-row textarea{ border-radius:12px; border:1.5px solid #D5DAE6; font-size:15px; }
  .chat-input-row button{ border-radius:12px; border-color:#D5DAE6; }
  .chat-input-row button#btnSend{ background:var(--stamp); border-color:var(--stamp); }
  .suggested-btn{ border-radius:999px; border-color:#D5DAE6; color:var(--stamp); }
  .activity-tab-btn{ border-radius:10px 10px 0 0; border-color:#D5DAE6; }
  .notes-form input, .notes-form textarea, .activity-field-block input[type=text], .activity-field-block textarea{ border-radius:10px; border-color:#D5DAE6; }
  .notes-form-actions button{ border-radius:10px; background:var(--stamp); border-color:var(--stamp); }
  .note-item{ border-radius:12px; }
  body.bot-chat-active .bot-brand{ margin-bottom:8px; } body.bot-chat-active .bot-brand small, body.bot-chat-active .bot-brand br{ display:none; }
  body.bot-chat-active h1{ font-size:20px; }
  @media print{ .bot-brand{ display:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bot-brand" id="botBrand"><span class="bot-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16h5"/></svg></span><span>경성고 수업 챗봇<br><small>선생님이 만든 챗봇과 함께 배워요</small></span></div>
  <div id="pinView">
    <h1 id="pinTitle">챗봇 이용하기</h1>
    <div class="sub">선생님이 알려주신 암호를 입력하면 대화를 시작할 수 있어요.</div>
    <div class="card">
      <div id="pinMsg"></div>
      <div class="field">
        <label>암호(PIN)</label>
        <input type="password" id="pinInput" inputmode="numeric" placeholder="선생님이 알려주신 암호">
      </div>
      <button type="button" class="btn" id="btnPinSubmit">확인</button>
    </div>
  </div>

  <div id="startView" style="display:none;">
    <h1 id="startTitle">챗봇</h1>
    <div class="sub" id="startDesc"></div>
    <div class="card">
      <div id="startMsg"></div>
      <div class="field" id="nameField" style="display:none;">
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력해주세요">
      </div>
      <div class="field" id="noField" style="display:none;">
        <label>학번</label>
        <input type="text" id="noInput" placeholder="학번을 입력해주세요">
      </div>
      <button type="button" class="btn" id="btnStartSubmit">대화 시작하기</button>
    </div>
  </div>

  <div id="chatView" style="display:none; flex:1; display:flex; flex-direction:column; min-height:0;">
    <h1 id="chatTitle">챗봇</h1>
    <div class="chat-layout">
      <div class="chat-shell">
        <div class="chat-messages" id="chatMessages"><div class="chat-empty" id="chatEmptyHint">궁금한 걸 물어보세요!</div></div>
        <div class="suggested-row" id="suggestedRow" style="display:none;"></div>
        <div class="chat-input-row">
          <textarea id="chatInput" rows="1" placeholder="메시지를 입력하세요... (Shift+Enter로 줄바꿈)"></textarea>
          <button type="button" id="btnMic" title="음성으로 말하기">🎤</button>
          <button type="button" id="btnSend">보내기</button>
        </div>
      </div>
      <div class="right-col" id="rightCol">
        <!-- 활동 탭(선생님이 챗봇 만들기에서 설계한 활동1/활동2/... + 하위항목) —
             설계된 탭이 하나도 없으면 이 패널 전체가 숨겨지고 메모장만 보인다. -->
        <div class="activity-panel" id="activityPanel" style="display:none;">
          <div class="activity-panel-head">
            <h2>학생 활동지</h2>
            <div class="activity-dl-buttons">
              <button type="button" id="btnActivityDlPdf" class="activity-dl-btn pdf">PDF로 저장</button>
              <button type="button" id="btnActivityDlWord" class="activity-dl-btn word">Word로 저장</button>
            </div>
          </div>
          <div class="activity-tabs" id="activityTabs"></div>
          <div class="activity-fields" id="activityFields"></div>
          <div id="activitySaveMsg" class="activity-save-msg"></div>
        </div>
        <div class="notes-panel">
          <div class="notes-panel-head">
            <h2>📝 조사한 자료</h2>
            <div class="notes-panel-hint">조사하면서 찾은 내용을 메모로 남겨두세요.</div>
          </div>
          <div class="notes-form">
            <input type="text" id="noteTitleInput" placeholder="제목">
            <textarea id="noteContentInput" rows="2" placeholder="내용"></textarea>
            <input type="text" id="noteSourceInput" placeholder="출처 (선택)">
            <div class="notes-form-actions">
              <button type="button" id="btnAddNote">+ 메모 추가</button>
            </div>
          </div>
          <div id="notesMsg"></div>
          <div class="notes-list" id="notesList"><div class="notes-empty">아직 남긴 메모가 없어요.</div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="notFoundView" style="display:none;">
    <h1>챗봇을 찾을 수 없어요</h1>
    <div class="sub">링크가 올바른지 다시 확인해주세요.</div>
  </div>
</div>

<!-- "PDF로 저장" 전용 — 평소엔 숨겨져 있고, window.print() 직전에 그 순간의
     activitySchema/activityResponses로 다시 채워진다. .wrap 바깥(body 직속
     형제)에 둬야 "인쇄 시 .wrap 전체를 가리고 이 뷰만 보여준다"는 CSS가 먹힌다. -->
<div id="activityPrintView"></div>

<script>
(function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const FUNCTIONS_BASE = SUPABASE_URL + '/functions/v1';

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${escapeHtml(text)}</div>` : ''; }
  function show(id){
    ['pinView','startView','chatView','notFoundView'].forEach(v => { el(v).style.display = v === id ? (v === 'chatView' ? 'flex' : 'block') : 'none'; });
    document.body.classList.toggle('bot-chat-active', id === 'chatView');
  }

  const slug = new URLSearchParams(location.search).get('b') || '';
  if(!slug){ show('notFoundView'); return; }
  const sessionKey = 'ks_bot_session_' + slug;

  async function callBot(action, body){
    const res = await fetch(FUNCTIONS_BASE + '/student-bot-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action }, body)),
    });
    return res.json();
  }

  let verifiedPin = '';
  let verifiedBot = null;

  // ---------- 활동 탭(선생님이 챗봇 만들기에서 설계한 활동1/활동2/... + 하위항목) ----------
  let activitySchema = [];
  let activityResponses = {};
  let activeActivityTabIdx = 0;
  let activitySaveTimer = null;
  // PDF/Word 다운로드의 문서 머리글에 쓰려고만 기억해두는 값 — 이번 방문에서
  // 이름+학번을 직접 입력했을 때만 채워지고, 새로고침 재접속(기존 sessionToken)
  // 경로에서는 다시 묻지 않으므로 빈 채로 남는다(그 경우 머리글에서 생략됨).
  let currentStudentName = '';
  let currentStudentNo = '';

  el('btnPinSubmit').addEventListener('click', async () => {
    const pin = el('pinInput').value.trim();
    if(!pin){ setMsg('pinMsg', '암호를 입력해주세요.', 'error'); return; }
    el('btnPinSubmit').disabled = true;
    setMsg('pinMsg', '', '');
    try{
      const data = await callBot('verify', { slug, pin });
      if(!data.ok){ setMsg('pinMsg', data.error || '확인하지 못했어요.', 'error'); return; }
      verifiedPin = pin;
      verifiedBot = data.bot;
      el('startTitle').textContent = data.bot.title || '챗봇';
      el('startDesc').textContent = data.bot.description || '';
      el('nameField').style.display = data.bot.collectName ? 'flex' : 'none';
      el('noField').style.display = data.bot.collectStudentNo ? 'flex' : 'none';
      show('startView');
    }catch(e){
      setMsg('pinMsg', '서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.', 'error');
    }finally{
      el('btnPinSubmit').disabled = false;
    }
  });
  el('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') el('btnPinSubmit').click(); });

  el('btnStartSubmit').addEventListener('click', async () => {
    const studentName = el('nameInput').value.trim();
    const studentNo = el('noInput').value.trim();
    currentStudentName = studentName;
    currentStudentNo = studentNo;
    el('btnStartSubmit').disabled = true;
    setMsg('startMsg', '', '');
    try{
      const data = await callBot('start', { slug, pin: verifiedPin, studentName, studentNo });
      if(!data.ok){ setMsg('startMsg', data.error || '시작하지 못했어요.', 'error'); return; }
      try{ sessionStorage.setItem(sessionKey, data.sessionToken); }catch(e){}
      el('chatTitle').textContent = data.bot.title || '챗봇';
      // 같은 이름+학번으로 이미 대화한 적이 있으면(이름·학번을 둘 다 받는 챗봇만) 서버가
      // 그 세션을 이어서 돌려줘요 — 처음 보는 빈 화면 대신 이전 대화를 그대로 보여줘서
      // 대화가 끊기지 않은 것처럼 느껴지게 해요.
      if(data.resumed && Array.isArray(data.history) && data.history.length){
        clearEmptyHint();
        data.history.forEach(h => appendMessage(h.role === 'user' ? 'user' : 'assistant', h.content));
      }
      renderSuggestedQuestions(data.bot.suggestedQuestions);
      show('chatView');
      initVoice();
      loadNotes();
      initActivityPanel(data.bot.activitySchema, data.activityResponses);
    }catch(e){
      setMsg('startMsg', '서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.', 'error');
    }finally{
      el('btnStartSubmit').disabled = false;
    }
  });

  // ---------- 채팅 ----------
  let sending = false;
  function clearEmptyHint(){ const h = el('chatEmptyHint'); if(h) h.remove(); }
  function appendMessage(role, text){
    clearEmptyHint();
    const wrap = el('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (role === 'user' ? 'user' : 'assistant');
    div.textContent = text;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }
  function addTtsButton(div, text){
    if(!window.speechSynthesis || !text) return;
    const ttsBtn = document.createElement('button');
    ttsBtn.type = 'button'; ttsBtn.className = 'tts-btn'; ttsBtn.title = '읽어주기'; ttsBtn.textContent = '🔊';
    ttsBtn.addEventListener('click', () => speakText(text));
    div.appendChild(ttsBtn);
  }
  function appendTyping(){
    const wrap = el('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-typing'; div.id = 'chatTyping'; div.innerHTML = '<span class="ks-typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
    wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  }
  function removeTyping(){ const t = el('chatTyping'); if(t) t.remove(); }
  // AI 답변의 마크다운 기호(강조 **, 목록 - 등)는 이 화면에서 그대로 텍스트로 보이고
  // 읽어주기도 그 기호까지 소리 내어 읽어버리므로, 화면 표시와 읽어주기 전에 제거해요.
  function cleanMarkdownText(text){
    return String(text || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/^[ \t]*[-*+]\s+/gm, '')
      .replace(/\*/g, '');
  }
  function speakText(text){
    if(!('speechSynthesis' in window) || !text) return;
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(cleanMarkdownText(text)); u.lang = 'ko-KR'; speechSynthesis.speak(u); }catch(e){}
  }
  function renderSuggestedQuestions(list){
    const row = el('suggestedRow');
    if(!Array.isArray(list) || !list.length){ row.style.display = 'none'; row.innerHTML = ''; return; }
    row.innerHTML = list.map((q, i) => `<button type="button" class="suggested-btn" data-i="${i}">${escapeHtml(q)}</button>`).join('');
    row.style.display = 'flex';
    row.querySelectorAll('.suggested-btn').forEach(btn => btn.addEventListener('click', () => {
      el('chatInput').value = list[Number(btn.dataset.i)] || '';
      sendMessage();
    }));
  }

  // ---------- 조사한 자료 메모장 ----------
  // 챗봇 대화와는 별도로, 학생이 조사하면서 찾은 내용을 제목/내용/출처로 직접 적어두는
  // 공간이에요. sessionToken으로만 인증하는 구조라 로그인 없이도 이 학생 세션에만
  // 묶여서 저장/조회돼요(다른 학생 메모는 절대 안 보임 — student-bot-chat이 매번
  // sessionToken → 세션 소유 여부를 서버에서 확인).
  let notes = [];
  function renderNotes(){
    const wrap = el('notesList');
    if(!notes.length){ wrap.innerHTML = '<div class="notes-empty">아직 남긴 메모가 없어요.</div>'; return; }
    wrap.innerHTML = notes.map(n => `
      <div class="note-item" data-id="${escapeHtml(n.id)}">
        <div class="note-item-title">
          <span class="note-item-title-text">${escapeHtml(n.title)}</span>
          <span class="note-item-caret">▶</span>
        </div>
        <div class="note-item-body">${escapeHtml(n.content)}${n.source ? `<div class="note-item-source">출처: ${escapeHtml(n.source)}</div>` : ''}<button type="button" class="note-item-del">삭제</button></div>
      </div>
    `).join('');
  }
  el('notesList').addEventListener('click', (e) => {
    const delBtn = e.target.closest('.note-item-del');
    if(delBtn){ deleteNote(delBtn.closest('.note-item').dataset.id); return; }
    const titleRow = e.target.closest('.note-item-title');
    if(titleRow) titleRow.closest('.note-item').classList.toggle('open');
  });
  async function loadNotes(){
    const token = sessionStorage.getItem(sessionKey);
    if(!token) return;
    try{
      const data = await callBot('listNotes', { sessionToken: token });
      if(data.ok){ notes = data.notes || []; renderNotes(); }
    }catch(e){ /* 조용히 무시 — 메모장은 부가 기능이라 실패해도 채팅은 계속돼야 함 */ }
  }
  async function addNote(){
    const token = sessionStorage.getItem(sessionKey);
    if(!token) return;
    const title = el('noteTitleInput').value.trim();
    const content = el('noteContentInput').value.trim();
    const source = el('noteSourceInput').value.trim();
    if(!title || !content){ setMsg('notesMsg', '제목과 내용을 입력해주세요.', 'error'); return; }
    el('btnAddNote').disabled = true;
    setMsg('notesMsg', '', '');
    try{
      const data = await callBot('saveNote', { sessionToken: token, title, content, source });
      if(!data.ok){ setMsg('notesMsg', data.error || '저장하지 못했어요.', 'error'); return; }
      notes.push(data.note);
      renderNotes();
      el('noteTitleInput').value = ''; el('noteContentInput').value = ''; el('noteSourceInput').value = '';
    }catch(e){
      setMsg('notesMsg', '서버에 연결하지 못했어요.', 'error');
    }finally{
      el('btnAddNote').disabled = false;
    }
  }
  async function deleteNote(id){
    const token = sessionStorage.getItem(sessionKey);
    if(!token || !id) return;
    notes = notes.filter(n => n.id !== id);
    renderNotes();
    try{ await callBot('deleteNote', { sessionToken: token, noteId: id }); }catch(e){ /* 화면은 이미 지웠고, 다음 로드 때 서버와 다시 맞춰짐 */ }
  }
  el('btnAddNote').addEventListener('click', addNote);

  // ---------- 활동 탭 ----------
  // schema가 비어있으면(선생님이 아무 탭도 설계하지 않음) 패널 자체를 숨기고
  // 메모장만 보인다 — 그 외에는 탭 목록 + 활성 탭의 하위항목을 그린다.
  function initActivityPanel(schema, responses){
    activitySchema = Array.isArray(schema) ? schema : [];
    activityResponses = (responses && typeof responses === 'object') ? responses : {};
    activeActivityTabIdx = 0;
    if(!activitySchema.length){ el('activityPanel').style.display = 'none'; return; }
    el('activityPanel').style.display = 'flex';
    renderActivityTabs();
    renderActivityFields();
  }
  function renderActivityTabs(){
    el('activityTabs').innerHTML = activitySchema.map((tab, i) => `
      <button type="button" class="activity-tab-btn ${i === activeActivityTabIdx ? 'active' : ''}" data-idx="${i}">${escapeHtml(tab.title || ('활동' + (i + 1)))}</button>
    `).join('');
    el('activityTabs').querySelectorAll('.activity-tab-btn').forEach(btn => btn.addEventListener('click', () => {
      activeActivityTabIdx = Number(btn.dataset.idx);
      renderActivityTabs();
      renderActivityFields();
    }));
  }
  // minLength/maxLength(선택, 체크리스트 유형엔 없음)를 기준으로 "N자 / 최대자" 표시
  // 문구와 "조건을 벗어났는지"를 계산한다 — 둘 다 없으면 그냥 "N자"만 보여준다.
  function activityLenInfo(f, value){
    const len = (value || '').length;
    const min = Number.isFinite(f.minLength) ? f.minLength : null;
    const max = Number.isFinite(f.maxLength) ? f.maxLength : null;
    const invalid = (min != null && len < min) || (max != null && len > max);
    let text = max != null ? (len + '자 / ' + max + '자') : (len + '자' + (min != null ? ' (최소 ' + min + '자)' : ''));
    let note = '';
    if(min != null && len < min) note = '최소 ' + min + '자 이상 써주세요';
    else if(max != null && len > max) note = '최대 ' + max + '자까지만 써주세요';
    return { text, note, invalid };
  }
  // 타이핑할 때마다(매 input 이벤트) 그 입력칸 바로 아래 글자수 표시만 갈아치운다 —
  // renderActivityFields() 전체를 다시 그리면 커서 위치가 날아가므로 여기만 따로 갱신.
  function updateActivityCharCountUI(input){
    const block = input.closest('.activity-field-block');
    const row = block && block.querySelector('.activity-char-row');
    if(!row) return;
    const tab = activitySchema[activeActivityTabIdx];
    const f = tab && (tab.fields || []).find(x => x.key === input.dataset.key);
    if(!f) return;
    const info = activityLenInfo(f, input.value);
    input.classList.toggle('invalid', info.invalid);
    row.classList.toggle('invalid', info.invalid);
    row.querySelector('.activity-char-note').textContent = info.note;
    row.querySelector('.activity-char-count').textContent = info.text;
  }
  function renderActivityFields(){
    const tab = activitySchema[activeActivityTabIdx];
    const box = el('activityFields');
    if(!tab || !Array.isArray(tab.fields) || !tab.fields.length){
      box.innerHTML = '<p class="notes-empty">이 탭에는 아직 하위항목이 없어요.</p>';
      return;
    }
    box.innerHTML = tab.fields.map(f => {
      const v = activityResponses[f.key];
      if(f.type === 'checklist'){
        const checked = Array.isArray(v) ? v : [];
        return `
          <div class="activity-field-block" data-key="${escapeHtml(f.key)}">
            <label>${escapeHtml(f.label || '')}</label>
            ${(f.options || []).map(o => `
              <label class="activity-checklist-item">
                <input type="checkbox" class="actFieldCheck" data-key="${escapeHtml(f.key)}" value="${escapeHtml(o)}" ${checked.includes(o) ? 'checked' : ''}>
                ${escapeHtml(o)}
              </label>
            `).join('')}
          </div>
        `;
      }
      if(f.type === 'textarea'){
        const info = activityLenInfo(f, v);
        return `
          <div class="activity-field-block" data-key="${escapeHtml(f.key)}">
            <label>${escapeHtml(f.label || '')}</label>
            <textarea class="actFieldInput ${info.invalid ? 'invalid' : ''}" data-key="${escapeHtml(f.key)}" rows="3">${escapeHtml(v || '')}</textarea>
            <div class="activity-char-row ${info.invalid ? 'invalid' : ''}">
              <span class="activity-char-note">${escapeHtml(info.note)}</span>
              <span class="activity-char-count">${escapeHtml(info.text)}</span>
            </div>
          </div>
        `;
      }
      {
        const info = activityLenInfo(f, v);
        return `
          <div class="activity-field-block" data-key="${escapeHtml(f.key)}">
            <label>${escapeHtml(f.label || '')}</label>
            <input type="text" class="actFieldInput ${info.invalid ? 'invalid' : ''}" data-key="${escapeHtml(f.key)}" value="${escapeHtml(v || '')}">
            <div class="activity-char-row ${info.invalid ? 'invalid' : ''}">
              <span class="activity-char-note">${escapeHtml(info.note)}</span>
              <span class="activity-char-count">${escapeHtml(info.text)}</span>
            </div>
          </div>
        `;
      }
    }).join('');
    box.querySelectorAll('.actFieldInput').forEach(input => input.addEventListener('input', () => {
      activityResponses[input.dataset.key] = input.value;
      updateActivityCharCountUI(input);
      scheduleActivitySave();
    }));
    box.querySelectorAll('.actFieldCheck').forEach(cb => cb.addEventListener('change', () => {
      const key = cb.dataset.key;
      const current = Array.isArray(activityResponses[key]) ? activityResponses[key].slice() : [];
      if(cb.checked){ if(!current.includes(cb.value)) current.push(cb.value); }
      else{ const idx = current.indexOf(cb.value); if(idx >= 0) current.splice(idx, 1); }
      activityResponses[key] = current;
      scheduleActivitySave();
    }));
  }
  // korean-inquiry.html의 inquiry_session_save와 같은 패턴 — 매번 responses
  // 전체를 통째로 덮어쓰는 디바운스 자동저장(900ms). 탭을 바꿀 때 재조회할 필요가
  // 없도록 activityResponses는 이미 메모리에 있는 값을 그대로 쓴다.
  function scheduleActivitySave(){
    const token = sessionStorage.getItem(sessionKey);
    if(!token) return;
    clearTimeout(activitySaveTimer);
    activitySaveTimer = setTimeout(async () => {
      try{
        const data = await callBot('saveActivityResponses', { sessionToken: token, responses: activityResponses });
        el('activitySaveMsg').textContent = data.ok ? '✓ 자동 저장됨' : ('⚠ ' + (data.error || '저장 실패'));
      }catch(e){
        el('activitySaveMsg').textContent = '⚠ 저장하지 못했어요.';
      }
    }, 900);
  }

  // ---------- 활동지 PDF/Word 다운로드 ----------
  // 같은 데이터(activitySchema + activityResponses, 지금 메모리에 있는 그대로 —
  // 작성 중에도 바로 받을 수 있게 저장 완료를 기다리지 않는다)로 같은 모양의
  // HTML을 만들어 PDF(인쇄)와 Word(.doc) 양쪽에 그대로 재사용한다.
  function activityExportTitle(){
    return (el('chatTitle').textContent || '챗봇') + ' 활동지';
  }
  function activityExportBodyHtml(){
    const today = new Date();
    const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    const metaParts = [];
    if(currentStudentName) metaParts.push(escapeHtml(currentStudentName) + (currentStudentNo ? ' (' + escapeHtml(currentStudentNo) + ')' : ''));
    metaParts.push(dateStr);
    const sections = activitySchema.map(tab => {
      const fieldsHtml = (tab.fields || []).map(f => {
        const v = activityResponses[f.key];
        if(f.type === 'checklist'){
          const checked = Array.isArray(v) ? v : [];
          const items = (f.options || []).map(o => (checked.includes(o) ? '✓ ' : '☐ ') + escapeHtml(o)).join('<br>');
          return '<p style="margin:0 0 12px;"><strong>' + escapeHtml(f.label || '') + '</strong><br>' + (items || '<span style="color:#94a3b8;">(항목 없음)</span>') + '</p>';
        }
        const text = String(v || '').trim();
        return '<p style="margin:0 0 12px;"><strong>' + escapeHtml(f.label || '') + '</strong><br>' +
          (text ? escapeHtml(text).replace(/\n/g, '<br>') : '<span style="color:#94a3b8;">(작성하지 않음)</span>') + '</p>';
      }).join('');
      return '<h2 style="font-size:15px;color:#4f46e5;border-bottom:1px solid #d7d2bd;padding-bottom:4px;margin:18px 0 10px;">' +
        escapeHtml(tab.title || '') + '</h2>' + (fieldsHtml || '<p style="color:#94a3b8;">(하위항목 없음)</p>');
    }).join('');
    return (
      '<div style="font-family:\'Malgun Gothic\',\'Noto Sans KR\',sans-serif;max-width:720px;line-height:1.6;">' +
        '<h1 style="font-size:19px;margin:0 0 4px;">' + escapeHtml(activityExportTitle()) + '</h1>' +
        '<div style="font-size:12px;color:#5c5a47;margin-bottom:16px;">' + metaParts.join(' · ') + '</div>' +
        sections +
      '</div>'
    );
  }
  function downloadActivityPdf(){
    el('activityPrintView').innerHTML = activityExportBodyHtml();
    window.print();
  }
  function downloadActivityWord(){
    const html = '<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>' + escapeHtml(activityExportTitle()) + '</title></head><body>' + activityExportBodyHtml() + '</body></html>';
    const blob = new Blob(['﻿', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = activityExportTitle() + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  el('btnActivityDlPdf').addEventListener('click', downloadActivityPdf);
  el('btnActivityDlWord').addEventListener('click', downloadActivityWord);

  async function sendMessage(){
    const input = el('chatInput');
    const text = input.value.trim();
    if(!text || sending) return;
    const token = sessionStorage.getItem(sessionKey);
    if(!token){ appendMessage('assistant', '세션이 만료됐어요. 페이지를 새로고침해서 암호를 다시 입력해주세요.'); return; }
    sending = true;
    el('btnSend').disabled = true;
    input.value = ''; input.style.height = 'auto';
    el('suggestedRow').style.display = 'none';
    appendMessage('user', text);
    appendTyping();
    try{
      const res = await fetch(FUNCTIONS_BASE + '/student-bot-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'chat', sessionToken: token, message: text }),
      });
      removeTyping();
      if(!res.ok || !res.body){
        let errMsg = '알 수 없는 오류가 발생했어요.';
        try{ const errData = await res.json(); errMsg = errData.error || errMsg; }catch(e){}
        appendMessage('assistant', '오류: ' + errMsg);
        return;
      }
      // 스트리밍 응답: 도착하는 대로 한 글자씩 이어 붙여 보여줘요(전체 다 받을 때까지
      // 기다리지 않아서 체감 속도가 훨씬 빨라요).
      const bubble = appendMessage('assistant', '');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        full += decoder.decode(value, { stream: true });
        bubble.textContent = full;
        el('chatMessages').scrollTop = el('chatMessages').scrollHeight;
      }
      if(full){ bubble.textContent = cleanMarkdownText(full); addTtsButton(bubble, full); }
    }catch(e){
      removeTyping();
      appendMessage('assistant', '오류: 서버에 연결하지 못했어요. 잠시 후 다시 시도해주세요.');
    }finally{
      sending = false;
      el('btnSend').disabled = false;
    }
  }
  el('btnSend').addEventListener('click', sendMessage);
  el('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
  el('chatInput').addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

  function initVoice(){
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognitionImpl){ el('btnMic').style.display = 'none'; return; }
    const recognizer = new SpeechRecognitionImpl();
    recognizer.lang = 'ko-KR'; recognizer.continuous = false; recognizer.interimResults = false; recognizer.maxAlternatives = 1;
    let listening = false;
    function setListening(v){
      listening = v;
      el('btnMic').classList.toggle('listening', v);
      el('btnMic').textContent = v ? '⏹' : '🎤';
    }
    recognizer.addEventListener('result', (e) => {
      const t = e.results[0][0].transcript;
      if(t && t.trim()){ el('chatInput').value = t.trim(); sendMessage(); }
    });
    recognizer.addEventListener('error', () => setListening(false));
    recognizer.addEventListener('end', () => setListening(false));
    el('btnMic').addEventListener('click', () => {
      if(listening){ recognizer.stop(); return; }
      try{ recognizer.start(); setListening(true); }catch(e){}
    });
  }

  // PIN을 입력하기 전에도 어떤 챗봇인지(선생님이 지은 이름) 바로 보이도록, 민감하지 않은
  // 제목만 먼저 가볍게 조회해요.
  (async () => {
    try{
      const info = await callBot('info', { slug });
      if(info.ok && info.title){
        el('pinTitle').textContent = info.title + ' 이용하기';
        el('chatTitle').textContent = info.title;
      }
    }catch(e){ /* 조용히 기본 문구 유지 */ }
  })();

  // 새로고침해도 같은 탭에서는 세션을 다시 쓸 수 있게(암호를 또 입력하지 않도록) 해요.
  // (지난 대화 내용은 화면엔 다시 안 보이지만, 챗봇은 서버에 저장된 이전 대화를 계속 참고해요.)
  const existingToken = sessionStorage.getItem(sessionKey);
  if(existingToken){
    show('chatView');
    initVoice();
    loadNotes();
    // 활동 탭은 "start"를 다시 호출하지 않는 이 경로에서는 구조(activitySchema,
    // bot 단위)와 응답(activityResponses, 세션 단위)을 각각 info/getActivityResponses로
    // 따로 가져온다 — info는 이미 위에서 제목 표시용으로 호출하던 것과 같은, PIN
    // 확인 없이도 되는 가벼운 조회라 여기서 다시 한 번 불러도 괜찮다.
    (async () => {
      try{
        const [info, respData] = await Promise.all([
          callBot('info', { slug }),
          callBot('getActivityResponses', { sessionToken: existingToken }),
        ]);
        const schema = (info.ok && Array.isArray(info.activitySchema)) ? info.activitySchema : [];
        const responses = respData.ok ? (respData.responses || {}) : {};
        initActivityPanel(schema, responses);
      }catch(e){ /* 활동 탭은 부가 기능이라 실패해도 채팅은 계속돼야 함 */ }
    })();
  } else {
    show('pinView');
  }
})();
</script>
</body>
</html>
