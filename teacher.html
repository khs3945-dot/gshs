<style>

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{

  .wrap{ max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }

    display:flex; align-items:baseline; justify-content:space-between;

  header.page-head h1{

    width:100%;

  }
  .suggest-list{

<script>
(async function(){
const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const [{ data: __staffRows }, { data: __dutyRows }] = await Promise.all([
  sb.from('public_staff').select('name, department, subject, extension, homeroom, homeroom_room, hours, schedule'),
  sb.from('duty_roster').select('duty_date, zone, teacher_name').order('duty_date')
]);

const DIRECTORY = (__staffRows || []).map(r => ({
  name: r.name, department: r.department, subject: r.subject,
  extension: r.extension, homeroom: r.homeroom
}));
const TEACHERS = (__staffRows || [])
  .filter(r => r.schedule)
  .map(r => ({ name: r.name, homeroom: r.homeroom_room, hours: r.hours, schedule: r.schedule }));
const DUTY_ROWS = __dutyRows || [];
// "정문1"/"정문2" → "정문", "중식1"/"중식2" → "중식"처럼 끝의 숫자만 떼서 묶어요
// (duty.html의 baseZoneLabel과 동일한 규칙).
function dutyBaseZoneLabel(zone){
  const s = (zone || '').trim();
  return s.replace(/\d+$/, '') || s;
}

// 금요일 5교시 수업은 실제로 6교시까지 이어지는 2시간 연속 수업이라, 데이터엔 6교시가 비어있어도
// 화면엔 5교시와 같은 내용을 그대로 보여줘요 (공강 계산에도 반영됨).
TEACHERS.forEach(t => {
  const fri = t.schedule && t.schedule['금'];
  if(fri && fri['5'] && !fri['6']) fri['6'] = fri['5'];
});

// 교실 번호(101, 205 등)를 1-1, 2-5 같은 학년-반 표기로 바꿔서 보여줘요.
// "AI교실"처럼 숫자가 아닌 특별실 이름은 그대로 둬요.
function formatRoom(room){
  if(room === null || room === undefined || room === '') return '';
  const n = Number(room);
  if(!Number.isInteger(n) || n < 101 || n > 399 || (n % 100) < 1) return String(room);
  return Math.floor(n / 100) + '-' + (n % 100);
}


const wdList = ['월','화','수','목','금'];
const SHOW_MOBILE = false; // 개인 휴대폰 번호 표시 여부 — true로 바꾸면 다시 켜집니다.
const periods = [1,2,3,4,5,6,7];

const nameSearchEl = document.getElementById('nameSearch');
const suggestListEl = document.getElementById('suggestList');
const resultArea = document.getElementById('resultArea');

function renderSuggest(query){
  const q = query.trim();
  const candidates = DIRECTORY.filter(d => !q || d.name.includes(q));
  if(candidates.length === 0){ suggestListEl.classList.remove('open'); return; }
  suggestListEl.innerHTML = candidates.map(d => `
    <div class="suggest-item" data-name="${d.name}">
      <span>${d.name}</span>
      <span class="dept">${d.department}${d.subject ? ' · ' + d.subject : ''}</span>
    </div>`).join('');
  suggestListEl.classList.add('open');
  suggestListEl.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      nameSearchEl.value = el.dataset.name;
      suggestListEl.classList.remove('open');
      showTeacher(el.dataset.name);
    });
  });
}

nameSearchEl.addEventListener('focus', () => renderSuggest(nameSearchEl.value));
nameSearchEl.addEventListener('input', (e) => renderSuggest(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-row')) suggestListEl.classList.remove('open');
});

function renderTimetable(t){
  if(!t){
    return '<div class="empty-note">등록된 시간표 정보가 없습니다.</div>';
  }
  let html = '<table class="tt"><tr><th>교시</th>' + wdList.map(w => `<th>${w}</th>`).join('') + '</tr>';
  periods.forEach(p => {
    html += `<tr><th>${p}</th>`;
    wdList.forEach(w => {
      const cell = t.schedule?.[w]?.[String(p)];
      if(cell){
        html += `<td class="swapCell" data-day="${w}" data-period="${p}" title="눌러서 이 시간에 교체 가능한 선생님을 찾아요"><div class="subj">${cell.subject || ''}</div><div class="room">${formatRoom(cell.room)}</div></td>`;
      } else {
        html += `<td class="empty">–</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

// ============ 수업 교체 가능자 찾기 ============
// 시간표 칸(수업이 있는 칸만)을 누르면, 그 요일·교시에 비어있는 다른 선생님을 찾아줘요.
// 자리를 옮기는 게 아니라 "그 시간에 누가 대신 들어가 줄 수 있는지"를 찾는 대체 수업
// 모델이라, 요일·교시 자체는 절대 바뀌지 않아요 — 시간표엔 그대로 보이지만 실제로
// 누가 들어가는지만 바뀌는 거라, 과목명에 분반 알파벳이 붙어 시간이 고정된 수업이어도
// (교실.html/teachers.html의 letter-suffix 고정 시간 제약) 이 기능엔 영향이 없어요.
// 그중에서도 "내(조회 중인 선생님)가 비어있는 시간에 상대방이 수업이 있는" 시간이
// 하나라도 있으면 실제로 맞바꿀 수 있는 시간이라 우선순위를 높여서 보여줘요.
let currentTeacherName = null;

function isFree(teacher, day, period){
  const p = teacher.schedule && teacher.schedule[day] && teacher.schedule[day][String(period)];
  return !p;
}

// A(targetTeacher)의 자리를 B(candidate)가 대신 맡아줄 때, B에게 곧바로 갚을 시간이
// 없으면(1:1 맞교체 불가) 제3의 선생님 C를 거치는 3자 교체가 되는지 찾아봐요: B가 수업
// 중인 어떤 시간(S1)을 C가 비어서 대신 맡고, C가 수업 중인 어떤 시간(S2)을 A가 비어서
// 대신 맡으면 — 세 사람 모두 원래 수업 수를 그대로 유지한 채 자리를 한 바퀴 돌려서
// 채울 수 있어요(원래 들어가야 하는 수업이 그냥 빠지지 않고 나중에 다시 채워지도록).
function findThreeWayCycle(a, b){
  for(const c of TEACHERS){
    if(c.name === a.name || c.name === b.name) continue;
    let s1 = null;
    outer1:
    for(const d of wdList){
      for(const p of periods){
        if(!isFree(b, d, p) && isFree(c, d, p)){ s1 = { day: d, period: p }; break outer1; }
      }
    }
    if(!s1) continue;
    let s2 = null;
    outer2:
    for(const d of wdList){
      for(const p of periods){
        if(!isFree(c, d, p) && isFree(a, d, p)){ s2 = { day: d, period: p }; break outer2; }
      }
    }
    if(!s2) continue;
    return { partner: c.name, coverForB: s1, coverForA: s2 };
  }
  return null;
}

function findSwapCandidates(targetTeacher, day, period){
  return TEACHERS.filter(t => t.name !== targetTeacher.name && isFree(t, day, period))
    .map(t => {
      const mutualSlots = [];
      wdList.forEach(d => {
        periods.forEach(p => {
          if(!isFree(t, d, p) && isFree(targetTeacher, d, p)) mutualSlots.push({ day: d, period: p });
        });
      });
      const threeWay = mutualSlots.length ? null : findThreeWayCycle(targetTeacher, t);
      return { teacher: t, mutualSlots, threeWay };
    })
    .sort((a, b) => {
      const score = (r) => r.mutualSlots.length ? 2 : (r.threeWay ? 1 : 0);
      const sa = score(a), sb = score(b);
      if(sa !== sb) return sb - sa;
      return a.teacher.name.localeCompare(b.teacher.name, 'ko');
    });
}

function openSwapModal(day, period){
  const targetTeacher = TEACHERS.find(t => t.name === currentTeacherName);
  if(!targetTeacher) return;
  const cell = targetTeacher.schedule?.[day]?.[String(period)];
  const results = findSwapCandidates(targetTeacher, day, period);

  document.getElementById('swapModalTitle').textContent = `${day}요일 ${period}교시 교체 가능한 선생님`;
  const subjLine = cell
    ? `<div class="empty-note" style="text-align:left; padding:0 0 12px;">현재 수업: ${cell.subject || ''}${formatRoom(cell.room) ? ' (' + formatRoom(cell.room) + ')' : ''}</div>`
    : '';
  const body = results.length ? results.map(r => {
    const dir = DIRECTORY.find(d => d.name === r.teacher.name);
    const deptLine = dir ? (dir.department || '') + (dir.subject ? ' · ' + dir.subject : '') : '';
    let mutualHtml;
    if(r.mutualSlots.length){
      mutualHtml = `<div class="swap-mutual">맞교체 가능: ${r.mutualSlots.map(s => `${s.day} ${s.period}교시`).join(', ')}</div>`;
    } else if(r.threeWay){
      const { partner, coverForB, coverForA } = r.threeWay;
      mutualHtml = `<div class="swap-mutual">3자 교체 가능(${partner} 선생님과 함께): ${r.teacher.name} 선생님이 이 시간을 맡고, ${r.teacher.name} 선생님의 ${coverForB.day} ${coverForB.period}교시는 ${partner} 선생님이, ${partner} 선생님의 ${coverForA.day} ${coverForA.period}교시는 선생님이 맡으면 돌아가며 채울 수 있어요.</div>`;
    } else {
      mutualHtml = `<div class="swap-mutual swap-mutual-none">이 시간엔 비어있어요 (맞바꿀 시간은 없어요)</div>`;
    }
    return `
      <div class="swap-candidate">
        <div class="swap-candidate-head"><span class="swap-name">${r.teacher.name}</span><span class="swap-dept">${deptLine}</span></div>
        ${mutualHtml}
      </div>
    `;
  }).join('') : '<div class="empty-note">이 시간에 비어있는 선생님이 없습니다.</div>';

  document.getElementById('swapModalBody').innerHTML = subjLine + body;
  document.getElementById('swapModalOverlay').style.display = 'block';
  document.getElementById('swapModal').style.display = 'flex';
}
function closeSwapModal(){
  document.getElementById('swapModalOverlay').style.display = 'none';
  document.getElementById('swapModal').style.display = 'none';
}
document.getElementById('swapModalOverlay').addEventListener('click', closeSwapModal);
document.getElementById('swapModalClose').addEventListener('click', closeSwapModal);
resultArea.addEventListener('click', (e) => {
  const cell = e.target.closest('.swapCell');
  if(!cell) return;
  openSwapModal(cell.dataset.day, Number(cell.dataset.period));
});

function renderDutyList(name){
  const byDate = {};
  DUTY_ROWS.forEach(r => {
    if(r.teacher_name !== name) return;
    if(!byDate[r.duty_date]) byDate[r.duty_date] = new Set();
    byDate[r.duty_date].add(dutyBaseZoneLabel(r.zone));
  });
  const dates = Object.keys(byDate).sort();
  if(dates.length === 0){
    return '<div class="empty-note">배정된 지도 당번 일정이 없습니다.</div>';
  }
  const wdNamesKo = ['일', '월', '화', '수', '목', '금', '토'];
  const mdFmt = iso => { const [y,m,dd] = iso.split('-'); return `${parseInt(m)}.${parseInt(dd)}`; };
  return '<ul class="duty-list">' + dates.map(date => {
    const [y, m, dd] = date.split('-').map(Number);
    const wd = wdNamesKo[new Date(y, m - 1, dd).getDay()];
    const roles = Array.from(byDate[date]);
    return `<li><span>${mdFmt(date)}(${wd})</span><span class="role">${roles.join(' · ')}</span></li>`;
  }).join('') + '</ul>';
}

function showTeacher(name){
  const person = DIRECTORY.find(d => d.name === name);
  if(!person){
    resultArea.innerHTML = '<div class="empty-note">해당 이름을 찾을 수 없습니다.</div>';
    return;
  }
  const timetable = TEACHERS.find(t => t.name === name);
  currentTeacherName = name;

  resultArea.innerHTML = `
    <div class="profile-card">
      <div class="profile-head">
        <span class="name">${person.name}</span>
        <span class="dept">${person.department}${person.subject ? ' · ' + person.subject : ''}</span>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="label">담임반</div><div class="value">${person.homeroom || '—'}</div></div>
        <div class="info-item"><div class="label">내선번호</div><div class="value">${person.extension || '—'}</div></div>
        ${SHOW_MOBILE ? '<div class="info-item"><div class="label">휴대폰 번호</div><div class="value"><span class="mobile-reveal" id="mobileReveal">휴대폰 번호</span></div></div>' : ''}
        <div class="info-item"><div class="label">부서</div><div class="value">${person.department || '—'}</div></div>
      </div>
    </div>

    <div class="section">
      <h2>시간표</h2>
      <div class="card">${renderTimetable(timetable)}</div>
    </div>

    <div class="section">
      <h2>학생 지도 당번 일정</h2>
      <div class="card">${renderDutyList(person.name)}</div>
    </div>
  `;

  if(SHOW_MOBILE){
    const revealEl = document.getElementById('mobileReveal');
    if(revealEl){
      revealEl.addEventListener('click', () => {
        revealEl.textContent = person.mobile || '등록된 번호 없음';
        revealEl.classList.remove('mobile-reveal');
      }, { once: true });
    }
  }
}

const params = new URLSearchParams(location.search);
const initialName = params.get('name');
if(initialName){
  nameSearchEl.value = initialName;
  showTeacher(initialName);
} else {
  // 로그인한 선생님이 있으면 기본으로 본인 정보를 보여줘요.
  (function waitForAuthTeacher(cb){
    if(window.__gsAuth){ cb(); } else { setTimeout(() => waitForAuthTeacher(cb), 150); }
  })(() => {
    const session = window.__gsAuth.getSession();
    if(session && session.name){
      nameSearchEl.value = session.name;
      showTeacher(session.name);
    }
  });
}
})();
</script>
