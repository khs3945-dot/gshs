<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사별 보기 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --stamp-strong: rgba(38,64,133,0.16);
    --crest-red: #EE2E22;
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head a.back{ font-size: 12.5px; color: var(--ink-soft); text-decoration:none; }
  header.page-head a.back:hover{ color: var(--ink); }

  .search-row{ position:relative; margin-bottom: 22px; }
  .search-row input{
    width:100%;
    font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding: 11px 12px; border:1px solid var(--rule); border-radius:6px;
    background: var(--paper-card); color: var(--ink);
  }
  .suggest-list{
    position:absolute; left:0; right:0; top: calc(100% + 4px);
    background:#fff; border:1px solid var(--rule); border-radius:6px;
    max-height: 240px; overflow-y:auto;
    box-shadow: 0 4px 14px rgba(38,43,37,0.14);
    z-index: 20; display:none;
  }
  .suggest-list.open{ display:block; }
  .suggest-item{ padding: 9px 12px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .suggest-item .dept{ color:var(--ink-soft); font-size:12px; }
  .suggest-item:hover, .suggest-item.active{ background: var(--stamp-soft); }

  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding: 30px 10px; }

  .profile-card{
    background: var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .profile-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .profile-head .name{ font-family:'Noto Sans KR', sans-serif; font-size:20px; font-weight:700; }
  .profile-head .dept{ font-size:12.5px; color:var(--ink-soft); }
  .info-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .info-item .label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
  .info-item .value{ font-size:14px; font-weight:600; }
  .mobile-reveal{
    color: var(--stamp); cursor:pointer; text-decoration:underline dotted; font-weight:500;
  }

  .section{ margin-bottom: 20px; }
  .section h2{
    font-family:'Noto Sans KR', sans-serif; font-size:14.5px; font-weight:700;
    color: var(--stamp); margin: 0 0 8px; display:flex; align-items:center; gap:8px;
  }
  .section h2::before{ content:''; display:inline-block; width:8px; height:8px; background:var(--stamp); }
  .card{ background: var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding: 16px 18px; overflow-x:auto; }

  table.tt{ border-collapse:collapse; width:100%; font-size:12.5px; min-width:480px; }
  table.tt th, table.tt td{ border:1px solid var(--rule-soft); padding:6px 5px; text-align:center; }
  table.tt th{ background:var(--stamp-soft); color:var(--stamp); font-weight:700; }
  table.tt td.subj{ font-weight:600; }
  table.tt td.room{ color:var(--ink-soft); font-size:11px; }
  table.tt td.empty{ color:var(--rule); }
  table.tt td.swapCell{ cursor:pointer; }
  table.tt td.swapCell:hover{ background:var(--stamp-soft); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(38,43,37,0.45); z-index:10000; }
  .modal-box{
    position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
    width:min(520px, 92vw); max-height:82vh; display:flex; flex-direction:column;
    background:var(--paper-card); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,0.25);
    z-index:10001;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--rule-soft); }
  .modal-head h3{ font-family:'Noto Sans KR', sans-serif; font-size:16px; margin:0; }
  .modal-close{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); line-height:1; padding:4px; }
  .modal-body{ padding:16px 20px; overflow-y:auto; flex:1; }
  .swap-candidate{ padding:10px 0; border-bottom:1px dashed var(--rule-soft); }
  .swap-candidate:last-child{ border-bottom:none; }
  .swap-candidate-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .swap-name{ font-weight:700; font-size:14px; }
  .swap-dept{ font-size:11.5px; color:var(--ink-soft); }
  .swap-mutual{ font-size:12.5px; color:var(--stamp); }
  .swap-mutual-none{ color:var(--ink-soft); }

  .duty-list{ list-style:none; margin:0; padding:0; }
  .duty-list li{
    display:flex; justify-content:space-between; gap:10px;
    padding: 7px 0; border-bottom:1px dashed var(--rule-soft); font-size:13.5px;
  }
  .duty-list li:last-child{ border-bottom:none; }
  .duty-list .role{ color:var(--stamp); font-weight:600; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./site-login-badge.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <header class="page-head">
      <h1>교사별 보기</h1>
      <a class="back" href="./index.html">← 메인으로</a>
    </header>

    <div class="search-row">
      <input type="text" id="nameSearch" placeholder="이름 검색 (예: 김경성)" autocomplete="off">
      <div class="suggest-list" id="suggestList"></div>
    </div>

    <div id="resultArea">
      <div class="empty-note">이름을 검색해 선택해주세요.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="swapModalOverlay" style="display:none;"></div>
<div class="modal-box" id="swapModal" style="display:none;">
  <div class="modal-head">
    <h3 id="swapModalTitle"></h3>
    <button type="button" class="modal-close" id="swapModalClose">✕</button>
  </div>
  <div class="modal-body" id="swapModalBody"></div>
</div>

<script>
(async function(){
const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const [{ data: __staffRows }, { data: __dutyRows }] = await Promise.all([
  sb.from('public_staff').select('name, department, subject, extension, homeroom, homeroom_room, hours, schedule'),
  sb.from('duty_roster').select('date, weekday, event, front1, front2, back, lunch1, lunch2, night, night_note').order('date')
]);

const DIRECTORY = (__staffRows || []).map(r => ({
  name: r.name, department: r.department, subject: r.subject,
  extension: r.extension, homeroom: r.homeroom
}));
const TEACHERS = (__staffRows || [])
  .filter(r => r.schedule)
  .map(r => ({ name: r.name, homeroom: r.homeroom_room, hours: r.hours, schedule: r.schedule }));
const DUTY_DATA = (__dutyRows || []).map(d => ({
  date: d.date, weekday: d.weekday, event: d.event,
  front1: d.front1, front2: d.front2, back: d.back,
  lunch1: d.lunch1, lunch2: d.lunch2, night: d.night, nightNote: d.night_note
}));

// 금요일 5교시 수업은 실제로 6교시까지 이어지는 2시간 연속 수업이라, 데이터엔 6교시가 비어있어도
// 화면엔 5교시와 같은 내용을 그대로 보여줘요 (공강 계산에도 반영됨).
TEACHERS.forEach(t => {
  const fri = t.schedule && t.schedule['금'];
  if(fri && fri['5'] && !fri['6']) fri['6'] = fri['5'];
});

// 교실 번호(101, 205 등)를 1-1, 2-5 같은 학년-반 표기로 바꿔서 보여줘요.
// "AI교실"처럼 숫자가 아닌 특별실 이름은 그대로 둬요.
function formatRoom(room){
  if(room === null || room === undefined || room === '') return '';
  const n = Number(room);
  if(!Number.isInteger(n) || n < 101 || n > 399 || (n % 100) < 1) return String(room);
  return Math.floor(n / 100) + '-' + (n % 100);
}


const wdList = ['월','화','수','목','금'];
const SHOW_MOBILE = false; // 개인 휴대폰 번호 표시 여부 — true로 바꾸면 다시 켜집니다.
const periods = [1,2,3,4,5,6,7];

const nameSearchEl = document.getElementById('nameSearch');
const suggestListEl = document.getElementById('suggestList');
const resultArea = document.getElementById('resultArea');

function renderSuggest(query){
  const q = query.trim();
  const candidates = DIRECTORY.filter(d => !q || d.name.includes(q));
  if(candidates.length === 0){ suggestListEl.classList.remove('open'); return; }
  suggestListEl.innerHTML = candidates.map(d => `
    <div class="suggest-item" data-name="${d.name}">
      <span>${d.name}</span>
      <span class="dept">${d.department}${d.subject ? ' · ' + d.subject : ''}</span>
    </div>`).join('');
  suggestListEl.classList.add('open');
  suggestListEl.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      nameSearchEl.value = el.dataset.name;
      suggestListEl.classList.remove('open');
      showTeacher(el.dataset.name);
    });
  });
}

nameSearchEl.addEventListener('focus', () => renderSuggest(nameSearchEl.value));
nameSearchEl.addEventListener('input', (e) => renderSuggest(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-row')) suggestListEl.classList.remove('open');
});

function renderTimetable(t){
  if(!t){
    return '<div class="empty-note">등록된 시간표 정보가 없습니다.</div>';
  }
  let html = '<table class="tt"><tr><th>교시</th>' + wdList.map(w => `<th>${w}</th>`).join('') + '</tr>';
  periods.forEach(p => {
    html += `<tr><th>${p}</th>`;
    wdList.forEach(w => {
      const cell = t.schedule?.[w]?.[String(p)];
      if(cell){
        html += `<td class="swapCell" data-day="${w}" data-period="${p}" title="눌러서 이 시간에 교체 가능한 선생님을 찾아요"><div class="subj">${cell.subject || ''}</div><div class="room">${formatRoom(cell.room)}</div></td>`;
      } else {
        html += `<td class="empty">–</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

// ============ 수업 교체 가능자 찾기 ============
// 시간표 칸(수업이 있는 칸만)을 누르면, 그 요일·교시에 비어있는 다른 선생님을 찾아줘요.
// 그중에서도 "내(조회 중인 선생님)가 비어있는 시간에 상대방이 수업이 있는" 시간이
// 하나라도 있으면 실제로 맞바꿀 수 있는 시간이라 우선순위를 높여서 보여줘요.
let currentTeacherName = null;

function isFree(teacher, day, period){
  const p = teacher.schedule && teacher.schedule[day] && teacher.schedule[day][String(period)];
  return !p;
}

// A(targetTeacher)의 자리를 B(candidate)가 대신 맡아줄 때, B에게 곧바로 갚을 시간이
// 없으면(1:1 맞교체 불가) 제3의 선생님 C를 거치는 3자 교체가 되는지 찾아봐요: B가 수업
// 중인 어떤 시간(S1)을 C가 비어서 대신 맡고, C가 수업 중인 어떤 시간(S2)을 A가 비어서
// 대신 맡으면 — 세 사람 모두 원래 수업 수를 그대로 유지한 채 자리를 한 바퀴 돌려서
// 채울 수 있어요("세 명이 서로 바꿔도 돼" 요청).
function findThreeWayCycle(a, b){
  for(const c of TEACHERS){
    if(c.name === a.name || c.name === b.name) continue;
    let s1 = null;
    outer1:
    for(const d of wdList){
      for(const p of periods){
        if(!isFree(b, d, p) && isFree(c, d, p)){ s1 = { day: d, period: p }; break outer1; }
      }
    }
    if(!s1) continue;
    let s2 = null;
    outer2:
    for(const d of wdList){
      for(const p of periods){
        if(!isFree(c, d, p) && isFree(a, d, p)){ s2 = { day: d, period: p }; break outer2; }
      }
    }
    if(!s2) continue;
    return { partner: c.name, coverForB: s1, coverForA: s2 };
  }
  return null;
}

function findSwapCandidates(targetTeacher, day, period){
  return TEACHERS.filter(t => t.name !== targetTeacher.name && isFree(t, day, period))
    .map(t => {
      const mutualSlots = [];
      wdList.forEach(d => {
        periods.forEach(p => {
          if(!isFree(t, d, p) && isFree(targetTeacher, d, p)) mutualSlots.push({ day: d, period: p });
        });
      });
      const threeWay = mutualSlots.length ? null : findThreeWayCycle(targetTeacher, t);
      return { teacher: t, mutualSlots, threeWay };
    })
    .sort((a, b) => {
      const score = (r) => r.mutualSlots.length ? 2 : (r.threeWay ? 1 : 0);
      const sa = score(a), sb = score(b);
      if(sa !== sb) return sb - sa;
      return a.teacher.name.localeCompare(b.teacher.name, 'ko');
    });
}

function openSwapModal(day, period){
  const targetTeacher = TEACHERS.find(t => t.name === currentTeacherName);
  if(!targetTeacher) return;
  const cell = targetTeacher.schedule?.[day]?.[String(period)];
  const results = findSwapCandidates(targetTeacher, day, period);

  document.getElementById('swapModalTitle').textContent = `${day}요일 ${period}교시 교체 가능한 선생님`;
  const subjLine = cell
    ? `<div class="empty-note" style="text-align:left; padding:0 0 12px;">현재 수업: ${cell.subject || ''}${formatRoom(cell.room) ? ' (' + formatRoom(cell.room) + ')' : ''}</div>`
    : '';
  const body = results.length ? results.map(r => {
    const dir = DIRECTORY.find(d => d.name === r.teacher.name);
    const deptLine = dir ? (dir.department || '') + (dir.subject ? ' · ' + dir.subject : '') : '';
    let mutualHtml;
    if(r.mutualSlots.length){
      mutualHtml = `<div class="swap-mutual">맞교체 가능: ${r.mutualSlots.map(s => `${s.day} ${s.period}교시`).join(', ')}</div>`;
    } else if(r.threeWay){
      const { partner, coverForB, coverForA } = r.threeWay;
      mutualHtml = `<div class="swap-mutual">3자 교체 가능(${partner} 선생님과 함께): ${r.teacher.name} 선생님이 이 시간을 맡고, ${r.teacher.name} 선생님의 ${coverForB.day} ${coverForB.period}교시는 ${partner} 선생님이, ${partner} 선생님의 ${coverForA.day} ${coverForA.period}교시는 선생님이 맡으면 돌아가며 채울 수 있어요.</div>`;
    } else {
      mutualHtml = `<div class="swap-mutual swap-mutual-none">이 시간엔 비어있어요 (맞바꿀 시간은 없어요)</div>`;
    }
    return `
      <div class="swap-candidate">
        <div class="swap-candidate-head"><span class="swap-name">${r.teacher.name}</span><span class="swap-dept">${deptLine}</span></div>
        ${mutualHtml}
      </div>
    `;
  }).join('') : '<div class="empty-note">이 시간에 비어있는 선생님이 없습니다.</div>';

  document.getElementById('swapModalBody').innerHTML = subjLine + body;
  document.getElementById('swapModalOverlay').style.display = 'block';
  document.getElementById('swapModal').style.display = 'flex';
}
function closeSwapModal(){
  document.getElementById('swapModalOverlay').style.display = 'none';
  document.getElementById('swapModal').style.display = 'none';
}
document.getElementById('swapModalOverlay').addEventListener('click', closeSwapModal);
document.getElementById('swapModalClose').addEventListener('click', closeSwapModal);
resultArea.addEventListener('click', (e) => {
  const cell = e.target.closest('.swapCell');
  if(!cell) return;
  openSwapModal(cell.dataset.day, Number(cell.dataset.period));
});

function renderDutyList(name){
  const rows = [];
  DUTY_DATA.forEach(d => {
    const roles = [];
    if(d.front1 === name || d.front2 === name) roles.push('정문');
    if(d.back === name) roles.push('후문');
    if(d.lunch1 === name || d.lunch2 === name) roles.push('중식');
    if(d.night === name) roles.push('야자');
    if(roles.length > 0){
      rows.push({ date: d.date, weekday: d.weekday, roles });
    }
  });
  if(rows.length === 0){
    return '<div class="empty-note">배정된 지도 당번 일정이 없습니다.</div>';
  }
  const mdFmt = iso => { const [y,m,dd] = iso.split('-'); return `${parseInt(m)}.${parseInt(dd)}`; };
  return '<ul class="duty-list">' + rows.map(r =>
    `<li><span>${mdFmt(r.date)}(${r.weekday})</span><span class="role">${r.roles.join(' · ')}</span></li>`
  ).join('') + '</ul>';
}

function showTeacher(name){
  const person = DIRECTORY.find(d => d.name === name);
  if(!person){
    resultArea.innerHTML = '<div class="empty-note">해당 이름을 찾을 수 없습니다.</div>';
    return;
  }
  const timetable = TEACHERS.find(t => t.name === name);
  currentTeacherName = name;

  resultArea.innerHTML = `
    <div class="profile-card">
      <div class="profile-head">
        <span class="name">${person.name}</span>
        <span class="dept">${person.department}${person.subject ? ' · ' + person.subject : ''}</span>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="label">담임반</div><div class="value">${person.homeroom || '—'}</div></div>
        <div class="info-item"><div class="label">내선번호</div><div class="value">${person.extension || '—'}</div></div>
        ${SHOW_MOBILE ? '<div class="info-item"><div class="label">휴대폰 번호</div><div class="value"><span class="mobile-reveal" id="mobileReveal">휴대폰 번호</span></div></div>' : ''}
        <div class="info-item"><div class="label">부서</div><div class="value">${person.department || '—'}</div></div>
      </div>
    </div>

    <div class="section">
      <h2>시간표</h2>
      <div class="card">${renderTimetable(timetable)}</div>
    </div>

    <div class="section">
      <h2>학생 지도 당번 일정</h2>
      <div class="card">${renderDutyList(person.name)}</div>
    </div>
  `;

  if(SHOW_MOBILE){
    const revealEl = document.getElementById('mobileReveal');
    if(revealEl){
      revealEl.addEventListener('click', () => {
        revealEl.textContent = person.mobile || '등록된 번호 없음';
        revealEl.classList.remove('mobile-reveal');
      }, { once: true });
    }
  }
}

const params = new URLSearchParams(location.search);
const initialName = params.get('name');
if(initialName){
  nameSearchEl.value = initialName;
  showTeacher(initialName);
} else {
  // 로그인한 선생님이 있으면 기본으로 본인 정보를 보여줘요.
  (function waitForAuthTeacher(cb){
    if(window.__gsAuth){ cb(); } else { setTimeout(() => waitForAuthTeacher(cb), 150); }
  })(() => {
    const session = window.__gsAuth.getSession();
    if(session && session.name){
      nameSearchEl.value = session.name;
      showTeacher(session.name);
    }
  });
}
})();
</script>
</body>
</html>
