<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사별 보기 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --stamp-strong: rgba(38,64,133,0.16);
    --crest-red: #EE2E22;
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Serif KR', serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head a.back{ font-size: 12.5px; color: var(--ink-soft); text-decoration:none; }
  header.page-head a.back:hover{ color: var(--ink); }

  .search-row{ position:relative; margin-bottom: 22px; }
  .search-row input{
    width:100%;
    font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding: 11px 12px; border:1px solid var(--rule); border-radius:6px;
    background: var(--paper-card); color: var(--ink);
  }
  .suggest-list{
    position:absolute; left:0; right:0; top: calc(100% + 4px);
    background:#fff; border:1px solid var(--rule); border-radius:6px;
    max-height: 240px; overflow-y:auto;
    box-shadow: 0 4px 14px rgba(38,43,37,0.14);
    z-index: 20; display:none;
  }
  .suggest-list.open{ display:block; }
  .suggest-item{ padding: 9px 12px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .suggest-item .dept{ color:var(--ink-soft); font-size:12px; }
  .suggest-item:hover, .suggest-item.active{ background: var(--stamp-soft); }

  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding: 30px 10px; }

  .profile-card{
    background: var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .profile-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .profile-head .name{ font-family:'Noto Serif KR', serif; font-size:20px; font-weight:700; }
  .profile-head .dept{ font-size:12.5px; color:var(--ink-soft); }
  .info-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .info-item .label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
  .info-item .value{ font-size:14px; font-weight:600; }
  .mobile-reveal{
    color: var(--stamp); cursor:pointer; text-decoration:underline dotted; font-weight:500;
  }

  .section{ margin-bottom: 20px; }
  .section h2{
    font-family:'Noto Serif KR', serif; font-size:14.5px; font-weight:700;
    color: var(--stamp); margin: 0 0 8px; display:flex; align-items:center; gap:8px;
  }
  .section h2::before{ content:''; display:inline-block; width:8px; height:8px; background:var(--stamp); }
  .card{ background: var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding: 16px 18px; overflow-x:auto; }

  table.tt{ border-collapse:collapse; width:100%; font-size:12.5px; min-width:480px; }
  table.tt th, table.tt td{ border:1px solid var(--rule-soft); padding:6px 5px; text-align:center; }
  table.tt th{ background:var(--stamp-soft); color:var(--stamp); font-weight:700; }
  table.tt td.subj{ font-weight:600; }
  table.tt td.room{ color:var(--ink-soft); font-size:11px; }
  table.tt td.empty{ color:var(--rule); }

  .duty-list{ list-style:none; margin:0; padding:0; }
  .duty-list li{
    display:flex; justify-content:space-between; gap:10px;
    padding: 7px 0; border-bottom:1px dashed var(--rule-soft); font-size:13.5px;
  }
  .duty-list li:last-child{ border-bottom:none; }
  .duty-list .role{ color:var(--stamp); font-weight:600; }
</style>

  </div>
</div>

const wdList = ['월','화','수','목','금'];
const SHOW_MOBILE = false; // 개인 휴대폰 번호 표시 여부 — true로 바꾸면 다시 켜집니다.
const periods = [1,2,3,4,5,6,7];

const nameSearchEl = document.getElementById('nameSearch');
const suggestListEl = document.getElementById('suggestList');
const resultArea = document.getElementById('resultArea');

function renderSuggest(query){
  const q = query.trim();
  const candidates = DIRECTORY.filter(d => !q || d.name.includes(q));
  if(candidates.length === 0){ suggestListEl.classList.remove('open'); return; }
  suggestListEl.innerHTML = candidates.map(d => `
    <div class="suggest-item" data-name="${d.name}">
      <span>${d.name}</span>
      <span class="dept">${d.department}${d.subject ? ' · ' + d.subject : ''}</span>
    </div>`).join('');
  suggestListEl.classList.add('open');
  suggestListEl.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      nameSearchEl.value = el.dataset.name;
      suggestListEl.classList.remove('open');
      showTeacher(el.dataset.name);
    });
  });
}

nameSearchEl.addEventListener('focus', () => renderSuggest(nameSearchEl.value));
nameSearchEl.addEventListener('input', (e) => renderSuggest(e.target.value));
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-row')) suggestListEl.classList.remove('open');
});

function renderTimetable(t){
  if(!t){
    return '<div class="empty-note">등록된 시간표 정보가 없습니다.</div>';
  }
  let html = '<table class="tt"><tr><th>교시</th>' + wdList.map(w => `<th>${w}</th>`).join('') + '</tr>';
  periods.forEach(p => {
    html += `<tr><th>${p}</th>`;
    wdList.forEach(w => {
      const cell = t.schedule?.[w]?.[String(p)];
      if(cell){
        html += `<td><div class="subj">${cell.subject || ''}</div><div class="room">${cell.room || ''}</div></td>`;
      } else {
        html += `<td class="empty">–</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

function renderDutyList(name){
  const rows = [];
  DUTY_DATA.forEach(d => {
    const roles = [];
    if(d.front1 === name || d.front2 === name) roles.push('정문');
    if(d.back === name) roles.push('후문');
    if(d.lunch1 === name || d.lunch2 === name) roles.push('중식');
    if(d.night === name) roles.push('야자');
    if(roles.length > 0){
      rows.push({ date: d.date, weekday: d.weekday, roles });
    }
  });
  if(rows.length === 0){
    return '<div class="empty-note">배정된 지도 당번 일정이 없습니다.</div>';
  }
  const mdFmt = iso => { const [y,m,dd] = iso.split('-'); return `${parseInt(m)}.${parseInt(dd)}`; };
  return '<ul class="duty-list">' + rows.map(r =>
    `<li><span>${mdFmt(r.date)}(${r.weekday})</span><span class="role">${r.roles.join(' · ')}</span></li>`
  ).join('') + '</ul>';
}

function showTeacher(name){
  const person = DIRECTORY.find(d => d.name === name);
  if(!person){
    resultArea.innerHTML = '<div class="empty-note">해당 이름을 찾을 수 없습니다.</div>';
    return;
  }
  const timetable = TEACHERS.find(t => t.name === name);

  resultArea.innerHTML = `
    <div class="profile-card">
      <div class="profile-head">
        <span class="name">${person.name}</span>
        <span class="dept">${person.department}${person.subject ? ' · ' + person.subject : ''}</span>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="label">담임반</div><div class="value">${person.homeroom || '—'}</div></div>
        <div class="info-item"><div class="label">내선번호</div><div class="value">${person.extension || '—'}</div></div>
        ${SHOW_MOBILE ? '<div class="info-item"><div class="label">휴대폰 번호</div><div class="value"><span class="mobile-reveal" id="mobileReveal">휴대폰 번호</span></div></div>' : ''}
        <div class="info-item"><div class="label">부서</div><div class="value">${person.department || '—'}</div></div>
      </div>
    </div>

    <div class="section">
      <h2>시간표</h2>
      <div class="card">${renderTimetable(timetable)}</div>
    </div>

    <div class="section">
      <h2>학생 지도 당번 일정</h2>
      <div class="card">${renderDutyList(person.name)}</div>
    </div>
  `;

  if(SHOW_MOBILE){
    const revealEl = document.getElementById('mobileReveal');
    if(revealEl){
      revealEl.addEventListener('click', () => {
        revealEl.textContent = person.mobile || '등록된 번호 없음';
        revealEl.classList.remove('mobile-reveal');
      }, { once: true });
    }
  }
}

const params = new URLSearchParams(location.search);
const initialName = params.get('name');
if(initialName){
  nameSearchEl.value = initialName;
  showTeacher(initialName);
} else {
  // 로그인한 선생님이 있으면 기본으로 본인 정보를 보여줘요.
  (function waitForAuthTeacher(cb){
    if(window.__gsAuth){ cb(); } else { setTimeout(() => waitForAuthTeacher(cb), 150); }
  })(() => {
    const session = window.__gsAuth.getSession();
    if(session && session.name){
      nameSearchEl.value = session.name;
      showTeacher(session.name);
    }
  });
}
</script>
</body>
</html>
