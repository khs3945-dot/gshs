<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 링크 모음 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5;
  }
  .wrap{ max-width: 1040px; margin:0 auto; padding: 36px 20px 80px; }
  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink); padding-bottom:14px; margin-bottom:20px; flex-wrap:wrap; gap:8px;
  }
  header.page-head h1{ font-family:'Noto Serif KR', serif; font-weight:600; font-size:20px; margin:0; }
  header.page-head a.back{ font-size:12.5px; color:var(--ink-soft); text-decoration:none; }

  .intro{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:20px; }

  input[type=text], input[type=url]{
    width:100%; font-family:'Noto Sans KR', sans-serif; font-size:13.5px;
    padding:10px 12px; border:1px solid var(--rule); border-radius:6px; box-sizing:border-box;
  }
  #searchInput{ margin-bottom:22px; font-size:15px; padding:12px 14px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:18px; margin-bottom:18px; }
  .card h2{ font-family:'Noto Serif KR', serif; font-size:14.5px; margin:0 0 12px; color:var(--stamp); }

  label.field{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; margin-top:10px; }
  label.field:first-child{ margin-top:0; }

  .btn{
    font-family:'Noto Sans KR', sans-serif; font-size:14px; font-weight:600;
    color:var(--paper-card); background:var(--stamp); border:none; border-radius:6px;
    padding:11px 18px; cursor:pointer; margin-top:14px;
  }
  .btn:disabled{ opacity:0.4; cursor:default; }

  .category-section{ margin-bottom: 26px; }
  .category-section h3{
    font-family:'Noto Serif KR', serif; font-size:15px; font-weight:700; margin:0 0 10px;
    padding-bottom:6px; border-bottom:2px solid var(--rule-soft); color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .category-section h3 .dot{
    display:inline-block; width:10px; height:10px; border-radius:50%; flex-shrink:0;
  }
  .category-section h3 .cat-count{
    font-family:'Noto Sans KR', sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    background:var(--rule-soft); border-radius:10px; padding:1px 8px; margin-left:2px;
  }
  .category-section h3 .cat-chevron{
    margin-left:auto; color:var(--ink-soft); font-size:13px;
  }
  .category-section h3:hover{ color:var(--stamp); }
  .link-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px;
  }
  .link-card{
    display:flex; flex-direction:column; justify-content:space-between; gap:8px;
    background:var(--paper-card); border:1px solid var(--rule-soft); border-radius:8px;
    padding:13px 14px; color:var(--ink); min-height:76px;
  }
  .link-card:hover{ border-color:var(--stamp); background:var(--stamp-soft); }
  .link-card .top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .link-card .name{ font-weight:600; font-size:13.5px; text-decoration:none; color:inherit; line-height:1.4; word-break:break-word; }
  .link-card .desc{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .link-card .bottom-row{ display:flex; align-items:center; justify-content:space-between; }
  .link-card .arrow{ color:var(--ink-soft); flex-shrink:0; font-size:13px; }
  .link-card .del-btn{
    flex-shrink:0; background:none; border:1px solid var(--rule-soft); border-radius:5px;
    color:var(--ink-soft); font-size:11px; padding:3px 7px; cursor:pointer;
  }
  .link-card .del-btn:hover{ border-color:var(--crest-red); color:var(--crest-red); }

  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding: 10px 2px; }

  .log{ font-size:12.5px; margin-top:10px; }
  .log.ok{ color:#2E7D32; }
  .log.warn{ color:#C77700; }
  .log.err{ color:var(--crest-red); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <header class="page-head">
      <h1>업무 링크 모음</h1>
    </header>

    <div class="intro">
      업무포털, 학교 홈페이지처럼 자주 쓰는 링크를 누구나 추가할 수 있어요. 추가하면 바로 아래 목록에 반영돼요.
    </div>

    <input type="text" id="searchInput" placeholder="이름·설명·카테고리로 검색">

    <div id="listArea"></div>

    <div class="card">
      <h2>+ 새 링크 추가</h2>
      <label class="field">카테고리</label>
      <select id="fCategory" style="width:100%; font-family:'Noto Sans KR', sans-serif; font-size:13.5px; padding:10px 12px; border:1px solid var(--rule); border-radius:6px; box-sizing:border-box; margin-bottom:12px; background:#fff;">
        <option value="">카테고리를 선택하세요</option>
        <option value="__new__">+ 새 카테고리 추가</option>
      </select>
      <div id="newCategoryRow" style="display:none; margin-bottom:12px;">
        <input type="text" id="fCategoryNew" placeholder="새 카테고리 이름 입력">
      </div>
      <label class="field">이름</label>
      <input type="text" id="fName" placeholder="예: 나이스 업무포털">
      <label class="field">링크 주소</label>
      <input type="url" id="fUrl" placeholder="https://...">
      <label class="field">설명 (선택)</label>
      <input type="text" id="fDesc" placeholder="간단한 설명">
      <button class="btn" id="btnSubmit">추가하기</button>
      <div class="log" id="submitLog"></div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbya9KVzR8Uu78lfQIw11EBY2Yg-cXZ1EJQs-4srjSAGEw_0svSlUxY8hXMuq1DI8x1dTw/exec';

let allLinks = [];

const CATEGORY_COLORS = ['#264085', '#6E6234', '#3F6B4F', '#6B3F5C', '#2E6E6E', '#4A5568', '#A85C32'];
function categoryColor(cat){
  let h = 0;
  for(let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
  return CATEGORY_COLORS[h % CATEGORY_COLORS.length];
}

let categoryExpanded = {};

function renderLinks(links, opts){
  opts = opts || {};
  const area = document.getElementById('listArea');
  if(links.length === 0){
    area.innerHTML = '<div class="empty-note">표시할 링크가 없어요.</div>';
    return;
  }
  const byCategory = {};
  links.forEach(l => {
    if(!byCategory[l.category]) byCategory[l.category] = [];
    byCategory[l.category].push(l);
  });

  let html = '';
  Object.keys(byCategory).sort().forEach(cat => {
    const color = categoryColor(cat);
    const isOpen = opts.forceOpen ? true : !!categoryExpanded[cat];
    html += `<div class="category-section">
      <h3 class="cat-toggle" data-cat="${escapeHtml(cat)}" style="border-bottom-color:${color}; cursor:pointer;">
        <span class="dot" style="background:${color};"></span>${escapeHtml(cat)}
        <span class="cat-count">${byCategory[cat].length}</span>
        <span class="cat-chevron">${isOpen ? '▾' : '▸'}</span>
      </h3>
      <div class="cat-body" style="display:${isOpen ? '' : 'none'};">
      <div class="link-grid">`;
    byCategory[cat].forEach(l => {
      html += `<div class="link-card" style="border-top:3px solid ${color};">
        <div class="top-row">
          <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="name">${escapeHtml(l.name)}</a>
          <span class="arrow">→</span>
        </div>
        ${l.desc ? `<div class="desc">${escapeHtml(l.desc)}</div>` : ''}
        <div class="bottom-row">
          <span></span>
          <button type="button" class="del-btn" data-id="${escapeHtml(l.id || '')}" title="삭제">✕</button>
        </div>
      </div>`;
    });
    html += `</div></div></div>`;
  });
  area.innerHTML = html;

  area.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); deleteLink(btn.dataset.id); });
  });
  area.querySelectorAll('.cat-toggle').forEach(h => {
    h.addEventListener('click', () => {
      const cat = h.dataset.cat;
      categoryExpanded[cat] = !categoryExpanded[cat];
      const body = h.nextElementSibling;
      const chevron = h.querySelector('.cat-chevron');
      body.style.display = categoryExpanded[cat] ? '' : 'none';
      chevron.textContent = categoryExpanded[cat] ? '▾' : '▸';
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilter(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){ renderLinks(allLinks); return; }
  const filtered = allLinks.filter(l =>
    l.name.toLowerCase().includes(q) ||
    l.desc.toLowerCase().includes(q) ||
    l.category.toLowerCase().includes(q)
  );
  // 검색 중일 때는 결과가 있는 카테고리를 전부 펼쳐서 보여줍니다.
  renderLinks(filtered, { forceOpen: true });
}

function updateCategorySelect(){
  const sel = document.getElementById('fCategory');
  const cats = [...new Set(allLinks.map(l => l.category))].sort();

  const current = sel.value;
  sel.innerHTML = '<option value="">카테고리를 선택하세요</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') +
    '<option value="__new__">+ 새 카테고리 추가</option>';
  if(cats.includes(current)) sel.value = current;
}

const CACHE_KEY = 'ks_linkhub_cache';

function loadCachedLinks(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function saveCachedLinks(links){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(links)); } catch(e){ /* 무시 */ }
}

async function loadLinks(){
  const area = document.getElementById('listArea');
  const cached = loadCachedLinks();

  if(cached){
    // 이전에 불러온 목록이 있으면 먼저 바로 보여주고, 최신 데이터는 뒤에서 조용히 받아와요.
    allLinks = cached;
    updateCategorySelect();
    applyFilter();
  } else {
    area.innerHTML = '<div class="empty-note">불러오는 중...</div>';
  }

  try{
    // 구글 앱스스크립트 웹앱의 GET 응답 캐시를 피하기 위해 매번 다른 값을 붙여요.
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('링크 목록을 불러오지 못했습니다.');
    allLinks = await res.json();
    saveCachedLinks(allLinks);
    updateCategorySelect();
    applyFilter();
  } catch(err){
    if(!cached){
      area.innerHTML = `<div class="empty-note">불러오기 실패: ${escapeHtml(err.message)}</div>`;
    }
    // 캐시된 목록이 이미 화면에 떠 있는 경우는, 최신화만 실패한 거라 화면은 그대로 둬요.
  }
}

async function submitLink(){
  const sel = document.getElementById('fCategory');
  const category = sel.value === '__new__'
    ? document.getElementById('fCategoryNew').value.trim()
    : sel.value.trim();
  const name = document.getElementById('fName').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const logEl = document.getElementById('submitLog');
  const btn = document.getElementById('btnSubmit');

  if(!category || !name || !url){
    logEl.textContent = '카테고리·이름·링크는 필수예요.';
    logEl.className = 'log warn';
    return;
  }
  try{ new URL(url); }
  catch(e){
    logEl.textContent = '링크 주소 형식이 올바르지 않아요. https:// 로 시작하는지 확인해주세요.';
    logEl.className = 'log warn';
    return;
  }

  btn.disabled = true;
  btn.textContent = '추가 중...';
  logEl.textContent = '';
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ category, name, url, desc })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || '알 수 없는 오류가 발생했습니다.');

    sel.value = '';
    document.getElementById('fCategoryNew').value = '';
    document.getElementById('newCategoryRow').style.display = 'none';
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fDesc').value = '';
    logEl.textContent = '✓ 추가되었어요.';
    logEl.className = 'log ok';
    loadLinks();
  } catch(err){
    logEl.textContent = '✕ ' + err.message;
    logEl.className = 'log err';
  } finally {
    btn.disabled = false;
    btn.textContent = '추가하기';
  }
}

async function deleteLink(id){
  if(!id){ alert('이 링크는 예전 방식으로 등록되어 삭제 기능을 쓸 수 없어요. 시트에서 직접 지워주세요.'); return; }
  if(!confirm('이 링크를 삭제할까요?')) return;
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', id })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || '삭제에 실패했습니다.');
    loadLinks();
  } catch(err){
    alert('✕ ' + err.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadLinks();
  document.getElementById('searchInput').addEventListener('input', applyFilter);
  document.getElementById('btnSubmit').addEventListener('click', submitLink);
  document.getElementById('fCategory').addEventListener('change', () => {
    document.getElementById('newCategoryRow').style.display =
      document.getElementById('fCategory').value === '__new__' ? '' : 'none';
  });
});
</script>
</body>
</html>
