<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교무 업무 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5;
  }
  .wrap{ max-width: 900px; margin:0 auto; padding: 44px 20px 80px; }

  header.page-head{
    border-bottom: 2px solid var(--ink); padding-bottom:16px; margin-bottom:24px;
  }
  header.page-head h1{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:24px; margin:0 0 6px; }
  header.page-head .term{ font-size:13px; color:var(--ink-soft); }
  a.back{ display:inline-block; margin-bottom:12px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }

  .card-list{ display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  /* 그룹이 있는 시트를 쓰면 nav.js가 위 그리드를 아래처럼 접고 펼 수 있는 그룹으로 바꿔줘요. */
  .card-list.has-groups{ display:flex; flex-direction:column; gap:22px; }
  .tile-group{ display:flex; flex-direction:column; gap:12px; }
  .tile-group-head{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:none; padding:0; cursor:pointer; text-align:left;
    font-family:'Noto Sans KR', sans-serif; font-size:14.5px; font-weight:700;
    color: var(--ink);
  }
  .tile-caret{ font-size:12px; color: var(--ink-soft); transition: transform 0.15s; }
  .tile-group-head[aria-expanded="false"] .tile-caret{ transform: rotate(-90deg); }
  .tile-group-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .tile-group-head[aria-expanded="false"] + .tile-group-grid{ display:none; }

  a.tool-card{
    display:flex; align-items:flex-start; gap:14px;
    background: var(--paper-card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 20px 20px 18px; text-decoration:none; color: var(--ink);
    transition: border-color 0.15s, transform 0.15s; position: relative;
  }
  a.tool-card:hover{ border-color: var(--stamp); background: var(--stamp-soft); transform: translateY(-1px); }
  .tool-card .icon{
    font-family:'Noto Sans KR', sans-serif; display:inline-flex; align-items:center; justify-content:center;
    padding-top: 4px; width: 42px; height: 48px; background: var(--stamp);
    clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%);
    color: #F8F4E8; font-weight:700; font-size:14px; flex-shrink:0;
  }
  .tool-card .text h2{ font-family:'Noto Sans KR', sans-serif; font-size:16px; font-weight:700; margin:0 0 4px; }
  .tool-card .text p{ font-size: 12px; color: var(--ink-soft); margin:0; line-height:1.55; }
  .arrow{ font-family:'Noto Sans KR', sans-serif; font-size: 16px; color: var(--ink-soft); position: absolute; top: 20px; right: 18px; }
  a.tool-card:hover .arrow{ color: var(--stamp); }

  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding: 20px 4px; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <a class="back" href="./index.html">← 메인으로</a>
    <header class="page-head">
      <h1>교무 업무 도구</h1>
      <span class="term">시험 준비 등 관리자용 도구 모음</span>
    </header>

    <div class="card-list">
      <a class="tool-card" href="./exam-generator.html">
        <span class="icon">생성</span>
        <div class="text">
          <h2>시험 시간표 생성기</h2>
          <p>NEIS 고사실별응시인원 원본 파일을 올리면 학생별 시험 시간표(exams.html)를 자동으로 만들어줘요.</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="tool-card" href="./menu-editor.html">
        <span class="icon">메뉴</span>
        <div class="text">
          <h2>메뉴 편집기</h2>
          <p>상단 햄버거 메뉴 목록을 이 화면에서 바로 고치고 저장하면, 다운로드·업로드 없이 GitHub에 바로 반영돼요.</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="tool-card" href="./sitemap-sync.html">
        <span class="icon">맵</span>
        <div class="text">
          <h2>사이트맵 ↔ 구글시트 동기화</h2>
          <p>메뉴·타일 구조를 구글시트로 내보내서 다듬은 다음, 그 시트 내용으로 사이트를 다시 반영해요.</p>
        </div>
        <span class="arrow">→</span>
      </a>

    </div>
  </div>
</div>
</body>
</html>
