<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날짜로 보기 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F3EC;
    --paper-card: #FFFFFF;
    --ink: #1C2230;
    --ink-soft: #5B6170;
    --rule: #DCD6C8;
    --rule-soft: #EFEAE0;
    --stamp: #23407A;
    --stamp-soft: rgba(35,64,122,0.08);
    --crest-red: #B8432F;
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 780px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{ font-family:'Gowun Batang', serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-0.01em; }
  header.page-head a.back{ font-size: 12.5px; color: var(--ink-soft); text-decoration:none; }
  header.page-head a.back:hover{ color: var(--ink); }

  .nav-row{ display:flex; align-items:stretch; gap:8px; margin-bottom: 22px; }
  .date-jump{ flex: 1; }
  .date-jump input[type=date]{
    width:100%;
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:14px;
    padding: 10px 11px; border:1px solid var(--rule); border-radius:6px;
    background: var(--paper-card); color: var(--ink); text-align:center;
  }
  .nav-btn{
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:13.5px; font-weight:500;
    color: var(--paper-card); background: var(--ink);
    border: none; border-radius: 6px; padding: 10px 16px; cursor:pointer;
  }

  .date-title{
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size: 22px; font-weight:700;
    margin-bottom: 20px;
  }
  .date-title .wd{ font-size:14px; color:var(--ink-soft); font-family:'IBM Plex Sans KR', system-ui, sans-serif; margin-left:8px; }

  .section{ margin-bottom: 20px; }
  .section h2{
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:14.5px; font-weight:700;
    color: var(--stamp);
    margin: 0 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .section h2::before{
    content:''; display:inline-block; width:8px; height:8px; background:var(--stamp);
  }
  .card{
    background: var(--paper-card); border:1px solid var(--rule); border-radius:8px;
    padding: 16px 18px;
  }
  .empty-note{ font-size:13px; color:var(--ink-soft); }

  .duty-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .duty-item .label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
  .duty-item .names{ font-size:14px; font-weight:600; }

  .event-tag{
    display:inline-block; background:var(--stamp-soft); color:var(--stamp);
    border-radius:4px; padding:3px 10px; font-size:13px; font-weight:600; margin-right:6px; margin-bottom:6px;
  }

  .gcal-item{
    display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed var(--rule-soft); font-size:13.5px;
  }
  .gcal-item:last-child{ border-bottom:none; }
  .gcal-item .time{ color:var(--ink-soft); font-size:12px; flex-shrink:0; min-width:70px; }
  .gcal-link{ display:inline-block; margin-top:8px; font-size:12px; color:var(--stamp); }

  .meal-block{ margin-bottom: 10px; }
  .meal-block:last-child{ margin-bottom:0; }
  .meal-block .kind{
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:12.5px; font-weight:700; color: var(--brass); margin-bottom:4px; display:inline-block;
  }
  .meal-block .dishes{ list-style:none; margin:0; padding:0; font-size:13.5px; line-height:1.6; }
  .meal-block .dishes li{ padding:2px 0; }
  .meal-block .cal{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .exam-grade{ margin-bottom:10px; }
  .exam-grade:last-child{ margin-bottom:0; }
  .exam-grade .g{ font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:13px; font-weight:700; margin-bottom:5px; }
  .exam-grade ul{ list-style:none; margin:0; padding:0; }
  .exam-grade li{ font-size:13.5px; padding:3px 0; border-bottom:1px dashed var(--rule-soft); }
  .exam-grade li:last-child{ border-bottom:none; }

  .footnote{ margin-top: 18px; font-size: 11px; color: var(--ink-soft); line-height:1.6; }
</style>
<script src="./nav.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>날짜로 보기</h1>
      <a class="back" href="./index.html">← 메인으로</a>
    </header>

    <div class="nav-row">
      <div class="date-jump"><input type="date" id="datePick"></div>
      <button class="nav-btn" id="btnToday">오늘</button>
    </div>

    <div class="date-title" id="dateTitle"></div>

    <div class="section">
      <h2>학사일정</h2>
      <div class="card" id="calendarBox"></div>
    </div>

    <div class="section">
      <h2>학교 구글 캘린더</h2>
      <div class="card" id="gcalBox"><div class="empty-note">불러오는 중…</div></div>
    </div>

    <div class="section">
      <h2>학생 지도 당번</h2>
      <div class="card" id="dutyBox"></div>
    </div>

    <div class="section">
      <h2>급식</h2>
      <div class="card" id="mealBox"><div class="empty-note">불러오는 중…</div></div>
    </div>

    <div class="section" id="examSection">
      <h2>시험 시간표</h2>
      <div class="card" id="examBox"></div>
    </div>

    <div class="footnote">

    </div>
  </div>

function pad(n){ return n.toString().padStart(2,'0'); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(key){ const [y,m,dd] = key.split('-').map(Number); return new Date(y, m-1, dd); }
function toYmd(d){ return d.getFullYear().toString() + pad(d.getMonth()+1) + pad(d.getDate()); }

let schoolCode = null;

async function resolveSchoolCode(){
  const cached = sessionStorage.getItem('gs_school_code');
  if(cached){ try { return JSON.parse(cached); } catch(e){} }
  const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&SCHUL_NM=${encodeURIComponent(SCHOOL_NAME)}&LCTN_SC_NM=${encodeURIComponent(LCTN_SC_NM)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('학교 정보 조회 실패');
  const data = await res.json();
  const rows = data?.schoolInfo?.[1]?.row;
  if(!rows || rows.length === 0) throw new Error('학교를 찾을 수 없습니다');
  const exact = rows.find(r => r.SCHUL_NM === SCHOOL_NAME) || rows[0];
  const code = { ATPT_OFCDC_SC_CODE: exact.ATPT_OFCDC_SC_CODE, SD_SCHUL_CODE: exact.SD_SCHUL_CODE };
  sessionStorage.setItem('gs_school_code', JSON.stringify(code));
  return code;
}

async function fetchMeal(date){
  const ymd = toYmd(date);
  const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${schoolCode.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${schoolCode.SD_SCHUL_CODE}&MLSV_YMD=${ymd}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('급식 정보 조회 실패');
  const data = await res.json();
  if(data?.RESULT) return [];
  return data?.mealServiceDietInfo?.[1]?.row || [];
}

function renderCalendar(iso){
  const box = document.getElementById('calendarBox');
  const dutyRow = DUTY_DATA.find(d => d.date === iso);
  let labels = [];
  if(dutyRow && dutyRow.nightNote){
    labels = [dutyRow.nightNote];
  } else if(dutyRow && dutyRow.event){
    labels = [dutyRow.event.replace(/(.)\1+/g, '$1')];
  } else if(CAL_EVENTS[iso]){
    labels = CAL_EVENTS[iso].slice();
  }
  if(labels.length === 0){
    box.innerHTML = '<div class="empty-note">등록된 특이사항이 없는 날입니다.</div>';
  } else {
    box.innerHTML = labels.map(l => `<span class="event-tag">${l}</span>`).join('');
  }
}

function renderDuty(iso){
  const box = document.getElementById('dutyBox');
  const row = DUTY_DATA.find(d => d.date === iso);
  if(!row || (!row.front1 && !row.back && !row.lunch1 && !row.night)){
    const note = row && row.nightNote ? `${row.nightNote} 기간으로 별도 지도 당번이 없습니다.` : '이 날짜의 지도 당번 정보가 없습니다.';
    box.innerHTML = `<div class="empty-note">${note}</div>`;
    return;
  }
  const items = [
    ['정문', [row.front1, row.front2].filter(Boolean).join(', ')],
    ['후문', row.back || ''],
    ['중식', [row.lunch1, row.lunch2].filter(Boolean).join(', ')],
    ['야자', row.night || (row.nightNote || '')],
  ];
  box.innerHTML = '<div class="duty-grid">' + items.map(([label, names]) => `
    <div class="duty-item">
      <div class="label">${label}</div>
      <div class="names">${names || '—'}</div>
    </div>`).join('') + '</div>';
}

async function renderMeal(dateObj){
  const box = document.getElementById('mealBox');
  box.innerHTML = '<div class="empty-note">불러오는 중…</div>';
  try{
    if(!schoolCode) schoolCode = await resolveSchoolCode();
    const rows = await fetchMeal(dateObj);
    if(rows.length === 0){
      box.innerHTML = '<div class="empty-note">이 날짜엔 급식 정보가 없어요 (주말·방학 등).</div>';
      return;
    }
    box.innerHTML = rows.map(r => {
      const dishes = (r.DDISH_NM || '').split('<br/>').map(s => s.trim()).filter(Boolean);
      const items = dishes.map(d => `<li>${d}</li>`).join('');
      const cal = r.CAL_INFO ? `<div class="cal">${r.CAL_INFO}</div>` : '';
      return `<div class="meal-block"><span class="kind">${r.MMEAL_SC_NM || '급식'}</span><ul class="dishes">${items}</ul>${cal}</div>`;
    }).join('');
  } catch(err){
    box.innerHTML = `<div class="empty-note">급식 정보를 불러오지 못했습니다. (${err.message})</div>`;
  }
}

function renderExam(iso){
  const section = document.getElementById('examSection');

  const data = EXAM_BY_DATE[iso];
  if(!data){

  section.style.display = '';
  const grades = Object.keys(data).sort();
  box.innerHTML = grades.map(g => {
    const items = data[g].map(e => `<li>${e.period}교시 — ${e.subject}</li>`).join('');
    return `<div class="exam-grade"><div class="g">${g}학년</div><ul>${items}</ul></div>`;

}

function fmtEventTime(dt){
  if(!dt) return '';
  const d = new Date(dt);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' });
}

async function renderGoogleCalendar(iso){
  const box = document.getElementById('gcalBox');
  box.innerHTML = '<div class="empty-note">불러오는 중…</div>';

  if(!GCAL_API_KEY || GCAL_API_KEY === 'YOUR_GOOGLE_API_KEY'){
    box.innerHTML = `<div class="empty-note">캘린더 연동 설정이 아직 안 되어 있어요.
      <a class="gcal-link" href="${GCAL_EMBED_URL}" target="_blank" rel="noopener">캘린더에서 직접 확인하기 ↗</a></div>`;
    return;
  }

  try{
    const timeMin = new Date(iso + 'T00:00:00+09:00').toISOString();
    const timeMax = new Date(iso + 'T23:59:59+09:00').toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_CALENDAR_ID)}/events?key=${GCAL_API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('캘린더 조회 실패 (' + res.status + ')');
    const data = await res.json();
    const items = data.items || [];
    if(items.length === 0){
      box.innerHTML = '<div class="empty-note">이 날짜에 등록된 캘린더 일정이 없습니다.</div>';
      return;
    }
    box.innerHTML = items.map(ev => {
      const isAllDay = !!ev.start?.date;
      const time = isAllDay ? '종일' : (fmtEventTime(ev.start?.dateTime) + (ev.end?.dateTime ? '–' + fmtEventTime(ev.end.dateTime) : ''));
      return `<div class="gcal-item"><span class="time">${time}</span><span>${ev.summary || '(제목 없음)'}</span></div>`;
    }).join('');
  } catch(err){
    box.innerHTML = `<div class="empty-note">캘린더 일정을 불러오지 못했습니다. (${err.message})
      <a class="gcal-link" href="${GCAL_EMBED_URL}" target="_blank" rel="noopener">캘린더에서 직접 확인하기 ↗</a></div>`;
  }
}

function renderAll(iso){
  const dateObj = parseKey(iso);
  document.getElementById('dateTitle').innerHTML =
    `${dateObj.getFullYear()}.${dateObj.getMonth()+1}.${dateObj.getDate()}<span class="wd">${wdNames[dateObj.getDay()]}요일</span>`;
  renderCalendar(iso);
  renderDuty(iso);
  renderExam(iso);
  renderMeal(dateObj);
  renderGoogleCalendar(iso);
}

const params = new URLSearchParams(location.search);
let currentIso = params.get('d') || toKey(new Date());
document.getElementById('datePick').value = currentIso;
renderAll(currentIso);

document.getElementById('datePick').addEventListener('change', (e) => {
  if(e.target.value){
    currentIso = e.target.value;
    history.replaceState(null, '', '?d=' + currentIso);
    renderAll(currentIso);
  }
});
document.getElementById('btnToday').addEventListener('click', () => {
  currentIso = toKey(new Date());
  document.getElementById('datePick').value = currentIso;
  history.replaceState(null, '', '?d=' + currentIso);
  renderAll(currentIso);
});
</script>
