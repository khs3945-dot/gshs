<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간계획 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 1440px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-weight:700; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:24px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:22px 24px; margin-bottom:18px; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:6px; padding:9px 15px; cursor:pointer; }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:16px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }

  /* 왼쪽(1) / 가운데(1.5) / 오른쪽(0.7) 3단 구성. 좁은 화면에서는 세로로 쌓아요. */
  .wp3-grid{ display:grid; grid-template-columns: 1fr 1.5fr 0.7fr; gap:16px; align-items:start; }
  @media (max-width: 900px){ .wp3-grid{ grid-template-columns: 1fr; } }
  .wp3-col{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:18px 20px; min-width:0; }
  .wp3-col h2{ font-size:15px; margin:0 0 12px; color:var(--stamp); }

  .wp-summary{ border:1px solid var(--rule-soft); border-radius:8px; padding:14px 16px; background:var(--stamp-soft); }
  .wp-summary-title{ font-size:13.5px; font-weight:700; color:var(--stamp); margin-bottom:8px; word-break:keep-all; }
  .wp-summary-body{ font-size:13px; line-height:1.7; color:var(--ink); white-space:pre-wrap; word-break:break-word; margin-bottom:8px; }
  .wp-summary-link{ font-size:12.5px; color:var(--stamp); text-decoration:none; font-weight:600; }
  .wp-summary-link:hover{ text-decoration:underline; }
  /* my-page.html과 같은 탭(날짜별/부서별 표) — AI 요약이 이미 "날짜/[공통] 소제목 +
     '  · 카테고리: 내용'" 형식이라 클라이언트에서 재구성만 하면 돼요. */
  .wp-summary-tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .wp-summary-tab-btn{ font-family:inherit; font-size:11.5px; font-weight:600; color:var(--ink-soft); background:transparent; border:1px solid var(--rule-soft); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .wp-summary-tab-btn.active{ color:#fff; background:var(--stamp); border-color:var(--stamp); }
  .wp-summary-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:4px; }
  .wp-summary-table td, .wp-summary-table th{ padding:4px 6px; border-bottom:1px solid var(--rule-soft); text-align:left; vertical-align:top; }
  .wp-summary-table-head th{ color:var(--stamp); font-size:12px; font-weight:700; padding-top:10px; border-bottom:none; }
  .wp-summary-table-tag{ width:72px; flex-shrink:0; color:var(--ink-soft); font-size:11.5px; white-space:nowrap; }

  .wp-preview-title{ font-size:13.5px; font-weight:700; margin-bottom:8px; word-break:keep-all; }
  .wp-preview{ width:100%; height:min(88vh, 1200px); border:1px solid var(--rule-soft); border-radius:8px; }

  .wp-list-item{ display:flex; flex-direction:column; gap:2px; font-size:13px; padding:8px 0; border-bottom:1px dashed var(--rule-soft); }
  .wp-list-item:last-child{ border-bottom:none; }
  .wp-list-item a{ color:var(--ink); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wp-list-item a:hover{ color:var(--stamp); }
  .wp-list-item .wp-date{ font-size:11.5px; color:var(--ink-soft); }
  .wp-list-item.latest .wp-badge{ display:inline-block; font-size:10px; font-weight:700; color:var(--stamp); background:var(--stamp-soft); border-radius:9px; padding:1px 7px; margin-right:5px; }
  .wp-list-scroll{ max-height:min(88vh, 1200px); overflow-y:auto; }
  .hint{ font-size:12.5px; color:var(--ink-soft); }

  /* 대시보드 위젯(?widget=1)으로 좁은 칸에 담길 때: 헤더·요약·목록은 숨기고
     "최근 주간계획" 문서 미리보기 한 칸만 꽉 채워 보여줘요. */
  body.widget-mode{ background:var(--paper-card); }
  body.widget-mode .wrap{ max-width:none; padding:10px; height:100vh; display:flex; flex-direction:column; }
  .wp-refresh-row{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  body.widget-mode a.back, body.widget-mode h1, body.widget-mode .sub{ display:none; }
  body.widget-mode #mainView{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.widget-mode .wp3-grid{ display:flex !important; flex:1; min-height:0; }
  body.widget-mode #wp3Grid > .wp3-col:first-child,
  body.widget-mode #wp3Grid > .wp3-col:last-child{ display:none; }
  body.widget-mode .wp3-col{ flex:1; display:flex; flex-direction:column; min-height:0; padding:0; border:none; background:none; }
  body.widget-mode .wp3-col h2{ display:none; }
  body.widget-mode #wp3Preview{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.widget-mode .wp-preview{ flex:1; height:auto; min-height:0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 메인으로</a>
  <h1>주간계획</h1>
  <div class="sub">구글 드라이브 '주간계획' 폴더의 문서를 한 화면에서 확인해요. 왼쪽은 최신 문서 AI 요약, 가운데는 문서 원본, 오른쪽은 전체 목록(최신순)이에요.</div>

  <div id="mainView">
    <div class="wp-refresh-row"><button type="button" class="btn secondary tiny" id="btnWpRefresh" title="캐시를 건너뛰고 폴더에서 다시 불러와요">↻ 새로고침</button></div>
    <div id="wpMsg"></div>
    <div class="wp3-grid" id="wp3Grid">
      <div class="wp3-col">
        <h2>이번주 요약</h2>
        <div id="wp3Summary"></div>
      </div>
      <div class="wp3-col">
        <h2>최근 주간계획</h2>
        <div id="wp3Preview"></div>
      </div>
      <div class="wp3-col">
        <h2>전체 목록 (최신순)</h2>
        <div class="wp-list-scroll"><div id="wp3List"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  // 대시보드 위젯(iframe)으로 이 페이지를 ?widget=1로 불러오면, 헤더·요약·목록을
  // 숨기고 문서 미리보기 한 칸만 꽉 채워 보여줘요(다른 위젯 페이지들과 같은 패턴).
  if(new URLSearchParams(location.search).get('widget') === '1'){
    document.body.classList.add('widget-mode');
  }

  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // 나의 페이지(my-page.html)의 '이번주 주간계획 AI 요약'과 같은 Apps Script·캐시를
  // 그대로 써서, 어느 화면에서 먼저 불러왔든 서로 캐시를 재사용해요.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyshMwE9ZOtwIEjpDb7JYpEgspvDaO7doN666SsS6R6-EeyxP63pHNpo6cTv_KDEXX0gQ/exec';

  function el(id){ return document.getElementById(id); }
  function pad(n){ return String(n).padStart(2, '0'); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 로그인 없이도 볼 수 있는 페이지예요(학사일정처럼 누구나 확인할 수 있는 정보).

  // ================= 주간계획 (구글 드라이브 폴더) =================
  let wpFiles = [];
  let wpSummaryRawText = '';
  let wpSummaryParsedItems = null;

  function wpFmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function wpPreviewUrl(f){
    return `https://drive.google.com/file/d/${f.id}/preview`;
  }
  // AI 요약 텍스트를 다시 파싱해서 {heading(날짜 또는 [공통]), category, content}
  // 배열로 만들어요 — 형식이 안 맞으면(예전 캐시, 구조 추출 폴백 등) null을 돌려줘서
  // 그 경우엔 탭 없이 기존 줄글만 보여줍니다. (my-page.html과 동일한 복사본)
  function parseWeekPlanOutline(text){
    if(!text) return null;
    const items = [];
    let currentHeading = null;
    text.split('\n').forEach(line => {
      const detail = line.match(/^\s*·\s*(.+)$/);
      if(detail){
        if(!currentHeading) return;
        const rest = detail[1].trim();
        const cat = rest.match(/^([^:：]{1,14})[:：]\s*(.+)$/);
        items.push({
          heading: currentHeading,
          category: cat ? cat[1].trim() : '기타',
          content: cat ? cat[2].trim() : rest
        });
      } else {
        const t = line.trim();
        if(t) currentHeading = t;
      }
    });
    return items.length ? items : null;
  }
  function wpGroupKeys(items, by){
    const seen = new Set(); const order = [];
    items.forEach(it => {
      const k = by === 'heading' ? it.heading : it.category;
      if(!seen.has(k)){ seen.add(k); order.push(k); }
    });
    return order;
  }
  function wpSummaryTableHtml(items, by){
    const body = wpGroupKeys(items, by).map(key => {
      const rows = items.filter(it => (by === 'heading' ? it.heading : it.category) === key).map(it => {
        const other = by === 'heading' ? it.category : it.heading;
        return `<tr><td class="wp-summary-table-tag">${escapeHtml(other)}</td><td>${escapeHtml(it.content)}</td></tr>`;
      }).join('');
      return `<tr class="wp-summary-table-head"><th colspan="2">${escapeHtml(key)}</th></tr>${rows}`;
    }).join('');
    return `<table class="wp-summary-table"><tbody>${body}</tbody></table>`;
  }
  function renderWeekPlan(){
    if(!wpFiles.length){
      el('wp3Summary').innerHTML = '';
      el('wp3Preview').innerHTML = '';
      el('wp3List').innerHTML = '';
      setMsg('wpMsg', '폴더에 문서가 없습니다. (\'주간계획\' 폴더에 바로가기를 추가해주세요)', 'error');
      return;
    }
    setMsg('wpMsg', '', '');
    const top = wpFiles[0];

    // 왼쪽: AI 요약(있을 때만 — 없는 형식이면 가운데 원본을 보라는 안내만 표시)
    wpSummaryRawText = top.summary || '';
    wpSummaryParsedItems = top.summary ? parseWeekPlanOutline(top.summary) : null;
    el('wp3Summary').innerHTML = top.summary ? `
      <div class="wp-summary">
        <div class="wp-summary-title">${escapeHtml(top.name || '(이름 없음)')}</div>
        ${wpSummaryParsedItems ? `<div class="wp-summary-tabs">
          <button type="button" class="wp-summary-tab-btn active" data-wpview="text">줄글</button>
          <button type="button" class="wp-summary-tab-btn" data-wpview="heading">날짜별 표</button>
          <button type="button" class="wp-summary-tab-btn" data-wpview="category">부서별 표</button>
        </div>` : ''}
        <div class="wp-summary-body" id="wpSummaryBody">${escapeHtml(top.summary)}</div>
        <a class="wp-summary-link" href="${escapeHtml(top.url)}" target="_blank" rel="noopener">문서 전체 보기 →</a>
      </div>
    ` : '<div class="hint">이 문서 형식은 AI 요약을 만들 수 없어요. 가운데에서 원본을 확인하세요.</div>';

    // 가운데: 최신 문서 원본을 그대로 불러와 보여줘요.
    el('wp3Preview').innerHTML = `
      <div class="wp-preview-title">${escapeHtml(top.name || '(이름 없음)')}</div>
      <iframe class="wp-preview" src="${escapeHtml(wpPreviewUrl(top))}" title="최근 주간계획 미리보기"></iframe>
    `;

    // 오른쪽: 전체 목록을 최신순 그대로 나열(맨 위 문서엔 "최신" 표시).
    el('wp3List').innerHTML = wpFiles.map((f, i) => `
      <div class="wp-list-item${i === 0 ? ' latest' : ''}">
        <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${i === 0 ? '<span class="wp-badge">최신</span>' : ''}${escapeHtml(f.name || '(이름 없음)')}</a>
        <span class="wp-date">${wpFmtDate(f.modifiedTime)}</span>
      </div>
    `).join('');
  }
  // 날짜별/부서별 표 탭 클릭 — my-page.html과 동일한 로직(새 Apps Script 호출 없이
  // 이미 받아둔 텍스트를 다시 렌더링만 해요).
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.wp-summary-tab-btn');
    if(!btn) return;
    const view = btn.dataset.wpview;
    const tabsWrap = btn.closest('.wp-summary-tabs');
    if(tabsWrap) tabsWrap.querySelectorAll('.wp-summary-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    const bodyEl = el('wpSummaryBody');
    if(!bodyEl) return;
    bodyEl.innerHTML = (view === 'text' || !wpSummaryParsedItems)
      ? escapeHtml(wpSummaryRawText || '')
      : wpSummaryTableHtml(wpSummaryParsedItems, view);
  });
  // Apps Script(콜드스타트로 느릴 때가 많고, 최근 수정된 문서가 있으면 AI 요약을
  // 새로 만드느라 더 오래 걸릴 수 있음) 결과는 선생님 전체가 같이 보는 내용이라,
  // 나의 페이지와 같은 Supabase 캐시(weekplan_cache)를 그대로 재사용해요.
  //
  // 예전에는 캐시가 "오래됐을 때"(TTL 초과) Apps Script 응답이 올 때까지 화면에
  // 아무것도 안 보여주고 기다렸어요 — 캐시에 멀쩡한 데이터가 이미 있는데도요. 콜드
  // 스타트가 느릴 땐 그 몇십 초 동안 화면이 완전히 비어 있어서 "아무것도 안 나온다"는
  // 오해를 샀어요(실제로는 로딩 중이었을 뿐). 지금은 캐시가 있으면 오래됐더라도 일단
  // 그걸로 바로 화면을 채우고, 그 뒤에 백그라운드로 최신 데이터를 가져와 조용히
  // 교체해요 — 캐시가 아예 없는 첫 방문 때만 "불러오는 중…" 안내를 보여주고 기다려요.
  const WEEKPLAN_CACHE_TTL_MS = 15 * 60 * 1000;
  // forceRefresh(새로고침 버튼)가 true면 15분 캐시가 남아있어도 건너뛰고 바로
  // Apps Script를 다시 불러요 — my-page.html의 같은 버튼과 동일한 동작이에요.
  async function loadWeekPlan(forceRefresh){
    let staleFiles = null;
    try{
      const { data: cached } = await sb.from('weekplan_cache').select('files, updated_at').eq('id', 'latest').maybeSingle();
      if(cached && Array.isArray(cached.files)){
        staleFiles = cached.files;
        if(!forceRefresh && cached.updated_at && (Date.now() - new Date(cached.updated_at).getTime()) < WEEKPLAN_CACHE_TTL_MS){
          wpFiles = cached.files;
          renderWeekPlan();
          return;
        }
      }
    }catch(e){ /* 캐시 조회 실패해도 평소대로(Apps Script 호출) 진행 */ }

    if(staleFiles){
      // 오래된 캐시라도 일단 바로 보여주고, 최신 정보는 아래에서 조용히 받아와요.
      wpFiles = staleFiles;
      renderWeekPlan();
      setMsg('wpMsg', '최신 정보를 확인하고 있어요…', '');
    } else {
      setMsg('wpMsg', '불러오는 중이에요… (문서가 많거나 방금 수정됐으면 다소 걸릴 수 있어요)', '');
    }

    try{
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'listWeekPlanFiles' }) });
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        throw new Error('불러오지 못했습니다. Code.gs가 최신 버전으로 재배포되어 있는지, 배포 액세스 권한이 "모든 사용자"로 되어 있는지 확인해주세요.');
      }
      if(!data.ok) throw new Error(data.error || '불러오지 못했습니다.');
      wpFiles = data.files || [];
      renderWeekPlan();
      sb.from('weekplan_cache').upsert({ id: 'latest', files: wpFiles, updated_at: new Date().toISOString() }).then(() => {}, () => {});
    }catch(e){
      if(staleFiles){
        // 이미 오래된 캐시로 화면을 채워뒀으니, 백그라운드 새로고침이 실패해도
        // 화면을 비우거나 에러로 덮어쓰지 않고 "안내 중" 메시지만 지워요.
        setMsg('wpMsg', '', '');
      } else {
        setMsg('wpMsg', e.message, 'error');
      }
    }
  }

  el('btnWpRefresh').addEventListener('click', async () => {
    const btn = el('btnWpRefresh');
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = '↻ 불러오는 중…';
    try{
      await loadWeekPlan(true);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  loadWeekPlan();
})();
</script>
</body>
</html>
