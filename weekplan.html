<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간계획 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 1560px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:14.3px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-weight:700; font-size:23.8px; margin:0 0 6px; }
  .sub{ font-size:14.8px; color:var(--ink-soft); margin-bottom:24px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:22px 24px; margin-bottom:18px; }
  .btn{ font-family:inherit; font-size:15.3px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:6px; padding:9px 15px; cursor:pointer; }

  .msg{ font-size:14.3px; border-radius:6px; padding:9px 11px; margin-bottom:16px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }

  /* 왼쪽(1) / 가운데(1.5) / 오른쪽(0.7) 3단 구성. 좁은 화면에서는 세로로 쌓아요. */
  .wp3-grid{ display:grid; grid-template-columns: 1fr 1.5fr 0.7fr; gap:16px; align-items:start; }
  @media (max-width: 900px){ .wp3-grid{ grid-template-columns: 1fr; } }
  .wp3-col{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:18px 20px; min-width:0; }
  .wp3-col h2{ font-size:16.8px; margin:0 0 12px; color:var(--stamp); }

  .wp-summary{ border:1px solid var(--rule-soft); border-radius:8px; padding:14px 16px; background:var(--stamp-soft); }
  .wp-summary-title{ font-size:15.3px; font-weight:700; color:var(--stamp); margin-bottom:8px; word-break:keep-all; }
  .wp-summary-body{ font-size:14.8px; line-height:1.7; color:var(--ink); white-space:pre-wrap; word-break:break-word; margin-bottom:8px; }
  .wp-summary-link{ font-size:14.3px; color:var(--stamp); text-decoration:none; font-weight:600; }
  .wp-summary-link:hover{ text-decoration:underline; }
  /* my-page.html과 같은 탭(날짜별/부서별 표) — AI 요약이 이미 "날짜/[공통] 소제목 +
     '  · 카테고리: 내용'" 형식이라 클라이언트에서 재구성만 하면 돼요. */
  .wp-ai-note{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; white-space:normal; }
  .wp-day + .wp-day{ margin-top:8px; }
  .wp-day-head{ font-weight:700; color:var(--stamp); }
  .wp-day-list{ margin:2px 0 0; padding-left:18px; white-space:normal; }
  .wp-day-list li{ margin:1px 0; }
  .wp-summary-tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .wp-summary-tab-btn{ font-family:inherit; font-size:13.3px; font-weight:600; color:var(--ink-soft); background:transparent; border:1px solid var(--rule-soft); border-radius:999px; padding:3px 10px; cursor:pointer; }
  .wp-summary-tab-btn.active{ color:#fff; background:var(--stamp); border-color:var(--stamp); }
  .wp-summary-table{ width:100%; border-collapse:collapse; font-size:14.3px; margin-bottom:4px; }
  .wp-summary-table td, .wp-summary-table th{ padding:4px 6px; border-bottom:1px solid var(--rule-soft); text-align:left; vertical-align:top; }
  .wp-summary-table-head th{ color:var(--stamp); font-size:13.8px; font-weight:700; padding-top:10px; border-bottom:none; }
  .wp-summary-table-tag{ width:72px; flex-shrink:0; color:var(--ink-soft); font-size:13.3px; white-space:nowrap; }

  .wp-preview-title{ font-size:15.3px; font-weight:700; margin-bottom:8px; word-break:keep-all; }
  .wp-preview{ width:100%; height:min(88vh, 1200px); border:1px solid var(--rule-soft); border-radius:8px; }

  .wp-list-item{ display:flex; flex-direction:column; gap:2px; font-size:14.8px; padding:8px 0; border-bottom:1px dashed var(--rule-soft); }
  .wp-list-item:last-child{ border-bottom:none; }
  .wp-list-item a{ color:var(--ink); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wp-list-item a:hover{ color:var(--stamp); }
  .wp-list-item .wp-date{ font-size:13.3px; color:var(--ink-soft); }
  .wp-list-item.latest .wp-badge{ display:inline-block; font-size:11.8px; font-weight:700; color:var(--stamp); background:var(--stamp-soft); border-radius:9px; padding:1px 7px; margin-right:5px; }
  .wp-list-scroll{ max-height:min(88vh, 1200px); overflow-y:auto; }
  .hint{ font-size:14.3px; color:var(--ink-soft); }

  /* 대시보드 위젯(?widget=1)으로 좁은 칸에 담길 때: 헤더·요약·목록은 숨기고
     "최근 주간계획" 문서 미리보기 한 칸만 꽉 채워 보여줘요. */
  body.widget-mode{ background:var(--paper-card); }
  body.widget-mode .wrap{ max-width:none; padding:10px; height:100vh; display:flex; flex-direction:column; }
  .wp-refresh-row{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  body.widget-mode a.back, body.widget-mode h1, body.widget-mode .sub{ display:none; }
  body.widget-mode #mainView{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.widget-mode .wp3-grid{ display:flex !important; flex:1; min-height:0; }
  body.widget-mode #wp3Grid > .wp3-col:first-child,
  body.widget-mode #wp3Grid > .wp3-col:last-child{ display:none; }
  body.widget-mode .wp3-col{ flex:1; display:flex; flex-direction:column; min-height:0; padding:0; border:none; background:none; }
  body.widget-mode .wp3-col h2{ display:none; }
  body.widget-mode #wp3Preview{ flex:1; display:flex; flex-direction:column; min-height:0; }
  body.widget-mode .wp-preview{ flex:1; height:auto; min-height:0; }
</style>

<style>
  :root{
    --ks-bg: #F3F5FC; --ks-card: #FFFFFF; --ks-ink: #1F2440; --ks-ink-soft: #6B7290;
    --ks-line: #E3E6F5; --ks-line-soft: #EEF0FA; --ks-primary: #4C5FF0; --ks-primary-dark: #3747C9;
    --ks-primary-soft: #EEF0FF; --ks-purple: #8B5CF6; --ks-purple-soft: #F3ECFE;
    --ks-shadow-sm: 0 1px 2px rgba(31,36,64,0.04), 0 1px 3px rgba(31,36,64,0.06);
    --ks-sidebar-w: 238px;
  }
  .ks-app{ display:flex; min-height:100vh; background:var(--ks-bg);
    background-image: radial-gradient(640px 420px at 100% -10%, rgba(124,108,240,0.10), transparent 60%),
                       radial-gradient(520px 360px at -5% 100%, rgba(91,110,245,0.08), transparent 60%);
    background-attachment: fixed; font-family:'Noto Sans KR', sans-serif;
  }
  .ks-sidebar{ width: var(--ks-sidebar-w); flex-shrink:0; background: var(--ks-card);
    border-right: 1px solid var(--ks-line); display:flex; flex-direction:column;
    padding: 20px 14px; position: sticky; top:0; height:100vh; }
  .ks-brand{ display:flex; align-items:center; gap:10px; padding: 4px 8px 20px; }
  .ks-brand-icon{ width:34px; height:34px; border-radius:11px; flex-shrink:0;
    background: linear-gradient(120deg, #5B6EF5, #7C6CF0); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18.8px; }
  .ks-brand-text{ font-weight:800; font-size:16.8px; letter-spacing:-0.01em; color:var(--ks-ink); }
  .ks-nav{ display:flex; flex-direction:column; gap:3px; }
  .ks-nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px;
    text-decoration:none; font-size:15.3px; font-weight:600; color: var(--ks-ink-soft); }
  .ks-nav-item:hover{ background: var(--ks-line-soft); color: var(--ks-ink); }
  .ks-nav-item.active{ background: var(--ks-primary-soft); color: var(--ks-primary-dark); }
  .ks-nav-ico{ width:20px; text-align:center; font-size:16.3px; flex-shrink:0; }
  .ks-nav-sep{ height:1px; background: var(--ks-line-soft); margin:10px 4px; }
  .ks-sidebar{ overflow-y:auto; }
  .ks-nav{ gap:2px; }
  .ks-nav-item{ padding:7px 10px; }
  .ks-nav-group-label{ font-size:12.3px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase;
    color: var(--ks-ink-soft); opacity:0.75; padding:12px 10px 4px; }

  .ks-sidebar-foot{ margin-top:auto; display:flex; align-items:flex-start; gap:8px; font-size:13.3px;
    color: var(--ks-ink-soft); padding:12px 8px 2px; border-top:1px solid var(--ks-line-soft); }
  .ks-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .ks-topbar{ display:flex; align-items:center; gap:14px; padding: 14px 28px;
    background: var(--ks-card); border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:5; }
  .ks-search{ flex:1; max-width:460px; display:flex; align-items:center; gap:8px;
    background: var(--ks-bg); border:1px solid var(--ks-line); border-radius:14px; padding: 9px 14px; }
  .ks-search input{ border:none; outline:none; background:none; flex:1; font-family:inherit; font-size:15.3px; color:var(--ks-ink); }
  .ks-search input::placeholder{ color: var(--ks-ink-soft); }
  .ks-announce-ticker{ position:relative; display:flex; align-items:center; gap:6px; max-width:240px;
    padding:7px 12px; background:var(--ks-primary-soft); border-radius:12px; flex-shrink:0; cursor:pointer; }
  .ks-announce-ico{ font-size:14.8px; flex-shrink:0; }
  .ks-announce-text{ font-size:13.3px; font-weight:600; color:var(--ks-primary-dark);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:1; transition:opacity 0.25s; }
  .ks-announce-text.ks-announce-fading{ opacity:0; }
  .ks-user{ display:flex; align-items:center; gap:9px; flex-shrink:0; white-space:nowrap; color:var(--ks-ink); }
  .ks-user-avatar{ width:30px; height:30px; border-radius:50%; background: var(--ks-purple-soft); color: var(--ks-purple);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14.3px; flex-shrink:0; }
  .ks-user a.login-link{ font-weight:700; color: var(--ks-primary); text-decoration:none; font-size:15.3px; }
  .ks-user-name{ font-size:14.8px; font-weight:700; }
  .ks-mobile-topbar{ display:none; }
  .ks-content-inner{ flex:1; min-width:0; }
  @media (max-width: 880px){
    .ks-app{ flex-direction:column; } .ks-sidebar{ display:none; } .ks-topbar{ display:none; }
    .ks-mobile-topbar{ display:flex; align-items:center; gap:4px; padding:10px 14px; background: var(--ks-card);
      border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:6; }
    .ks-mobile-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      font-size:17.8px; background:none; border:none; cursor:pointer; text-decoration:none; color:var(--ks-ink); }
    .ks-mobile-icon:hover{ background: var(--ks-line-soft); }
    .ks-mobile-spacer{ flex:1; }
    .ks-mobile-login{ font-size:14.3px; font-weight:700; color: var(--ks-primary); text-decoration:none; padding:0 6px; }
    .ks-sidebar.ks-mobile-open{ display:flex; position:fixed; z-index:30; top:0; left:0; height:100vh;
      box-shadow: 0 0 0 9999px rgba(20,24,50,0.45); }
  }
  .gsnav-burger, .gsnav-home-btn, .gsnav-mypage-btn, .gsnav-search-btn, #site-login-badge{ display:none !important; }

  /* 글꼴 + 모서리 둥글게 */
  *, *::before, *::after{ font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif !important; }

  /* 버튼: 밋밋한 흰색 보조 버튼에 은은한 색(인디고 20% 배경 + 진한 인디고 글자) */
  .btn.secondary, .btn-secondary, .nav-btn:not(.primary){
    background: rgba(76,95,240,0.2) !important; color:#20296B !important;
    border-color: rgba(76,95,240,0.3) !important; border-radius:9px !important;
  }
</style>

<style>
  /* 이 페이지가 다른 페이지 안에 ?widget= 로 iframe 임베드될 때는(이미 그 페이지
     자신의 JS가 body에 widget-mode 클래스를 붙여요) 새 셸도 함께 숨겨서, 원래의
     "헤더 없이 내용만 꽉 채우는" 위젯 레이아웃이 그대로 유지되게 해요. */
  body.widget-mode .ks-sidebar, body.widget-mode .ks-topbar, body.widget-mode .ks-mobile-topbar{ display:none !important; }
  body.widget-mode .ks-app{ display:block !important; min-height:0 !important; background:none !important; background-image:none !important; }
  body.widget-mode .ks-content-inner{ padding:0 !important; }
</style>
<style id="ks-theme">
  /* 메뉴 아이콘 색: 유형별 — 연한 배경 + 같은 계열 색 아이콘 */
  .ks-nav-ico.ic-base, .icon.ic-base, .ks-feature-icon.ic-base{ background:#e2e5fd !important; }
  .ic-base svg, .ic-base svg *{ stroke:#4C5FF0 !important; }
  .ks-mobile-ico-badge{ background:#e2e5fd !important; }
  .ks-mobile-ico-badge svg, .ks-mobile-ico-badge svg *{ stroke:#4C5FF0 !important; }
  .ks-nav-ico.ic-plan, .icon.ic-plan, .ks-feature-icon.ic-plan{ background:#d8eeeb !important; }
  .ic-plan svg, .ic-plan svg *{ stroke:#0E9384 !important; }
  .ks-nav-ico.ic-share, .icon.ic-share, .ks-feature-icon.ic-share{ background:#faeadb !important; }
  .ic-share svg, .ic-share svg *{ stroke:#E07A1F !important; }
  .ks-nav-ico.ic-bot, .icon.ic-bot, .ks-feature-icon.ic-bot{ background:#ece5fe !important; }
  .ic-bot svg, .ic-bot svg *{ stroke:#8B5CF6 !important; }
  .ks-nav-ico.ic-work, .icon.ic-work, .ks-feature-icon.ic-work{ background:#f9e1ea !important; }
  .ic-work svg, .ic-work svg *{ stroke:#D9467A !important; }
  .ks-nav-ico.ic-life, .icon.ic-life, .ks-feature-icon.ic-life{ background:#deefe4 !important; }
  .ic-life svg, .ic-life svg *{ stroke:#2F9E55 !important; }
  .ks-nav-ico.ic-eval, .icon.ic-eval, .ks-feature-icon.ic-eval{ background:#d7e7f0 !important; }
  .ic-eval svg, .ic-eval svg *{ stroke:#0369A1 !important; }
  .ks-nav-ico.ic-admin, .icon.ic-admin, .ks-feature-icon.ic-admin{ background:#e2e4e7 !important; }
  .ic-admin svg, .ic-admin svg *{ stroke:#475569 !important; }
  /* === 메인 화면(index.html)과 같은 디자인으로 맞춤 — 옛 색상 변수를 새 팔레트로 덮어씀 === */
  :root{
    --paper:#F4F5F7; --paper-card:#FFFFFF; --ink:#05070D; --ink-soft:#2F3545;
    --rule:#E3E5EA; --rule-soft:#EDEEF1; --stamp:#1A2453; --stamp-soft:#E9ECF5;
    --brass:#7A5B12; --brass-soft:#EEF0F3;
    --ks-bg:#F4F5F7; --ks-line:#E3E5EA; --ks-line-soft:#EDEEF1;
    --ks-ink:#05070D; --ks-ink-soft:#2F3545; --ks-primary-dark:#1A2453; --ks-primary-soft:#E9ECF5;
  }
  .ks-nav-item:hover{ background:var(--ks-line-soft); color:var(--ks-ink); }
  .ks-app{ background:var(--ks-bg) !important; background-image:none !important; }
  body{ background:var(--ks-bg); }
  .ks-nav-item.active{ color:var(--ks-primary-dark); }
  .ks-nav-ico{ width:22px; height:22px; border-radius:7px; background:var(--ks-primary);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; }
  .ks-logout-btn{ font-size:13.3px; font-weight:700; color:var(--ks-ink-soft); background:var(--ks-line-soft);
    border:none; border-radius:9px; padding:6px 12px; cursor:pointer; font-family:inherit; margin-left:2px; }
  .ks-logout-btn:hover{ background:var(--ks-line); color:var(--ks-ink); }
  .ks-mobile-ico-badge{ width:22px; height:22px; border-radius:7px; background:var(--ks-primary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #ksMobileAuth{ display:flex; align-items:center; gap:6px; }
  .ks-mobile-user-name{ font-size:13.3px; font-weight:700; color:var(--ks-ink); white-space:nowrap; }
  .ks-mobile-logout-btn{ font-size:12.3px; font-weight:700; color:var(--ks-ink-soft); background:var(--ks-line-soft);
    border:none; border-radius:8px; padding:5px 9px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  /* 본문: 카드·제목·버튼·입력칸을 메인처럼 둥글고 가볍게 */
  .ks-content-inner header.page-head{ background:var(--ks-card); border:1px solid var(--ks-line); border-radius:22px;
    padding:20px 24px; margin-bottom:20px; box-shadow:var(--ks-shadow-sm); }
  .ks-content-inner header.page-head h1{ font-size:24px; font-weight:800; letter-spacing:-0.01em; color:var(--ks-ink); }
  .ks-content-inner .card{ border:1px solid var(--ks-line); border-radius:18px; box-shadow:var(--ks-shadow-sm); }
  .ks-content-inner .btn{ border-radius:10px; }
  .ks-content-inner input[type="text"], .ks-content-inner input[type="password"], .ks-content-inner input[type="number"],
  .ks-content-inner input[type="date"], .ks-content-inner input[type="datetime-local"], .ks-content-inner input[type="time"],
  .ks-content-inner input[type="search"], .ks-content-inner select, .ks-content-inner textarea{ border-radius:10px; }
  @media (max-width:880px){
    .ks-content-inner header.page-head{ padding:16px 18px; border-radius:18px; }
    .ks-content-inner header.page-head h1{ font-size:21px; }
  }
  @media (max-width:880px){
    .ks-mobile-icon{ width:40px; height:40px; }
    .ks-mobile-ico-badge{ width:30px; height:30px; border-radius:9px; }
    .ks-mobile-ico-badge svg{ width:18px; height:18px; }
  }
</style>
</head>
<body>
<div class="ks-app" id="ksApp">
  <aside class="ks-sidebar" id="ksSidebar">
    <div class="ks-brand"><span class="ks-brand-icon">📘</span><span class="ks-brand-text">교무 업무 도구</span></div>
    <nav class="ks-nav" id="ksNav"></nav>
    <script src="./ks-menu.js"></script>
    <div class="ks-sidebar-foot"><span>🌱</span><span>더 나은 교육을 위한<br>함께하는 교무 업무</span></div>
  </aside>
  <div class="ks-mobile-topbar">
    <button class="ks-mobile-icon" id="ksMobileBurger" type="button" aria-label="메뉴 열기">☰</button>
    <a class="ks-mobile-icon" href="./index.html" aria-label="홈"><span class="ks-mobile-ico-badge"><svg viewBox="0 0 24 24" width="13" height="13" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg></span></a>
    <a class="ks-mobile-icon" href="./my-page.html" aria-label="나의 페이지"><span class="ks-mobile-ico-badge"><svg viewBox="0 0 24 24" width="13" height="13" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2.2"/><path d="M5.5 17c.8-2 2.3-3 3.5-3s2.7 1 3.5 3"/><path d="M14 9h5M14 13h5"/></svg></span></a>
    <div class="ks-mobile-spacer"></div>
    <span id="ksMobileAuth"></span>
    <button class="ks-mobile-icon" id="ksMobileSearchBtn" type="button" aria-label="검색">🔍</button>
  </div>
  <div class="ks-main">
    <header class="ks-topbar">

<div class="wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  // 대시보드 위젯(iframe)으로 이 페이지를 ?widget=1로 불러오면, 헤더·요약·목록을
  // 숨기고 문서 미리보기 한 칸만 꽉 채워 보여줘요(다른 위젯 페이지들과 같은 패턴).
  if(new URLSearchParams(location.search).get('widget') === '1'){
    document.body.classList.add('widget-mode');
  }

  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // 나의 페이지(my-page.html)의 '이번주 주간계획 AI 요약'과 같은 Apps Script·캐시를
  // 그대로 써서, 어느 화면에서 먼저 불러왔든 서로 캐시를 재사용해요.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyshMwE9ZOtwIEjpDb7JYpEgspvDaO7doN666SsS6R6-EeyxP63pHNpo6cTv_KDEXX0gQ/exec';

  function el(id){ return document.getElementById(id); }
  function pad(n){ return String(n).padStart(2, '0'); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 로그인 없이도 볼 수 있는 페이지예요(학사일정처럼 누구나 확인할 수 있는 정보).

  // ================= 주간계획 (구글 드라이브 폴더) =================
  let wpFiles = [];
  let wpSummaryRawText = '';
  let wpSummaryParsedItems = null;

  function wpFmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function wpPreviewUrl(f){
    return `https://drive.google.com/file/d/${f.id}/preview`;
  }
  // AI 요약 텍스트를 다시 파싱해서 {heading(날짜 또는 [공통]), category, content}
  // 배열로 만들어요 — 형식이 안 맞으면(예전 캐시, 구조 추출 폴백 등) null을 돌려줘서
  // 그 경우엔 탭 없이 기존 줄글만 보여줍니다. (my-page.html과 동일한 복사본)
  // 주간계획 요약 글을 보여주기 전에 줄을 정리해요 — 표가 글로 펴지면서 "학교 | ■ a ■ b ■ c"처럼
  // 한 칸의 여러 항목이 한 줄로 이어지거나, AI가 항목을 " · "로 이어 붙여 내보낼 때가 있어서요.
  // 각 줄의 "부서 | " 머리는 따로 한 줄로, ■·▪·● 같은 글머리와 " · " 항목은 각자 새 줄로 나눠요.
  function tidyWeekPlanText(text){
    // 글머리는 ■ 말고도 반각 ￭(U+FFED)·◼·◾·□로 오는 경우가 있어 모두 줄을 나눈다
    const out = [];
    String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
      let l = line.replace(/\s+$/, '');
      if(!l.trim()){ if(out.length && out[out.length - 1] !== '') out.push(''); return; }
      // 주간일정 표 줄 "10/20 | 화 | 학력평가" → "10/20(화) 학력평가" 한 줄(일정 없는 날은 뺌)
      const day = l.match(/^\s*(\d{1,2}\/\d{1,2})\s*\|\s*([월화수목금토일])\s*\|\s*(.*)$/);
      if(day){ const what = day[3].replace(/[|\s]+$/, '').trim(); if(what) out.push(`  ${day[1]}(${day[2]}) ${what}`); return; }
      const m = l.match(/^\s*([^|\n■▪◆●•￭◼◾□]{1,24}?)\s*\|\s*(.*)$/);
      if(m){
        if(/^(부서|구분|담당)$/.test(m[1].trim()) && !/[■▪◆●•￭◼◾□]/.test(m[2])) return; // 표 머리줄("부서 | 추진업무")은 빼요
        if(out.length && out[out.length - 1] !== '') out.push(''); // 부서마다 빈 줄로 구분
        out.push(m[1].trim()); l = m[2].replace(/[|\s]+$/, ''); if(!l.replace(/[■▪◆●•￭◼◾□○·\s-]/g, '')) return; if(!/^[■▪◆●•￭◼◾□○·-]/.test(l)) l = '  ' + l;
      }
      l = l.replace(/\s*([■▪◆●•￭◼◾□○])\s*/g, (s, mark, idx) => (idx === 0 ? '' : '\n') + '  ' + mark + ' ')
           .replace(/\s+·\s+/g, '\n  · ');
      l.split('\n').forEach(x => { if(x.trim()) out.push(x.replace(/^\s*/, (sp) => sp.length >= 2 ? '  ' : sp)); });
    });
    // 내용 없는 제목(부서·주간일정 등)은 통째로 빼요 — 제목은 들여쓰기 없는 줄, 내용은 들여쓴 줄
    const kept = out.filter((x, i) => !(x && !/^\s/.test(x) && (out[i + 1] === undefined || out[i + 1] === '')));
    return kept.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  // 날짜별 보기 — 정리된 요약(부서 제목 + 들여쓴 항목)에서 항목마다 첫 날짜를 찾아 날짜 순서로 묶어요(부서 이름은 뺌).
  // 항목 맨 앞의 날짜는 묶음 제목과 겹쳐서 지우고(기간 "10/27(화)~28(수)"은 그대로), 날짜 없는 항목은 맨 아래 "기타".
  function wpDateViewHtml(text){
    const DOW = '일월화수목금토', year = new Date().getFullYear();
    const groups = new Map(), etc = [];
    String(text || '').split('\n').forEach(line => {
      if(!line.trim() || !/^\s/.test(line)) return; // 빈 줄·부서 제목 줄은 건너뜀
      let t = line.trim().replace(/^[■▪◆●•￭◼◾□○·-]\s*/, '').trim();
      if(!t) return;
      const m = t.match(/(?<!\d)(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/);
      const mo = m ? +m[1] : 0, d = m ? +m[2] : 0;
      if(!m || mo < 1 || mo > 12 || d < 1 || d > 31){ if(!etc.includes(t)) etc.push(t); return; }
      if(m.index === 0){
        const rest = t.replace(/^\d{1,2}\s*[\/.]\s*\d{1,2}\.?\s*(\([월화수목금토일]\))?/, '');
        if(!/^\s*~/.test(rest)) t = rest.replace(/^\s*[:：]?\s*/, '') || t;
      }
      const key = mo * 100 + d;
      if(!groups.has(key)) groups.set(key, []);
      if(!groups.get(key).includes(t)) groups.get(key).push(t);
    });
    const block = (head, list) => `<div class="wp-day"><div class="wp-day-head">${escapeHtml(head)}</div><ul class="wp-day-list">${list.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`;
    const html = [...groups.keys()].sort((a, b) => a - b).map(k => {
      const mo = Math.floor(k / 100), d = k % 100;
      return block(`${mo}/${d}(${DOW[new Date(year, mo - 1, d).getDay()]})`, groups.get(k));
    }).join('') + (etc.length ? block('기타', etc) : '');
    return html || escapeHtml(text || '');
  }
  // AI 요약(weekplan-summarize Edge Function, 문서·수정 시각별로 서버에 캐시) — "10/22(목)" 줄 + "  · 내용" 줄 형식
  let wpAiSummary = null, wpAiKey = null, wpAiState = '';
  // AI 요약의 "10/27(토)" 같은 요일이 틀릴 때가 있어 날짜로 요일을 다시 계산해요(연도는 오늘과 가까운 쪽).
  function fixWeekdays(text){
    if(!text) return text;
    const now = new Date(), W = ['일', '월', '화', '수', '목', '금', '토'];
    return String(text).replace(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\(\s*[월화수목금토일]\s*\)/g, (all, m, d) => {
      let best = null;
      [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].forEach(y => {
        const dt = new Date(y, +m - 1, +d);
        if(dt.getMonth() !== +m - 1) return;
        if(!best || Math.abs(dt - now) < Math.abs(best - now)) best = dt;
      });
      return best ? `${m}/${d}(${W[best.getDay()]})` : all;
    });
  }
  function wpOutlineHtml(text){
    const out = []; let cur = null;
    String(text || '').split('\n').forEach(line => {
      if(!line.trim()) return;
      const item = line.match(/^\s*[·•\-*]\s*(.+)$/);
      if(item || /^\s/.test(line)){ if(!cur){ cur = { head: '', list: [] }; out.push(cur); } cur.list.push((item ? item[1] : line).trim()); }
      else { cur = { head: line.trim(), list: [] }; out.push(cur); }
    });
    return out.map(g => `<div class="wp-day">${g.head ? `<div class="wp-day-head">${escapeHtml(g.head)}</div>` : ''}<ul class="wp-day-list">${g.list.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`).join('');
  }
  function wpAiViewHtml(){
    if(wpAiSummary) return wpOutlineHtml(wpAiSummary);
    const note = wpAiState === 'error' ? 'AI 요약을 만들지 못해 날짜별 정리를 대신 보여드려요.' : 'AI가 요약하는 중이에요… 잠시만요(그동안 날짜별 정리를 보여드려요).';
    return `<div class="wp-ai-note">${note}</div>` + wpDateViewHtml(wpSummaryRawText);
  }
  async function wpRequestAiSummary(top){
    const key = `${top.id || top.url}:${top.modifiedTime || ''}`;
    if(wpAiKey === key) return;
    wpAiKey = key; wpAiSummary = null; wpAiState = 'loading';
    // Apps Script 쪽 AI 요약(날짜 + "·" 형식)이 이미 왔으면 그대로 써요
    if(parseWeekPlanOutline(top.summary)){ wpAiSummary = fixWeekdays(top.summary); wpAiState = 'done'; return; }
    try{
      const { data, error } = await sb.functions.invoke('weekplan-summarize', { body: { fileId: top.id || top.url, modifiedTime: top.modifiedTime || '', name: top.name || '', text: top.summary } });
      if(wpAiKey !== key) return;
      if(error || !data || !data.ok || !data.summary) throw new Error((data && data.error) || 'fail');
      wpAiSummary = fixWeekdays(data.summary); wpAiState = 'done';
    }catch(e){ if(wpAiKey === key) wpAiState = 'error'; }
    const active = document.querySelector('.wp-summary-tab-btn.active');
    const bodyEl = el('wpSummaryBody');
    if(bodyEl && active && active.dataset.wpview === 'ai') bodyEl.innerHTML = wpAiViewHtml();
  }
  function parseWeekPlanOutline(text){
    if(!text) return null;
    const items = [];
    let currentHeading = null;
    text.split('\n').forEach(line => {
      const detail = line.match(/^\s*·\s*(.+)$/);
      if(detail){
        if(!currentHeading) return;
        const rest = detail[1].trim();
        const cat = rest.match(/^([^:：]{1,14})[:：]\s*(.+)$/);
        items.push({
          heading: currentHeading,
          category: cat ? cat[1].trim() : '기타',
          content: cat ? cat[2].trim() : rest
        });
      } else {
        const t = line.trim();
        if(t) currentHeading = t;
      }
    });
    return items.length ? items : null;
  }
  function wpGroupKeys(items, by){
    const seen = new Set(); const order = [];
    items.forEach(it => {
      const k = by === 'heading' ? it.heading : it.category;
      if(!seen.has(k)){ seen.add(k); order.push(k); }
    });
    return order;
  }
  function wpSummaryTableHtml(items, by){
    const body = wpGroupKeys(items, by).map(key => {
      const rows = items.filter(it => (by === 'heading' ? it.heading : it.category) === key).map(it => {
        const other = by === 'heading' ? it.category : it.heading;
        return `<tr><td class="wp-summary-table-tag">${escapeHtml(other)}</td><td>${escapeHtml(it.content)}</td></tr>`;
      }).join('');
      return `<tr class="wp-summary-table-head"><th colspan="2">${escapeHtml(key)}</th></tr>${rows}`;
    }).join('');
    return `<table class="wp-summary-table"><tbody>${body}</tbody></table>`;
  }
  function renderWeekPlan(){
    if(!wpFiles.length){
      el('wp3Summary').innerHTML = '';
      el('wp3Preview').innerHTML = '';
      el('wp3List').innerHTML = '';
      setMsg('wpMsg', '폴더에 문서가 없습니다. (\'주간계획\' 폴더에 바로가기를 추가해주세요)', 'error');
      return;
    }
    setMsg('wpMsg', '', '');
    const top = wpFiles[0];

    // 왼쪽: AI 요약(있을 때만 — 없는 형식이면 가운데 원본을 보라는 안내만 표시)
    if(top.summary) top.summary = tidyWeekPlanText(top.summary);
    wpSummaryRawText = top.summary || '';
    wpSummaryParsedItems = top.summary ? parseWeekPlanOutline(top.summary) : null;
    if(top.summary) wpRequestAiSummary(top);
    el('wp3Summary').innerHTML = top.summary ? `
      <div class="wp-summary">
        <div class="wp-summary-title">${escapeHtml(top.name || '(이름 없음)')}</div>
        <div class="wp-summary-tabs">
          <button type="button" class="wp-summary-tab-btn active" data-wpview="ai">요약</button>
          <button type="button" class="wp-summary-tab-btn" data-wpview="date">날짜별</button>
          <button type="button" class="wp-summary-tab-btn" data-wpview="dept">부서별</button>
        </div>
        <div class="wp-summary-body" id="wpSummaryBody">${wpAiViewHtml()}</div>
        <a class="wp-summary-link" href="${escapeHtml(top.url)}" target="_blank" rel="noopener">문서 전체 보기 →</a>
      </div>
    ` : '<div class="hint">이 문서 형식은 AI 요약을 만들 수 없어요. 가운데에서 원본을 확인하세요.</div>';

    // 가운데: 최신 문서 원본을 그대로 불러와 보여줘요.
    el('wp3Preview').innerHTML = `
      <div class="wp-preview-title">${escapeHtml(top.name || '(이름 없음)')}</div>
      <iframe class="wp-preview" src="${escapeHtml(wpPreviewUrl(top))}" title="최근 주간계획 미리보기"></iframe>
    `;

    // 오른쪽: 전체 목록을 최신순 그대로 나열(맨 위 문서엔 "최신" 표시).
    el('wp3List').innerHTML = wpFiles.map((f, i) => `
      <div class="wp-list-item${i === 0 ? ' latest' : ''}">
        <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${i === 0 ? '<span class="wp-badge">최신</span>' : ''}${escapeHtml(f.name || '(이름 없음)')}</a>
        <span class="wp-date">${wpFmtDate(f.modifiedTime)}</span>
      </div>
    `).join('');
  }
  // 날짜별/부서별 표 탭 클릭 — my-page.html과 동일한 로직(새 Apps Script 호출 없이
  // 이미 받아둔 텍스트를 다시 렌더링만 해요).
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.wp-summary-tab-btn');
    if(!btn) return;
    const view = btn.dataset.wpview;
    const tabsWrap = btn.closest('.wp-summary-tabs');
    if(tabsWrap) tabsWrap.querySelectorAll('.wp-summary-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    const bodyEl = el('wpSummaryBody');
    if(!bodyEl) return;
    if(view === 'ai'){ bodyEl.innerHTML = wpAiViewHtml(); return; }
    if(view === 'date'){ bodyEl.innerHTML = wpDateViewHtml(wpSummaryRawText); return; }
    if(view === 'dept'){ bodyEl.innerHTML = escapeHtml(wpSummaryRawText || ''); return; }
    bodyEl.innerHTML = (view === 'text' || !wpSummaryParsedItems)
      ? escapeHtml(wpSummaryRawText || '')
      : wpSummaryTableHtml(wpSummaryParsedItems, view);
  });
  // Apps Script(콜드스타트로 느릴 때가 많고, 최근 수정된 문서가 있으면 AI 요약을
  // 새로 만드느라 더 오래 걸릴 수 있음) 결과는 선생님 전체가 같이 보는 내용이라,
  // 나의 페이지와 같은 Supabase 캐시(weekplan_cache)를 그대로 재사용해요.
  //
  // 예전에는 캐시가 "오래됐을 때"(TTL 초과) Apps Script 응답이 올 때까지 화면에
  // 아무것도 안 보여주고 기다렸어요 — 캐시에 멀쩡한 데이터가 이미 있는데도요. 콜드
  // 스타트가 느릴 땐 그 몇십 초 동안 화면이 완전히 비어 있어서 "아무것도 안 나온다"는
  // 오해를 샀어요(실제로는 로딩 중이었을 뿐). 지금은 캐시가 있으면 오래됐더라도 일단
  // 그걸로 바로 화면을 채우고, 그 뒤에 백그라운드로 최신 데이터를 가져와 조용히
  // 교체해요 — 캐시가 아예 없는 첫 방문 때만 "불러오는 중…" 안내를 보여주고 기다려요.
  const WEEKPLAN_CACHE_TTL_MS = 15 * 60 * 1000;
  // forceRefresh(새로고침 버튼)가 true면 15분 캐시가 남아있어도 건너뛰고 바로
  // Apps Script를 다시 불러요 — my-page.html의 같은 버튼과 동일한 동작이에요.
  async function loadWeekPlan(forceRefresh){
    let staleFiles = null;
    try{
      const { data: cached } = await sb.from('weekplan_cache').select('files, updated_at').eq('id', 'latest').maybeSingle();
      if(cached && Array.isArray(cached.files)){
        staleFiles = cached.files;
        if(!forceRefresh && cached.updated_at && (Date.now() - new Date(cached.updated_at).getTime()) < WEEKPLAN_CACHE_TTL_MS){
          wpFiles = cached.files;
          renderWeekPlan();
          return;
        }
      }
    }catch(e){ /* 캐시 조회 실패해도 평소대로(Apps Script 호출) 진행 */ }

    if(staleFiles){
      // 오래된 캐시라도 일단 바로 보여주고, 최신 정보는 아래에서 조용히 받아와요.
      wpFiles = staleFiles;
      renderWeekPlan();
      setMsg('wpMsg', '최신 정보를 확인하고 있어요…', '');
    } else {
      setMsg('wpMsg', '불러오는 중이에요… (문서가 많거나 방금 수정됐으면 다소 걸릴 수 있어요)', '');
    }

    try{
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'listWeekPlanFiles' }) });
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        throw new Error('불러오지 못했습니다. Code.gs가 최신 버전으로 재배포되어 있는지, 배포 액세스 권한이 "모든 사용자"로 되어 있는지 확인해주세요.');
      }
      if(!data.ok) throw new Error(data.error || '불러오지 못했습니다.');
      wpFiles = data.files || [];
      renderWeekPlan();
      sb.from('weekplan_cache').upsert({ id: 'latest', files: wpFiles, updated_at: new Date().toISOString() }).then(() => {}, () => {});
    }catch(e){
      if(staleFiles){
        // 이미 오래된 캐시로 화면을 채워뒀으니, 백그라운드 새로고침이 실패해도
        // 화면을 비우거나 에러로 덮어쓰지 않고 "안내 중" 메시지만 지워요.
        setMsg('wpMsg', '', '');
      } else {
        setMsg('wpMsg', e.message, 'error');
      }
    }
  }

  el('btnWpRefresh').addEventListener('click', async () => {
    const btn = el('btnWpRefresh');
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = '↻ 불러오는 중…';
    try{
      await loadWeekPlan(true);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  loadWeekPlan();
})();
</script>

<script>
(function(){

    if(sidebar && sidebar.classList.contains('ks-mobile-open') && !e.target.closest('.ks-sidebar') && !e.target.closest('#ksMobileBurger')){
      sidebar.classList.remove('ks-mobile-open');
    }
  });
  // 공지사항(작성 기간 안인 것만)을 이름 오른쪽에 하나씩 돌아가며 보여줘요 — 여러 개면
  // 4초마다 다음 걸로 부드럽게 바뀌고, 클릭하면 공지사항 페이지로 이동해요. 쓰이지 않던
  // 알림 종 아이콘을 대신해 실제로 쓰이는 정보를 보여주기 위한 것.
  async function loadAnnounceTicker(sb2){
    var ticker = document.getElementById('ksAnnounceTicker');
    var textEl = document.getElementById('ksAnnounceText');
    if(!ticker || !textEl) return;
    try{
      var nowIso = new Date().toISOString();
      var res = await sb2.from('announcements').select('title').lte('starts_at', nowIso).gte('ends_at', nowIso).order('starts_at', { ascending:false });
      var data = res.data;
      if(!data || !data.length) return;
      ticker.style.display = '';
      ticker.title = '공지사항 — 눌러서 보기';
      ticker.addEventListener('click', function(){ location.href = './announce.html'; });
      var idx = 0;
      textEl.textContent = data[0].title;
      if(data.length > 1){
        setInterval(function(){
          textEl.classList.add('ks-announce-fading');
          setTimeout(function(){
            idx = (idx + 1) % data.length;
            textEl.textContent = data[idx].title;
            textEl.classList.remove('ks-announce-fading');
          }, 250);
        }, 4000);
      }
    }catch(e){ /* 공지사항을 못 불러와도 조용히 무시 — 로그인 배지 표시에는 영향 없음 */ }
  }
  function waitForSupabase(cb, attemptsLeft){
    if(window.supabase){ cb(); return; }
    if(attemptsLeft <= 0) return;
    setTimeout(function(){ waitForSupabase(cb, attemptsLeft - 1); }, 200);
  }
  waitForSupabase(async function(){
    var sb = window.supabase.createClient('https://tmssupuskkajahpuswcj.supabase.co', 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W', { auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false } });
    var sess = (await sb.auth.getSession()).data.session;
    var userEl = document.getElementById('ksUser');
    var mobileEl = document.getElementById('ksMobileAuth');
    if(!sess){
      var returnTo = encodeURIComponent(location.pathname + location.search);

    if(mobileEl) mobileEl.innerHTML = '<span class="ks-user-avatar" style="width:26px;height:26px;font-size:12.8px;">' + initial + '</span><span class="ks-mobile-user-name">' + name + '님</span><button type="button" class="ks-mobile-logout-btn" id="ksMobileLogout">로그아웃</button>';
    ['ksLogout','ksMobileLogout'].forEach(function(id){ var b = document.getElementById(id); if(b) b.addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); }); });
    loadAnnounceTicker(sb);
  }, 25);
})();
</script>
