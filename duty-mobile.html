<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘의 지도 당번</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 18px 18px 22px;
    max-width: 420px;
    margin: 0 auto;
    width:100%;
  }

  h1.title{
    text-align:center;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 16px;
  }

  .hero{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 20px 18px 18px;
    box-shadow: 0 1px 0 rgba(38,43,37,0.06);
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .hero-date{
    font-family:'Noto Sans KR', sans-serif;
    display:flex;
    align-items:baseline;
    gap: 8px;
  }
  .hero-date .num{
    font-size: 34px;
    font-weight: 700;
    line-height:1;
  }
  .hero-date .rest{
    font-size: 15px;
    color: var(--ink-soft);
  }
  .stamp{
    font-family:'Noto Sans KR', sans-serif;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding-top: 3px;
    width: 38px;
    height: 44px;
    background: var(--stamp);
    clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%);
    color: #F8F4E8;
    font-weight: 700;
    font-size: 11px;
    flex-shrink:0;
  }
  .event-badge{
    display:inline-block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--stamp);
    background: var(--stamp-soft);
    border: 1px solid rgba(158,58,44,0.25);
    border-radius: 3px;
    padding: 2px 8px;
    margin-bottom: 12px;
  }

  .duty-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--rule-soft);
    border: 1px solid var(--rule-soft);
    border-radius: 6px;
    overflow: hidden;
  }
  .duty-cell{
    background: var(--paper-card);
    padding: 12px 12px 13px;
    min-height: 74px;
  }
  .duty-cell .label{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .duty-cell .names{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.45;
  }
  .duty-cell .names .empty{
    font-family:'Noto Sans KR', sans-serif;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .duty-cell .sub{
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .off-state{
    text-align:center;
    padding: 16px 6px 4px;
  }
  .off-state .big{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .off-state .reason{
    font-size: 13px;
    color: var(--ink-soft);
  }

  .nav-row{
    display:flex;
    align-items:stretch;
    gap: 8px;
    margin-top: 16px;
  }
  .nav-btn{
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 13px 6px;
    cursor:pointer;
    text-align:center;
  }
  .nav-btn:active{ background: var(--rule-soft); }
  .nav-btn.primary{
    background: var(--ink);
    color: var(--paper-card);
    border-color: var(--ink);
    flex: 0.8;
  }

  .date-jump{
    margin-top: 10px;
    display:flex;
    justify-content:center;
  }
  .date-jump input[type=date]{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--paper-card);
    color: var(--ink);
    width: 100%;
    text-align:center;
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
<link rel="stylesheet" href="./theme.css">
</head>

    </div>
    <div class="date-jump">

    </div>
  </div>

</div>

function pad(n){ return n.toString().padStart(2,'0'); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}

const byDate = {};
DUTY_DATA.forEach(d => byDate[d.date] = d);
const sortedDates = DUTY_DATA.map(d => d.date);

let currentKey = toKey(new Date());

function nearestIndex(key){
  let idx = sortedDates.findIndex(k => k >= key);
  if(idx === -1) idx = sortedDates.length - 1;
  return idx;
}

function renderHero(key){
  const hero = document.getElementById('hero');
  const entry = byDate[key];
  const dateObj = parseKey(key);
  const isToday = key === toKey(new Date());
  const wdNames = ['일','월','화','수','목','금','토'];

  if(!entry){
    hero.innerHTML = `
      <div class="hero-top">
        <div class="hero-date">
          <span class="num">${dateObj.getMonth()+1}.${dateObj.getDate()}</span>
          <span class="rest">${wdNames[dateObj.getDay()]}요일</span>
        </div>
        ${isToday ? '<div class="stamp">오늘</div>' : ''}
      </div>
      <div class="off-state">
        <div class="big">지도 일정이 없는 날</div>
        <div class="reason">주말이거나 일정표 범위 밖이에요</div>
      </div>`;
    return;
  }

  const allEmpty = !entry.front1 && !entry.front2 && !entry.back && !entry.lunch1 && !entry.lunch2 && !entry.night;

  let inner = `
    <div class="hero-top">
      <div class="hero-date">
        <span class="num">${dateObj.getMonth()+1}.${dateObj.getDate()}</span>
        <span class="rest">${entry.weekday}요일</span>
      </div>
      ${isToday ? '<div class="stamp">오늘</div>' : ''}
    </div>`;

  if(entry.event){
    inner += `<div class="event-badge">${entry.event}</div>`;
  }

  if(allEmpty){
    const reason = entry.nightNote || entry.event || '학사일정';
    inner += `
      <div class="off-state">
        <div class="big">지도 당번이 없는 날</div>
        <div class="reason">사유: ${reason}</div>
      </div>`;
  } else {
    const cell = (label, names, subNote) => {
      const list = names.filter(Boolean);
      const body = list.length
        ? `<div class="names">${list.join('<br>')}</div>`
        : `<div class="names"><span class="empty">배정 없음</span></div>`;
      const sub = subNote ? `<div class="sub">${subNote}</div>` : '';
      return `<div class="duty-cell"><div class="label">${label}</div>${body}${sub}</div>`;
    };
    inner += `<div class="duty-grid">
      ${cell('정문', [entry.front1, entry.front2])}
      ${cell('후문', [entry.back])}
      ${cell('중식', [entry.lunch1, entry.lunch2])}
      ${cell('야자', [entry.night], entry.nightNote && !entry.night ? entry.nightNote : '')}
    </div>`;
  }

  hero.innerHTML = inner;
}

function stepDay(delta){
  const idx = sortedDates.indexOf(currentKey);
  let newIdx;
  if(idx === -1){
    newIdx = nearestIndex(currentKey) + (delta > 0 ? 0 : -1);
  } else {
    newIdx = idx + delta;
  }
  newIdx = Math.max(0, Math.min(sortedDates.length - 1, newIdx));
  currentKey = sortedDates[newIdx];
  document.getElementById('datePick').value = currentKey;
  renderHero(currentKey);
}

document.getElementById('btnPrev').addEventListener('click', () => stepDay(-1));
document.getElementById('btnNext').addEventListener('click', () => stepDay(1));
document.getElementById('btnToday').addEventListener('click', () => {
  currentKey = toKey(new Date());
  document.getElementById('datePick').value = currentKey;
  renderHero(currentKey);
});
document.getElementById('datePick').addEventListener('change', (e) => {
  if(e.target.value){
    currentKey = e.target.value;
    renderHero(currentKey);
  }
});

document.getElementById('datePick').value = currentKey;
renderHero(currentKey);
</script>
