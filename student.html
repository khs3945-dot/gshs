<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>내 학생 페이지 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 학생용 독립 페이지(학생 도메인): 개인 링크(?k=) 또는 반 QR(?c=) + 비밀번호로 자기 자료만 봐요. 선생님용은 student-portal.html */
  :root{ --bg:#F3F5FC; --ink:#1F2440; --soft:#6B7290; --line:#E3E6F5; --pri:#26357A; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width:560px; margin:0 auto; padding:22px 16px 60px; }
  .brand{ font-size:13px; color:var(--soft); font-weight:700; margin-bottom:4px; }
  h1{ font-size:21px; margin:0 0 14px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:12px; }
  .lbl{ font-size:13.5px; font-weight:700; color:var(--soft); margin-bottom:6px; display:block; }
  input[type=password], input[type=text], input[type=tel]{ width:100%; font-family:inherit; font-size:17px; padding:11px 12px; border:1.5px solid #CBD2EC; border-radius:12px; letter-spacing:.05em; }
  input:focus{ outline:none; border-color:var(--pri); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-size:15px; font-weight:700; border:0; border-radius:12px; padding:11px 16px; cursor:pointer; background:var(--pri); color:#fff; text-decoration:none; }
  .btn.full{ width:100%; margin-top:10px; }
  .btn.ghost{ background:#fff; color:var(--pri); border:1.5px solid #CBD2EC; padding:8px 12px; font-size:14px; }
  .btn:disabled{ opacity:.55; }
  .err{ color:#B42318; font-size:14px; margin-top:8px; min-height:1em; }
  .remember{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--soft); margin-top:10px; }
  .nums{ display:grid; grid-template-columns:repeat(auto-fill, minmax(54px, 1fr)); gap:7px; margin-top:4px; }
  .nums button{ font-family:inherit; font-size:16px; font-weight:700; padding:10px 0; border:1.5px solid #CBD2EC; border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; }
  .nums button.on{ background:var(--pri); border-color:var(--pri); color:#fff; }
  .me{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .me .who{ font-size:19px; font-weight:800; flex:1 1 220px; min-width:0; }
  .me .acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .qr-box{ text-align:center; } .qr-box img{ width:200px; height:200px; }
  .hint{ font-size:13px; color:var(--soft); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1F2440; color:#fff; font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px; display:none; z-index:20; }
  .sp-item{ background:#fff; border:1px solid #E3E6F5; border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .sp-item-head{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  /* 자료 카드: 처음엔 제목 줄만, 제목을 누르면 펼치고 접기 */
  .sp-item-head.sp-fold{ width:100%; border:0; background:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .sp-fold .sp-title{ flex:1 1 auto; min-width:0; }
  .sp-swipe{ touch-action:pan-y; will-change:transform; }
  .sp-swipe-hint{ text-align:center; font-size:12.5px; color:#8A90A8; margin:4px 0 10px; }
  .sp-hidbtn{ display:block; margin:6px auto 10px; font-family:inherit; font-size:13.5px; font-weight:700; color:#4A5170; background:#fff; border:1.5px dashed #CBD2EC; border-radius:999px; padding:6px 16px; cursor:pointer; }
  .sp-hidlist .sp-item{ opacity:.7; }
  .sp-hide-row{ display:flex; justify-content:flex-end; margin:-2px 0 4px; }
  .sp-hide, .sp-unhide{ font-family:inherit; font-size:12px; color:#6B7290; background:none; border:1px solid #DDE2F3; border-radius:999px; padding:2px 10px; cursor:pointer; }
  .sp-unhide{ color:#26357A; border-color:#C9D3F5; }
  .sp-meta{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; font-size:11.5px; line-height:1.3; color:#6B7290; white-space:nowrap; }
  .sp-meta span + span{ color:#9AA0B8; }
  .sp-caret{ color:#8A90A8; font-size:13px; transition:transform .15s; }
  .sp-item:not(.open) .sp-caret{ transform:rotate(-90deg); }
  .sp-item:not(.open) .sp-item-body{ display:none; }
  .sp-item.open .sp-item-body{ margin-top:6px; }
  .sp-item.sp-pin{ border-left:4px solid #2F3FB8; background:#F7F8FF; }
  .sp-item.sp-pin .sp-kind::before{ content:'📌 '; }
  .sp-kind{ font-size:11.5px; font-weight:700; border-radius:7px; padding:1px 7px; background:#EEF1FF; color:#2F3FB8; }
  .k-account .sp-kind{ background:#FFF0D6; color:#8A5200; } .k-exam .sp-kind{ background:#DDF5E7; color:#17703F; } .k-link .sp-kind{ background:#EFE6FD; color:#6232B0; }
  .k-timetable .sp-kind{ background:#E6ECFF; color:#2F3FB8; }
  .sp-tt-wrap{ overflow-x:auto; margin-top:4px; }
  table.sp-tt{ width:100%; min-width:300px; border-collapse:collapse; table-layout:fixed; font-size:12.5px; }
  table.sp-tt th, table.sp-tt td{ border:1px solid #E3E6F5; text-align:center; vertical-align:middle; padding:4px 2px; line-height:1.25; word-break:keep-all; overflow-wrap:anywhere; }
  table.sp-tt thead th{ background:#F1F3FB; color:#1A2453; } table.sp-tt tbody th{ width:22px; background:#F7F8FD; color:#6B7290; }
  table.sp-tt td b{ display:block; font-weight:700; } table.sp-tt td b i{ font-style:normal; color:#3747C9; }
  table.sp-tt td span{ display:block; font-size:11px; color:#6B7290; }
  table.sp-tt td.mv{ background:#E6ECFF; } table.sp-tt td.fx{ background:#F3F4F6; color:#6B7290; }
  .sp-title{ font-size:15.5px; color:#1F2440; }
  .sp-until{ margin-left:auto; font-size:12px; color:#6B7290; }
  .sp-body{ font-size:14.5px; white-space:pre-wrap; word-break:break-word; margin-top:7px; line-height:1.6; }
  .sp-muted{ color:#6B7290; }
  .sp-note{ background:#FFFBEA; border-radius:8px; padding:6px 9px; }
  .sp-sub{ font-size:13.5px; color:#4A5170; margin-top:6px; }
  .sp-kv{ margin-top:8px; border:1px solid #E3E6F5; border-radius:10px; overflow:hidden; }
  .sp-kv-row{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-top:1px solid #EEF0F7; font-size:14.5px; }
  .sp-kv-row:first-child{ border-top:0; }
  .sp-kv-row .k{ color:#6B7290; min-width:76px; font-size:13px; }
  .sp-kv-row .v{ flex:1; min-width:0; font-weight:700; word-break:break-all; font-family:ui-monospace, Menlo, Consolas, monospace; }
  .sp-copy{ font-family:inherit; font-size:12px; font-weight:700; border:1px solid #C9D0EE; background:#fff; color:#26357A; border-radius:7px; padding:2px 8px; cursor:pointer; flex-shrink:0; }
  .sp-btn{ display:inline-block; margin-top:9px; background:#26357A; color:#fff; text-decoration:none; font-size:14px; font-weight:700; border-radius:9px; padding:8px 14px; }
  .k-file .sp-kind{ background:#E3F1FC; color:#1F5F99; }
  .sp-files{ margin-top:8px; border:1px solid #E3E6F5; border-radius:10px; overflow:hidden; }
  .sp-imgs{ margin-top:8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .sp-img{ position:relative; display:block; border:1px solid #E3E6F5; border-radius:10px; overflow:hidden; background:#F4F6FA; aspect-ratio:4/3; }
  .sp-imgs .sp-img:only-child{ grid-column:1 / -1; aspect-ratio:auto; }
  .sp-img img{ display:block; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; }
  .sp-imgs .sp-img:only-child img{ height:auto; max-height:70vh; object-fit:contain; }
  .sp-img-x{ display:none; position:absolute; inset:0; padding:10px; font-size:12.5px; color:#5b6180; align-items:center; justify-content:center; text-align:center; }
  .sp-img.broken img{ display:none; } .sp-img.broken .sp-img-x{ display:flex; }
  .sp-tbl-wrap{ margin-top:8px; overflow-x:auto; border:1px solid #E3E6F5; border-radius:10px; }
  .sp-tbl{ border-collapse:collapse; width:100%; font-size:14px; }
  .sp-tbl th{ background:#F4F6FA; color:#5b6180; font-size:12.5px; font-weight:700; padding:7px 10px; text-align:center; white-space:nowrap; border-bottom:1px solid #E3E6F5; }
  .sp-tbl td{ padding:9px 10px; text-align:center; font-weight:700; white-space:nowrap; cursor:copy; }
  .sp-tbl th + th, .sp-tbl td + td{ border-left:1px solid #EEF0F7; }
  .sp-file{ display:flex; align-items:center; gap:6px; padding:7px 10px; border-top:1px solid #EEF0F7; font-size:14px; }
  .sp-file:first-child{ border-top:0; }
  .sp-file .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .sp-file .sz{ font-size:12px; color:#6B7290; }
  .sp-file a.sp-copy{ text-decoration:none; }
  .sp-from{ font-size:12px; color:#9AA0B8; margin-top:8px; text-align:right; }
  .sp-protect{ position:relative; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .sp-wm{ position:absolute; inset:0; pointer-events:none; border-radius:inherit; background-repeat:repeat; }
  .sp-prot{ font-size:11px; font-weight:700; color:#6232B0; background:#EFE6FD; border-radius:6px; padding:0 6px; }
  body.sp-veil .sp-protect > *:not(.sp-wm){ filter:blur(9px); }
  .sp-empty{ text-align:center; color:#6B7290; font-size:14.5px; padding:26px 10px; background:#fff; border:1px dashed #D5DAF0; border-radius:14px; }

  @media print{ .sp-protect{ visibility:hidden !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">경성고등학교 · 학생 페이지</div>
  <div id="loginView" style="display:none;">
    <h1 id="loginTitle">내 학생 페이지</h1>
    <div class="card">
      <div id="numBox" style="display:none;"><span class="lbl">내 번호를 골라요</span><div class="nums" id="nums"></div><div style="height:12px"></div></div>
      <label class="lbl" for="pw">비밀번호</label>
      <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="선생님께 받은 비밀번호">
      <label class="remember"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지(내 휴대폰일 때만)</label>
      <button type="button" class="btn full" id="btnLogin">들어가기</button>
      <div class="err" id="err"></div>
    </div>
    <p class="hint">비밀번호를 모르면 담임 선생님께 물어보세요. 5번 틀리면 10분 동안 잠겨요.</p>
  </div>
  <div id="msgView" class="card" style="display:none;"></div>
  <div id="mainView" style="display:none;">
    <div class="me"><div class="who" id="who"></div>
      <div class="acts"><button type="button" class="btn ghost" id="btnShare">내 링크</button><button type="button" class="btn ghost" id="btnQr">QR</button><button type="button" class="btn ghost" id="btnPw">비밀번호</button><button type="button" class="btn ghost" id="btnLogout">나가기</button></div>
    </div>
    <div id="qrBox" class="card qr-box" style="display:none;"></div>
    <div id="pwBox" class="card" style="display:none;">
      <b style="font-size:15px;">비밀번호 바꾸기</b>
      <p class="hint" style="margin:4px 0 10px;text-align:left;">선생님께 받은 비밀번호를 내가 정한 것으로 바꿀 수 있어요(4~30자). 잊어버리면 담임 선생님이 다시 정해 줄 수 있어요.</p>
      <label class="lbl" for="pwOld">지금 비밀번호</label><input type="password" id="pwOld" autocomplete="current-password">
      <label class="lbl" for="pwNew" style="margin-top:8px;">새 비밀번호</label><input type="password" id="pwNew" autocomplete="new-password" placeholder="4~30자">
      <label class="lbl" for="pwNew2" style="margin-top:8px;">새 비밀번호 한 번 더</label><input type="password" id="pwNew2" autocomplete="new-password">
      <div style="display:flex;gap:8px;margin-top:12px;"><button type="button" class="btn ghost" id="btnPwCancel" style="flex:1;">취소</button><button type="button" class="btn" id="btnPwSave" style="flex:2;">바꾸기</button></div>
      <div class="err" id="pwErr"></div>
    </div>
    <div id="items"></div>
    <p class="hint" style="text-align:center;margin-top:14px;">선생님이 보낸 자료가 기간 동안 여기에 보여요.</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }) : null;
  const el = (id) => document.getElementById(id);
  const BASE = location.origin + location.pathname.replace(/[^/]*$/, '');
  // ---------- 학생 페이지 자료 그리기(student.html과 같은 코드 — 고치면 두 곳 다) ----------
  const KIND_LABEL = { notice: '공지', account: '나의 자료', exam: '시험 시간표', link: '링크', file: '파일', timetable: '수업 시간표' };
  function spSize(n){ n = Number(n) || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  function spDate(iso){ if(!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; }
  // 파일 자료인데 모두 그림이면 학생 화면 종류 이름을 '이미지'로
  function spAllImg(it){ if(it.kind !== 'file') return false; const fs = (Array.isArray(it.files) ? it.files : []).concat(it.payload && Array.isArray(it.payload.files) ? it.payload.files : []); return fs.length > 0 && fs.every(f => /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name || '')); }
  function spItemHtml(it, base){
    const until = it.ends_at ? `<span class="sp-until">${spDate(it.ends_at)}까지</span>` : '';
    let inner = '';
    if(it.body) inner += `<div class="sp-body">${spEsc(it.body)}</div>`;
    if(it.kind === 'account'){
      const cols = (it.payload && Array.isArray(it.payload.cols)) ? it.payload.cols : [];
      // 선생님이 "한 줄 표"를 고르면 가로 표(머리글 한 줄 + 내 값 한 줄, 칸을 누르면 복사)
      if(cols.length && it.payload.view === 'table') inner += `<div class="sp-tbl-wrap"><table class="sp-tbl"><thead><tr>${cols.map(([k]) => `<th>${spEsc(k)}</th>`).join('')}</tr></thead><tbody><tr>${cols.map(([, v]) => `<td class="sp-cell" data-copy="${spEsc(v)}" title="눌러서 복사">${spEsc(v)}</td>`).join('')}</tr></tbody></table></div>`;
      else inner += cols.length ? `<div class="sp-kv">${cols.map(([k, v]) => `<div class="sp-kv-row"><span class="k">${spEsc(k)}</span><span class="v">${spEsc(v)}</span><button type="button" class="sp-copy" data-copy="${spEsc(v)}">복사</button></div>`).join('')}</div>` : '<div class="sp-body sp-muted">이 학생에게 해당하는 계정 정보가 없어요.</div>';
    } else if(it.kind === 'exam'){
      if(it.exam && it.exam.t) inner += `<div class="sp-sub">${spEsc(it.exam.title || '')}${it.exam.period ? ' · ' + spEsc(it.exam.period) : ''}</div><a class="sp-btn" href="${spEsc(base + 'exam-view.html?id=' + encodeURIComponent(it.exam.id) + '&s=' + encodeURIComponent(it.exam.s) + '&t=' + it.exam.t)}" target="_blank" rel="noopener">내 시험 시간표 보기</a>`;
      else inner += '<div class="sp-body sp-muted">시험 시간표 자료를 찾지 못했어요.</div>';
    } else if(it.kind === 'file'){
      // 모두에게 같은 파일(it.files) + 이 학생에게만 간 파일(payload.files). 내려받기 막힘(dl=false)이면 보기만
      const fs = (Array.isArray(it.files) ? it.files : []).concat(it.payload && Array.isArray(it.payload.files) ? it.payload.files : []);
      const dl = it.dl !== false;
      // 이미지(jpg·png 등)는 드라이브 미리보기 그림으로 작게(누르면 크게 보기), 나머지는 파일 줄로
      const isImg = (f) => /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name || '') || /^image\//.test(f.mime || '');
      const imgs = fs.filter(isImg), others = fs.filter(f => !isImg(f));
      if(imgs.length) inner += `<div class="sp-imgs">${imgs.map(f => { const id = encodeURIComponent(f.id); return `<a class="sp-img" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener" title="${spEsc(f.name)} — 눌러서 크게 보기"><img loading="lazy" alt="${spEsc(f.name)}" src="https://drive.google.com/thumbnail?id=${id}&amp;sz=w1200" onerror="if(!this.dataset.r){this.dataset.r=1;this.src='https://lh3.googleusercontent.com/d/${id}=w1200';}else{this.closest('.sp-img').classList.add('broken');}" draggable="false"><span class="sp-img-x">그림을 불러오지 못했어요 — 눌러서 드라이브에서 보기</span></a>`; }).join('')}</div>`;
      if(others.length || !imgs.length) inner += others.length ? `<div class="sp-files">${others.map(f => `<div class="sp-file"><span class="nm">${spEsc(f.name)}</span>${f.size ? `<span class="sz">${spSize(f.size)}</span>` : ''}<a class="sp-copy" href="https://drive.google.com/file/d/${encodeURIComponent(f.id)}/view" target="_blank" rel="noopener">보기</a>${dl ? `<a class="sp-copy" href="https://drive.google.com/uc?export=download&amp;id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener">내려받기</a>` : ''}</div>`).join('')}</div>${dl ? '' : '<div class="sp-body sp-muted" style="font-size:12.5px;">보기만 할 수 있는 파일이에요(내려받기 막힘).</div>'}` : '<div class="sp-body sp-muted">파일이 없어요.</div>';
    } else if(it.kind === 'timetable'){
      // 학생 시간표(학생 시간표 페이지에서 저장한 것) — payload.tt = {월:{1:{s,sec,r}}}
      const tt = (it.payload && it.payload.tt) || null, D5 = ['월', '화', '수', '목', '금'];
      if(tt){
        let mx = 6; D5.forEach(d => Object.keys(tt[d] || {}).forEach(p => { if(+p > mx) mx = +p; }));
        const ps = Array.from({ length: mx }, (_, i) => i + 1);
        inner += `${it.payload.label ? `<div class="sp-sub">${spEsc(it.payload.label)}</div>` : ''}<div class="sp-tt-wrap"><table class="sp-tt"><thead><tr><th></th>${D5.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>${ps.map(p => `<tr><th>${p}</th>${D5.map(d => { const x = tt[d] && tt[d][p]; if(!x) return '<td></td>'; const fx = x.s === '창체' || x.s === '공강'; return `<td class="${fx ? 'fx' : x.sec ? 'mv' : ''}"><b>${spEsc(x.s)}${x.sec ? `<i>${spEsc(x.sec)}</i>` : ''}</b>${x.r && !fx ? `<span>${spEsc(x.r)}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
      } else inner += '<div class="sp-body sp-muted">시간표 자료가 없어요.</div>';
    } else if(it.kind === 'link' && it.url){
      inner += `<a class="sp-btn" href="${spEsc(it.url)}" target="_blank" rel="noopener">열기</a>`;
    }
    if(it.payload && it.payload.note) inner += `<div class="sp-body sp-note">${spEsc(it.payload.note)}</div>`;
    // 보호 모드: 학번·이름 워터마크(spWatermark가 채움)·복사 막기·화면 벗어나면 가리기
    const pr = !!it.protect;
    return `<div class="sp-item k-${spEsc(it.kind)}${it.kind === 'notice' ? ' sp-pin' : ''}${pr ? ' sp-protect' : ''}"><button type="button" class="sp-item-head sp-fold" aria-expanded="false"><span class="sp-kind">${it.aud ? spEsc(it.aud) : (spAllImg(it) ? '이미지' : KIND_LABEL[it.kind] || '')}</span><b class="sp-title">${spEsc(it.title)}</b>${pr ? '<span class="sp-prot">보호</span>' : ''}<span class="sp-meta">${it.ends_at ? `<span>${spDate(it.ends_at)}까지</span>` : ''}${it.from ? `<span>${spEsc(it.from)} 선생님</span>` : ''}</span><span class="sp-caret" aria-hidden="true">▾</span></button><div class="sp-item-body">${inner}</div>${pr ? '<div class="sp-wm" aria-hidden="true"></div>' : ''}</div>`;
  }
  document.addEventListener('click', (e) => { const h = e.target.closest('.sp-fold'); if(!h) return; const it = h.closest('.sp-item'); const on = !it.classList.contains('open'); it.classList.toggle('open', on); h.setAttribute('aria-expanded', on); });
  function spWatermark(root, text){
    const t = String(text || '').replace(/[&<>]/g, '');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120"><text x="10" y="70" transform="rotate(-18 110 60)" font-size="15" font-family="sans-serif" fill="rgba(40,50,110,0.13)">${t}</text></svg>`;
    const url = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    root.querySelectorAll('.sp-wm').forEach(w => { w.style.backgroundImage = url; });
  }
  function spEsc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  let toastT = null;
  function toast(t){ const b = el('toast'); b.textContent = t; b.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { b.style.display = 'none'; }, 1800); }
  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); toast('복사했어요'); return; }catch(e){}
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('복사했어요'); }catch(e){} ta.remove();
  }
  function showMsg(html){ el('loginView').style.display = 'none'; el('mainView').style.display = 'none'; el('msgView').innerHTML = html; el('msgView').style.display = ''; }
  if(!sb){ showMsg('페이지를 불러오지 못했어요. 잠시 후 새로고침해 주세요.'); return; }

  const q = new URLSearchParams(location.search);
  const K = q.get('k') || '', C = q.get('c') || '';
  const STORE = 'kssp:' + (K ? 'k:' + K : 'c:' + C);
  const ERR = { wrong: '비밀번호가 맞지 않아요.', locked: '여러 번 틀려서 10분 동안 잠겼어요. 잠시 후 다시 해 주세요.', no_pw: '아직 비밀번호가 없어요. 선생님께 문의해 주세요.', not_found: '링크가 올바르지 않거나 바뀌었어요. 선생님께 새 링크를 받아 주세요.', inactive: '지금은 쓸 수 없는 학생 페이지예요(비활성). 필요하면 선생님께 문의해 주세요.' };
  let chosenNo = null, MY = null;

  function readSaved(){ try{ return JSON.parse(sessionStorage.getItem(STORE) || localStorage.getItem(STORE) || 'null'); }catch(e){ return null; } }
  function saveLogin(v, keep){ try{ sessionStorage.setItem(STORE, JSON.stringify(v)); if(keep) localStorage.setItem(STORE, JSON.stringify(v)); }catch(e){} }
  function clearLogin(){ try{ sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); }catch(e){} }

  async function tryLogin(no, pw, keep, silent){
    el('btnLogin').disabled = true; el('err').textContent = '';
    try{
      const { data, error } = K ? await sb.rpc('portal_view', { p_token: K, p_pw: pw }) : await sb.rpc('portal_view_class', { p_ctoken: C, p_no: no, p_pw: pw });
      if(error) throw new Error('연결이 잠시 안 돼요. 다시 시도해 주세요.');
      if(!data || data.error){ if(silent){ clearLogin(); return false; } el('err').textContent = ERR[data && data.error] || '들어가지 못했어요.'; return false; }
      saveLogin({ no, pw }, keep);
      MY = data; MY_PW = pw; migrateLocalHidden(); renderMain(); return true;
    }catch(e){ if(!silent) el('err').textContent = e.message; return false; }
    finally{ el('btnLogin').disabled = false; }
  }
  // ---------- 왼쪽으로 밀어 숨기기(이 기기의 localStorage, 학생별) · 숨긴 자료 다시 표시 ----------
  // 숨김은 데이터베이스(student_portal_targets.hidden)에 저장 → 어느 기기에서 열어도 같아요
  let HIDDEN = new Set(), SHOW_HID = false, MY_PW = '';
  async function setHidden(id, on){
    const it = (MY.items || []).find(x => x.id === id); if(it) it.hidden = on;
    renderMain();
    try{
      const { data, error } = await sb.rpc('portal_set_hidden', { p_token: MY.token, p_pw: MY_PW, p_item: id, p_hidden: on });
      if(error || !data || data.error) throw new Error();
    }catch(e){ if(it) it.hidden = !on; renderMain(); toast('저장하지 못했어요. 잠시 후 다시 해 주세요.'); }
  }
  function hideItem(id){ setHidden(id, true); toast('숨겼어요. 아래 "숨긴 자료"에서 다시 볼 수 있어요.'); }
  function unhideItem(id){ setHidden(id, false); }
  // 예전(이 기기에만 저장하던 때)에 숨긴 자료를 데이터베이스로 한 번 옮기고 지움
  function migrateLocalHidden(){
    const key = 'kssp-hidden:' + MY.grade + '-' + MY.class_no + '-' + MY.no;
    let old = []; try{ old = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){}
    if(!old.length) return;
    try{ localStorage.removeItem(key); }catch(e){}
    old.forEach(id => { const it = (MY.items || []).find(x => x.id === id); if(it && !it.hidden){ it.hidden = true; sb.rpc('portal_set_hidden', { p_token: MY.token, p_pw: MY_PW, p_item: id, p_hidden: true }); } });
  }
  let SW = null;   // 밀기 중인 카드
  el('items').addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.sp-swipe'); if(!c || e.button > 0 || e.target.closest('a, input, .sp-copy, .sp-unhide')) return;
    SW = { c, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId };
  });
  el('items').addEventListener('pointermove', (e) => {
    if(!SW || e.pointerId !== SW.id) return;
    const dx = e.clientX - SW.x, dy = e.clientY - SW.y;
    if(!SW.on){ if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){ SW.on = true; try{ SW.c.setPointerCapture(e.pointerId); }catch(_){} } else if(Math.abs(dy) > 12){ SW = null; return; } else return; }
    SW.dx = Math.min(0, dx);
    SW.c.style.transition = 'none'; SW.c.style.transform = `translateX(${SW.dx}px)`; SW.c.style.opacity = String(Math.max(.35, 1 + SW.dx / 300));
  });
  const swEnd = (e) => {
    if(!SW || (e && e.pointerId !== SW.id)) return;
    const { c, dx, on } = SW; SW = null; if(!on) return;
    c.dataset.swiped = '1'; setTimeout(() => { delete c.dataset.swiped; }, 50);
    const w = c.getBoundingClientRect().width;
    if(dx < -Math.min(110, w * 0.35)){
      c.style.transition = 'transform .18s, opacity .18s'; c.style.transform = `translateX(-${w}px)`; c.style.opacity = '0';
      const id = c.dataset.iid; setTimeout(() => (c.classList.contains('sp-hid') ? unhideItem(id) : hideItem(id)), 170);
    } else { c.style.transition = 'transform .15s, opacity .15s'; c.style.transform = ''; c.style.opacity = ''; }
  };
  el('items').addEventListener('pointerup', swEnd); el('items').addEventListener('pointercancel', swEnd);
  // 밀고 난 직후의 클릭(펼치기)은 무시
  el('items').addEventListener('click', (e) => { const c = e.target.closest('.sp-swipe'); if(c && c.dataset.swiped){ e.stopPropagation(); e.preventDefault(); } }, true);
  el('items').addEventListener('click', (e) => {
    if(e.target.closest('#btnShowHid')){ SHOW_HID = !SHOW_HID; renderMain(); return; }
    const u = e.target.closest('.sp-unhide'); if(u){ unhideItem(u.dataset.iid); return; }
    const h = e.target.closest('.sp-hide'); if(h){ hideItem(h.dataset.iid); }
  });
  function renderMain(){
    el('loginView').style.display = 'none'; el('msgView').style.display = 'none'; el('mainView').style.display = '';
    el('who').textContent = `${MY.grade}학년 ${MY.class_no}반 ${MY.no}번 ${MY.name || ''}`;
    // 공지(학년·학급 공지 포함)는 맨 위에, 그 안에서는 최근 것부터(서버가 최근순으로 줌)
    const items = (MY.items || []).slice().sort((a, b) => (b.kind === 'notice') - (a.kind === 'notice'));
    // 학생이 왼쪽으로 밀어 숨긴 자료(이 기기에만 기억). 기간이 끝나 안 오는 자료 id는 정리
    HIDDEN = new Set(items.filter(it => it.hidden).map(it => it.id));
    const shown = items.filter(it => !HIDDEN.has(it.id)), hid = items.filter(it => HIDDEN.has(it.id));
    const card = (it, isHid) => spItemHtml(it, BASE).replace('<div class="sp-item ', `<div data-iid="${spEsc(it.id)}" class="sp-swipe sp-item ${isHid ? 'sp-hid ' : ''}`)
      .replace('<div class="sp-item-body">', `<div class="sp-item-body"><div class="sp-hide-row">${isHid ? `<button type="button" class="sp-unhide" data-iid="${spEsc(it.id)}">다시 표시</button>` : `<button type="button" class="sp-hide" data-iid="${spEsc(it.id)}">숨기기</button>`}</div>`);
    el('items').innerHTML = (shown.length ? shown.map(it => card(it, false)).join('') : `<div class="sp-empty">${items.length ? '보이는 자료를 모두 숨겼어요.' : '지금 보이는 자료가 없어요.'}</div>`)
      + (shown.length ? '<div class="sp-swipe-hint">확인이 끝난 자료는 카드를 <b>왼쪽으로 밀어</b> 숨길 수 있어요.</div>' : '')
      + (hid.length ? `<button type="button" class="sp-hidbtn" id="btnShowHid" aria-expanded="${SHOW_HID}">숨긴 자료 ${hid.length}개 ${SHOW_HID ? '접기' : '보기'}</button>${SHOW_HID ? `<div class="sp-hidlist">${hid.map(it => card(it, true)).join('')}</div>` : ''}` : '');
    const d = new Date();
    spWatermark(el('items'), `${MY.grade}-${MY.class_no}-${MY.no} ${MY.name || ''} · ${d.getMonth() + 1}/${d.getDate()}`);
  }
  // 보호 모드 자료: 복사·길게 눌러 저장·오른쪽 클릭을 막고, 화면을 벗어나거나 PrintScreen을 누르면 잠깐 가려요(스크린샷을 완전히 막을 수는 없어요)
  const inProtect = (e) => e.target && e.target.closest && e.target.closest('.sp-protect');
  ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, (e) => { if(inProtect(e)) e.preventDefault(); }));
  const veil = (on) => { if(document.querySelector('.sp-protect')) document.body.classList.toggle('sp-veil', on); };
  document.addEventListener('visibilitychange', () => veil(document.hidden));
  window.addEventListener('blur', () => veil(true));
  window.addEventListener('focus', () => veil(false));
  document.addEventListener('keyup', (e) => { if(e.key === 'PrintScreen'){ veil(true); try{ navigator.clipboard.writeText(''); }catch(_){} setTimeout(() => veil(false), 1500); } });
  window.addEventListener('beforeprint', () => veil(true));
  window.addEventListener('afterprint', () => veil(false));
  // ---------- 비밀번호 바꾸기(학생 본인) — 지금 비밀번호를 확인한 뒤 새 것으로 ----------
  const PW_ERR = { wrong: '지금 비밀번호가 맞지 않아요.', locked: '여러 번 틀려서 10분 동안 잠겼어요. 잠시 후 다시 해 주세요.', bad_new: '새 비밀번호는 4~30자로 정해 주세요.', same: '지금 비밀번호와 다른 것으로 정해 주세요.', inactive: ERR.inactive, not_found: ERR.not_found };
  el('btnPw').addEventListener('click', () => {
    const box = el('pwBox'), open = box.style.display === 'none';
    box.style.display = open ? '' : 'none'; el('qrBox').style.display = 'none';
    ['pwOld', 'pwNew', 'pwNew2'].forEach(id => { el(id).value = ''; }); el('pwErr').textContent = '';
    if(open) el('pwOld').focus();
  });
  el('btnPwCancel').addEventListener('click', () => { el('pwBox').style.display = 'none'; });
  el('btnPwSave').addEventListener('click', async () => {
    const o = el('pwOld').value, n = el('pwNew').value, n2 = el('pwNew2').value;
    el('pwErr').textContent = '';
    if(!o || !n){ el('pwErr').textContent = '지금 비밀번호와 새 비밀번호를 넣어 주세요.'; return; }
    if(n.length < 4 || n.length > 30){ el('pwErr').textContent = PW_ERR.bad_new; return; }
    if(n !== n2){ el('pwErr').textContent = '새 비밀번호 두 칸이 서로 달라요.'; return; }
    const b = el('btnPwSave'); b.disabled = true;
    try{
      const { data, error } = await sb.rpc('portal_change_pw', { p_token: MY.token, p_old: o, p_new: n });
      if(error) throw new Error('연결이 잠시 안 돼요. 다시 시도해 주세요.');
      if(!data || !data.ok){ el('pwErr').textContent = PW_ERR[data && data.error] || '바꾸지 못했어요.'; return; }
      MY_PW = n;
      // 이 기기에 로그인을 기억해 두었다면 새 비밀번호로 바꿔 둠
      const saved = readSaved();
      if(saved){ let keep = false; try{ keep = !!localStorage.getItem(STORE); }catch(e){} saveLogin(Object.assign({}, saved, { pw: n }), keep); }
      el('pwBox').style.display = 'none';
      toast('비밀번호를 바꿨어요');
    }catch(e){ el('pwErr').textContent = e.message; }
    finally{ b.disabled = false; }
  });
  const myLink = () => `${BASE}student.html?k=${encodeURIComponent(MY.token)}`;
  el('btnShare').addEventListener('click', async () => {
    const url = myLink();
    if(navigator.share){ try{ await navigator.share({ title: '내 학생 페이지', url }); return; }catch(e){ if(e && e.name === 'AbortError') return; } }
    copyText(url);
  });
  el('btnQr').addEventListener('click', async () => {
    const box = el('qrBox');
    if(box.style.display === ''){ box.style.display = 'none'; return; }
    if(!window.QRCode) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }).catch(() => {});
    if(!window.QRCode){ toast('QR을 만들지 못했어요'); return; }
    const tmp = document.createElement('div'); new QRCode(tmp, { text: myLink(), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    const c = tmp.querySelector('canvas'); const src = c ? c.toDataURL('image/png') : '';
    box.innerHTML = `<img src="${src}" alt="내 페이지 QR"><div class="hint">내 개인 링크 QR — 들어갈 때 비밀번호가 필요해요.</div><a class="btn ghost" style="margin-top:8px;" download="내_학생페이지_QR.png" href="${src}">QR 저장</a>`;
    box.style.display = '';
  });
  el('btnLogout').addEventListener('click', () => { clearLogin(); location.reload(); });
  el('items').addEventListener('click', (e) => { const b = e.target.closest('.sp-copy[data-copy], .sp-cell'); if(b) copyText(b.dataset.copy); });
  el('btnLogin').addEventListener('click', () => {
    const pw = el('pw').value.trim();
    if(C && !chosenNo){ el('err').textContent = '먼저 내 번호를 골라 주세요.'; return; }
    if(!pw){ el('err').textContent = '비밀번호를 넣어 주세요.'; return; }
    tryLogin(chosenNo, pw, el('remember').checked, false);
  });
  el('pw').addEventListener('keydown', (e) => { if(e.key === 'Enter') el('btnLogin').click(); });

  if(!K && !C){ showMsg('선생님께 받은 개인 링크나 반 QR로 들어와 주세요.'); return; }
  const saved = readSaved();
  if(saved && saved.pw && await tryLogin(saved.no, saved.pw, false, true)) return;
  if(C){
    const { data } = await sb.rpc('portal_class_numbers', { p_ctoken: C });
    if(!data){ showMsg(ERR.not_found); return; }
    el('loginTitle').textContent = `${data.grade}학년 ${data.class_no}반`;
    const nos = data.nos || [];
    if(!nos.length){ showMsg('아직 이 반 학생들의 비밀번호가 만들어지지 않았어요. 선생님께 문의해 주세요.'); return; }
    el('nums').innerHTML = nos.map(n => `<button type="button" data-no="${n}">${n}</button>`).join('');
    el('nums').addEventListener('click', (e) => { const b = e.target.closest('[data-no]'); if(!b) return; chosenNo = +b.dataset.no; el('nums').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); el('pw').focus(); });
    el('numBox').style.display = '';
  }
  el('loginView').style.display = '';
  el('pw').focus();
})();
</script>
</body>
</html>
