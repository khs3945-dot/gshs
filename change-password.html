<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5;
  }
  .wrap{ max-width: 420px; margin:0 auto; padding: 60px 20px 80px; }
  h1{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:22px; margin:0 0 10px; text-align:center; }
  .lead{ font-size:13px; color:var(--ink-soft); text-align:center; margin:0 0 26px; line-height:1.6; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:26px 24px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:5px; }
  .field input{
    width:100%; font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding:10px 11px; border:1px solid var(--rule); border-radius:6px; background:#fff; color:var(--ink);
  }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

  .btn{
    width:100%; font-family:'Noto Sans KR', sans-serif; font-size:14px; font-weight:700;
    color:#fff; background:var(--ink); border:none; border-radius:6px; padding:12px 16px; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:14px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }
</style>
</head>
<body>
<div class="wrap">
  <h1>비밀번호 변경이 필요해요</h1>
  <p class="lead">관리자가 이 계정의 비밀번호를 새로 설정했어요. 계속 사용하려면 본인만 아는 새 비밀번호로 바꿔주세요. 바꾸기 전에는 다른 화면으로 이동할 수 없어요.</p>

  <div class="card" id="mainView" style="display:none;">
    <div id="msgArea"></div>
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" id="pwNew" placeholder="8자 이상, 영문+숫자 포함">
      <div class="hint">8자 이상이면서 영문과 숫자를 함께 사용해주세요.</div>
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" id="pwConfirm" placeholder="다시 한 번 입력">
    </div>
    <button type="button" class="btn" id="btnChangePw">비밀번호 바꾸기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function el(id){ return document.getElementById(id); }
  function setMsg(text, type){ el('msgArea').innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href = './login.html'; return; }
  const { data: profile } = await sb.from('profiles').select('must_change_password').eq('id', session.user.id).maybeSingle();
  // 바꿀 필요가 없는 계정이 URL로 직접 들어오면 나의 페이지로 돌려보내요.
  if(!profile || !profile.must_change_password){ location.href = './my-page.html'; return; }
  el('mainView').style.display = 'block';

  el('btnChangePw').addEventListener('click', async () => {
    setMsg('', '');
    const pw1 = el('pwNew').value;
    const pw2 = el('pwConfirm').value;
    if(pw1.length < 8){ setMsg('비밀번호는 8자 이상이어야 해요.', 'error'); return; }
    if(!/[0-9]/.test(pw1) || !/[a-zA-Z]/.test(pw1)){ setMsg('영문과 숫자를 함께 사용해주세요.', 'error'); return; }
    if(pw1 !== pw2){ setMsg('두 비밀번호가 서로 달라요.', 'error'); return; }

    const btn = el('btnChangePw');
    btn.disabled = true; btn.textContent = '변경하는 중…';
    try{
      const { error: upErr } = await sb.auth.updateUser({ password: pw1 });
      if(upErr){ setMsg('변경 실패: ' + upErr.message, 'error'); return; }
      const { error: clearErr } = await sb.rpc('clear_must_change_password');
      if(clearErr){ setMsg('비밀번호는 바뀌었지만 상태 갱신에 실패했어요. 새로고침 후 다시 로그인해주세요: ' + clearErr.message, 'error'); return; }
      setMsg('비밀번호를 바꿨어요. 이동합니다…', 'success');
      location.href = './my-page.html';
    }catch(e){
      setMsg('변경 중 오류가 발생했어요: ' + e.message, 'error');
    }finally{
      btn.disabled = false; btn.textContent = '비밀번호 바꾸기';
    }
  });
})();
</script>
</body>
</html>
