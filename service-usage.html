<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서비스 사용량 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 1560px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:14.3px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-weight:700; font-size:23.8px; margin:0 0 6px; }
  .sub{ font-size:14.8px; color:var(--ink-soft); margin-bottom:24px; line-height:1.7; }

  #gate{ text-align:center; padding: 60px 0; }
  #gate p{ font-size:14.8px; color:var(--ink-soft); }
  #appArea{ display:none; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .card h2{ font-size:16.8px; margin:0 0 8px; }
  .hint{ font-size:14.3px; color:var(--ink-soft); margin:0 0 12px; }

  .msg{ font-size:14.3px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  .btn{
    font-family:inherit; font-size:14.3px; font-weight:700; color:#fff; background:var(--stamp);
    border:none; border-radius:6px; padding:8px 14px; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ background:#fff; color:var(--ink); border:1px solid var(--rule); }

  .filter-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:4px; }
  .filter-row select{
    font-family:inherit; font-size:14.3px; padding:7px 10px; border:1px solid var(--rule); border-radius:6px;
    background:#fff; color:var(--ink);
  }
  .filter-row label{ font-size:13.8px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }

  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top:14px; }
  .stat-tile{ background:var(--stamp-soft); border-radius:8px; padding:12px 14px; }
  .stat-tile .num{ font-size:21.8px; font-weight:700; color:var(--stamp); }
  .stat-tile .label{ font-size:13.3px; color:var(--ink-soft); margin-top:2px; }

  table.usage-table{ width:100%; border-collapse:collapse; font-size:14.3px; margin-top:6px; }
  table.usage-table th, table.usage-table td{ padding:8px 10px; border-bottom:1px solid var(--rule-soft); text-align:left; }
  table.usage-table th{ color:var(--ink-soft); font-weight:700; font-size:13.3px; }
  table.usage-table td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.usage-table tr:last-child td{ border-bottom:none; }
  /* 기능별 AI 모델 설정: 기본은 접혀 있고 제목을 누르면 펼쳐짐 */
  details.model-card > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; }
  details.model-card > summary::-webkit-details-marker{ display:none; }
  details.model-card > summary h2{ margin:0; }
  details.model-card > summary::after{ content:'▸'; margin-left:auto; color:var(--ink-soft); transition:transform .15s; }
  details.model-card[open] > summary::after{ transform:rotate(90deg); }
  details.model-card[open] > summary{ margin-bottom:10px; }
  .model-card-sum{ font-size:13px; color:var(--ink-soft); }
  table.model-table select{ font-family:inherit; font-size:13.8px; padding:5px 8px; border:1px solid var(--rule); border-radius:8px; max-width:100%; }
  table.model-table td:first-child{ font-weight:600; white-space:nowrap; }
  /* 모바일: 칸이 좁아 글자가 세로로 쪼개지고 페이지가 옆으로 밀리던 문제 — 표만 좌우로 밀어 보게 */
  @media (max-width: 760px){
    table.usage-table{ display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.usage-table th, table.usage-table td{ white-space:nowrap; padding:7px 8px; }
    table.usage-table input{ min-width:4.5em; }
    .card{ min-width:0; }
  }
  .empty-note{ font-size:14.3px; color:var(--ink-soft); padding:10px 4px; }
  .loading-note{ font-size:14.3px; color:var(--ink-soft); padding:10px 4px; }

  .pagination-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft);
  }
  .pg-size label{ font-size:13.8px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .pg-size select{
    font-family:inherit; font-size:14.3px; padding:5px 8px; border:1px solid var(--rule); border-radius:6px;
    background:#fff; color:var(--ink);
  }
  .pg-nav{ display:flex; align-items:center; gap:8px; font-size:13.8px; color:var(--ink-soft); }
  .pg-nav .btn{ padding:5px 10px; font-size:13.8px; }

  .price-input{
    font-family:inherit; font-size:14.3px; padding:5px 7px; border:1px solid var(--rule); border-radius:5px;
    width:82px; text-align:right; background:#fff; color:var(--ink);
  }
  .pricing-foot{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .pricing-foot .note{ font-size:13.3px; color:var(--ink-soft); }

  .su-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:-8px 0 10px; }
  .su-card{ padding:14px 16px !important; }
  .su-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .su-head h2{ margin:0 !important; }
  .su-role{ font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-left:4px; }
  .su-link{ font-size:13px; color:var(--stamp); text-decoration:none; white-space:nowrap; }
  .g-row{ margin-top:10px; }
  .g-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; flex-wrap:wrap; }
  .g-label{ font-weight:700; }
  .g-val{ color:var(--ink-soft); font-size:13.5px; }
  .g-val b{ color:var(--ink); font-size:15px; }
  .g-pct{ font-weight:700; margin-left:4px; }
  .g-pct.ok{ color:#1B7F4B; } .g-pct.warn{ color:#B26A00; } .g-pct.bad{ color:#C0281E; }
  .g-bar{ height:10px; background:#EEF0F7; border-radius:99px; overflow:hidden; margin-top:4px; }
  .g-fill{ height:100%; border-radius:99px; }
  .g-fill.ok{ background:#2E9E62; } .g-fill.warn{ background:#E59A1A; } .g-fill.bad{ background:#E0443A; }
  .g-note{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .g-note a{ color:var(--stamp); }
  .s-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:12px; }
  .s-tile{ background:var(--stamp-soft); border-radius:10px; padding:9px 12px; }
  .s-num{ font-size:19px; font-weight:800; color:var(--stamp); }
  .s-label{ font-size:12.5px; color:var(--ink-soft); }
  .su-more{ margin-top:10px; font-size:13.5px; }
  .su-more summary{ cursor:pointer; color:var(--ink-soft); }
  .su-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  .su-table th, .su-table td{ text-align:left; padding:5px 6px; border-bottom:1px solid #EEF0F7; vertical-align:top; }
  .su-table th{ color:var(--ink-soft); font-weight:700; }
  .nf-base{ margin-top:8px; font-size:13.5px; }
  .nf-form{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .nf-form input{ flex:1 1 160px; min-width:0; font-family:inherit; font-size:14px; padding:7px 10px; border:1px solid var(--rule); border-radius:8px; }
  .linkbtn{ background:none; border:0; padding:0; font:inherit; color:var(--stamp); cursor:pointer; text-decoration:underline; }
  .su-setup{ font-size:13.5px; background:#F5F7FD; border-radius:10px; padding:10px 12px; margin-top:6px; line-height:1.6; }
  .su-setup summary{ cursor:pointer; font-weight:700; }
  .su-setup ol{ margin:6px 0 0; padding-left:20px; }
  .su-setup a{ color:var(--stamp); }
  .su-setup code{ background:#fff; border:1px solid #E3E6F5; border-radius:5px; padding:0 4px; }
</style>

<style>
  :root{
    --ks-bg: #F3F5FC; --ks-card: #FFFFFF; --ks-ink: #1F2440; --ks-ink-soft: #6B7290;
    --ks-line: #E3E6F5; --ks-line-soft: #EEF0FA; --ks-primary: #4C5FF0; --ks-primary-dark: #3747C9;
    --ks-primary-soft: #EEF0FF; --ks-purple: #8B5CF6; --ks-purple-soft: #F3ECFE;
    --ks-shadow-sm: 0 1px 2px rgba(31,36,64,0.04), 0 1px 3px rgba(31,36,64,0.06);
    --ks-sidebar-w: 238px;
  }
  .ks-app{ display:flex; min-height:100vh; background:var(--ks-bg);
    background-image: radial-gradient(640px 420px at 100% -10%, rgba(124,108,240,0.10), transparent 60%),
                       radial-gradient(520px 360px at -5% 100%, rgba(91,110,245,0.08), transparent 60%);
    background-attachment: fixed; font-family:'Noto Sans KR', sans-serif;
  }
  .ks-sidebar{ width: var(--ks-sidebar-w); flex-shrink:0; background: var(--ks-card);
    border-right: 1px solid var(--ks-line); display:flex; flex-direction:column;
    padding: 20px 14px; position: sticky; top:0; height:100vh; }
  .ks-brand{ display:flex; align-items:center; gap:10px; padding: 4px 8px 20px; }
  .ks-brand-icon{ width:34px; height:34px; border-radius:11px; flex-shrink:0;
    background: linear-gradient(120deg, #5B6EF5, #7C6CF0); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18.8px; }
  .ks-brand-text{ font-weight:800; font-size:16.8px; letter-spacing:-0.01em; color:var(--ks-ink); }
  .ks-nav{ display:flex; flex-direction:column; gap:3px; }
  .ks-nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px;
    text-decoration:none; font-size:15.3px; font-weight:600; color: var(--ks-ink-soft); }
  .ks-nav-item:hover{ background: var(--ks-line-soft); color: var(--ks-ink); }
  .ks-nav-item.active{ background: var(--ks-primary-soft); color: var(--ks-primary-dark); }
  .ks-nav-ico{ width:20px; text-align:center; font-size:16.3px; flex-shrink:0; }
  .ks-nav-sep{ height:1px; background: var(--ks-line-soft); margin:10px 4px; }
  .ks-sidebar{ overflow-y:auto; }
  .ks-nav{ gap:2px; }
  .ks-nav-item{ padding:7px 10px; }
  .ks-nav-group-label{ font-size:12.3px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase;
    color: var(--ks-ink-soft); opacity:0.75; padding:12px 10px 4px; }

  .ks-sidebar-foot{ margin-top:auto; display:flex; align-items:flex-start; gap:8px; font-size:13.3px;
    color: var(--ks-ink-soft); padding:12px 8px 2px; border-top:1px solid var(--ks-line-soft); }
  .ks-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .ks-topbar{ display:flex; align-items:center; gap:14px; padding: 14px 28px;
    background: var(--ks-card); border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:5; }
  .ks-search{ flex:1; max-width:460px; display:flex; align-items:center; gap:8px;
    background: var(--ks-bg); border:1px solid var(--ks-line); border-radius:14px; padding: 9px 14px; }
  .ks-search input{ border:none; outline:none; background:none; flex:1; font-family:inherit; font-size:15.3px; color:var(--ks-ink); }
  .ks-search input::placeholder{ color: var(--ks-ink-soft); }
  .ks-announce-ticker{ position:relative; display:flex; align-items:center; gap:6px; max-width:240px;
    padding:7px 12px; background:var(--ks-primary-soft); border-radius:12px; flex-shrink:0; cursor:pointer; }
  .ks-announce-ico{ font-size:14.8px; flex-shrink:0; }
  .ks-announce-text{ font-size:13.3px; font-weight:600; color:var(--ks-primary-dark);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:1; transition:opacity 0.25s; }
  .ks-announce-text.ks-announce-fading{ opacity:0; }
  .ks-user{ display:flex; align-items:center; gap:9px; flex-shrink:0; white-space:nowrap; color:var(--ks-ink); }
  .ks-user-avatar{ width:30px; height:30px; border-radius:50%; background: var(--ks-purple-soft); color: var(--ks-purple);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14.3px; flex-shrink:0; }
  .ks-user a.login-link{ font-weight:700; color: var(--ks-primary); text-decoration:none; font-size:15.3px; }
  .ks-user-name{ font-size:14.8px; font-weight:700; }
  .ks-mobile-topbar{ display:none; }
  .ks-content-inner{ flex:1; min-width:0; }
  @media (max-width: 880px){
    .ks-app{ flex-direction:column; } .ks-sidebar{ display:none; } .ks-topbar{ display:none; }
    .ks-mobile-topbar{ display:flex; align-items:center; gap:4px; padding:10px 14px; background: var(--ks-card);
      border-bottom:1px solid var(--ks-line); position: sticky; top:0; z-index:6; }
    .ks-mobile-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      font-size:17.8px; background:none; border:none; cursor:pointer; text-decoration:none; color:var(--ks-ink); }
    .ks-mobile-icon:hover{ background: var(--ks-line-soft); }
    .ks-mobile-spacer{ flex:1; }
    .ks-mobile-login{ font-size:14.3px; font-weight:700; color: var(--ks-primary); text-decoration:none; padding:0 6px; }
    .ks-sidebar.ks-mobile-open{ display:flex; position:fixed; z-index:30; top:0; left:0; height:100vh;
      box-shadow: 0 0 0 9999px rgba(20,24,50,0.45); }
  }
  .gsnav-burger, .gsnav-home-btn, .gsnav-mypage-btn, .gsnav-search-btn, #site-login-badge{ display:none !important; }

  /* 글꼴 + 모서리 둥글게 */
  *, *::before, *::after{ font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif !important; }

  /* 버튼: 밋밋한 흰색 보조 버튼에 은은한 색(인디고 20% 배경 + 진한 인디고 글자) */
  .btn.secondary, .btn-secondary, .nav-btn:not(.primary){
    background: rgba(76,95,240,0.2) !important; color:#20296B !important;
    border-color: rgba(76,95,240,0.3) !important; border-radius:9px !important;
  }
</style>
<style id="ks-theme">
  /* 메뉴 아이콘 색: 유형별 — 연한 배경 + 같은 계열 색 아이콘 */
  .ks-nav-ico.ic-base, .icon.ic-base, .ks-feature-icon.ic-base{ background:#e2e5fd !important; }
  .ic-base svg, .ic-base svg *{ stroke:#4C5FF0 !important; }
  .ks-mobile-ico-badge{ background:#e2e5fd !important; }
  .ks-mobile-ico-badge svg, .ks-mobile-ico-badge svg *{ stroke:#4C5FF0 !important; }
  .ks-nav-ico.ic-plan, .icon.ic-plan, .ks-feature-icon.ic-plan{ background:#d8eeeb !important; }
  .ic-plan svg, .ic-plan svg *{ stroke:#0E9384 !important; }
  .ks-nav-ico.ic-share, .icon.ic-share, .ks-feature-icon.ic-share{ background:#faeadb !important; }
  .ic-share svg, .ic-share svg *{ stroke:#E07A1F !important; }
  .ks-nav-ico.ic-bot, .icon.ic-bot, .ks-feature-icon.ic-bot{ background:#ece5fe !important; }
  .ic-bot svg, .ic-bot svg *{ stroke:#8B5CF6 !important; }
  .ks-nav-ico.ic-work, .icon.ic-work, .ks-feature-icon.ic-work{ background:#f9e1ea !important; }
  .ic-work svg, .ic-work svg *{ stroke:#D9467A !important; }
  .ks-nav-ico.ic-life, .icon.ic-life, .ks-feature-icon.ic-life{ background:#deefe4 !important; }
  .ic-life svg, .ic-life svg *{ stroke:#2F9E55 !important; }
  .ks-nav-ico.ic-eval, .icon.ic-eval, .ks-feature-icon.ic-eval{ background:#d7e7f0 !important; }
  .ic-eval svg, .ic-eval svg *{ stroke:#0369A1 !important; }
  .ks-nav-ico.ic-admin, .icon.ic-admin, .ks-feature-icon.ic-admin{ background:#e2e4e7 !important; }
  .ic-admin svg, .ic-admin svg *{ stroke:#475569 !important; }
  /* === 메인 화면(index.html)과 같은 디자인으로 맞춤 — 옛 색상 변수를 새 팔레트로 덮어씀 === */
  :root{
    --paper:#F4F5F7; --paper-card:#FFFFFF; --ink:#05070D; --ink-soft:#2F3545;
    --rule:#E3E5EA; --rule-soft:#EDEEF1; --stamp:#1A2453; --stamp-soft:#E9ECF5;
    --brass:#7A5B12; --brass-soft:#EEF0F3;

  }
  .ks-nav-item:hover{ background:var(--ks-line-soft); color:var(--ks-ink); }
  .ks-app{ background:var(--ks-bg) !important; background-image:none !important; }
  body{ background:var(--ks-bg); }
  .ks-nav-item.active{ color:var(--ks-primary-dark); }
  .ks-nav-ico{ width:22px; height:22px; border-radius:7px; background:var(--ks-primary);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; }
  .ks-logout-btn{ font-size:13.3px; font-weight:700; color:var(--ks-ink-soft); background:var(--ks-line-soft);
    border:none; border-radius:9px; padding:6px 12px; cursor:pointer; font-family:inherit; margin-left:2px; }
  .ks-logout-btn:hover{ background:var(--ks-line); color:var(--ks-ink); }
  .ks-mobile-ico-badge{ width:22px; height:22px; border-radius:7px; background:var(--ks-primary);

  #ksMobileAuth{ display:flex; align-items:center; gap:6px; }
  .ks-mobile-user-name{ font-size:13.3px; font-weight:700; color:var(--ks-ink); white-space:nowrap; }
  .ks-mobile-logout-btn{ font-size:12.3px; font-weight:700; color:var(--ks-ink-soft); background:var(--ks-line-soft);
    border:none; border-radius:8px; padding:5px 9px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  /* 본문: 카드·제목·버튼·입력칸을 메인처럼 둥글고 가볍게 */

  .ks-content-inner header.page-head h1{ font-size:24px; font-weight:800; letter-spacing:-0.01em; color:var(--ks-ink); }
  .ks-content-inner .card{ border:1px solid var(--ks-line); border-radius:18px; box-shadow:var(--ks-shadow-sm); }
  .ks-content-inner .btn{ border-radius:10px; }
  .ks-content-inner input[type="text"], .ks-content-inner input[type="password"], .ks-content-inner input[type="number"],
  .ks-content-inner input[type="date"], .ks-content-inner input[type="datetime-local"], .ks-content-inner input[type="time"],
  .ks-content-inner input[type="search"], .ks-content-inner select, .ks-content-inner textarea{ border-radius:10px; }

    .ks-content-inner header.page-head{ padding:16px 18px; border-radius:18px; }

  }
  @media (max-width:880px){
    .ks-mobile-icon{ width:44px; height:44px; }
    .ks-mobile-ico-badge{ width:36px; height:36px; border-radius:11px; }
    .ks-mobile-ico-badge svg{ width:21px; height:21px; }
    /* 맨 윗줄 이름·로그아웃 크게, 돋보기는 선 아이콘(#ksMobileSearchBtn svg) */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtNum(n){ return (n || 0).toLocaleString('ko-KR'); }
  function fmtBytes(b){ b = Number(b) || 0; if(b >= 1e9) return (b / 1e9).toFixed(2) + 'GB'; if(b >= 1e6) return (b / 1e6).toFixed(1) + 'MB'; if(b >= 1e3) return Math.round(b / 1e3) + 'KB'; return b + 'B'; }
  function fmtWhen(v){ const d = new Date(v); if(isNaN(d)) return ''; const p = (n) => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    el('gateMsg').textContent = '로그인이 필요합니다.';
    el('gateLoginLink').style.display = 'inline-block';
    return;
  }
  const { data: myProfile } = await sb.from('profiles').select('is_admin, name').eq('id', session.user.id).maybeSingle();
  if(!myProfile || !myProfile.is_admin){
    el('gateMsg').textContent = '관리자 계정만 접근할 수 있어요.';
    return;
  }
  el('gate').style.display = 'none';
  el('appArea').style.display = 'block';
  const myName = myProfile.name || '';

  // 무료 한도(2026-10 기준 공개 요금표). 바뀌면 여기만 고치면 돼요.
  const LIMITS = { sbDb: 500e6, sbStorage: 1e9, sbMau: 50000, vcDeploys: 100, nfCredits: 300, nfDeployCredit: 15 };

  // 한 줄 막대: 70% 넘으면 주황, 90% 넘으면 빨강
  function gauge(label, used, limit, usedText, limitText, note){
    const pct = limit ? Math.min(100, used / limit * 100) : 0;
    const lv = pct >= 90 ? 'bad' : pct >= 70 ? 'warn' : 'ok';
    return `<div class="g-row"><div class="g-top"><span class="g-label">${escapeHtml(label)}</span><span class="g-val"><b>${escapeHtml(usedText)}</b> / ${escapeHtml(limitText)} <span class="g-pct ${lv}">${pct < 1 && used > 0 ? '1% 미만' : Math.round(pct) + '%'} 사용</span></span></div>
      <div class="g-bar"><div class="g-fill ${lv}" style="width:${Math.max(pct, used > 0 ? 1.5 : 0)}%"></div></div>${note ? `<div class="g-note">${note}</div>` : ''}</div>`;
  }
  const stat = (label, value, note) => `<div class="s-tile"><div class="s-num">${escapeHtml(value)}</div><div class="s-label">${escapeHtml(label)}</div>${note ? `<div class="g-note">${note}</div>` : ''}</div>`;

  async function loadSupabase(){
    const { data, error } = await sb.rpc('admin_usage_stats');
    if(error || !data){ el('sbBox').innerHTML = `<div class="msg error">불러오지 못했어요: ${escapeHtml(error ? error.message : '')}</div>`; return; }
    const d = data;
    const prov = (d.ai_month_by_provider || []).map(p => `${p.provider === 'claude' ? 'Claude' : p.provider === 'gemini' ? 'Gemini' : escapeHtml(p.provider)} ${fmtNum(p.calls)}회`).join(' · ');
    el('sbBox').innerHTML =
      gauge('데이터베이스', d.db_bytes, LIMITS.sbDb, fmtBytes(d.db_bytes), '500MB') +
      gauge('파일 저장소', d.storage_bytes, LIMITS.sbStorage, fmtBytes(d.storage_bytes), '1GB', `파일 ${fmtNum(d.storage_files)}개`) +
      gauge('한 달 로그인 사용자', d.mau, LIMITS.sbMau, fmtNum(d.mau) + '명', '5만 명', `가입 계정 ${fmtNum(d.users)}개`) +
      `<div class="s-grid">${stat('오늘 AI 호출', fmtNum(d.ai_today) + '회')}${stat('이번 달 AI 호출', fmtNum(d.ai_month) + '회', prov)}</div>
      <div class="g-note" style="margin-top:8px;">AI 요금은 Supabase가 아니라 Claude·Gemini에 따로 나가요 — <a href="./ai-usage.html">AI 사용량</a>에서 기능별로 볼 수 있어요. 데이터 전송량(월 5GB)·서버 함수 호출(월 50만 회)은 위 "자세히"에서 확인해요.</div>
      <details class="su-more"><summary>많이 차지하는 곳</summary>
        <table class="su-table"><tr><th>표(데이터)</th><th>크기</th><th>행</th></tr>${(d.tables || []).map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${fmtBytes(t.bytes)}</td><td>${t.rows >= 0 ? fmtNum(t.rows) : '-'}</td></tr>`).join('')}</table>
        <table class="su-table"><tr><th>파일 보관함</th><th>크기</th><th>파일</th></tr>${(d.buckets || []).map(b => `<tr><td>${escapeHtml(b.name)}</td><td>${fmtBytes(b.bytes)}</td><td>${fmtNum(b.files)}</td></tr>`).join('') || '<tr><td colspan="3">없음</td></tr>'}</table>
      </details>`;
  }

  const SETUP = {
    vercel: `<details class="su-setup"><summary>토큰 등록 방법 <span class="g-note">(만료되면 다시 등록)</span></summary><ol>
      <li><a href="https://vercel.com/account/settings/tokens" target="_blank" rel="noopener">Vercel → Account Settings → Tokens</a>에서 <b>Create</b>(이름: gshs-usage, Scope: gshs 프로젝트가 있는 곳, 만료: 1년) → 나온 토큰 복사</li>
      <li><a href="https://supabase.com/dashboard/project/tmssupuskkajahpuswcj/functions/secrets" target="_blank" rel="noopener">Supabase → Edge Functions → Secrets</a>에 이름 <code>VERCEL_TOKEN</code>, 값에 붙여넣기 → Save</li></ol></details>`,
    netlify: `<details class="su-setup"><summary>토큰 등록 방법 <span class="g-note">(만료되면 다시 등록)</span></summary><ol>
      <li><a href="https://app.netlify.com/user/applications#personal-access-tokens" target="_blank" rel="noopener">Netlify → User settings → Applications → Personal access tokens</a>에서 <b>New access token</b>(이름: gshs-usage, 만료: 1년) → 토큰 복사</li>
      <li><a href="https://supabase.com/dashboard/project/tmssupuskkajahpuswcj/functions/secrets" target="_blank" rel="noopener">Supabase → Edge Functions → Secrets</a>에 이름 <code>NETLIFY_TOKEN</code>, 값에 붙여넣기 → Save</li></ol></details>`,
  };
  const stateKo = (s) => ({ READY: '완료', ready: '완료', ERROR: '실패', error: '실패', BUILDING: '배포 중', QUEUED: '대기', CANCELED: '취소', building: '배포 중', enqueued: '대기' })[s] || escapeHtml(s || '');

  async function loadPlatforms(){
    const { data, error } = await sb.functions.invoke('platform-usage', { body: {} });
    if(error || !data || !data.ok){
      const m = `<div class="msg error">불러오지 못했어요${data && data.error ? ': ' + escapeHtml(data.error) : ''}</div>`;
      el('vcBox').innerHTML = m; el('nfBox').innerHTML = m; return;
    }
    const v = data.vercel || {};
    if(!v.configured) el('vcBox').innerHTML = SETUP.vercel.replace('<details', '<details open');
    else if(v.error) el('vcBox').innerHTML = `<div class="msg error">Vercel에서 읽지 못했어요(${escapeHtml(v.error)}). 토큰이 만료됐거나 권한이 없을 수 있어요.</div>${SETUP.vercel}`;
    else el('vcBox').innerHTML =
      gauge('최근 24시간 배포', v.last24h, LIMITS.vcDeploys, fmtNum(v.last24h) + (v.more ? '+' : '') + '번', '100번', `한국시간 오늘 ${fmtNum(v.todayKst)}번 · work 브랜치에 푸시할 때마다 1번씩 늘어요. 100번이 차면 그날은 미리보기가 갱신되지 않아요.`) +
      `<div class="g-note" style="margin-top:6px;">전송량(월 100GB)·함수 실행은 정적 사이트라 거의 쓰지 않아요.</div>` +
      (v.latest && v.latest.length ? `<details class="su-more"><summary>최근 배포</summary><table class="su-table"><tr><th>시각</th><th>상태</th><th>내용</th></tr>${v.latest.map(x => `<tr><td>${fmtWhen(x.at)}</td><td>${stateKo(x.state)}</td><td>${escapeHtml(x.msg || x.branch)}</td></tr>`).join('')}</table></details>` : '') + SETUP.vercel;

    NF_DATA = data.netlify || {};
    renderNetlify();
  }
  // Netlify 크레딧: 관리자가 "남은 크레딧"을 직접 입력하면(추가 결제 후 등) 그 시각 이후 운영 배포×15만 빼서 보여줌.
  // 입력이 없으면 최근 30일 배포로 월 300 대비 어림. 값은 app_settings.netlify_credit {credits, at, by}.
  let NF_DATA = null, NF_BASE = null;
  function creditBaseHtml(){
    return `<div class="nf-base"><button type="button" class="linkbtn" id="nfBaseToggle">남은 크레딧 직접 입력</button>
      <div id="nfBaseForm" style="display:none;"><div class="nf-form"><input type="number" id="nfBaseInput" min="0" step="1" inputmode="numeric" placeholder="Netlify에 보이는 남은 크레딧" value="${NF_BASE ? NF_BASE.credits : ''}">
      <button type="button" class="btn" id="nfBaseSave">저장</button>${NF_BASE ? '<button type="button" class="btn secondary" id="nfBaseClear">입력값 지우기</button>' : ''}</div>
      <div class="g-note">크레딧을 추가로 결제했거나 달이 바뀌어 다시 채워졌을 때, <a href="https://app.netlify.com/teams/khs3945" target="_blank" rel="noopener">Netlify</a>의 Usage &amp; billing에 보이는 남은 크레딧을 넣어 주세요. 지금 시각부터 다시 세요.</div></div></div>`;
  }
  function renderNetlify(){
    const n = NF_DATA || {};
    const sites = n.sites || [];
    let top = '';
    if(NF_BASE){
      const at = Date.parse(NF_BASE.at);
      let since = 0, partial = false;
      sites.forEach(s => { since += (s.prodTimes || []).filter(t => Date.parse(t) >= at).length; if(s.oldest && Date.parse(s.oldest) > at && (s.prodTimes || []).length >= 100) partial = true; });
      const used = since * LIMITS.nfDeployCredit, left = Math.max(0, NF_BASE.credits - used);
      top = gauge('남은 크레딧(어림)', used, NF_BASE.credits, `약 ${fmtNum(left)} 남음`, `${fmtNum(NF_BASE.credits)}에서`,
        `${fmtWhen(NF_BASE.at)}에 ${fmtNum(NF_BASE.credits)}으로 입력${NF_BASE.by ? '(' + escapeHtml(NF_BASE.by) + ')' : ''} → 그 뒤 운영 배포 ${fmtNum(since)}번${partial ? '+' : ''} × ${LIMITS.nfDeployCredit} = ${fmtNum(used)} 사용. ` +
        (n.configured ? '방문 트래픽 몫은 빠져 있어요.' : '배포 횟수는 토큰을 등록해야 빼져요.'));
    } else if(n.configured){
      const deploys30 = sites.reduce((a, s) => a + (s.prod30d || 0), 0);
      const credits = deploys30 * LIMITS.nfDeployCredit;
      top = gauge('크레딧(배포분 어림)', credits, LIMITS.nfCredits, fmtNum(credits), '월 300', `최근 30일 운영 배포 ${fmtNum(deploys30)}번 × ${LIMITS.nfDeployCredit}크레딧. main에 병합하면 두 사이트가 함께 배포돼 한 번에 약 ${LIMITS.nfDeployCredit * 2}크레딧이 들어요. 방문 트래픽 몫은 빠져 있으니 정확한 값은 "자세히"에서 확인해요.`);
    }
    if(!n.configured){ el('nfBox').innerHTML = top + creditBaseHtml() + SETUP.netlify.replace('<details', '<details open'); bindBase(); return; }
    {
      el('nfBox').innerHTML = top + creditBaseHtml() +
        `<table class="su-table"><tr><th>사이트</th><th>이번 달 배포</th><th>최근 배포</th></tr>${sites.map(s => s.error
          ? `<tr><td>${escapeHtml(s.role)}</td><td colspan="2" class="g-note">읽지 못했어요(${escapeHtml(s.error)})</td></tr>`
          : `<tr><td>${escapeHtml(s.role)}<div class="g-note">${escapeHtml(s.name)}</div></td><td>${fmtNum(s.prodMonth)}번</td><td>${s.last ? fmtWhen(s.last.at) + ' ' + stateKo(s.last.state) : '-'}</td></tr>`).join('')}</table>` + SETUP.netlify;
      bindBase();
    }
  }
  function bindBase(){
    el('nfBaseToggle').addEventListener('click', () => { const f = el('nfBaseForm'); f.style.display = f.style.display === 'none' ? '' : 'none'; if(f.style.display === '') el('nfBaseInput').focus(); });
    el('nfBaseSave').addEventListener('click', async () => {
      const v = Math.round(Number(el('nfBaseInput').value));
      if(!(v >= 0) || el('nfBaseInput').value === ''){ alert('남은 크레딧을 숫자로 넣어 주세요.'); return; }
      await saveBase({ credits: v, at: new Date().toISOString(), by: myName });
    });
    const c = el('nfBaseClear');
    if(c) c.addEventListener('click', async () => { if(confirm('입력한 남은 크레딧을 지우고 최근 30일 어림으로 돌아갈까요?')) await saveBase(null); });
  }
  async function saveBase(v){
    const { error } = await sb.from('app_settings').update({ netlify_credit: v }).eq('id', 'site');
    if(error){ alert('저장하지 못했어요: ' + error.message); return; }
    NF_BASE = v; renderNetlify();
  }

  async function loadAll(){
    el('suTime').textContent = '불러오는 중…';
    const { data: st } = await sb.from('app_settings').select('netlify_credit').eq('id', 'site').maybeSingle();
    NF_BASE = st && st.netlify_credit && Number.isFinite(Number(st.netlify_credit.credits)) ? { credits: Number(st.netlify_credit.credits), at: st.netlify_credit.at, by: st.netlify_credit.by } : null;
    await Promise.all([loadSupabase(), loadPlatforms()]);
    el('suTime').textContent = '기준: ' + new Date().toLocaleString('ko-KR');
  }
  el('btnRefresh').addEventListener('click', loadAll);
  loadAll();
})();
</script>

<script>
(function(){
  function openRealSiteSearch(){ var b = document.querySelector('.gsnav-search-btn'); if(b) b.click(); }
  var ts = document.getElementById('ksTopSearch'); if(ts){ ts.addEventListener('click', openRealSiteSearch); ts.addEventListener('focus', openRealSiteSearch); }
  var ms = document.getElementById('ksMobileSearchBtn'); if(ms) ms.addEventListener('click', openRealSiteSearch);
  var sidebar = document.getElementById('ksSidebar');
  var burger = document.getElementById('ksMobileBurger');
  if(burger) burger.addEventListener('click', function(){ sidebar.classList.add('ks-mobile-open'); });
  document.addEventListener('click', function(e){
    if(sidebar && sidebar.classList.contains('ks-mobile-open') && !e.target.closest('.ks-sidebar') && !e.target.closest('#ksMobileBurger')){
      sidebar.classList.remove('ks-mobile-open');
    }
  });
  // 공지사항(작성 기간 안인 것만)을 이름 오른쪽에 하나씩 돌아가며 보여줘요 — 여러 개면
  // 4초마다 다음 걸로 부드럽게 바뀌고, 클릭하면 공지사항 페이지로 이동해요. 쓰이지 않던
  // 알림 종 아이콘을 대신해 실제로 쓰이는 정보를 보여주기 위한 것.
  async function loadAnnounceTicker(sb2){
    var ticker = document.getElementById('ksAnnounceTicker');
    var textEl = document.getElementById('ksAnnounceText');
    if(!ticker || !textEl) return;
    try{
      var nowIso = new Date().toISOString();
      var res = await sb2.from('announcements').select('title').lte('starts_at', nowIso).gte('ends_at', nowIso).order('starts_at', { ascending:false });
      var data = res.data;
      if(!data || !data.length) return;
      ticker.style.display = '';
      ticker.title = '공지사항 — 눌러서 보기';
      ticker.addEventListener('click', function(){ location.href = './announce.html'; });
      var idx = 0;
      textEl.textContent = data[0].title;
      if(data.length > 1){
        setInterval(function(){
          textEl.classList.add('ks-announce-fading');
          setTimeout(function(){
            idx = (idx + 1) % data.length;
            textEl.textContent = data[idx].title;
            textEl.classList.remove('ks-announce-fading');
          }, 250);
        }, 4000);
      }
    }catch(e){ /* 공지사항을 못 불러와도 조용히 무시 — 로그인 배지 표시에는 영향 없음 */ }
  }
  function waitForSupabase(cb, attemptsLeft){
    if(window.supabase){ cb(); return; }
    if(attemptsLeft <= 0) return;
    setTimeout(function(){ waitForSupabase(cb, attemptsLeft - 1); }, 200);
  }
  waitForSupabase(async function(){
    var sb = window.supabase.createClient('https://tmssupuskkajahpuswcj.supabase.co', 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W', { auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false } });
    var sess = (await sb.auth.getSession()).data.session;
    var userEl = document.getElementById('ksUser');
    var mobileEl = document.getElementById('ksMobileAuth');
    if(!sess){
      var returnTo = encodeURIComponent(location.pathname + location.search);
      if(userEl) userEl.innerHTML = '<a class="login-link" href="./login.html?return=' + returnTo + '">로그인</a>';
      if(mobileEl) mobileEl.innerHTML = '<a class="ks-mobile-login" href="./login.html?return=' + returnTo + '">로그인</a>';
      return;
    }
    var prof = (await sb.from('profiles').select('name').eq('id', sess.user.id).maybeSingle()).data;
    var name = (prof && prof.name) || '선생님';
    var initial = name.slice(0, 1);
    if(userEl) userEl.innerHTML = '<span class="ks-user-avatar">' + initial + '</span><span class="ks-user-name">' + name + '님</span><button type="button" class="ks-logout-btn" id="ksLogout">로그아웃</button>';
    if(mobileEl) mobileEl.innerHTML = '<span class="ks-user-avatar" style="width:26px;height:26px;font-size:12.8px;">' + initial + '</span><span class="ks-mobile-user-name">' + name + '님</span><button type="button" class="ks-mobile-logout-btn" id="ksMobileLogout">로그아웃</button>';
    ['ksLogout','ksMobileLogout'].forEach(function(id){ var b = document.getElementById(id); if(b) b.addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); }); });
    loadAnnounceTicker(sb);
  }, 25);
})();
</script>
