<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 시간표 조회 · 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --stamp-strong: rgba(38,64,133,0.16);
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 980px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 26px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head .term{ font-size:13px; color:var(--ink-soft); }

  /* ---- Teacher picker ---- */
  .picker-block{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 24px;
  }
  .picker-block h2{
    font-family:'Noto Sans KR', sans-serif; font-size:15px; font-weight:600; margin:0 0 4px;
  }
  .picker-block p.hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }
  .search-row{ position:relative; margin-bottom: 10px; }
  .search-row input[type=text]{
    width:100%;
    font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding: 10px 12px;
    border:1px solid var(--rule); border-radius:4px;
    background: #fff; color: var(--ink);
  }
  .suggest-list{
    position:absolute; left:0; right:0; top: calc(100% + 4px);
    background:#fff; border:1px solid var(--rule); border-radius:4px;
    max-height: 220px; overflow-y:auto;
    box-shadow: 0 4px 14px rgba(38,43,37,0.14);
    z-index: 20;
    display:none;
  }
  .suggest-list.open{ display:block; }
  .suggest-item{
    padding: 9px 12px; font-size:13.5px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px;
  }
  .suggest-item:hover, .suggest-item.active{ background: var(--stamp-soft); }
  .suggest-item .room{ color:var(--ink-soft); font-size:12px; }
  .suggest-empty{ padding:10px 12px; font-size:13px; color:var(--ink-soft); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--ink); color: var(--paper-card);
    border-radius: 20px;
    padding: 6px 8px 6px 14px;
    font-size: 13.5px; font-weight:500;
  }
  .chip button{
    background:none; border:none; color: var(--paper-card);
    opacity:0.75; cursor:pointer; font-size:15px; line-height:1;
    padding: 2px 6px;
  }
  .chip button:hover{ opacity:1; }

  /* ---- Empty state ---- */
  .empty-state{
    text-align:center; padding: 50px 20px;
    color: var(--ink-soft); font-size:14px;
  }

  /* ---- Common free summary ---- */
  .common-free{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 26px;
  }
  .common-free h2{
    font-family:'Noto Sans KR', sans-serif; font-size:15px; font-weight:600; margin:0 0 4px;
  }
  .common-free p.hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }
  .free-slot-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .free-slot{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13.5px; font-weight:600;
    background: var(--stamp-soft);
    border: 1px solid rgba(158,58,44,0.3);
    color: var(--stamp);
    border-radius: 4px;
    padding: 6px 11px;
  }
  .no-common{
    font-size: 13.5px; color: var(--ink-soft);
    padding: 4px 2px;
  }

  /* ---- Timetable grid ---- */
  .teacher-block{ margin-bottom: 28px; }
  .teacher-block .th-row{
    display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
  }
  .teacher-block h3{
    font-family:'Noto Sans KR', sans-serif; font-size:17px; font-weight:700; margin:0;
  }
  .teacher-block .meta{ font-size:12px; color:var(--ink-soft); }

  table.tt{
    width:100%; border-collapse:collapse;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow:hidden;
    table-layout: fixed;
  }
  table.tt th{
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px; font-weight:600; color:var(--ink-soft);
    padding: 8px 4px; text-align:center;
    border-bottom: 1px solid var(--rule);
    background: rgba(38,43,37,0.02);
  }
  table.tt th.period-col{ width: 44px; }
  table.tt td{
    border-bottom: 1px solid var(--rule-soft);
    border-right: 1px solid var(--rule-soft);
    padding: 8px 5px;
    text-align:center;
    font-size: 12.5px;
    vertical-align: middle;
    height: 52px;
  }
  table.tt td:last-child{ border-right:none; }
  table.tt tr:last-child td{ border-bottom:none; }
  table.tt td.period-num{
    font-family:'Noto Sans KR', sans-serif; font-weight:600; color:var(--ink-soft);
    background: rgba(38,43,37,0.02);
  }
  table.tt td .subject{ font-weight:600; }
  table.tt td .room{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
  table.tt td.free{ color: var(--ink-soft); font-size:12px; }
  table.tt td.free.common{
    background: var(--stamp-strong);
    color: var(--stamp);
    font-weight:600;
  }

  footer{
    margin-top: 20px; font-size:11.5px; color:var(--ink-soft);
    border-top: 1px solid var(--rule); padding-top:14px;
  }

  @media (max-width:560px){
    table.tt td{ font-size:11px; height:46px; padding:5px 3px; }
    table.tt td .room{ font-size:9.5px; }
    table.tt th{ font-size:10.5px; }
  }

  table.tt td.swapCell{ cursor:pointer; }
  table.tt td.swapCell:hover{ background:var(--stamp-soft); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(38,43,37,0.45); z-index:10000; }
  .modal-box{
    position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
    width:min(520px, 92vw); max-height:82vh; display:flex; flex-direction:column;
    background:var(--paper-card); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,0.25);
    z-index:10001;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--rule-soft); }
  .modal-head h3{ font-size:16px; margin:0; }
  .modal-close{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); line-height:1; padding:4px; }
  .modal-body{ padding:16px 20px; overflow-y:auto; flex:1; }
  .swap-candidate{ padding:10px 0; border-bottom:1px dashed var(--rule-soft); }
  .swap-candidate:last-child{ border-bottom:none; }
  .swap-candidate-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .swap-name{ font-weight:700; font-size:14px; }
  .swap-dept{ font-size:11.5px; color:var(--ink-soft); }
  .swap-mutual{ font-size:12.5px; color:var(--stamp); }
  .swap-mutual-none{ color:var(--ink-soft); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <header class="page-head">
      <h1>교사 시간표 조회 · 비교</h1>
      <span class="term">2026학년도 2학기</span>
    </header>

    <div class="picker-block">
      <h2>교사 선택</h2>
      <p class="hint">이름을 입력해 선생님을 추가하세요. 한 명이면 시간표를, 두 명 이상이면 공통으로 비는 시간도 함께 찾아드려요.</p>
      <div class="search-row">
        <input type="text" id="teacherSearch" placeholder="이름 검색 (예: 김경성)" autocomplete="off">
        <div class="suggest-list" id="suggestList"></div>
      </div>
      <div class="chip-row" id="chipRow"></div>
    </div>

    <div id="content"></div>

    <footer>
      빈칸(공강)은 회색으로, 두 명 이상을 선택했을 때 모두가 공통으로 비는 시간은 강조 색으로 표시됩니다. 시간표는 2학기 정규 수업 기준이며 변동 시 원본 시간표를 확인해 주세요.
    </footer>
  </div>

</div>

<div class="modal-overlay" id="swapModalOverlay" style="display:none;"></div>
<div class="modal-box" id="swapModal" style="display:none;">
  <div class="modal-head">
    <h3 id="swapModalTitle"></h3>
    <button type="button" class="modal-close" id="swapModalClose">✕</button>
  </div>
  <div class="modal-body" id="swapModalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const { data: __staffRows } = await sb.from('public_staff').select('name, department, subject, homeroom_room, hours, schedule').not('schedule', 'is', null);
const TEACHERS = (__staffRows || []).map(r => ({ name: r.name, department: r.department, subject: r.subject, homeroom: r.homeroom_room, hours: r.hours, schedule: r.schedule }));

// 금요일 5교시 수업은 실제로 6교시까지 이어지는 2시간 연속 수업이라, 데이터엔 6교시가 비어있어도
// 화면엔 5교시와 같은 내용을 그대로 보여줘요 (공강/공통 공강 계산에도 반영됨).
TEACHERS.forEach(t => {
  const fri = t.schedule && t.schedule['금'];
  if(fri && fri['5'] && !fri['6']) fri['6'] = fri['5'];
});

// 교실 번호(101, 205 등)를 1-1, 2-5 같은 학년-반 표기로 바꿔서 보여줘요.
// "AI교실"처럼 숫자가 아닌 특별실 이름은 그대로 둬요.
function formatRoom(room){
  if(room === null || room === undefined || room === '') return '';
  const n = Number(room);
  if(!Number.isInteger(n) || n < 101 || n > 399 || (n % 100) < 1) return String(room);
  return Math.floor(n / 100) + '-' + (n % 100);
}

const DAYS = ['월','화','수','목','금'];
const PERIODS = [1,2,3,4,5,6,7];

const byName = {};
TEACHERS.forEach(t => byName[t.name] = t);
const allNames = TEACHERS.map(t => t.name).sort((a,b) => a.localeCompare(b, 'ko'));

let selected = [];

const searchInput = document.getElementById('teacherSearch');
const suggestList = document.getElementById('suggestList');
const chipRow = document.getElementById('chipRow');
const content = document.getElementById('content');

function isFree(teacher, day, period){
  const p = teacher.schedule[day] && teacher.schedule[day][String(period)];
  return !p;
}

function renderSuggestions(query){
  const q = query.trim();
  const candidates = allNames
    .filter(n => !selected.includes(n))
    .filter(n => !q || n.includes(q));
  if(candidates.length === 0){
    suggestList.innerHTML = `<div class="suggest-empty">일치하는 선생님이 없습니다.</div>`;
    suggestList.classList.add('open');
    return;
  }
  suggestList.innerHTML = candidates.map(n => {
    const t = byName[n];
    const room = t.homeroom ? formatRoom(t.homeroom) : '';
    return `<div class="suggest-item" data-name="${n}"><span>${n}</span><span class="room">${room}</span></div>`;
  }).join('');
  suggestList.classList.add('open');
}

searchInput.addEventListener('focus', () => renderSuggestions(searchInput.value));
searchInput.addEventListener('input', () => renderSuggestions(searchInput.value));
document.addEventListener('click', (e) => {
  if(!suggestList.contains(e.target) && e.target !== searchInput){
    suggestList.classList.remove('open');
  }
});
suggestList.addEventListener('click', (e) => {
  const item = e.target.closest('.suggest-item');
  if(!item) return;
  const name = item.dataset.name;
  if(name && !selected.includes(name)){
    selected.push(name);
    searchInput.value = '';
    suggestList.classList.remove('open');
    renderAll();
  }
});
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const q = searchInput.value.trim();
    const match = allNames.find(n => n === q) || allNames.find(n => n.includes(q) && !selected.includes(n));
    if(match && !selected.includes(match)){
      selected.push(match);
      searchInput.value = '';
      suggestList.classList.remove('open');
      renderAll();
    }
  }
});

function removeTeacher(name){
  selected = selected.filter(n => n !== name);
  renderAll();
}

function renderChips(){
  if(selected.length === 0){
    chipRow.innerHTML = '';
    return;
  }
  chipRow.innerHTML = selected.map(n =>
    `<span class="chip">${n}<button data-name="${n}" aria-label="제거">×</button></span>`
  ).join('');
  chipRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => removeTeacher(btn.dataset.name));
  });
}

function computeCommonFree(){
  const slots = [];
  DAYS.forEach(day => {
    PERIODS.forEach(period => {
      const allFree = selected.every(n => isFree(byName[n], day, period));
      if(allFree) slots.push({day, period});
    });
  });
  return slots;
}

function renderTimetable(teacher, commonSlotSet){
  let html = `<table class="tt"><thead><tr><th class="period-col">교시</th>`;
  DAYS.forEach(d => html += `<th>${d}</th>`);
  html += `</tr></thead><tbody>`;
  PERIODS.forEach(p => {
    html += `<tr><td class="period-num">${p}</td>`;
    DAYS.forEach(day => {
      const cell = teacher.schedule[day] && teacher.schedule[day][String(p)];
      const isCommon = commonSlotSet.has(day+'-'+p);
      if(cell){
        html += `<td class="swapCell" data-teacher="${teacher.name}" data-day="${day}" data-period="${p}" title="눌러서 이 시간에 교체 가능한 선생님을 찾아요"><div class="subject">${cell.subject || ''}</div>${cell.room ? `<div class="room">${formatRoom(cell.room)}</div>` : ''}</td>`;
      } else {
        html += `<td class="free${isCommon ? ' common' : ''}">${isCommon ? '공통 공강' : '공강'}</td>`;
      }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

// ============ 수업 교체 가능자 찾기 (teacher.html과 동일한 로직) ============
// 자리를 옮기는 게 아니라 "그 시간에 누가 대신 들어가 줄 수 있는지"를 찾는 대체 수업
// 모델이라, 요일·교시 자체는 절대 바뀌지 않아요 — 과목명에 분반 알파벳이 붙어 시간이
// 고정된 수업이어도(letter-suffix 고정 시간 제약) 이 기능엔 영향이 없어요.
// A(targetTeacher)의 자리를 B(candidate)가 대신 맡아줄 때, B에게 곧바로 갚을 시간이
// 없으면(1:1 맞교체 불가) 제3의 선생님 C를 거치는 3자 교체가 되는지 찾아봐요.
function findThreeWayCycle(a, b){
  for(const c of TEACHERS){
    if(c.name === a.name || c.name === b.name) continue;
    let s1 = null;
    outer1:
    for(const d of DAYS){
      for(const p of PERIODS){
        if(!isFree(b, d, p) && isFree(c, d, p)){ s1 = { day: d, period: p }; break outer1; }
      }
    }
    if(!s1) continue;
    let s2 = null;
    outer2:
    for(const d of DAYS){
      for(const p of PERIODS){
        if(!isFree(c, d, p) && isFree(a, d, p)){ s2 = { day: d, period: p }; break outer2; }
      }
    }
    if(!s2) continue;
    return { partner: c.name, coverForB: s1, coverForA: s2 };
  }
  return null;
}

function findSwapCandidates(targetTeacher, day, period){
  return TEACHERS.filter(t => t.name !== targetTeacher.name && isFree(t, day, period))
    .map(t => {
      const mutualSlots = [];
      DAYS.forEach(d => {
        PERIODS.forEach(p => {
          if(!isFree(t, d, p) && isFree(targetTeacher, d, p)) mutualSlots.push({ day: d, period: p });
        });
      });
      const threeWay = mutualSlots.length ? null : findThreeWayCycle(targetTeacher, t);
      return { teacher: t, mutualSlots, threeWay };
    })
    .sort((a, b) => {
      const score = (r) => r.mutualSlots.length ? 2 : (r.threeWay ? 1 : 0);
      const sa = score(a), sb = score(b);
      if(sa !== sb) return sb - sa;
      return a.teacher.name.localeCompare(b.teacher.name, 'ko');
    });
}

function openSwapModal(teacherName, day, period){
  const targetTeacher = byName[teacherName];
  if(!targetTeacher) return;
  const cell = targetTeacher.schedule?.[day]?.[String(period)];
  const results = findSwapCandidates(targetTeacher, day, period);

  document.getElementById('swapModalTitle').textContent = `${targetTeacher.name} 선생님 · ${day}요일 ${period}교시 교체 가능한 선생님`;
  const subjLine = cell
    ? `<div class="empty-note" style="text-align:left; padding:0 0 12px;">현재 수업: ${cell.subject || ''}${formatRoom(cell.room) ? ' (' + formatRoom(cell.room) + ')' : ''}</div>`
    : '';
  const body = results.length ? results.map(r => {
    const deptLine = (r.teacher.department || '') + (r.teacher.subject ? ' · ' + r.teacher.subject : '');
    let mutualHtml;
    if(r.mutualSlots.length){
      mutualHtml = `<div class="swap-mutual">맞교체 가능: ${r.mutualSlots.map(s => `${s.day} ${s.period}교시`).join(', ')}</div>`;
    } else if(r.threeWay){
      const { partner, coverForB, coverForA } = r.threeWay;
      mutualHtml = `<div class="swap-mutual">3자 교체 가능(${partner} 선생님과 함께): ${r.teacher.name} 선생님이 이 시간을 맡고, ${r.teacher.name} 선생님의 ${coverForB.day} ${coverForB.period}교시는 ${partner} 선생님이, ${partner} 선생님의 ${coverForA.day} ${coverForA.period}교시는 선생님이 맡으면 돌아가며 채울 수 있어요.</div>`;
    } else {
      mutualHtml = `<div class="swap-mutual swap-mutual-none">이 시간엔 비어있어요 (맞바꿀 시간은 없어요)</div>`;
    }
    return `
      <div class="swap-candidate">
        <div class="swap-candidate-head"><span class="swap-name">${r.teacher.name}</span><span class="swap-dept">${deptLine}</span></div>
        ${mutualHtml}
      </div>
    `;
  }).join('') : '<div class="empty-note">이 시간에 비어있는 선생님이 없습니다.</div>';

  document.getElementById('swapModalBody').innerHTML = subjLine + body;
  document.getElementById('swapModalOverlay').style.display = 'block';
  document.getElementById('swapModal').style.display = 'flex';
}
function closeSwapModal(){
  document.getElementById('swapModalOverlay').style.display = 'none';
  document.getElementById('swapModal').style.display = 'none';
}
document.getElementById('swapModalOverlay').addEventListener('click', closeSwapModal);
document.getElementById('swapModalClose').addEventListener('click', closeSwapModal);
content.addEventListener('click', (e) => {
  const cell = e.target.closest('.swapCell');
  if(!cell) return;
  openSwapModal(cell.dataset.teacher, cell.dataset.day, Number(cell.dataset.period));
});

function renderAll(){
  renderChips();

  if(selected.length === 0){
    content.innerHTML = `<div class="empty-state">선생님을 선택하면 시간표가 여기 표시됩니다.</div>`;
    return;
  }

  let html = '';
  let commonSlotSet = new Set();

  if(selected.length >= 2){
    const slots = computeCommonFree();
    commonSlotSet = new Set(slots.map(s => s.day+'-'+s.period));
    html += `<div class="common-free">
      <h2>공통 공강 시간</h2>
      <p class="hint">${selected.join(', ')} 선생님 모두가 비어 있는 시간이에요.</p>`;
    if(slots.length === 0){
      html += `<div class="no-common">해당 선생님들이 함께 비는 시간이 없습니다.</div>`;
    } else {
      html += `<div class="free-slot-list">` +
        slots.map(s => `<span class="free-slot">${s.day} ${s.period}교시</span>`).join('') +
        `</div>`;
    }
    html += `</div>`;
  }

  selected.forEach(name => {
    const t = byName[name];
    html += `<div class="teacher-block">
      <div class="th-row">
        <h3>${t.name}</h3>
        <span class="meta">${t.homeroom ? formatRoom(t.homeroom) + ' · ' : ''}주 ${t.hours}시간</span>
      </div>
      ${renderTimetable(t, commonSlotSet)}
    </div>`;
  });

  content.innerHTML = html;
}

renderAll();

// 로그인한 선생님이 있으면 기본으로 본인 시간표를 먼저 보여줘요.
function waitForAuthTeachers(cb){
  if(window.__gsAuth){ cb(); } else { setTimeout(() => waitForAuthTeachers(cb), 150); }
}
waitForAuthTeachers(() => {
  const session = window.__gsAuth.getSession();
  if(session && session.name && byName[session.name] && selected.length === 0){
    selected.push(session.name);
    renderAll();
  }
});
})();
</script>
</body>
</html>
