<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 880px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }

  .btn{
    font-family:'Noto Sans KR', sans-serif; font-size:13.5px; font-weight:700;
    color:#fff; background:var(--ink); border:none; border-radius:6px; padding:9px 14px; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ color:var(--ink); background:none; border:1px solid var(--rule); }
  .btn.small{ font-size:12px; padding:6px 10px; }
  .btn.approve{ background:var(--brass); }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:14px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  #gate{ text-align:center; padding: 60px 0; }
  #gate p{ font-size:13px; color:var(--ink-soft); }
  #appArea{ display:none; }

  #searchInput{ width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--rule); border-radius:6px; margin-bottom:8px; }
  .count-line{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  .member-row{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:12px 16px; margin-bottom:8px; }
  .member-head{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .member-head .mname{ font-size:14.5px; font-weight:700; flex:1; }
  .badge{ font-size:10.5px; border-radius:10px; padding:2px 9px; white-space:nowrap; }
  .badge.pending{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .badge.approved{ background:var(--brass-soft); color:var(--brass); }
  .badge.admin{ background:var(--stamp-soft); color:var(--stamp); }
  .member-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; padding-left:2px; }

  .member-detail{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--rule-soft); }
  .field-label{ font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .field-input{ width:100%; font-size:13px; padding:7px 9px; border:1px solid var(--rule); border-radius:5px; font-family:inherit; }
  .field-row-2{ display:flex; gap:8px; margin-bottom:9px; }
  .field-row-2 > div{ flex:1; }
  .field-row{ margin-bottom:9px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <p id="gateMsg">확인 중…</p>
    <a class="btn" href="./login.html" id="gateLoginLink" style="display:none; text-decoration:none;">로그인하러 가기</a>
  </div>

  <div id="appArea">
    <a class="back" href="./admin-tools.html">← 교무 업무 도구</a>
    <h1>회원 관리</h1>
    <div class="sub">가입한 선생님 목록을 확인하고, 정보를 수정하거나 승인할 수 있어요.</div>
    <div id="listMsg"></div>
    <input type="text" id="searchInput" placeholder="이름으로 검색">
    <div class="count-line" id="countLine"></div>
    <div id="memberList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function el(id){ return document.getElementById(id); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    el('gateMsg').textContent = '로그인이 필요합니다.';
    el('gateLoginLink').style.display = 'inline-block';
    return;
  }
  const { data: myProfile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if(!myProfile || !myProfile.is_admin){
    el('gateMsg').textContent = '관리자 계정만 접근할 수 있어요.';
    return;
  }
  el('gate').style.display = 'none';
  el('appArea').style.display = 'block';

  let members = [];
  let expandedId = null;
  let searchQuery = '';

  async function loadMembers(){
    const { data, error } = await sb.from('profiles').select('*').order('approved', { ascending: true }).order('name');
    if(error){ setMsg('listMsg', '불러오지 못했습니다: ' + error.message, 'error'); return; }
    members = data || [];
    renderList();
  }

  function renderList(){
    const q = searchQuery.trim();
    const items = members.filter(m => !q || (m.name || '').includes(q));
    const pendingCount = members.filter(m => !m.approved).length;
    el('countLine').textContent = `전체 ${members.length}명 · 승인 대기 ${pendingCount}명`;

    if(!items.length){ el('memberList').innerHTML = '<p class="hint">회원이 없습니다.</p>'; return; }
    el('memberList').innerHTML = items.map(m => {
      const badges = [
        m.approved ? '<span class="badge approved">승인됨</span>' : '<span class="badge pending">승인 대기</span>',
        m.is_admin ? '<span class="badge admin">관리자</span>' : ''
      ].filter(Boolean).join(' ');
      const metaBits = [m.department, m.subject, m.is_homeroom ? '담임' + (m.homeroom_class ? '(' + m.homeroom_class + ')' : '') : ''].filter(Boolean).join(' · ');
      const isOpen = expandedId === m.id;
      return `
        <div class="member-row" data-id="${m.id}">
          <div class="member-head memberToggle" data-id="${m.id}">
            <span class="mname">${escapeHtml(m.name || '(이름 없음)')}</span>
            ${badges}
            ${!m.approved ? `<button type="button" class="btn approve small quickApprove" data-id="${m.id}">승인</button>` : ''}
          </div>
          ${metaBits ? `<div class="member-meta">${escapeHtml(metaBits)}</div>` : ''}
          <div class="member-detail" style="display:${isOpen ? 'block' : 'none'};" data-detail-for="${m.id}"></div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.memberToggle').forEach(row => row.addEventListener('click', (e) => {
      if(e.target.closest('.quickApprove')) return;
      const id = e.currentTarget.dataset.id;
      expandedId = (expandedId === id) ? null : id;
      renderList();
      if(expandedId) renderDetail(expandedId);
    }));
    document.querySelectorAll('.quickApprove').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const { error } = await sb.from('profiles').update({ approved: true }).eq('id', id);
      if(error){ setMsg('listMsg', '승인 실패: ' + error.message, 'error'); return; }
      setMsg('listMsg', '승인했습니다.', 'success');
      await loadMembers();
    }));
    if(expandedId) renderDetail(expandedId);
  }

  function renderDetail(id){
    const m = members.find(x => x.id === id);
    const container = document.querySelector(`[data-detail-for="${id}"]`);
    if(!m || !container) return;
    container.innerHTML = `
      <div class="field-row"><label class="field-label">이메일</label><input class="field-input dEmail" value="${escapeHtml(m.email || '')}"></div>
      <div class="field-row-2">
        <div><label class="field-label">전화번호</label><input class="field-input dPhone" value="${escapeHtml(m.phone || '')}"></div>
        <div><label class="field-label">내선번호</label><input class="field-input dExtension" value="${escapeHtml(m.extension || '')}"></div>
      </div>
      <div class="field-row-2">
        <div><label class="field-label">부서</label><input class="field-input dDepartment" value="${escapeHtml(m.department || '')}"></div>
        <div><label class="field-label">교과</label><input class="field-input dSubject" value="${escapeHtml(m.subject || '')}"></div>
      </div>
      <div class="field-row">
        <label style="font-size:12px; display:flex; align-items:center; gap:6px; margin-bottom:6px;">
          <input type="checkbox" class="dIsHomeroom" ${m.is_homeroom ? 'checked' : ''}> 담임을 맡고 있어요
        </label>
        <input class="field-input dHomeroomClass" placeholder="담임반" value="${escapeHtml(m.homeroom_class || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">교직원 명부 연결(staff_name)</label>
        <input class="field-input dStaffName" value="${escapeHtml(m.staff_name || '')}">
      </div>
      <div class="field-row" style="display:flex; gap:16px;">
        <label style="font-size:12.5px; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" class="dApproved" ${m.approved ? 'checked' : ''}> 승인됨
        </label>
        <label style="font-size:12.5px; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" class="dIsAdmin" ${m.is_admin ? 'checked' : ''}> 관리자
        </label>
      </div>
      <button type="button" class="btn small dSave">저장</button>
      <button type="button" class="btn secondary small dCancel">닫기</button>
    `;
    container.querySelector('.dCancel').addEventListener('click', () => { expandedId = null; renderList(); });
    container.querySelector('.dSave').addEventListener('click', async () => {
      const payload = {
        email: container.querySelector('.dEmail').value.trim() || null,
        phone: container.querySelector('.dPhone').value.trim() || null,
        extension: container.querySelector('.dExtension').value.trim() || null,
        department: container.querySelector('.dDepartment').value.trim() || null,
        subject: container.querySelector('.dSubject').value.trim() || null,
        is_homeroom: container.querySelector('.dIsHomeroom').checked,
        homeroom_class: container.querySelector('.dHomeroomClass').value.trim() || null,
        staff_name: container.querySelector('.dStaffName').value.trim() || null,
        approved: container.querySelector('.dApproved').checked,
        is_admin: container.querySelector('.dIsAdmin').checked,
        updated_at: new Date().toISOString()
      };
      const { error } = await sb.from('profiles').update(payload).eq('id', id);
      if(error){ setMsg('listMsg', '저장 실패: ' + error.message, 'error'); return; }
      setMsg('listMsg', '저장했습니다.', 'success');
      expandedId = null;
      await loadMembers();
    });
  }

  el('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; renderList(); });

  loadMembers();
})();
</script>
</body>
</html>
