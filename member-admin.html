<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F6F3EC; --paper-card: #FFFFFF; --ink: #1C2230; --ink-soft: #5B6170;
    --rule: #DCD6C8; --rule-soft: #EFEAE0; --stamp: #23407A; --stamp-soft: rgba(35,64,122,0.08);
    --crest-red: #B8432F; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow-x:hidden; }
  body{ background: var(--paper); color: var(--ink); font-family:'IBM Plex Sans KR', system-ui, sans-serif; line-height:1.5; }
  .wrap{ max-width: 880px; margin:0 auto; padding: 40px 20px 80px; min-width:0; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-family:'Gowun Batang', serif; font-weight:700; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; word-break:keep-all; overflow-wrap:break-word; }

  .btn{
    font-family:'IBM Plex Sans KR', system-ui, sans-serif; font-size:13.5px; font-weight:700;
    color:#fff; background:var(--ink); border:none; border-radius:6px; padding:9px 14px; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ color:var(--ink); background:none; border:1px solid var(--rule); }
  .btn.small{ font-size:12px; padding:6px 10px; }
  .btn.approve{ background:var(--brass); }
  .btn.danger{ background:var(--crest-red); }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:14px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  #gate{ text-align:center; padding: 60px 0; }
  #gate p{ font-size:13px; color:var(--ink-soft); }
  #appArea{ display:none; }

  .toolbar-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  #searchInput{ flex:1; min-width:160px; font-size:14px; padding:9px 11px; border:1px solid var(--rule); border-radius:6px; }
  .count-line{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
  .bulk-bar{ display:none; align-items:center; gap:8px; background:var(--stamp-soft); border-radius:6px; padding:8px 12px; margin-bottom:10px; font-size:12.5px; }
  .bulk-bar.show{ display:flex; flex-wrap:wrap; }

  #addForm{ display:none; background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:16px 18px; margin-bottom:14px; }
  .field-label{ font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .field-input{ width:100%; font-size:13px; padding:7px 9px; border:1px solid var(--rule); border-radius:5px; font-family:inherit; }
  .field-row-2{ display:flex; gap:8px; margin-bottom:9px; }
  .field-row-2 > div{ flex:1; }
  .field-row{ margin-bottom:9px; }

  .select-all-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }

  .member-row{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:12px 16px; margin-bottom:8px; min-width:0; }
  .member-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .member-head .mname{ font-size:14.5px; font-weight:700; flex:1; cursor:pointer; min-width:80px; word-break:break-word; }
  .badge{ font-size:10.5px; border-radius:10px; padding:2px 9px; white-space:nowrap; }
  .badge.pending{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .badge.approved{ background:var(--brass-soft); color:var(--brass); }
  .badge.admin{ background:var(--stamp-soft); color:var(--stamp); }
  .badge.google{ background:var(--stamp-soft); color:var(--stamp); }
  .member-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; padding-left:2px; }

  .member-detail{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--rule-soft); }

  .pager{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <p id="gateMsg">확인 중…</p>
    <a class="btn" href="./login.html" id="gateLoginLink" style="display:none; text-decoration:none;">로그인하러 가기</a>
  </div>

  <div id="appArea">
    <a class="back" href="./admin-tools.html">← 교무 업무 도구</a>
    <h1>회원 관리</h1>
    <div class="sub">가입한 선생님 목록을 확인하고, 정보를 수정하거나 승인·삭제·등록할 수 있어요.</div>
    <div id="listMsg"></div>

    <div class="toolbar-row">
      <input type="text" id="searchInput" placeholder="이름으로 검색">
      <button type="button" class="btn secondary small" id="btnToggleAdd">+ 새 회원 등록</button>
    </div>

    <div id="addForm">
      <div class="field-row-2">
        <div><label class="field-label">이름 (로그인 아이디)</label><input class="field-input" id="addName"></div>
        <div><label class="field-label">초기비밀번호 (선택)</label><input class="field-input" id="addPassword" placeholder="비우면 자동 생성"></div>
      </div>
      <div class="field-row-2">
        <div><label class="field-label">이메일 (선택)</label><input class="field-input" id="addEmail"></div>
        <div><label class="field-label">전화번호</label><input class="field-input" id="addPhone"></div>
      </div>
      <div class="field-row-2">
        <div><label class="field-label">내선번호</label><input class="field-input" id="addExtension"></div>
        <div><label class="field-label">부서</label><input class="field-input" id="addDepartment"></div>
      </div>
      <div class="field-row-2">
        <div><label class="field-label">교과</label><input class="field-input" id="addSubject"></div>
        <div><label class="field-label">담임반</label><input class="field-input" id="addHomeroomClass"></div>
      </div>
      <div class="field-row">
        <label style="font-size:12px; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="addIsHomeroom"> 담임을 맡고 있어요
        </label>
      </div>
      <button type="button" class="btn small" id="btnAddSubmit">등록하기</button>
      <button type="button" class="btn secondary small" id="btnAddCancel">취소</button>
    </div>

    <div class="count-line" id="countLine"></div>
    <div class="bulk-bar" id="bulkBar">
      <span id="bulkCount"></span>
      <button type="button" class="btn approve small" id="btnBulkApprove">선택 일괄 승인</button>
      <button type="button" class="btn danger small" id="btnBulkDelete">선택 일괄 삭제</button>
    </div>
    <div class="select-all-row">
      <input type="checkbox" id="selectAll"> 전체 선택 (이 페이지)
    </div>
    <div class="toolbar-row" style="margin-bottom:10px;">
      <select class="field-input" id="groupKind" style="max-width:100px;">
        <option value="department">부서</option>
        <option value="subject">교과</option>
        <option value="grade">학년</option>
      </select>
      <select class="field-input" id="groupValue" style="max-width:160px;"></select>
      <button type="button" class="btn secondary small" id="btnGroupSelect">그룹으로 선택</button>
    </div>
    <div id="memberList"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const PAGE_SIZE = 20;

  function el(id){ return document.getElementById(id); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    el('gateMsg').textContent = '로그인이 필요합니다.';
    el('gateLoginLink').style.display = 'inline-block';
    return;
  }
  const { data: myProfile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if(!myProfile || !myProfile.is_admin){
    el('gateMsg').textContent = '관리자 계정만 접근할 수 있어요.';
    return;
  }
  el('gate').style.display = 'none';
  el('appArea').style.display = 'block';

  let members = [];
  let expandedId = null;
  let searchQuery = '';
  let currentPage = 1;
  let selected = new Set();
  let authInfoMap = {};

  async function loadMembers(){
    const { data, error } = await sb.from('profiles').select('*').order('approved', { ascending: true }).order('name');
    if(error){ setMsg('listMsg', '불러오지 못했습니다: ' + error.message, 'error'); return; }
    members = data || [];
    renderList();
    renderGroupValueOptions();
  }

  async function loadAuthInfo(){
    const { data, error } = await sb.functions.invoke('member-auth-info', {});
    if(error || !data || data.ok === false) return; // 표시만 못 할 뿐, 나머지 화면은 정상 동작해야 해서 조용히 무시
    authInfoMap = data.users || {};
  }

  // 개인별로 하나씩 체크하는 대신, 부서·교과·학년 그룹을 골라 한 번에 선택할 수 있게 해줘요.
  function memberGroupValues(kind){
    const set = new Set();
    members.forEach(m => {
      if(kind === 'department' && m.department) set.add(m.department);
      else if(kind === 'subject' && m.subject) set.add(m.subject);
      else if(kind === 'grade' && m.is_homeroom && m.homeroom_class){
        const g = m.homeroom_class.match(/^(\d+)학년/);
        if(g) set.add(g[1] + '학년');
      }
    });
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ko'));
  }
  function memberIdsInGroup(kind, value){
    return members.filter(m => {
      if(kind === 'department') return m.department === value;
      if(kind === 'subject') return m.subject === value;
      if(kind === 'grade'){
        if(!m.is_homeroom || !m.homeroom_class) return false;
        const g = m.homeroom_class.match(/^(\d+)학년/);
        return g && (g[1] + '학년') === value;
      }
      return false;
    }).map(m => m.id);
  }
  function renderGroupValueOptions(){
    const kind = el('groupKind').value;
    const values = memberGroupValues(kind);
    el('groupValue').innerHTML = values.length
      ? values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('')
      : '<option value="">(그룹 없음)</option>';
  }

  function filteredMembers(){
    const q = searchQuery.trim();
    return members.filter(m => !q || (m.name || '').includes(q));
  }

  function renderList(){
    const all = filteredMembers();
    const pendingCount = members.filter(m => !m.approved).length;
    el('countLine').textContent = `전체 ${members.length}명 · 승인 대기 ${pendingCount}명`;

    const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if(currentPage > totalPages) currentPage = totalPages;
    const items = all.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    if(!items.length){ el('memberList').innerHTML = '<p class="hint">회원이 없습니다.</p>'; }
    else{
      el('memberList').innerHTML = items.map(m => {
        const authInfo = authInfoMap[m.id];
        const badges = [
          m.approved ? '<span class="badge approved">승인됨</span>' : '<span class="badge pending">승인 대기</span>',
          m.is_admin ? '<span class="badge admin">관리자</span>' : '',
          authInfo && authInfo.hasGoogle ? '<span class="badge google">구글 연동</span>' : ''
        ].filter(Boolean).join(' ');
        const metaBits = [m.department, m.subject, m.is_homeroom ? '담임' + (m.homeroom_class ? '(' + m.homeroom_class + ')' : '') : ''].filter(Boolean).join(' · ');
        const isOpen = expandedId === m.id;
        return `
          <div class="member-row" data-id="${m.id}">
            <div class="member-head">
              <input type="checkbox" class="rowChk" data-id="${m.id}" ${selected.has(m.id) ? 'checked' : ''}>
              <span class="mname memberToggle" data-id="${m.id}">${escapeHtml(m.name || '(이름 없음)')}</span>
              ${badges}
              ${!m.approved ? `<button type="button" class="btn approve small quickApprove" data-id="${m.id}">승인</button>` : ''}
              <button type="button" class="btn danger small quickDelete" data-id="${m.id}">삭제</button>
            </div>
            ${metaBits ? `<div class="member-meta">${escapeHtml(metaBits)}</div>` : ''}
            <div class="member-detail" style="display:${isOpen ? 'block' : 'none'};" data-detail-for="${m.id}"></div>
          </div>
        `;
      }).join('');
    }

    el('pager').innerHTML = totalPages > 1 ? `
      <button type="button" class="btn secondary small" id="btnPrevPage" ${currentPage <= 1 ? 'disabled' : ''}>이전</button>
      <span>${currentPage} / ${totalPages}</span>
      <button type="button" class="btn secondary small" id="btnNextPage" ${currentPage >= totalPages ? 'disabled' : ''}>다음</button>
    ` : '';

    wireRowEvents();
    updateBulkBar();
    if(expandedId) renderDetail(expandedId);

    const prevBtn = el('btnPrevPage'); if(prevBtn) prevBtn.addEventListener('click', () => { currentPage--; renderList(); });
    const nextBtn = el('btnNextPage'); if(nextBtn) nextBtn.addEventListener('click', () => { currentPage++; renderList(); });
  }

  function updateBulkBar(){
    const bar = el('bulkBar');
    if(selected.size > 0){
      bar.classList.add('show');
      el('bulkCount').textContent = `${selected.size}명 선택됨`;
    } else {
      bar.classList.remove('show');
    }
    const visibleIds = filteredMembers().slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE).map(m => m.id);
    el('selectAll').checked = visibleIds.length > 0 && visibleIds.every(id => selected.has(id));
  }

  function wireRowEvents(){
    document.querySelectorAll('.rowChk').forEach(chk => chk.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      if(e.target.checked) selected.add(id); else selected.delete(id);
      updateBulkBar();
    }));
    document.querySelectorAll('.memberToggle').forEach(span => span.addEventListener('click', (e) => {
      const id = e.target.dataset.id;
      expandedId = (expandedId === id) ? null : id;
      renderList();
    }));
    document.querySelectorAll('.quickApprove').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const { error } = await sb.from('profiles').update({ approved: true }).eq('id', id);
      if(error){ setMsg('listMsg', '승인 실패: ' + error.message, 'error'); return; }
      setMsg('listMsg', '승인했습니다.', 'success');
      await loadMembers();
    }));
    document.querySelectorAll('.quickDelete').forEach(btn => btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const m = members.find(x => x.id === id);
      if(!confirm(`${m ? m.name : '이 회원'}을(를) 삭제할까요? 되돌릴 수 없습니다.`)) return;
      await deleteMembers([id]);
    }));
  }

  async function deleteMembers(ids){
    const { data, error } = await sb.functions.invoke('delete-member', { body: { ids } });
    if(error){ setMsg('listMsg', '삭제 중 오류가 발생했습니다: ' + error.message, 'error'); return; }
    if(data && data.ok === false){ setMsg('listMsg', '삭제 실패: ' + data.error, 'error'); return; }
    const failed = (data.results || []).filter(r => !r.ok);
    if(failed.length){ setMsg('listMsg', `${failed.length}건 삭제 실패: ` + failed.map(f => f.error).join(', '), 'error'); }
    else { setMsg('listMsg', '삭제했습니다.', 'success'); }
    ids.forEach(id => selected.delete(id));
    await loadMembers();
  }

  el('selectAll').addEventListener('change', (e) => {
    const visibleIds = filteredMembers().slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE).map(m => m.id);
    if(e.target.checked) visibleIds.forEach(id => selected.add(id));
    else visibleIds.forEach(id => selected.delete(id));
    renderList();
  });

  el('groupKind').addEventListener('change', renderGroupValueOptions);
  el('btnGroupSelect').addEventListener('click', () => {
    const kind = el('groupKind').value;
    const value = el('groupValue').value;
    if(!value){ setMsg('listMsg', '선택할 그룹이 없습니다.', 'error'); return; }
    const ids = memberIdsInGroup(kind, value);
    ids.forEach(id => selected.add(id));
    setMsg('listMsg', `${ids.length}명을 선택 목록에 추가했습니다.`, 'success');
    renderList();
  });

  el('btnBulkApprove').addEventListener('click', async () => {
    const ids = Array.from(selected);
    if(!ids.length) return;
    const { error } = await sb.from('profiles').update({ approved: true }).in('id', ids);
    if(error){ setMsg('listMsg', '일괄 승인 실패: ' + error.message, 'error'); return; }
    setMsg('listMsg', `${ids.length}명 승인했습니다.`, 'success');
    selected.clear();
    await loadMembers();
  });
  el('btnBulkDelete').addEventListener('click', async () => {
    const ids = Array.from(selected);
    if(!ids.length) return;
    if(!confirm(`선택한 ${ids.length}명을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    await deleteMembers(ids);
  });

  function renderDetail(id){
    const m = members.find(x => x.id === id);
    const container = document.querySelector(`[data-detail-for="${id}"]`);
    if(!m || !container) return;
    const authInfo = authInfoMap[id];
    const googleLine = authInfo && authInfo.hasGoogle
      ? `연동됨 (${escapeHtml(authInfo.googleEmail || '')})`
      : '연동 안 됨';
    container.innerHTML = `
      <div class="field-row"><label class="field-label">연동된 구글 계정</label><div class="hint" style="margin-top:2px;">${googleLine}</div></div>
      <div class="field-row"><label class="field-label">이메일</label><input class="field-input dEmail" value="${escapeHtml(m.email || '')}"></div>
      <div class="field-row-2">
        <div><label class="field-label">전화번호</label><input class="field-input dPhone" value="${escapeHtml(m.phone || '')}"></div>
        <div><label class="field-label">내선번호</label><input class="field-input dExtension" value="${escapeHtml(m.extension || '')}"></div>
      </div>
      <div class="field-row-2">
        <div><label class="field-label">부서</label><input class="field-input dDepartment" value="${escapeHtml(m.department || '')}"></div>
        <div><label class="field-label">교과</label><input class="field-input dSubject" value="${escapeHtml(m.subject || '')}"></div>
      </div>
      <div class="field-row">
        <label style="font-size:12px; display:flex; align-items:center; gap:6px; margin-bottom:6px;">
          <input type="checkbox" class="dIsHomeroom" ${m.is_homeroom ? 'checked' : ''}> 담임을 맡고 있어요
        </label>
        <input class="field-input dHomeroomClass" placeholder="담임반" value="${escapeHtml(m.homeroom_class || '')}">
      </div>
      <div class="field-row" style="display:flex; gap:16px;">
        <label style="font-size:12.5px; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" class="dApproved" ${m.approved ? 'checked' : ''}> 승인됨
        </label>
        <label style="font-size:12.5px; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" class="dIsAdmin" ${m.is_admin ? 'checked' : ''}> 관리자
        </label>
      </div>
      <button type="button" class="btn small dSave">저장</button>
      <button type="button" class="btn secondary small dCancel">닫기</button>
      ${id !== session.user.id ? `<button type="button" class="btn secondary small dImpersonate" style="margin-left:6px;">이 계정으로 로그인</button>` : ''}
      <div class="field-row" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line, #ddd);">
        <label class="field-label">비밀번호 재설정</label>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <input class="field-input dNewPassword" placeholder="새 비밀번호 (비워두면 임시 비밀번호 자동 생성)" style="flex:1; min-width:200px;">
          <button type="button" class="btn secondary small dResetPassword">비밀번호 재설정</button>
        </div>
        <div class="hint dResetResult" style="margin-top:6px;"></div>
      </div>
    `;
    container.querySelector('.dCancel').addEventListener('click', () => { expandedId = null; renderList(); });
    container.querySelector('.dResetPassword').addEventListener('click', async () => {
      const newPassword = container.querySelector('.dNewPassword').value.trim();
      if(newPassword && newPassword.length < 6){ setMsg('listMsg', '비밀번호는 6자 이상이어야 합니다.', 'error'); return; }
      if(!confirm(`${m.name || '이 회원'}의 비밀번호를 재설정할까요?`)) return;
      const { data, error } = await sb.functions.invoke('reset-member-password', { body: { targetUserId: id, newPassword: newPassword || undefined } });
      if(error){ setMsg('listMsg', '비밀번호 재설정 실패: ' + error.message, 'error'); return; }
      if(!data || data.ok === false){ setMsg('listMsg', '비밀번호 재설정 실패: ' + (data && data.error ? data.error : '알 수 없는 오류'), 'error'); return; }
      const resultEl = container.querySelector('.dResetResult');
      if(resultEl) resultEl.textContent = `새 비밀번호: ${data.password}`;
      container.querySelector('.dNewPassword').value = '';
      setMsg('listMsg', '비밀번호를 재설정했습니다.', 'success');
    });
    const impersonateBtn = container.querySelector('.dImpersonate');
    if(impersonateBtn) impersonateBtn.addEventListener('click', async () => {
      if(!confirm(`${m.name || '이 회원'} 계정으로 로그인할까요?\n\n지금 로그인된 관리자 세션이 이 계정으로 바뀝니다. 다시 관리자로 돌아오려면 로그아웃 후 관리자 계정으로 다시 로그인해야 해요.`)) return;
      setMsg('listMsg', '전환하는 중…', '');
      const { data, error } = await sb.functions.invoke('impersonate-user', { body: { targetUserId: id } });
      if(error){ setMsg('listMsg', '전환 실패: ' + error.message, 'error'); return; }
      if(!data || data.ok === false){ setMsg('listMsg', '전환 실패: ' + (data && data.error ? data.error : '알 수 없는 오류'), 'error'); return; }
      // generateLink()가 돌려주는 hashed_token은 이메일 OTP 코드가 아니라 "토큰 해시"라서,
      // { email, token } 조합이 아니라 { token_hash } 로 넘겨야 검증이 돼요. 예전 코드는
      // { email, token: hashed_token }으로 보내고 있었는데, verifyOtp는 이 조합을 6자리
      // 이메일 OTP 코드로 취급해서 항상 검증에 실패했던 게 "로그인이 안 되는" 원인이었어요.
      const { error: otpErr } = await sb.auth.verifyOtp({ token_hash: data.hashed_token, type: 'magiclink' });
      if(otpErr){ setMsg('listMsg', '전환 실패: ' + otpErr.message, 'error'); return; }
      location.href = './my-page.html';
    });
    container.querySelector('.dSave').addEventListener('click', async () => {
      const payload = {
        email: container.querySelector('.dEmail').value.trim() || null,
        phone: container.querySelector('.dPhone').value.trim() || null,
        extension: container.querySelector('.dExtension').value.trim() || null,
        department: container.querySelector('.dDepartment').value.trim() || null,
        subject: container.querySelector('.dSubject').value.trim() || null,
        is_homeroom: container.querySelector('.dIsHomeroom').checked,
        homeroom_class: container.querySelector('.dHomeroomClass').value.trim() || null,
        approved: container.querySelector('.dApproved').checked,
        is_admin: container.querySelector('.dIsAdmin').checked,
        updated_at: new Date().toISOString()
      };
      const { error } = await sb.from('profiles').update(payload).eq('id', id);
      if(error){ setMsg('listMsg', '저장 실패: ' + error.message, 'error'); return; }
      setMsg('listMsg', '저장했습니다.', 'success');
      expandedId = null;
      await loadMembers();
    });
  }

  el('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; currentPage = 1; renderList(); });

  el('btnToggleAdd').addEventListener('click', () => {
    const opening = getComputedStyle(el('addForm')).display === 'none';
    el('addForm').style.display = opening ? 'block' : 'none';
    if(opening){
      ['addName','addPassword','addEmail','addPhone','addExtension','addDepartment','addSubject','addHomeroomClass'].forEach(id => el(id).value = '');
      el('addIsHomeroom').checked = false;
    }
  });
  el('btnAddCancel').addEventListener('click', () => { el('addForm').style.display = 'none'; });
  el('btnAddSubmit').addEventListener('click', async () => {
    const name = el('addName').value.trim();
    if(!name){ setMsg('listMsg', '이름을 입력해주세요.', 'error'); return; }
    const row = {
      name,
      password: el('addPassword').value.trim(),
      email: el('addEmail').value.trim(),
      phone: el('addPhone').value.trim(),
      extension: el('addExtension').value.trim(),
      department: el('addDepartment').value.trim(),
      subject: el('addSubject').value.trim(),
      is_homeroom: el('addIsHomeroom').checked,
      homeroom_class: el('addHomeroomClass').value.trim()
    };
    const { data, error } = await sb.functions.invoke('bulk-register-users', { body: { rows: [row] } });
    if(error){ setMsg('listMsg', '등록 중 오류가 발생했습니다: ' + error.message, 'error'); return; }
    const result = data && data.results && data.results[0];
    if(!result || !result.ok){ setMsg('listMsg', '등록 실패: ' + (result ? result.error : '알 수 없는 오류'), 'error'); return; }
    setMsg('listMsg', `등록했습니다. 초기비밀번호: ${result.password}`, 'success');
    el('addForm').style.display = 'none';
    await loadMembers();
  });

  loadMembers();
  loadAuthInfo().then(() => renderList());
})();
</script>
</body>
</html>
