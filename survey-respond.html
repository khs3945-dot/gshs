<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설문 응답 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<meta name="robots" content="noindex">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 860px; margin:0 auto; padding: 36px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:14.3px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-weight:700; font-size:23.8px; margin:0 0 6px; }
  .sub{ font-size:14.8px; color:var(--ink-soft); margin-bottom:24px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .card h2{ font-size:16.8px; margin:0; color:var(--stamp); }
  .hint{ font-size:13.3px; color:var(--ink-soft); margin:0 0 12px; }

  .btn{ font-family:inherit; font-size:14.8px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:6px; padding:8px 14px; cursor:pointer; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ color:var(--ink); background:#fff; border:1px solid var(--rule); }
  .btn.small{ font-size:13.3px; padding:6px 10px; }
  .btn.danger{ color:#fff; background:var(--crest-red); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .msg{ font-size:14.3px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:13.3px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type=text], .field input[type=date], .field input[type=datetime-local], .field textarea{
    font-family:inherit; font-size:15.3px; padding:9px 11px; border:1px solid var(--rule); border-radius:6px; width:100%; resize:vertical;
  }
  .field textarea{ min-height:70px; }
  .field .check-row{ display:flex; align-items:center; gap:7px; font-size:14.3px; }
  .period-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .period-row input[type=datetime-local]{ flex:1 1 200px; width:auto; min-width:0; }
  .period-sep{ color:var(--ink-soft); font-weight:700; flex-shrink:0; }

  .q-block{ border:1px solid var(--rule-soft); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--paper); }
  .q-block-head{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .q-block-head input[type=text]{ flex:1; font-weight:700; }
  .q-block select{ font-family:inherit; font-size:13.8px; padding:6px 8px; border:1px solid var(--rule); border-radius:6px; background:#fff; }
  .q-options textarea{ min-height:60px; font-size:14.3px; }
  .q-options-hint{ font-size:12.3px; color:var(--ink-soft); margin:4px 0; }
  .q-required-row{ display:flex; align-items:center; gap:6px; font-size:13.3px; color:var(--ink-soft); margin-top:6px; }

  .survey-item{ border-bottom:1px solid var(--rule-soft); padding:14px 2px; }
  .survey-item:last-child{ border-bottom:none; }
  .survey-item-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; justify-content:space-between; }
  .survey-item-title{ font-weight:700; font-size:16.3px; color:var(--stamp); word-break:break-word; }
  .survey-badge{ font-size:12.3px; border-radius:9px; padding:2px 9px; white-space:nowrap; font-weight:700; }
  .survey-badge.open{ background:var(--brass-soft); color:var(--brass); }
  .survey-badge.closed{ background:rgba(110,98,52,0.15); color:var(--ink-soft); }
  .survey-badge.scheduled{ background:var(--stamp-soft); color:var(--stamp); }
  .survey-item-meta{ font-size:12.8px; color:var(--ink-soft); margin:4px 0 10px; }
  .survey-item-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .survey-results{ display:none; margin-top:10px; padding:12px; background:var(--paper); border:1px solid var(--rule-soft); border-radius:8px; }
  .survey-results.open{ display:block; }

  .result-q{ margin-bottom:16px; }
  .result-q:last-child{ margin-bottom:0; }
  .result-q-label{ font-weight:700; font-size:14.3px; margin-bottom:6px; }
  .result-opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:13.3px; }
  .result-opt-label{ flex:0 0 120px; max-width:120px; word-break:break-word; }
  .result-bar-wrap{ flex:1; height:9px; background:var(--rule-soft); border-radius:5px; overflow:hidden; }
  .result-bar{ height:100%; background:var(--stamp); border-radius:5px; }
  .result-opt-count{ flex:0 0 auto; font-size:12.3px; color:var(--ink-soft); white-space:nowrap; }
  .result-text-item{ font-size:13.8px; padding:7px 9px; background:#fff; border:1px solid var(--rule-soft); border-radius:6px; margin-bottom:5px; white-space:pre-wrap; }
  .result-text-item a{ color:var(--stamp); text-decoration:underline; }
  .result-empty{ font-size:13.3px; color:var(--ink-soft); }
  .pub-viewer-btns{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .pub-viewer{ margin-bottom:12px; }
  .pub-viewer:empty{ display:none; }
  .target-status{ margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft); }
  .target-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .target-chip{ font-size:12.5px; border-radius:999px; padding:2px 9px; }
  .target-chip.done{ background:rgba(22,163,74,0.10); color:#15803d; }
  .target-chip.todo{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .result-names{ font-size:12.8px; color:var(--ink-soft); margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft); }

  /* ---- 공개 응답 화면 ---- */
  .q-fill{ margin-bottom:18px; }
  .q-fill-label{ font-weight:700; font-size:15.3px; margin-bottom:8px; }
  .q-fill-label .req{ color:var(--crest-red); margin-left:3px; }
  .q-fill-opt{ display:flex; align-items:center; gap:8px; font-size:14.8px; padding:7px 0; }
  .q-fill-opt input{ width:16px; height:16px; flex-shrink:0; }
  .q-fill textarea{ font-family:inherit; font-size:15.3px; padding:9px 11px; border:1px solid var(--rule); border-radius:6px; width:100%; min-height:90px; resize:vertical; }
  .q-fill input[type=file]{ font-family:inherit; font-size:14.3px; width:100%; }
  .closed-note, .thanks-note{ font-size:15.3px; color:var(--ink-soft); text-align:center; padding:30px 10px; }
  .thanks-note .big{ font-size:19.3px; font-weight:700; color:var(--stamp); margin-bottom:8px; }

  .copy-link-box{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .copy-link-box input{ flex:1; min-width:160px; font-family:inherit; font-size:13.8px; padding:7px 9px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink-soft); }
  .named-group{ padding:6px 0; border-bottom:1px dashed var(--rule-soft); }
  .named-group:last-child{ border-bottom:0; }
  .named-opt{ font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .named-count{ font-weight:600; color:var(--ink-soft); font-size:12.5px; margin-left:4px; }
  .target-pick-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; }
  .target-pick-row select, .target-pick-row input{ padding:5px 8px; border:1px solid var(--rule, #ccc); border-radius:6px; font:inherit; font-size:14px; min-width:0; }
  .field .target-pick-row input{ width:auto; flex:1 1 8em; }
  .field .target-pick-row select{ width:auto; }
  .respondent-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .respondent-row .field{ flex:1 1 140px; min-width:0; }
</style>
<style>
  /* 학생·학부모용 독립 응답 페이지 — 메뉴·로그인 배지 없음(학생 챗봇 bot.html처럼 학생용 도메인에서 연다) */
  body{ font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif; }
  .wrap{ padding-top:24px; }
  .respond-foot{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="publicView" style="display:none;">
    <div class="card" id="publicCard">
      <div id="publicBody"></div>
    </div>
  </div>
  <div class="respond-foot">경성고등학교</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// survey.html의 공개 응답 화면(?id=)을 떼어 온 독립 페이지 — 응답 화면을 고치면 survey.html 쪽도 같이 고칠 것.
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  function el(id){ return document.getElementById(id); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${escapeHtml(text)}</div>` : ''; }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDateTime(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  // "yyyy-mm-dd hh:mm" 형식 — 설문 기간 표시 전용(기존 fmtDateTime은 점(.) 구분이라
  // 다른 곳에 이미 쓰이고 있어 그대로 두고, 기간 표시에만 이 포맷을 새로 쓴다.
  function fmtYmdHm(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtPeriod(opensIso, closesIso){
    const open = fmtYmdHm(opensIso);
    return closesIso ? `${open} ~ ${fmtYmdHm(closesIso)}` : `${open} ~ (상시)`;
  }
  // <input type="datetime-local">가 쓰는 "YYYY-MM-DDTHH:MM" 로컬 시각 문자열로 변환.
  function toDatetimeLocalValue(d){
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function shareUrl(id){
    return location.origin + location.pathname.replace(/[^/]*$/, '') + 'survey.html?id=' + encodeURIComponent(id);
  }

  // "파일 첨부" 문항용 — collect.html이 쓰는 그 공유 Apps Script 배포를 그대로
  // 재사용한다(파일 실물은 항상 이 스크립트가 구글 드라이브에 저장/링크 공유한다).
  // 비회원 응답이 전제인 페이지라 매니저 비밀번호/로그인 토큰 없이 바로 올린다.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyshMwE9ZOtwIEjpDb7JYpEgspvDaO7doN666SsS6R6-EeyxP63pHNpo6cTv_KDEXX0gQ/exec';
  const MAX_FILES_PER_Q = 5;
  const MAX_FILE_SIZE = 15 * 1024 * 1024; // 15MB
  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
      r.readAsDataURL(file);
    });
  }
  async function filesToPayload(fileList){
    const out = [];
    for (const file of fileList) {
      out.push({ name: file.name, mime: file.type, data: await fileToBase64(file) });
    }
    return out;
  }
  async function uploadSurveyFiles(surveyId, questionKey, questionLabel, filePayload){
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'surveyUploadFiles', surveyId, questionKey, questionLabel, files: filePayload })
      });
      return await res.json();
    } catch (e) {
      return { ok: false, error: '네트워크 오류로 파일을 올리지 못했어요.' };
    }
  }

  const surveyId = new URLSearchParams(location.search).get('id');
  if (!surveyId) {
    el('publicView').style.display = '';
    el('publicBody').innerHTML = '<p class="hint">설문 링크가 올바르지 않아요. 받은 링크를 다시 확인해주세요.</p>';
    return;
  }
  await initPublicView(surveyId);

  // =====================================================================
  // 공개 응답 화면 — 로그인 없이 누구나 열 수 있어요. public_surveys는
  // select가 anon에게도 열려 있어 로그인 세션 없이도 바로 조회돼요.
  // =====================================================================
  async function initPublicView(id){
    el('publicView').style.display = '';
    const body = el('publicBody');
    body.innerHTML = '<p class="hint">불러오는 중…</p>';

    // 응답 대상 명단(target_names)은 비로그인에게 안 보이게 막혀 있어 열을 골라서 읽고,
    // 학번 칸을 띄울지는 survey_public_form_info로만 알아요(명단은 서버의 survey_check_respondent가 대조).
    const { data: surv, error } = await sb.from('public_surveys').select('id, title, description, questions, creator_id, creator_name, require_respondent_name, closes_at, is_closed, created_at, opens_at, show_status, show_results, show_named_results').eq('id', id).maybeSingle();
    if (surv) { const { data: fi } = await sb.rpc('survey_public_form_info', { p_id: id }); surv._form = fi || {}; }
    if (error || !surv) {
      body.innerHTML = '<div class="closed-note">이 설문을 찾을 수 없어요. 링크가 정확한지 확인해주세요.</div>';
      return;
    }

    const notYetOpen = surv.opens_at && new Date(surv.opens_at) > new Date();
    if (notYetOpen) {
      body.innerHTML = `
        <h2 style="margin-top:0;">${escapeHtml(surv.title)}</h2>
        <div class="closed-note">이 설문은 아직 시작 전이에요.<br>${fmtYmdHm(surv.opens_at)}부터 응답을 받아요.</div>
      `;
      return;
    }

    const isClosed = surv.is_closed || (surv.closes_at && new Date(surv.closes_at) < new Date());
    if (isClosed) {
      body.innerHTML = `
        <h2 style="margin-top:0;">${escapeHtml(surv.title)}</h2>
        <div class="closed-note">이 설문은 마감됐어요. 더 이상 응답을 받지 않아요.</div>
      `;
      return;
    }

    const respondedKey = 'ks_survey_responded_' + id;
    if (localStorage.getItem(respondedKey)) {
      renderAlreadyResponded(surv);
      return;
    }

    renderFillForm(surv);

    function pubViewerHtml(surv){
      if (!surv.show_status && !surv.show_results && !surv.show_named_results) return '';
      return `<div class="pub-viewer-btns">
        ${surv.show_status ? '<button type="button" class="btn secondary small" data-pubview="status">📋 제출 현황 보기</button>' : ''}
        ${surv.show_results ? '<button type="button" class="btn secondary small" data-pubview="results">📊 결과 보기</button>' : ''}
        ${surv.show_named_results ? '<button type="button" class="btn secondary small" data-pubview="named">👥 이름 포함 결과 보기</button>' : ''}
      </div><div id="pubViewer" class="pub-viewer"></div>`;
    }
    function wirePubViewer(surv){
      body.querySelectorAll('[data-pubview]').forEach(b => b.addEventListener('click', async () => {
        const box = el('pubViewer');
        const mode = b.dataset.pubview;
        if (box.dataset.mode === mode && box.innerHTML) { box.innerHTML = ''; box.dataset.mode = ''; return; }
        box.dataset.mode = mode;
        box.innerHTML = '<p class="hint">불러오는 중…</p>';
        const { data: sum, error: e2 } = await sb.rpc('survey_public_summary', { p_id: surv.id });
        if (e2 || !sum) { box.innerHTML = '<p class="hint">불러오지 못했어요.</p>'; return; }
        if (mode === 'results') {
          box.innerHTML = renderResultsSummary(surv, (sum.answers || []).map(a => ({ answers: a })), true);
          return;
        }
        if (mode === 'named') {
          box.innerHTML = renderNamedResults(surv, sum.named || []);
          return;
        }
        const names = new Set((sum.names || []).map(n => String(n).trim()));
        const targets = Array.isArray(sum.targets) ? sum.targets : [];
        if (targets.length) {
          const doneN = targets.filter(n => names.has(n)).length;
          box.innerHTML = `<div class="target-status"><b>제출 현황</b> — 대상 ${targets.length}명 중 ${doneN}명 제출, 미제출 ${targets.length - doneN}명
            <div class="target-chips">${targets.map(n => `<span class="target-chip ${names.has(n) ? 'done' : 'todo'}">${names.has(n) ? '✓' : '·'} ${escapeHtml(n)}</span>`).join('')}</div></div>`;
        } else if (names.size) {
          box.innerHTML = `<div class="target-status"><b>제출 현황</b> — ${sum.count}명 제출<div class="target-chips">${[...names].map(n => `<span class="target-chip done">✓ ${escapeHtml(n)}</span>`).join('')}</div></div>`;
        } else {
          box.innerHTML = `<div class="target-status"><b>제출 현황</b> — 지금까지 ${sum.count}건 제출됐어요.</div>`;
        }
      }));
    }

    function renderAlreadyResponded(surv){
      body.innerHTML = `
        <div class="thanks-note">
          <div class="big">✅ 이미 응답하셨어요</div>
          <p>감사합니다. 같은 기기에서 다시 응답하려면 아래 버튼을 눌러주세요.</p>
          <button type="button" class="btn secondary small" id="btnRespondAgain">다시 응답하기</button>
        </div>
        ${pubViewerHtml(surv)}
      `;
      wirePubViewer(surv);
      el('btnRespondAgain').addEventListener('click', () => {
        localStorage.removeItem(respondedKey);
        renderFillForm(surv);
      });
    }

    function renderFillForm(surv){
      const qs = surv.questions || [];
      let html = `<h2 style="margin-top:0;">${escapeHtml(surv.title)}</h2>`;
      if (surv.description) html += `<p class="hint" style="white-space:pre-wrap;">${escapeHtml(surv.description)}</p>`;
      html += pubViewerHtml(surv);
      html += '<div id="fillMsg"></div>';
      if (surv._form && surv._form.has_targets) {
        // 대상 명단이 있는 설문: 명단은 보여주지 않고 학번·이름을 직접 입력받아 제출할 때 서버에서 대조해요
        html += `<div class="id-row respondent-row">${surv._form.needs_no ? `<div class="field"><label>학번 <span class="req">*</span></label><input type="text" id="fRespondentNo" inputmode="numeric" autocomplete="off" placeholder="예: 10203"></div>` : ''}<div class="field"><label>이름 <span class="req">*</span></label><input type="text" id="fRespondentName" autocomplete="off" placeholder="이름을 입력해주세요"></div></div>`;
      } else if (surv.require_respondent_name) {
        html += `<div class="field"><label>이름 <span class="req">*</span></label><input type="text" id="fRespondentName" placeholder="이름을 입력해주세요"></div>`;
      }
      qs.forEach((q, qi) => {
        html += `<div class="q-fill" data-qkey="${escapeHtml(q.key)}">
          <div class="q-fill-label">${qi + 1}. ${escapeHtml(q.label)}${q.required ? '<span class="req">*</span>' : ''}</div>`;
        if (q.type === 'text') {
          html += `<textarea data-qkey="${escapeHtml(q.key)}" class="f-text" placeholder="답변을 입력해주세요"></textarea>`;
        } else if (q.type === 'file') {
          html += `<input type="file" multiple data-qkey="${escapeHtml(q.key)}" class="f-file">
            <div class="hint" style="margin:4px 0 0;">파일당 15MB 이하, 문항당 최대 ${MAX_FILES_PER_Q}개까지 첨부할 수 있어요.</div>`;
        } else {
          const inputType = q.type === 'multi' ? 'checkbox' : 'radio';
          (q.options || []).forEach((opt, oi) => {
            html += `<label class="q-fill-opt">
              <input type="${inputType}" name="fq_${qi}" value="${escapeHtml(opt)}" data-qkey="${escapeHtml(q.key)}" class="f-opt">
              <span>${escapeHtml(opt)}</span>
            </label>`;
          });
        }
        html += '</div>';
      });
      html += `<div class="btn-row"><button type="button" class="btn" id="btnSubmitResponse">제출하기</button></div>`;
      body.innerHTML = html;
      wirePubViewer(surv);

      el('btnSubmitResponse').addEventListener('click', async () => {
        const answers = {};
        const fileQuestionFiles = {}; // qkey -> File[] (아직 업로드 전, 개수/크기만 검증됨)
        let missing = null;
        for (const q of qs) {
          if (q.type === 'text') {
            const ta = body.querySelector(`textarea.f-text[data-qkey="${cssEscape(q.key)}"]`);
            const v = (ta.value || '').trim();
            if (q.required && !v) { missing = q.label; break; }
            if (v) answers[q.key] = v;
          } else if (q.type === 'multi') {
            const checked = Array.from(body.querySelectorAll(`input.f-opt[data-qkey="${cssEscape(q.key)}"]:checked`)).map(i => i.value);
            if (q.required && !checked.length) { missing = q.label; break; }
            if (checked.length) answers[q.key] = checked;
          } else if (q.type === 'file') {
            const input = body.querySelector(`input.f-file[data-qkey="${cssEscape(q.key)}"]`);
            const files = input && input.files ? Array.from(input.files) : [];
            if (q.required && !files.length) { missing = q.label; break; }
            if (files.length > MAX_FILES_PER_Q) { setMsg('fillMsg', `"${q.label}" 문항은 파일을 최대 ${MAX_FILES_PER_Q}개까지만 첨부할 수 있어요.`, 'error'); return; }
            const tooBig = files.find(f => f.size > MAX_FILE_SIZE);
            if (tooBig) { setMsg('fillMsg', `"${q.label}" 문항의 "${tooBig.name}" 파일이 너무 커요 (15MB 이하만 가능해요).`, 'error'); return; }
            if (files.length) fileQuestionFiles[q.key] = files;
          } else {
            const checkedEl = body.querySelector(`input.f-opt[data-qkey="${cssEscape(q.key)}"]:checked`);
            if (q.required && !checkedEl) { missing = q.label; break; }
            if (checkedEl) answers[q.key] = checkedEl.value;
          }
        }
        if (missing) { setMsg('fillMsg', `"${missing}" 문항에 응답해주세요.`, 'error'); return; }
        let respondentName = null;
        if (el('fRespondentName')) {
          respondentName = (el('fRespondentName').value || '').trim();
          if (!respondentName) { setMsg('fillMsg', '이름을 입력해주세요.', 'error'); return; }
          if (surv._form && surv._form.has_targets) {
            const no = el('fRespondentNo') ? (el('fRespondentNo').value || '').replace(/\s/g, '') : '';
            if (el('fRespondentNo') && !no) { setMsg('fillMsg', '학번을 입력해주세요.', 'error'); return; }
            const { data: chk } = await sb.rpc('survey_check_respondent', { p_id: surv.id, p_no: no, p_name: respondentName });
            if (!chk || !chk.ok) { setMsg('fillMsg', '응답 대상 명단에 없습니다. ' + (el('fRespondentNo') ? '학번과 이름을' : '이름을') + ' 다시 확인해주세요.', 'error'); return; }
            respondentName = chk.name; // 명단에 적힌 그대로(예: "10203 홍길동")로 저장해 응답 현황과 맞춰요
          }
        }
        setMsg('fillMsg', '제출 중…', '');
        for (const q of qs) {
          if (q.type !== 'file' || !fileQuestionFiles[q.key]) continue;
          setMsg('fillMsg', `파일 올리는 중… ("${q.label}")`, '');
          const payload = await filesToPayload(fileQuestionFiles[q.key]);
          const uploaded = await uploadSurveyFiles(surv.id, q.key, q.label, payload);
          if (!uploaded.ok) { setMsg('fillMsg', `"${q.label}" 문항의 파일 업로드에 실패했어요: ` + (uploaded.error || ''), 'error'); return; }
          answers[q.key] = uploaded.files;
        }
        setMsg('fillMsg', '제출 중…', '');
        const { error: insErr } = await sb.from('public_survey_responses').insert({
          survey_id: surv.id, respondent_name: respondentName, answers
        });
        if (insErr) { setMsg('fillMsg', '제출 중 문제가 발생했어요: ' + insErr.message, 'error'); return; }
        localStorage.setItem(respondedKey, '1');
        body.innerHTML = `<div class="thanks-note"><div class="big">🎉 제출 완료!</div><p>응답해주셔서 감사합니다.</p></div>${pubViewerHtml(surv)}`;
        wirePubViewer(surv);
      });
    }
  }

  // 응답자에게 공개하는 "이름 포함 결과" — 문항마다 선택지별로 고른 사람 이름을 묶어서(주관식은 이름: 답)
  function renderNamedResults(surv, named){
    if (!named.length) return '<p class="hint">아직 응답이 없어요.</p>';
    const nm = r => escapeHtml(r.name || '(이름 없음)');
    let html = `<div class="hint" style="margin-bottom:8px;">총 응답 ${named.length}건</div>`;
    (surv.questions || []).filter(q => q.type !== 'file').forEach(q => {
      html += `<div class="result-q"><div class="result-q-label">${escapeHtml(q.label)}</div>`;
      if (q.type === 'text') {
        const rows = named.filter(r => String((r.answers && r.answers[q.key]) || '').trim());
        html += rows.length
          ? rows.map(r => `<div class="result-text-item"><b>${nm(r)}</b>: ${escapeHtml(r.answers[q.key])}</div>`).join('')
          : '<div class="result-empty">응답 없음</div>';
      } else {
        const groups = {};
        (q.options || []).forEach(o => { groups[o] = []; });
        named.forEach(r => {
          const v = r.answers && r.answers[q.key];
          if (!v) return;
          (Array.isArray(v) ? v : [v]).forEach(val => { (groups[val] = groups[val] || []).push(r); });
        });
        html += Object.entries(groups).map(([opt, rs]) => `<div class="named-group">
            <div class="named-opt">${escapeHtml(opt)} <span class="named-count">${rs.length}명</span></div>
            <div class="target-chips">${rs.length ? rs.map(r => `<span class="target-chip done">${nm(r)}</span>`).join('') : '<span class="result-empty">없음</span>'}</div>
          </div>`).join('');
      }
      html += '</div>';
    });
    return html;
  }

  function renderResultsSummary(surv, responses, pub){
    // pub: 응답자에게 보여주는 공개 보기 — 파일 링크·미응답 복사 버튼은 빼요
    let html = `<div class="hint" style="margin-bottom:12px;">총 응답 ${responses.length}건</div>`;
    (surv.questions || []).forEach(q => {
      html += `<div class="result-q"><div class="result-q-label">${escapeHtml(q.label)}</div>`;
      if (q.type === 'text') {
        const texts = responses.map(r => (r.answers && r.answers[q.key]) || '').filter(Boolean);
        html += texts.length
          ? texts.map(t => `<div class="result-text-item">${escapeHtml(t)}</div>`).join('')
          : '<div class="result-empty">응답 없음</div>';
      } else if (q.type === 'file') {
        if (pub) { html += '<div class="result-empty">(파일 문항은 공개하지 않아요)</div></div>'; return; }
        const withFiles = responses.filter(r => Array.isArray(r.answers && r.answers[q.key]) && r.answers[q.key].length);
        html += withFiles.length
          ? withFiles.map(r => {
              const files = r.answers[q.key];
              const who = r.respondent_name ? escapeHtml(r.respondent_name) : fmtDateTime(r.submitted_at);
              const links = files.map(f => `<a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${escapeHtml(f.name)}</a>`).join(', ');
              return `<div class="result-text-item">${who}: ${links}</div>`;
            }).join('')
          : '<div class="result-empty">제출된 파일 없음</div>';
      } else {
        const counts = {};
        (q.options || []).forEach(o => { counts[o] = 0; });
        responses.forEach(r => {
          const v = r.answers && r.answers[q.key];
          if (!v) return;
          (Array.isArray(v) ? v : [v]).forEach(val => { counts[val] = (counts[val] || 0) + 1; });
        });
        const total = responses.length || 1;
        html += Object.entries(counts).map(([opt, n]) => {
          const pct = Math.round((n / total) * 100);
          return `<div class="result-opt-row">
            <span class="result-opt-label">${escapeHtml(opt)}</span>
            <div class="result-bar-wrap"><div class="result-bar" style="width:${pct}%"></div></div>
            <span class="result-opt-count">${n}명 (${pct}%)</span>
          </div>`;
        }).join('');
      }
      html += '</div>';
    });
    if (pub) return html;
    const targets = Array.isArray(surv.target_names) ? surv.target_names : [];
    if (targets.length) {
      const done = new Set(responses.map(r => (r.respondent_name || '').trim()).filter(Boolean));
      const todo = targets.filter(n => !done.has(n));
      html += `<div class="target-status"><b>응답 현황</b> — 대상 ${targets.length}명 중 ${targets.length - todo.length}명 응답, <span style="color:var(--crest-red);">미응답 ${todo.length}명</span>
        ${todo.length ? `<button type="button" class="btn secondary small act-copy-todo" data-names="${escapeHtml(todo.join(', '))}" style="margin-left:6px;">미응답 명단 복사</button>` : ''}
        <div class="target-chips">${targets.map(n => `<span class="target-chip ${done.has(n) ? 'done' : 'todo'}">${done.has(n) ? '✓' : '·'} ${escapeHtml(n)}</span>`).join('')}</div></div>`;
    } else if (surv.require_respondent_name) {
      const names = responses.map(r => r.respondent_name).filter(Boolean);
      html += `<div class="result-names">응답자: ${names.length ? names.map(escapeHtml).join(', ') : '(없음)'}</div>`;
    }
    return html;
  }

  function cssEscape(s){
    return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
  }

})();
</script>
</body>
</html>
