<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생별 기말고사 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA;
    --paper-card: #FFFFFF;
    --ink: #262B25;
    --ink-soft: #5C5A47;
    --rule: #C7BC9C;
    --rule-soft: #DAD1B6;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --brass: #6E6234;
    --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.5;
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 36px 20px 80px; }

  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 8px;
  }
  header.page-head h1{
    font-family:'Noto Serif KR', serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  header.page-head .term{ font-size:12.5px; color:var(--ink-soft); }

  .picker-block{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .picker-block h2{ font-family:'Noto Serif KR', serif; font-size:14.5px; font-weight:600; margin:0 0 10px; }

  .class-select-row{
    display:flex; gap: 10px; margin-bottom: 14px; flex-wrap:wrap;
  }
  .class-select-row label{
    font-size: 12.5px; color: var(--ink-soft); display:flex; flex-direction:column; gap:4px;
  }
  .class-select-row select{
    font-family:'Noto Sans KR', sans-serif; font-size:14px;
    padding: 7px 10px;
    border: 1px solid var(--rule); border-radius:4px;
    background:#fff; color:var(--ink);
  }

  .roster-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
  }
  .roster-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 8px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .roster-btn:hover{ border-color: var(--ink); }
  .roster-btn.active{
    background: var(--ink);
    color: var(--paper-card);
    border-color: var(--ink);
    font-weight:600;
  }

  .action-row{
    display:flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .print-btn, .print-all-btn{
    display:inline-block;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .print-btn{
    background: var(--ink);
    color: var(--paper-card);
  }
  .print-all-btn{
    background: var(--paper-card);
    color: var(--ink);
  }
  .print-all-btn:hover{ background: var(--rule-soft); }

  .id-head{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .id-head .who{ display:flex; align-items:baseline; gap:14px; }
  .id-head .who .name{
    font-family:'Noto Serif KR', serif; font-size:22px; font-weight:700;
  }
  .id-head .who .meta{ font-size:12.5px; color:var(--ink-soft); }
  .id-head .stamp{
    font-family:'Noto Serif KR', serif;
    display:inline-flex; align-items:center; justify-content:center;
    padding-top: 4px;
    width: 46px; height: 52px;
    background: var(--stamp);
    clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%);
    color: #F8F4E8;
    font-weight:700; font-size:11px;
    flex-shrink:0;
  }

  table.tt{
    width:100%; border-collapse:collapse;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow:hidden;
    table-layout: fixed;
    margin-bottom: 18px;
  }
  table.tt th{
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px; font-weight:600; color:var(--ink-soft);
    padding: 8px 4px; text-align:center;
    border-bottom: 1px solid var(--rule);
    background: rgba(38,43,37,0.02);
  }
  table.tt th.period-col{ width: 46px; }
  table.tt td{
    border-bottom: 1px solid var(--rule-soft);
    border-right: 1px solid var(--rule-soft);
    padding: 8px 5px;
    text-align:center;
    font-size: 12.5px;
    vertical-align: middle;
    height: 58px;
  }
  table.tt td:last-child{ border-right:none; }
  table.tt tr:last-child td{ border-bottom:none; }
  table.tt td.period-num{
    font-family:'Noto Serif KR', serif; font-weight:600; color:var(--ink-soft);
    background: rgba(38,43,37,0.02);
  }
  table.tt td .subject{ font-weight:700; font-size:13.5px; }
  table.tt td .room{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  table.tt td .time{ font-size: 9.5px; color: var(--ink-soft); }
  table.tt td.wait{ background: var(--brass-soft); }
  table.tt td.wait .subject{ color: var(--brass); font-size:12.5px; }
  table.tt td.done{ color: var(--rule); font-size: 12px; }
  table.tt td.empty-slot{ color: var(--rule); }

  .notice{
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height:1.7;
  }
  .notice strong{ color: var(--ink); }

  .empty-state{ text-align:center; padding: 40px 20px; color: var(--ink-soft); font-size:14px; }

  @media (max-width:520px){
    table.tt td{ font-size:11px; height:52px; padding:5px 3px; }
    table.tt td .subject{ font-size:12px; }
    table.tt td .room{ font-size:10px; }
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
<script src="./nav.js" defer></script>
</head>
<body>
<div id="protected-content" style="display:none">
  <div class="wrap">
    <header class="page-head">
      <h1>학생별 기말고사 시간표</h1>
      <span class="term">2026학년도 1학기 기말고사 · 경성고등학교</span>
    </header>

    <div class="picker-block">
      <h2>학년 · 반 · 학생 선택</h2>
      <div class="class-select-row">
        <label>학년
          <select id="gradeSelect">
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </label>
        <label>반
          <select id="classSelect"></select>
        </label>
      </div>
      <div class="roster-grid" id="rosterGrid"></div>
    </div>

    <div class="action-row">
      <button class="print-btn" id="printSingleBtn">현재 학생 인쇄</button>
      <button class="print-all-btn" id="printAllBtn">이 반 전체 인쇄</button>
    </div>

    <div id="content">
      <div class="empty-state">학생을 선택하면 개인별 시험 시간표가 표시됩니다.</div>
    </div>
  </div>

</div>

const EXAM_NOTICE = "1) OMR 카드는 반드시 컴퓨터용 수성싸인펜으로 기재할 것. 수정테이프 사용 가능.<br>2) 서답형 답안은 반드시 지워지지 않는 볼펜으로 작성할 것(흑색, 청색 펜 권장). 수정테이프, 수정액 사용 불가.<br>3) 고사 10분 전까지 입실 완료.<br>4) \"대기\"로 표시된 시간은 본인 반 교실이 다른 과목 시험실로 사용되어 지정된 장소에서 대기해야 합니다.<br>5) \"종료\"는 그날 응시할 시험이 모두 끝났음을 의미합니다.";

const gradeSelect = document.getElementById('gradeSelect');
const classSelect = document.getElementById('classSelect');
const rosterGrid = document.getElementById('rosterGrid');
const content = document.getElementById('content');

let currentGrade = 2;
let currentClass = 1;
let currentId = null;

function classesFor(grade){
  const set = new Set(STUDENTS.filter(s => s.grade === grade).map(s => s.cls));
  return Array.from(set).sort((a,b) => a-b);
}

function populateClassSelect(){
  const classes = classesFor(currentGrade);
  classSelect.innerHTML = classes.map(c => `<option value="${c}">${c}반</option>`).join('');
  if(!classes.includes(currentClass)){
    currentClass = classes[0];
  }
  classSelect.value = String(currentClass);
}

function currentRoster(){
  return STUDENTS
    .filter(s => s.grade === currentGrade && s.cls === currentClass)
    .sort((a,b) => a.num - b.num);
}

function populateRoster(){
  const roster = currentRoster();
  rosterGrid.innerHTML = '';
  roster.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'roster-btn';
    btn.textContent = s.name;
    btn.dataset.id = s.id;
    btn.addEventListener('click', () => selectStudent(s.id));
    rosterGrid.appendChild(btn);
  });
  if(roster.length > 0){
    selectStudent(roster[0].id);
  } else {
    currentId = null;
    content.innerHTML = `<div class="empty-state">해당 반 학생 정보를 찾을 수 없습니다.</div>`;
  }
}

gradeSelect.addEventListener('change', () => {
  currentGrade = parseInt(gradeSelect.value, 10);
  populateClassSelect();
  populateRoster();
});
classSelect.addEventListener('change', () => {
  currentClass = parseInt(classSelect.value, 10);
  populateRoster();
});

function selectStudent(id){
  currentId = id;
  document.querySelectorAll('.roster-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  renderStudent(id);
}

function groupByDay(timeline){
  const days = [];
  const map = {};
  timeline.forEach(e => {
    if(!map[e.day]){ map[e.day] = []; days.push(e.day); }
    map[e.day].push(e);
  });
  return days.map(d => ({ day: d, entries: map[d] }));
}

function renderStudentBlock(s){
  const grouped = groupByDay(s.timeline);
  const maxPeriod = Math.max(...s.timeline.map(e => e.period));

  let html = `
    <div class="id-head">
      <div class="who">
        <span class="name">${s.name}</span>
        <span class="meta">${s.grade}학년 ${s.cls}반 · 학번 ${s.id}</span>
      </div>
      <div class="stamp">응시표</div>
    </div>
    <table class="tt">
      <thead><tr><th class="period-col">교시</th>`;
  grouped.forEach(g => html += `<th>${g.day}</th>`);
  html += `</tr></thead><tbody>`;

  for(let p = 1; p <= maxPeriod; p++){
    html += `<tr><td class="period-num">${p}</td>`;
    grouped.forEach(g => {
      const e = g.entries.find(x => x.period === p);
      if(!e){
        html += `<td class="empty-slot"></td>`;
      } else if(e.type === 'exam'){
        html += `<td><div class="subject">${e.subject}</div><div class="room">${e.room}</div><div class="time">${e.time}</div></td>`;
      } else if(e.type === 'wait'){
        html += `<td class="wait"><div class="subject">대기</div><div class="room">${e.room}</div><div class="time">${e.time}</div></td>`;
      } else if(e.type === 'free'){
        html += `<td class="wait"><div class="subject">자습</div><div class="room">${e.room}</div><div class="time">${e.time}</div></td>`;
      } else {
        html += `<td class="done">종료</td>`;
      }
    });
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  html += `<div class="notice"><strong>유의사항</strong><br>${EXAM_NOTICE}</div>`;

  return html;
}

function renderStudent(id){
  const s = STUDENTS.find(x => x.id === id);
  if(!s) return;
  content.innerHTML = renderStudentBlock(s);
}

const PRINT_STYLE = `
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  *{ box-sizing:border-box; }
  body{ font-family:'Noto Sans KR', sans-serif; color:#262B25; margin:24px; }
  .id-head{ display:flex; align-items:center; justify-content:space-between; border:1px solid #C7BC9C; border-radius:6px; padding:14px 18px; margin-bottom:14px; }
  .id-head .name{ font-family:'Noto Serif KR', serif; font-size:20px; font-weight:700; margin-right:12px; }
  .id-head .meta{ font-size:12px; color:#5C5A47; }
  .id-head .stamp{ font-family:'Noto Serif KR', serif; display:inline-flex; align-items:center; justify-content:center; width:46px;height:52px; padding-top:4px; background:#264085; clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%); color:#F8F4E8; font-weight:700; font-size:11px; }
  table.tt{ width:100%; border-collapse:collapse; margin-bottom:12px; table-layout:fixed; }
  table.tt th, table.tt td{ border:1px solid #C7BC9C; padding:6px 4px; text-align:center; font-size:11.5px; }
  table.tt th{ background:#F1EEE0; font-size:11px; }
  table.tt td.period-num{ font-family:'Noto Serif KR', serif; font-weight:600; background:#F8F6EE; }
  table.tt .subject{ font-weight:700; font-size:12.5px; }
  table.tt .room{ font-size:10px; color:#5C5A47; }
  table.tt .time{ font-size:9px; color:#5C5A47; }
  table.tt td.wait{ background:#F1EEDF; }
  table.tt td.done{ color:#bbb; font-size:11px; }
  .notice{ font-size:10.5px; color:#5C5A47; line-height:1.7; border:1px solid #C7BC9C; border-radius:6px; padding:10px 14px; }
  .print-page{ page-break-after: always; }
  .print-page:last-child{ page-break-after: auto; }
`;

function openPrintWindow(title, bodyHtml){
  const w = window.open('', '_blank');
  if(!w){
    alert('팝업이 차단되어 인쇄 창을 열 수 없습니다. 브라우저의 팝업 차단 설정을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${title}</title>
    <style>${PRINT_STYLE}</style></head><body>${bodyHtml}</body></html>`);
  w.document.close();
  const triggerPrint = () => { try{ w.focus(); w.print(); } catch(e){} };
  w.onload = triggerPrint;
  setTimeout(triggerPrint, 500);
}

document.getElementById('printSingleBtn').addEventListener('click', () => {
  if(!currentId) return;
  const s = STUDENTS.find(x => x.id === currentId);
  openPrintWindow(`${s.name} 시험시간표`, renderStudentBlock(s));
});

document.getElementById('printAllBtn').addEventListener('click', () => {
  const roster = currentRoster();
  if(roster.length === 0) return;
  const pages = roster.map(s => `<div class="print-page">${renderStudentBlock(s)}</div>`).join('');
  openPrintWindow(`${currentGrade}학년 ${currentClass}반 전체 시험시간표`, pages);
});

populateClassSelect();
populateRoster();
</script>
