<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학생별 시험 시간표</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="./nav.js" defer></script>
<style>
  :root {
    --bg: #F3F1EC;
    --card: #FFFFFF;
    --ink: #1B1A17;
    --ink-soft: #8C877C;
    --border: #E6E2D8;
    --border-strong: #D3CCBC;
    --accent: #14130F;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17160F; --card: #211F17; --ink: #EFEBDE; --ink-soft: #A7A08E;
      --border: #37331F; --border-strong: #4A4530; --accent: #EFEBDE;
      --stamp: #6E8FC2; --stamp-soft: rgba(110,143,194,0.10);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17160F; --card: #211F17; --ink: #EFEBDE; --ink-soft: #A7A08E;
    --border: #37331F; --border-strong: #4A4530; --accent: #EFEBDE;
    --stamp: #6E8FC2; --stamp-soft: rgba(110,143,194,0.10);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", sans-serif; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 90px; }

  .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom: 22px; flex-wrap:wrap; }
  .topbar h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .topbar p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .btn {
    font-family: inherit; font-size: 12.5px; font-weight: 700; color:#fff; background: var(--stamp);
    border:none; border-radius:8px; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .btn.secondary { background:#fff; color: var(--ink); border:1px solid var(--border-strong); font-weight:500; }
  .btn.danger { background:#fff; color: var(--crest-red); border:1px solid rgba(238,46,34,0.4); font-weight:500; }
  .btn.tiny { font-size:11.5px; padding:5px 10px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; margin-bottom: 18px; }
  .card h3 { font-size: 14px; font-weight: 700; margin: 0 0 14px; color: var(--ink); }
  .card p.desc { color: var(--ink-soft); font-size: 12.5px; margin: -8px 0 14px; }

  .exam-card {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 12px; transition: border-color 0.15s;
  }
  .exam-card:hover { border-color: var(--stamp); }
  .exam-card.hidden-exam { opacity: 0.55; border-style: dashed; }
  .exam-card-link { flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:14px; text-decoration:none; color: var(--ink); }
  .exam-card-link .title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
  .exam-card-link .period { font-size: 12px; color: var(--ink-soft); }
  .exam-card-link .arrow { font-size: 16px; color: var(--ink-soft); flex-shrink: 0; }
  .exam-card:hover .exam-card-link .arrow { color: var(--stamp); }
  .exam-card-admin { display:flex; gap:6px; flex-shrink:0; }
  .hidden-badge { font-size:10.5px; color: var(--ink-soft); font-weight:700; margin-left:8px; }

  .empty-note { font-size: 12.5px; color: var(--ink-soft); padding: 10px 4px; }
</style>
</head>
<body>
<div class="wrap" id="examGateView">
  <div class="card">
    <h3>로그인이 필요해요</h3>
    <p class="desc">학생 개인정보(이름·시험실 배정)가 담긴 시험 시간표라, 선생님 로그인 후에만 볼 수 있어요.</p>
    <a style="text-decoration:none; display:inline-block; padding:10px 18px; border-radius:10px; background:var(--accent); color:var(--bg);" href="./login.html">로그인하러 가기</a>
  </div>
</div>
<div class="wrap" id="examPendingView" style="display:none;">
  <div class="card">
    <h3>관리자 승인을 기다리고 있어요</h3>
    <p class="desc">승인되면 바로 이용하실 수 있어요.</p>
  </div>
</div>
<div class="wrap" id="examMainWrap" style="display:none;">
  <div class="topbar">
    <div>
      <h1>학생별 시험 시간표</h1>
      <p>확인할 시험을 골라주세요.</p>
    </div>
    <a class="btn" href="./exam-generator.html">+ 시험 추가하기</a>
  </div>

  <div id="examListMsg"></div>
  <div id="examListArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// 시험 목록은 exam_schedules 테이블에서 읽어와요 — exam-generator.html이 만들어주는
// 각 시험 페이지 자체에 있는 "+ 이 시험 목록에 추가" 버튼이 이 테이블에 행을 하나
// 추가하는 방식이라, 이 페이지 자체에는 "추가" 폼이 따로 없어요(추가는 항상 그
// 시험 페이지에서 이뤄져요). hidden=true인 행은 RLS 자체가 관리자에게만 보여주므로
// (exam_schedules_select 정책 참고) 여기서는 받은 걸 그대로 그리기만 하면 돼요.
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function setMsg(text, type){ el('examListMsg').innerHTML = text ? `<div class="card empty-note" style="${type === 'error' ? 'color:var(--crest-red);' : ''}">${escapeHtml(text)}</div>` : ''; }

  let isAdmin = false;
  let exams = [];

  async function loadExams(){
    const { data, error } = await sb.from('exam_schedules').select('id, title, period, href, hidden').order('created_at', { ascending: false });
    if(error){ setMsg('시험 목록을 불러오지 못했어요: ' + error.message, 'error'); return; }
    exams = data || [];
    renderExamList();
  }

  function renderExamList(){
    setMsg('', '');
    const area = el('examListArea');
    if(!exams.length){
      area.innerHTML = '<div class="card empty-note">아직 등록된 시험이 없어요. "+ 시험 추가하기"로 새 시험을 만들어보세요.</div>';
      return;
    }
    area.innerHTML = exams.map(e => `
      <div class="exam-card ${e.hidden ? 'hidden-exam' : ''}" data-id="${e.id}">
        <a class="exam-card-link" href="${escapeHtml(e.href)}">
          <div>
            <div class="title">${escapeHtml(e.title)}${e.hidden ? '<span class="hidden-badge">숨김</span>' : ''}</div>
            <div class="period">${escapeHtml(e.period || '')}</div>
          </div>
          <span class="arrow">→</span>
        </a>
        ${isAdmin ? `
          <div class="exam-card-admin">
            <button type="button" class="btn secondary tiny btnToggleHidden">${e.hidden ? '보이기' : '숨기기'}</button>
            <button type="button" class="btn danger tiny btnDeleteExam">삭제</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  el('examListArea').addEventListener('click', async (e) => {
    const card = e.target.closest('.exam-card');
    if(!card) return;
    const id = card.dataset.id;
    const exam = exams.find(x => x.id === id);
    if(!exam) return;

    if(e.target.closest('.btnToggleHidden')){
      e.preventDefault();
      const { error } = await sb.from('exam_schedules').update({ hidden: !exam.hidden }).eq('id', id);
      if(error){ setMsg('변경하지 못했어요: ' + error.message, 'error'); return; }
      loadExams();
      return;
    }
    if(e.target.closest('.btnDeleteExam')){
      e.preventDefault();
      if(!confirm(`"${exam.title}"을(를) 목록에서 완전히 삭제할까요? (실제 시험 시간표 파일은 지워지지 않아요)`)) return;
      const { error } = await sb.from('exam_schedules').delete().eq('id', id);
      if(error){ setMsg('삭제하지 못했어요: ' + error.message, 'error'); return; }
      loadExams();
      return;
    }
  });

  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;
  const { data: profile } = await sb.from('profiles').select('approved, is_admin').eq('id', session.user.id).maybeSingle();
  document.getElementById('examGateView').style.display = 'none';
  if(!profile || !profile.approved){
    document.getElementById('examPendingView').style.display = '';
    return;
  }
  isAdmin = !!profile.is_admin;
  document.getElementById('examMainWrap').style.display = '';
  loadExams();
})();
</script>
</body>
</html>
