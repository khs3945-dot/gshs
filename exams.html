<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학생별 시험 시간표</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="./nav.js" defer></script>
<style>
  :root {
    --bg: #F3F1EC;
    --card: #FFFFFF;
    --ink: #1B1A17;
    --ink-soft: #8C877C;
    --border: #E6E2D8;
    --border-strong: #D3CCBC;
    --accent: #14130F;
    --stamp: #264085;
    --stamp-soft: rgba(38,64,133,0.08);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17160F; --card: #211F17; --ink: #EFEBDE; --ink-soft: #A7A08E;
      --border: #37331F; --border-strong: #4A4530; --accent: #EFEBDE;
      --stamp: #6E8FC2; --stamp-soft: rgba(110,143,194,0.10);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17160F; --card: #211F17; --ink: #EFEBDE; --ink-soft: #A7A08E;
    --border: #37331F; --border-strong: #4A4530; --accent: #EFEBDE;
    --stamp: #6E8FC2; --stamp-soft: rgba(110,143,194,0.10);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", sans-serif; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 90px; }

  .topbar { margin-bottom: 22px; }
  .topbar h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .topbar p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; margin-bottom: 18px; }
  .card h3 { font-size: 14px; font-weight: 700; margin: 0 0 14px; color: var(--ink); }
  .card p.desc { color: var(--ink-soft); font-size: 12.5px; margin: -8px 0 14px; }

  a.exam-card {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 12px; text-decoration: none; color: var(--ink);
    transition: border-color 0.15s, transform 0.15s;
  }
  a.exam-card:last-child { margin-bottom: 0; }
  a.exam-card:hover { border-color: var(--stamp); background: var(--stamp-soft); transform: translateY(-1px); }
  a.exam-card .title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
  a.exam-card .period { font-size: 12px; color: var(--ink-soft); }
  a.exam-card .arrow { font-size: 16px; color: var(--ink-soft); flex-shrink: 0; }
  a.exam-card:hover .arrow { color: var(--stamp); }

  .empty-note { font-size: 12.5px; color: var(--ink-soft); padding: 10px 4px; }
</style>
</head>
<body>
<div class="wrap" id="examGateView">
  <div class="card">
    <h3>로그인이 필요해요</h3>
    <p class="desc">학생 개인정보(이름·시험실 배정)가 담긴 시험 시간표라, 선생님 로그인 후에만 볼 수 있어요.</p>
    <a style="text-decoration:none; display:inline-block; padding:10px 18px; border-radius:10px; background:var(--accent); color:var(--bg);" href="./login.html">로그인하러 가기</a>
  </div>
</div>
<div class="wrap" id="examPendingView" style="display:none;">
  <div class="card">
    <h3>관리자 승인을 기다리고 있어요</h3>
    <p class="desc">승인되면 바로 이용하실 수 있어요.</p>
  </div>
</div>
<div class="wrap" id="examMainWrap" style="display:none;">
  <div class="topbar">
    <h1>학생별 시험 시간표</h1>
    <p>확인할 시험을 골라주세요.</p>
  </div>

  <div id="examListArea"></div>
</div>

<!--
  시험이 끝날 때마다 새 시험이 이 목록에 하나씩 늘어나요. exam-generator.html에서 새
  시험 시간표 파일(예: exam-2026-2-final.html)을 만들어 깃허브에 추가한 뒤, 아래
  EXAMS 배열에 { title, period, href } 한 줄만 추가하면 돼요 — duty.html의
  DUTY_DATA처럼 학기마다 손으로 채워 넣는 하드코딩 목록이라, 별도 관리자 화면이나
  Supabase 테이블은 두지 않았어요.
-->
<script>
  const EXAMS = [
    { title: '2026학년도 2학기 중간고사', period: '9/28(월) ~ 10/2(금)', href: './exam-2026-2-mid.html' },
  ];

  function el(id){ return document.getElementById(id); }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderExamList(){
    const area = el('examListArea');
    if(!EXAMS.length){
      area.innerHTML = '<div class="card empty-note">아직 등록된 시험이 없어요.</div>';
      return;
    }
    area.innerHTML = EXAMS.map(e => `
      <a class="exam-card" href="${e.href}">
        <div>
          <div class="title">${escapeHtml(e.title)}</div>
          <div class="period">${escapeHtml(e.period || '')}</div>
        </div>
        <span class="arrow">→</span>
      </a>
    `).join('');
  }
  renderExamList();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// exam-2026-2-mid.html과 같은 방식의 간단한 로그인 확인이에요 — 시험 목록 자체엔
// 학생 개인정보가 없지만, 실제 시간표(학생 이름·고사실 배정)로 이어지는 입구라 여기서도
// 똑같이 막아둬요.
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;
  const { data: profile } = await sb.from('profiles').select('approved').eq('id', session.user.id).maybeSingle();
  document.getElementById('examGateView').style.display = 'none';
  if(!profile || !profile.approved){
    document.getElementById('examPendingView').style.display = '';
    return;
  }
  document.getElementById('examMainWrap').style.display = '';
})();
</script>
</body>
</html>
