<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 편집기 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5;
  }
  .wrap{ max-width: 680px; margin:0 auto; padding: 36px 20px 80px; }
  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink); padding-bottom:14px; margin-bottom:20px; flex-wrap:wrap; gap:8px;
  }
  header.page-head h1{ font-family:'Noto Serif KR', serif; font-weight:600; font-size:20px; margin:0; }
  header.page-head a.back{ font-size:12.5px; color:var(--ink-soft); text-decoration:none; }

  .intro{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:22px; }
  .intro b{ color:var(--ink); }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:18px; margin-bottom:16px; }
  .card h2{ font-family:'Noto Serif KR', serif; font-size:14.5px; margin:0 0 10px; color:var(--stamp); }

  label.field{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  input[type=text], input[type=password]{
    width:100%; font-family:'Noto Sans KR', sans-serif; font-size:13.5px;
    padding:9px 10px; border:1px solid var(--rule); border-radius:6px; box-sizing:border-box; margin-bottom:12px;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

  .btn{
    font-family:'Noto Sans KR', sans-serif; font-size:14px; font-weight:600;
    color:var(--paper-card); background:var(--ink); border:none; border-radius:6px;
    padding:11px 16px; cursor:pointer;
  }
  .btn.primary{ background:var(--stamp); }
  .btn.small{ font-size:12px; padding:6px 10px; font-weight:600; }
  .btn.danger{ background:var(--crest-red); }
  .btn:disabled{ opacity:0.4; cursor:default; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .menu-row{
    display:flex; align-items:center; gap:8px; background:#FAFAF7; border:1px solid var(--rule-soft);
    border-radius:6px; padding:10px; margin-bottom:8px;
  }
  .menu-row .fields{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .menu-row input{ margin-bottom:0; font-size:13px; padding:7px 9px; }
  .menu-row .order-btns{ display:flex; flex-direction:column; gap:2px; }
  .menu-row .order-btns button{ font-size:10px; padding:2px 6px; cursor:pointer; }

  .log{ font-size:12.5px; background:#FAFAF7; border:1px solid var(--rule-soft); border-radius:6px; padding:12px 14px; white-space:pre-wrap; max-height:220px; overflow-y:auto; margin-top:12px; }
  .log .ok{ color:#2E7D32; }
  .log .warn{ color:#C77700; }
  .log .err{ color:var(--crest-red); }

  .footnote{ margin-top:18px; font-size:11px; color:var(--ink-soft); line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>메뉴 편집기</h1>
      <a class="back" href="./admin-tools.html">← 교무 업무 도구로</a>
    </header>

    <div class="intro">
      상단 햄버거 메뉴에 뜨는 목록을 직접 고쳐서 저장하면, 곧바로 <b>GitHub에 커밋</b>되고 Netlify가 자동 배포해요.
      다운로드·업로드 없이 이 화면에서 끝나요.
    </div>

    <div class="card" id="settingsCard">
      <h2>① 접속 설정 (최초 1회만)</h2>
      <label class="field">GitHub 저장소 (예: your-id/your-repo)</label>
      <input type="text" id="repoInput" placeholder="예: khs3945/school-tools">
      <div class="row2">
        <div>
          <label class="field">브랜치</label>
          <input type="text" id="branchInput" placeholder="main" value="main">
        </div>
        <div>
          <label class="field">nav.js 파일 경로</label>
          <input type="text" id="pathInput" placeholder="nav.js" value="nav.js">
        </div>
      </div>
      <label class="field">GitHub 토큰 (github_pat_로 시작)</label>
      <input type="password" id="tokenInput" placeholder="github_pat_...">
      <div class="btn-row">
        <button class="btn" id="btnSaveSettings">설정 저장</button>
        <button class="btn small" id="btnClearSettings" style="background:var(--rule-soft); color:var(--ink);">저장된 설정 지우기</button>
      </div>
    </div>

    <div class="card">
      <h2>② 메뉴 불러오기</h2>
      <button class="btn primary" id="btnLoad">현재 메뉴 불러오기</button>
      <div class="log" id="logBox" style="display:none;"></div>
    </div>

    <div class="card" id="editCard" style="display:none;">
      <h2>③ 메뉴 편집</h2>
      <div id="menuRows"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn small" id="btnAddRow">+ 항목 추가</button>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" id="btnSave">GitHub에 저장 (바로 반영)</button>
      </div>
    </div>

    <div class="footnote">
      href는 <code>./exams.html</code>처럼 앞에 <code>./</code>을 붙인 상대경로로 적어주세요. 저장하면 몇 초 뒤 사이트에 반영돼요 (Netlify 자동 배포).
    </div>
  </div>

<script>
let logEl;
function log(msg, cls){
  if(!logEl) return;
  logEl.style.display = '';
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

const SETTINGS_KEY = 'ks_gh_settings';

function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveSettingsToStorage(s){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64){
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function ghHeaders(token){
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json'
  };
}

let currentFile = null; // { content, sha, arrayStart, arrayEnd }
let currentRows = [];

function findArrayEnd(content, start){
  let depth = 0, inStr = false, esc = false, strCh = '';
  for(let i = start; i < content.length; i++){
    const c = content[i];
    if(inStr){
      if(esc){ esc = false; }
      else if(c === '\\'){ esc = true; }
      else if(c === strCh){ inStr = false; }
    } else {
      if(c === '"' || c === "'"){ inStr = true; strCh = c; }
      else if(c === '['){ depth++; }
      else if(c === ']'){ depth--; if(depth === 0) return i + 1; }
    }
  }
  throw new Error('배열의 닫는 대괄호를 찾지 못했습니다.');
}

async function loadMenu(){
  const settings = loadSettings();
  if(!settings.repo || !settings.token){
    log('⚠ 먼저 ①에서 저장소와 토큰을 입력하고 "설정 저장"을 눌러주세요.', 'warn');
    return;
  }
  const btn = document.getElementById('btnLoad');
  btn.disabled = true;
  log('nav.js를 불러오는 중...');
  try{
    const url = `https://api.github.com/repos/${settings.repo}/contents/${settings.path}?ref=${encodeURIComponent(settings.branch)}`;
    const res = await fetch(url, { headers: ghHeaders(settings.token) });
    if(!res.ok){
      const body = await res.text();
      throw new Error(`GitHub 응답 오류 (${res.status}): ${body.slice(0, 200)}`);
    }
    const data = await res.json();
    const content = base64ToUtf8(data.content);
    const marker = 'const NAV_ITEMS = [';
    const startIdx = content.indexOf(marker);
    if(startIdx < 0) throw new Error('nav.js에서 "const NAV_ITEMS = [" 를 찾지 못했습니다.');
    const arrStart = startIdx + marker.length - 1; // '[' 위치
    const arrEnd = findArrayEnd(content, arrStart);
    const arrayText = content.slice(arrStart, arrEnd);
    const rows = Function('"use strict"; return (' + arrayText + ');')();

    currentFile = { content, sha: data.sha, arrayStart: arrStart, arrayEnd: arrEnd };
    currentRows = rows.map(r => ({ label: r.label || '', href: r.href || '' }));
    renderRows();
    document.getElementById('editCard').style.display = '';
    log(`불러오기 완료: 메뉴 ${currentRows.length}개`, 'ok');
  } catch(err){
    log('✕ ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function renderRows(){
  const container = document.getElementById('menuRows');
  container.innerHTML = '';
  currentRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'menu-row';
    div.innerHTML = `
      <div class="order-btns">
        <button type="button" data-act="up" data-i="${i}" ${i===0?'disabled':''}>▲</button>
        <button type="button" data-act="down" data-i="${i}" ${i===currentRows.length-1?'disabled':''}>▼</button>
      </div>
      <div class="fields">
        <input type="text" data-field="label" data-i="${i}" placeholder="메뉴 이름" value="${row.label.replace(/"/g,'&quot;')}">
        <input type="text" data-field="href" data-i="${i}" placeholder="./page.html" value="${row.href.replace(/"/g,'&quot;')}">
      </div>
      <button type="button" class="btn small danger" data-act="remove" data-i="${i}">삭제</button>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = parseInt(inp.dataset.i, 10);
      currentRows[i][inp.dataset.field] = inp.value;
    });
  });
  container.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      const act = btn.dataset.act;
      if(act === 'remove'){ currentRows.splice(i, 1); }
      else if(act === 'up' && i > 0){ [currentRows[i-1], currentRows[i]] = [currentRows[i], currentRows[i-1]]; }
      else if(act === 'down' && i < currentRows.length - 1){ [currentRows[i+1], currentRows[i]] = [currentRows[i], currentRows[i+1]]; }
      renderRows();
    });
  });
}

async function saveMenu(){
  if(!currentFile){ log('⚠ 먼저 메뉴를 불러와주세요.', 'warn'); return; }
  const settings = loadSettings();
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    const newArrayText = JSON.stringify(currentRows, null, 2);
    const newContent = currentFile.content.slice(0, currentFile.arrayStart) + newArrayText + currentFile.content.slice(currentFile.arrayEnd);
    const url = `https://api.github.com/repos/${settings.repo}/contents/${settings.path}`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(settings.token)),
      body: JSON.stringify({
        message: '메뉴 편집기로 nav.js 메뉴 목록 수정',
        content: utf8ToBase64(newContent),
        sha: currentFile.sha,
        branch: settings.branch
      })
    });
    if(!res.ok){
      const body = await res.text();
      throw new Error(`저장 실패 (${res.status}): ${body.slice(0, 300)}`);
    }
    const data = await res.json();
    currentFile.content = newContent;
    currentFile.sha = data.content.sha;
    log('✓ GitHub에 저장 완료. Netlify가 자동 배포 중이니 잠시 후 사이트에서 확인해보세요.', 'ok');
  } catch(err){
    log('✕ ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'GitHub에 저장 (바로 반영)';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  logEl = document.getElementById('logBox');

  const settings = loadSettings();
  if(settings.repo) document.getElementById('repoInput').value = settings.repo;
  if(settings.branch) document.getElementById('branchInput').value = settings.branch;
  if(settings.path) document.getElementById('pathInput').value = settings.path;
  if(settings.token) document.getElementById('tokenInput').value = settings.token;

  document.getElementById('btnSaveSettings').addEventListener('click', () => {
    const s = {
      repo: document.getElementById('repoInput').value.trim(),
      branch: document.getElementById('branchInput').value.trim() || 'main',
      path: document.getElementById('pathInput').value.trim() || 'nav.js',
      token: document.getElementById('tokenInput').value.trim()
    };
    if(!s.repo || !s.token){
      log('⚠ 저장소와 토큰은 필수예요.', 'warn');
      return;
    }
    saveSettingsToStorage(s);
    log('설정을 이 브라우저에 저장했어요.', 'ok');
  });

  document.getElementById('btnClearSettings').addEventListener('click', () => {
    localStorage.removeItem(SETTINGS_KEY);
    document.getElementById('repoInput').value = '';
    document.getElementById('branchInput').value = 'main';
    document.getElementById('pathInput').value = 'nav.js';
    document.getElementById('tokenInput').value = '';
    log('저장된 설정을 지웠어요.', 'ok');
  });

  document.getElementById('btnLoad').addEventListener('click', loadMenu);
  document.getElementById('btnAddRow').addEventListener('click', () => {
    currentRows.push({ label: '', href: './' });
    renderRows();
  });
  document.getElementById('btnSave').addEventListener('click', saveMenu);
});
</script>
</body>
</html>
