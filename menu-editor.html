<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴 편집기 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(38,43,37,0.022) 28px);
    color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5;
  }
  .wrap{ max-width: 860px; margin:0 auto; padding: 36px 20px 80px; }
  header.page-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 2px solid var(--ink); padding-bottom:14px; margin-bottom:20px; flex-wrap:wrap; gap:8px;
  }
  header.page-head h1{ font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:20px; margin:0; }
  header.page-head a.back{ font-size:12.5px; color:var(--ink-soft); text-decoration:none; }

  .intro{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:22px; }
  .intro b{ color:var(--ink); }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:8px; padding:18px; margin-bottom:16px; }
  .card h2{ font-family:'Noto Sans KR', sans-serif; font-size:14.5px; margin:0 0 10px; color:var(--stamp); }

  label.field{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  input[type=text]{
    width:100%; font-family:'Noto Sans KR', sans-serif; font-size:13.5px;
    padding:9px 10px; border:1px solid var(--rule); border-radius:6px; box-sizing:border-box; margin-bottom:12px;
  }

  .btn{
    font-family:'Noto Sans KR', sans-serif; font-size:14px; font-weight:600;
    color:var(--paper-card); background:var(--ink); border:none; border-radius:6px;
    padding:11px 16px; cursor:pointer;
  }
  .btn.primary{ background:var(--stamp); }
  .btn.small{ font-size:12px; padding:6px 10px; font-weight:600; }
  .btn.danger{ background:var(--crest-red); }
  .btn:disabled{ opacity:0.4; cursor:default; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .menu-row{
    display:flex; align-items:center; gap:8px; background:#FAFAF7; border:1px solid var(--rule-soft);
    border-radius:6px; padding:10px; margin-bottom:8px;
  }
  .menu-row.hidden-row{ opacity:0.55; }
  .menu-row .fields{ flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .menu-row input{ margin-bottom:0; font-size:13px; padding:7px 9px; }
  .menu-row .order-btns{ display:flex; flex-direction:column; gap:2px; }
  .menu-row .order-btns button{ font-size:10px; padding:2px 6px; cursor:pointer; }
  .menu-row .show-toggle{ display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--ink-soft); }
  .menu-row .show-toggle input{ margin:0; width:16px; height:16px; }

  .log{ font-size:12.5px; background:#FAFAF7; border:1px solid var(--rule-soft); border-radius:6px; padding:12px 14px; white-space:pre-wrap; max-height:220px; overflow-y:auto; margin-top:12px; }
  .log .ok{ color:#2E7D32; }
  .log .warn{ color:#C77700; }
  .log .err{ color:var(--crest-red); }

  .footnote{ margin-top:18px; font-size:11px; color:var(--ink-soft); line-height:1.6; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>메뉴 편집기</h1>
      <a class="back" href="./admin-tools.html">← 교무 업무 도구로</a>
    </header>

    <div class="intro">
      햄버거 메뉴에 뜨는 목록을 구글시트에서 직접 관리해요. 저장하면 <b>구글 로그인만으로 바로 반영</b>돼요 —
      GitHub 토큰도, 어느 컴퓨터인지도 상관없어요.
    </div>

    <div class="card" id="settingsCard">
      <h2>① 시트 연결 (최초 1회만)</h2>
      <label class="field">사이트맵 구글시트 링크 또는 ID</label>
      <input type="text" id="sheetIdInput" placeholder="https://docs.google.com/spreadsheets/d/....">
      <div class="btn-row">
        <button class="btn" id="btnSaveSettings">저장</button>
      </div>
    </div>

    <div class="card">
      <h2>② 메뉴 불러오기</h2>
      <button class="btn primary" id="btnLoad">현재 메뉴 불러오기</button>
      <div class="log" id="logBox" style="display:none;"></div>
    </div>

    <div class="card" id="editCard" style="display:none;">
      <h2>③ 메뉴 편집</h2>
      <div id="menuRows"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn small" id="btnAddRow">+ 항목 추가</button>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn primary" id="btnSave">구글시트에 저장 (바로 반영)</button>
      </div>
    </div>

    <div class="footnote">
      href는 <code>./exams.html</code>처럼 앞에 <code>./</code>을 붙인 상대경로로 적어주세요. 체크박스를 끄면 메뉴에서만 숨겨지고,
      삭제(✕)를 누르면 이 페이지의 타일 정보까지 시트에서 완전히 사라져요 — 메뉴에서만 빼고 싶으면 체크박스만 꺼주세요.
      저장하면 몇 초 안에 사이트에 반영돼요.
    </div>
  </div>

<script>
let logEl;
function log(msg, cls){
  if(!logEl) return;
  logEl.style.display = '';
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

const SETTINGS_KEY = 'ks_menu_sheet_settings';
function loadSettings(){
  try{ const raw = localStorage.getItem(SETTINGS_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveSettingsToStorage(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

function parseSheetId(input){
  const m = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : input.trim();
}

const HEADER = ['href','메뉴이름','메뉴표시(Y/N)','타일섹션(메인/교무도구/없음)','아이콘','타일제목','설명','순서'];

// currentRows: { href, label, show(bool), order, rest:[섹션,아이콘,타일제목,설명] }
let currentRows = [];
let sheetId = null;

function rowsToObjects(values){
  const rows = (values || []).slice(1);
  return rows.filter(r => r[0]).map(r => ({
    href: r[0] || '',
    label: r[1] || '',
    show: String(r[2] || '').trim().toUpperCase() === 'Y',
    rest: [r[3] || '', r[4] || '', r[5] || '', r[6] || ''],
    order: parseInt(r[7], 10) || 999
  }));
}

function rowsToValues(rows){
  return [HEADER].concat(
    rows.map((r, i) => [r.href, r.label, r.show ? 'Y' : 'N', r.rest[0], r.rest[1], r.rest[2], r.rest[3], i + 1])
  );
}

async function loadMenu(){
  const settings = loadSettings();
  if(!settings.sheetId){
    log('⚠ 먼저 ①에서 시트 링크를 입력하고 저장해주세요.', 'warn');
    return;
  }
  sheetId = settings.sheetId;
  const btn = document.getElementById('btnLoad');
  btn.disabled = true;
  btn.textContent = '구글 권한 요청 중...';
  window.__gsAuth.requestAccessToken(window.__gsAuth.SCOPES.SHEETS, async (err, token) => {
    if(err){ log('✕ 구글 권한 요청 실패: ' + err, 'err'); btn.disabled = false; btn.textContent = '현재 메뉴 불러오기'; return; }
    try{
      btn.textContent = '불러오는 중...';
      const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:H1000`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(!res.ok) throw new Error(`시트 읽기 실패 (${res.status}): ${(await res.text()).slice(0,300)}`);
      const data = await res.json();
      currentRows = rowsToObjects(data.values).sort((a, b) => a.order - b.order);
      renderRows();
      document.getElementById('editCard').style.display = '';
      log(`불러오기 완료: 전체 ${currentRows.length}개 (메뉴 표시 ${currentRows.filter(r=>r.show).length}개)`, 'ok');
    } catch(err){
      log('✕ ' + err.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = '현재 메뉴 불러오기';
    }
  });
}

function renderRows(){
  const container = document.getElementById('menuRows');
  container.innerHTML = '';
  currentRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'menu-row' + (row.show ? '' : ' hidden-row');
    div.innerHTML = `
      <div class="order-btns">
        <button type="button" data-act="up" data-i="${i}" ${i===0?'disabled':''}>▲</button>
        <button type="button" data-act="down" data-i="${i}" ${i===currentRows.length-1?'disabled':''}>▼</button>
      </div>
      <label class="show-toggle">
        <input type="checkbox" data-act="toggle" data-i="${i}" ${row.show ? 'checked' : ''}>
        표시
      </label>
      <div class="fields">
        <input type="text" data-field="label" data-i="${i}" placeholder="메뉴 이름" value="${row.label.replace(/"/g,'&quot;')}">
        <input type="text" data-field="href" data-i="${i}" placeholder="./page.html" value="${row.href.replace(/"/g,'&quot;')}">
      </div>
      <button type="button" class="btn small danger" data-act="remove" data-i="${i}" title="시트에서 완전히 삭제">✕</button>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = parseInt(inp.dataset.i, 10);
      currentRows[i][inp.dataset.field] = inp.value;
    });
  });
  container.querySelectorAll('input[data-act="toggle"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const i = parseInt(cb.dataset.i, 10);
      currentRows[i].show = cb.checked;
      renderRows();
    });
  });
  container.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      const act = btn.dataset.act;
      if(act === 'remove'){
        if(!confirm(`"${currentRows[i].label || currentRows[i].href}" 항목을 시트에서 완전히 삭제할까요? (타일 정보도 함께 사라져요)`)) return;
        currentRows.splice(i, 1);
      }
      else if(act === 'up' && i > 0){ [currentRows[i-1], currentRows[i]] = [currentRows[i], currentRows[i-1]]; }
      else if(act === 'down' && i < currentRows.length - 1){ [currentRows[i+1], currentRows[i]] = [currentRows[i], currentRows[i+1]]; }
      renderRows();
    });
  });
}

async function saveMenu(){
  if(!sheetId){ log('⚠ 먼저 메뉴를 불러와주세요.', 'warn'); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '구글 권한 요청 중...';
  window.__gsAuth.requestAccessToken(window.__gsAuth.SCOPES.SHEETS, async (err, token) => {
    if(err){ log('✕ 구글 권한 요청 실패: ' + err, 'err'); btn.disabled = false; btn.textContent = '구글시트에 저장 (바로 반영)'; return; }
    try{
      btn.textContent = '기존 내용 지우는 중...';
      const clearRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:Z1000:clear`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if(!clearRes.ok) throw new Error(`초기화 실패 (${clearRes.status}): ${(await clearRes.text()).slice(0,300)}`);

      btn.textContent = '저장 중...';
      const values = rowsToValues(currentRows);
      const writeRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1?valueInputOption=RAW`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values })
      });
      if(!writeRes.ok) throw new Error(`저장 실패 (${writeRes.status}): ${(await writeRes.text()).slice(0,300)}`);

      log('✓ 구글시트에 저장 완료. 사이트에서 몇 초 안에 반영돼요 (탭을 새로고침해보세요).', 'ok');
    } catch(err){
      log('✕ ' + err.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = '구글시트에 저장 (바로 반영)';
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  logEl = document.getElementById('logBox');

  const settings = loadSettings();
  if(settings.sheetId) document.getElementById('sheetIdInput').value = settings.sheetRaw || settings.sheetId;

  document.getElementById('btnSaveSettings').addEventListener('click', () => {
    const raw = document.getElementById('sheetIdInput').value.trim();
    if(!raw){ log('⚠ 시트 링크나 ID를 입력해주세요.', 'warn'); return; }
    saveSettingsToStorage({ sheetId: parseSheetId(raw), sheetRaw: raw });
    log('설정을 이 브라우저에 저장했어요.', 'ok');
  });

  document.getElementById('btnLoad').addEventListener('click', loadMenu);
  document.getElementById('btnAddRow').addEventListener('click', () => {
    currentRows.push({ href: './', label: '', show: true, rest: ['없음','','',''], order: currentRows.length + 1 });
    renderRows();
  });
  document.getElementById('btnSave').addEventListener('click', saveMenu);
});
</script>
</body>
</html>
