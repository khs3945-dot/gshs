<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 1560px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:14.3px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:23.8px; margin:0 0 6px; }
  .sub{ font-size:14.8px; color:var(--ink-soft); margin-bottom:24px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:22px 24px; margin-bottom:18px; }
  .card h2{ font-family:'Noto Sans KR', sans-serif; font-size:16.8px; margin:0 0 12px; color:var(--stamp); }
  .card p.hint{ font-size:14.3px; color:var(--ink-soft); margin:0 0 14px; }

  .btn{
    font-family:'Noto Sans KR', sans-serif; font-size:15.3px; font-weight:700;
    color:#fff; background:var(--ink); border:none; border-radius:6px; padding:10px 16px; cursor:pointer;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ color:var(--ink); background:none; border:1px solid var(--rule); }

  table{ width:100%; border-collapse:collapse; font-size:14.3px; margin-top:14px; }
  th, td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--rule-soft); }
  th{ color:var(--ink-soft); font-weight:600; }
  .status-ok{ color: var(--brass); font-weight:600; }
  .status-err{ color: var(--crest-red); font-weight:600; }

  .msg{ font-size:14.3px; border-radius:6px; padding:9px 11px; margin-bottom:14px; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  #gate{ text-align:center; padding: 60px 0; }
  #gate p{ font-size:14.8px; color:var(--ink-soft); }
  #appArea{ display:none; }
</style>

<style>

    .ks-app{ flex-direction:column; } .ks-sidebar{ display:none; } .ks-topbar{ display:none; }
    .ks-mobile-topbar{ display:flex; align-items:center; gap:4px; padding:10px 14px; background: var(--ks-card);

    .ks-mobile-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;

    .ks-mobile-spacer{ flex:1; }
    .ks-mobile-login{ font-size:14.3px; font-weight:700; color: var(--ks-primary); text-decoration:none; padding:0 6px; }

  /* 글꼴 + 모서리 둥글게 */
  *, *::before, *::after{ font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif !important; }

  /* 버튼: 밋밋한 흰색 보조 버튼에 은은한 색(인디고 20% 배경 + 진한 인디고 글자) */

</style>

  @media (max-width:374px){ #ksMobileAuth .ks-user-avatar{ display:none !important; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let parsedRows = [];

  // 관리자 계정(로그인 + profiles.is_admin=true) 확인
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('gateMsg').textContent = '로그인이 필요합니다.';
    document.getElementById('gateLoginLink').style.display = 'inline-block';
    return;
  }
  const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
  if(!profile || !profile.is_admin){
    document.getElementById('gateMsg').textContent = '관리자 계정만 접근할 수 있어요.';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('appArea').style.display = 'block';

  document.getElementById('btnDownloadTemplate').addEventListener('click', () => {
    const ws = XLSX.utils.aoa_to_sheet([
      ['이름', '초기비밀번호(선택)', '이메일(선택)', '전화번호', '내선번호', '부서', '담임여부(Y/N)', '담임반', '교과'],
      ['홍길동', '', 'hong@example.com', '010-1234-5678', '1234', '교무부', 'Y', '2학년 3반', '수학']
    ]);
    ws['!cols'] = [{ wch: 10 }, { wch: 14 }, { wch: 24 }, { wch: 16 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '회원목록');
    XLSX.writeFile(wb, '경성고_회원_일괄등록_양식.xlsx');
  });

  function parseHomeroom(v){
    const s = String(v || '').trim().toLowerCase();
    return ['y', 'yes', '예', 'o', 'true', '1'].includes(s);
  }

  function renderPreview(rows){
    const area = document.getElementById('previewArea');
    if(!rows.length){ area.innerHTML = '<div class="msg error">읽을 수 있는 행이 없습니다.</div>'; return; }
    area.innerHTML = `
      <table>
        <tr><th>이름</th><th>초기비밀번호</th><th>이메일</th><th>전화번호</th><th>내선</th><th>부서</th><th>담임</th><th>담임반</th><th>교과</th></tr>
        ${rows.map(r => `<tr><td>${r.name}</td><td>${r.password || '(자동생성)'}</td><td>${r.email}</td><td>${r.phone}</td><td>${r.extension}</td><td>${r.department}</td><td>${r.is_homeroom ? 'Y' : ''}</td><td>${r.homeroom_class}</td><td>${r.subject}</td></tr>`).join('')}
      </table>
    `;
    document.getElementById('submitCard').style.display = 'block';
    document.getElementById('submitMsg').innerHTML = `<div class="msg success">${rows.length}명을 등록할 준비가 되었습니다.</div>`;
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    parsedRows = rows.map(r => ({
      name: String(r['이름'] || '').trim(),
      password: String(r['초기비밀번호(선택)'] || '').trim(),
      email: String(r['이메일(선택)'] || '').trim(),
      phone: String(r['전화번호'] || '').trim(),
      extension: String(r['내선번호'] || '').trim(),
      department: String(r['부서'] || '').trim(),
      subject: String(r['교과'] || '').trim(),
      is_homeroom: parseHomeroom(r['담임여부(Y/N)']),
      homeroom_class: String(r['담임반'] || '').trim()
    })).filter(r => r.name);
    renderPreview(parsedRows);
  });

  document.getElementById('btnSubmit').addEventListener('click', async () => {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = '등록하는 중…';
    const { data, error } = await sb.functions.invoke('bulk-register-users', {
      body: { rows: parsedRows }
    });
    btn.disabled = false; btn.textContent = '일괄 등록하기';
    const resultArea = document.getElementById('resultArea');
    if(error){
      resultArea.innerHTML = `<div class="msg error">등록 중 오류가 발생했습니다: ${error.message}</div>`;
      return;
    }
    resultArea.innerHTML = `
      <table>
        <tr><th>이름</th><th>결과</th><th>초기비밀번호</th></tr>
        ${data.results.map(r => `<tr><td>${r.name}</td><td class="${r.ok ? 'status-ok' : 'status-err'}">${r.ok ? '성공' : '실패: ' + r.error}</td><td>${r.ok ? r.password : ''}</td></tr>`).join('')}
      </table>
      <p class="hint">초기비밀번호는 지금만 표시돼요. 각 선생님께 직접 전달해주세요.</p>
    `;
  });
})();
</script>

<script>
(function(){
  function openRealSiteSearch(){ var b = document.querySelector('.gsnav-search-btn'); if(b) b.click(); }
  var ts = document.getElementById('ksTopSearch'); if(ts){ ts.addEventListener('click', openRealSiteSearch); ts.addEventListener('focus', openRealSiteSearch); }
  var ms = document.getElementById('ksMobileSearchBtn'); if(ms) ms.addEventListener('click', openRealSiteSearch);
  var sidebar = document.getElementById('ksSidebar');
  var burger = document.getElementById('ksMobileBurger');
  if(burger) burger.addEventListener('click', function(){ sidebar.classList.add('ks-mobile-open'); });
  document.addEventListener('click', function(e){
    if(sidebar && sidebar.classList.contains('ks-mobile-open') && !e.target.closest('.ks-sidebar') && !e.target.closest('#ksMobileBurger')){
      sidebar.classList.remove('ks-mobile-open');
    }
  });
  // 공지사항(작성 기간 안인 것만)을 이름 오른쪽에 하나씩 돌아가며 보여줘요 — 여러 개면
  // 4초마다 다음 걸로 부드럽게 바뀌고, 클릭하면 공지사항 페이지로 이동해요. 쓰이지 않던
  // 알림 종 아이콘을 대신해 실제로 쓰이는 정보를 보여주기 위한 것.
  async function loadAnnounceTicker(sb2){
    var ticker = document.getElementById('ksAnnounceTicker');
    var textEl = document.getElementById('ksAnnounceText');
    if(!ticker || !textEl) return;
    try{
      var nowIso = new Date().toISOString();
      var res = await sb2.from('announcements').select('title').lte('starts_at', nowIso).gte('ends_at', nowIso).order('starts_at', { ascending:false });
      var data = res.data;
      if(!data || !data.length) return;
      ticker.style.display = '';
      ticker.title = '공지사항 — 눌러서 보기';
      ticker.addEventListener('click', function(){ location.href = './announce.html'; });
      var idx = 0;
      textEl.textContent = data[0].title;
      if(data.length > 1){
        setInterval(function(){
          textEl.classList.add('ks-announce-fading');
          setTimeout(function(){
            idx = (idx + 1) % data.length;
            textEl.textContent = data[idx].title;
            textEl.classList.remove('ks-announce-fading');
          }, 250);
        }, 4000);
      }
    }catch(e){ /* 공지사항을 못 불러와도 조용히 무시 — 로그인 배지 표시에는 영향 없음 */ }
  }
  function waitForSupabase(cb, attemptsLeft){
    if(window.supabase){ cb(); return; }
    if(attemptsLeft <= 0) return;
    setTimeout(function(){ waitForSupabase(cb, attemptsLeft - 1); }, 200);
  }
  waitForSupabase(async function(){
    var sb = window.supabase.createClient('https://tmssupuskkajahpuswcj.supabase.co', 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W', { auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false } });
    var sess = (await sb.auth.getSession()).data.session;
    var userEl = document.getElementById('ksUser');
    var mobileEl = document.getElementById('ksMobileAuth');
    if(!sess){
      var returnTo = encodeURIComponent(location.pathname + location.search);
      if(userEl) userEl.innerHTML = '<a class="login-link" href="./login.html?return=' + returnTo + '">로그인</a>';
      if(mobileEl) mobileEl.innerHTML = '<a class="ks-mobile-login" href="./login.html?return=' + returnTo + '">로그인</a>';
      return;
    }
    var prof = (await sb.from('profiles').select('name').eq('id', sess.user.id).maybeSingle()).data;
    var name = (prof && prof.name) || '선생님';
    var initial = name.slice(0, 1);
    if(userEl) userEl.innerHTML = '<span class="ks-user-avatar">' + initial + '</span><span class="ks-user-name">' + name + '님</span><button type="button" class="ks-logout-btn" id="ksLogout">로그아웃</button>';
    if(mobileEl) mobileEl.innerHTML = '<span class="ks-user-avatar" style="width:26px;height:26px;font-size:12.8px;">' + initial + '</span><span class="ks-mobile-user-name">' + name + '님</span><button type="button" class="ks-mobile-logout-btn" id="ksMobileLogout">로그아웃</button>';
    ['ksLogout','ksMobileLogout'].forEach(function(id){ var b = document.getElementById(id); if(b) b.addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); }); });
    loadAnnounceTicker(sb);
  }, 25);
})();
</script>
