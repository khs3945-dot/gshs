<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기능 개선 의견 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #DAD1B6; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; }
  .wrap{ max-width: 720px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  h1{ font-weight:700; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:24px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:22px 24px; margin-bottom:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .card h2{ font-size:15px; margin:0; color:var(--stamp); }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }

  .btn{ font-family:inherit; font-size:13.5px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:6px; padding:9px 15px; cursor:pointer; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ color:var(--ink); background:#fff; border:1px solid var(--rule); }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  .form-row{ display:flex; flex-direction:column; gap:8px; }
  .form-row textarea{ font-family:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--rule); border-radius:6px; resize:vertical; }

  .fb-row{ padding:10px 4px; border-bottom:1px solid var(--rule-soft); font-size:12.5px; }
  .fb-row:last-child{ border-bottom:none; }
  .fb-row .content{ white-space:pre-wrap; word-break:break-word; margin-bottom:4px; }
  .fb-row .meta{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:11px; flex-wrap:wrap; }
  .fb-status{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px; white-space:nowrap; }
  .fb-status.new{ background:var(--stamp-soft); color:var(--stamp); }
  .fb-status.planned{ background:var(--brass-soft); color:var(--brass); }
  .fb-status.done{ background:rgba(0,0,0,0.06); color:var(--ink-soft); }
  .fb-status.declined{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .fb-row select{ font-family:inherit; font-size:11px; padding:3px 5px; border:1px solid var(--rule); border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 메인으로</a>
  <h1>기능 개선 의견</h1>
  <div class="sub">이 사이트에 있으면 좋겠다 싶은 기능이나 불편한 점을 자유롭게 남겨주세요. 관리자가 직접 읽어보고 괜찮은 의견은 반영해요.</div>

  <div class="card" id="gateView" style="display:none;">
    <p class="hint">이 기능은 선생님 로그인 후에만 쓸 수 있어요.</p>
    <a class="btn" href="./login.html">로그인하러 가기</a>
  </div>
  <div class="card" id="pendingView" style="display:none;">
    <p class="hint">관리자 승인을 기다리고 있어요. 승인되면 바로 이용하실 수 있어요.</p>
  </div>

  <div id="mainView" style="display:none;">
    <div class="card">
      <div class="card-head"><h2>의견 남기기</h2></div>
      <div id="fbMsg"></div>
      <div class="form-row">
        <textarea id="fbContent" rows="4" placeholder="예: 캘린더에서 학사일정도 색으로 구분해서 보여주면 좋겠어요"></textarea>
        <button type="button" class="btn" id="btnFbSave" style="align-self:flex-start;">의견 보내기</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>내가 남긴 의견</h2></div>
      <div id="myFbList"></div>
    </div>

    <div class="card" id="adminFbCard" style="display:none;">
      <div class="card-head"><h2>전체 의견 (관리자)</h2></div>
      <p class="hint">상태를 바꾸면 바로 저장돼요.</p>
      <div id="allFbList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://tmssupuskkajahpuswcj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g7j_5q6QSPfaYKHycDiU4w_oNZxJd4W';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function el(id){ return document.getElementById(id); }
  function setMsg(elId, text, type){ el(elId).innerHTML = text ? `<div class="msg ${type}">${text}</div>` : ''; }
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const STATUS_LABELS = { new: '새 의견', planned: '반영 예정', done: '반영 완료', declined: '보류' };
  function fmtDate(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
  }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){ el('gateView').style.display = 'block'; return; }
  const { data: gateProfile } = await sb.from('profiles').select('approved, name, is_admin').eq('id', session.user.id).maybeSingle();
  if(!gateProfile || !gateProfile.approved){ el('pendingView').style.display = 'block'; return; }
  el('mainView').style.display = 'block';

  async function loadMyFeedback(){
    const { data, error } = await sb.from('feature_feedback').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false });
    if(error){ el('myFbList').innerHTML = '<div class="hint" style="padding:0;">불러오지 못했습니다.</div>'; return; }
    if(!data || !data.length){ el('myFbList').innerHTML = '<div class="hint" style="padding:0;">아직 남긴 의견이 없어요.</div>'; return; }
    el('myFbList').innerHTML = data.map(f => `
      <div class="fb-row">
        <div class="content">${escapeHtml(f.content)}</div>
        <div class="meta"><span class="fb-status ${f.status}">${STATUS_LABELS[f.status] || f.status}</span>${fmtDate(f.created_at)}</div>
      </div>
    `).join('');
  }

  el('btnFbSave').addEventListener('click', async () => {
    const content = el('fbContent').value.trim();
    if(!content){ setMsg('fbMsg', '내용을 입력해주세요.', 'error'); return; }
    el('btnFbSave').disabled = true;
    const { error } = await sb.from('feature_feedback').insert({
      user_id: session.user.id, name: gateProfile.name || null, content,
    });
    el('btnFbSave').disabled = false;
    if(error){ setMsg('fbMsg', '보내지 못했어요: ' + error.message, 'error'); return; }
    el('fbContent').value = '';
    setMsg('fbMsg', '의견을 보냈어요. 읽어봐 주셔서 감사해요!', 'success');
    loadMyFeedback();
    if(gateProfile.is_admin) loadAllFeedback();
  });

  // ---------- 관리자용: 전체 의견 보기·상태 바꾸기 ----------
  async function loadAllFeedback(){
    const { data, error } = await sb.from('feature_feedback').select('*').order('created_at', { ascending: false });
    if(error){ el('allFbList').innerHTML = '<div class="hint" style="padding:0;">불러오지 못했습니다.</div>'; return; }
    if(!data || !data.length){ el('allFbList').innerHTML = '<div class="hint" style="padding:0;">아직 들어온 의견이 없어요.</div>'; return; }
    el('allFbList').innerHTML = data.map(f => `
      <div class="fb-row">
        <div class="content">${escapeHtml(f.content)}</div>
        <div class="meta">
          <span>${escapeHtml(f.name || '(이름 없음)')}</span>
          <span>${fmtDate(f.created_at)}</span>
          <select class="fbStatusSelect" data-id="${f.id}">
            ${Object.entries(STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v}</option>`).join('')}
          </select>
        </div>
      </div>
    `).join('');
    el('allFbList').querySelectorAll('.fbStatusSelect').forEach(sel => sel.addEventListener('change', async () => {
      const { error: updErr } = await sb.from('feature_feedback').update({ status: sel.value, updated_at: new Date().toISOString() }).eq('id', sel.dataset.id);
      if(updErr) alert('상태 저장 실패: ' + updErr.message);
    }));
  }

  if(gateProfile.is_admin){
    el('adminFbCard').style.display = 'block';
    loadAllFeedback();
  }

  loadMyFeedback();
})();
</script>
</body>
</html>
