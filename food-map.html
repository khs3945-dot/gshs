<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집 공유지도 — 경성고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./site-login-badge.js" defer></script>
<script src="./nav.js" defer></script>
<style>
  :root{
    --paper: #F7F8FA; --paper-card: #FFFFFF; --ink: #262B25; --ink-soft: #5C5A47;
    --rule: #C7BC9C; --rule-soft: #E6E0CC; --stamp: #264085; --stamp-soft: rgba(38,64,133,0.08);
    --crest-red: #EE2E22; --brass: #6E6234; --brass-soft: rgba(110,98,52,0.10);
    --shadow-sm: 0 1px 3px rgba(38,45,30,0.06), 0 1px 2px rgba(38,45,30,0.04);
    --shadow-md: 0 6px 20px rgba(38,45,30,0.08), 0 2px 6px rgba(38,45,30,0.05);
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width: 1880px; margin:0 auto; padding: 40px 20px 80px; }
  a.back{ display:inline-block; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); text-decoration:none; }
  a.back:hover{ color:var(--stamp); }
  h1{ font-weight:800; font-size:23px; margin:0 0 6px; letter-spacing:-0.2px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:24px; max-width:720px; }

  .card{ background:var(--paper-card); border:1px solid var(--rule-soft); border-radius:var(--radius); padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow-sm); }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .card h2{ font-size:15px; margin:0; color:var(--stamp); font-weight:800; }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }

  .btn{ font-family:inherit; font-size:13px; font-weight:700; color:#fff; background:var(--ink); border:none; border-radius:9px; padding:9px 15px; cursor:pointer; transition:transform 0.1s ease, opacity 0.15s ease, box-shadow 0.15s ease; }
  .btn:hover:not(:disabled){ opacity:0.88; }
  .btn:active:not(:disabled){ transform:scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .btn.secondary{ color:var(--ink); background:#fff; border:1px solid var(--rule-soft); }
  .btn.secondary:hover:not(:disabled){ border-color:var(--stamp); color:var(--stamp); opacity:1; }
  .btn.small{ font-size:12px; padding:7px 11px; }
  .btn.danger{ color:#fff; background:var(--crest-red); }
  .btn.active-mode{ background:var(--crest-red); box-shadow:0 0 0 3px rgba(238,46,34,0.15); }

  .msg{ font-size:12.5px; border-radius:6px; padding:9px 11px; margin-bottom:12px; white-space:pre-wrap; }
  .msg.error{ background:rgba(238,46,34,0.08); color:var(--crest-red); }
  .msg.success{ background:var(--brass-soft); color:var(--brass); }

  .toolbar-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  #fmSearch{ flex:1; min-width:140px; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--rule-soft); border-radius:9px; transition:border-color 0.15s ease; }
  #fmSearch:focus{ outline:none; border-color:var(--stamp); }
  #fmSort{ font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink); padding:8px 10px; border:1px solid var(--rule-soft); border-radius:9px; background:#fff; cursor:pointer; }
  .filter-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .toggle-pill{
    font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--paper); border:1px solid var(--rule-soft);
    border-radius:999px; padding:6px 13px; cursor:pointer; white-space:nowrap; transition:all 0.15s ease;
  }
  .toggle-pill:hover{ border-color:var(--stamp); color:var(--stamp); }
  .toggle-pill.active{ background:var(--stamp); border-color:var(--stamp); color:#fff; }
  .my-stats-line{ font-size:12px; color:var(--ink-soft); background:var(--stamp-soft); border-radius:9px; padding:8px 11px; margin-bottom:10px; }
  .my-stats-line b{ color:var(--stamp); }
  .cat-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .cat-pill{
    font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--paper); border:1px solid var(--rule-soft);
    border-radius:999px; padding:6px 13px; cursor:pointer; white-space:nowrap; transition:all 0.15s ease;
  }
  .cat-pill:hover{ border-color:var(--stamp); color:var(--stamp); }
  .cat-pill.active{ background:var(--stamp); border-color:var(--stamp); color:#fff; }

  .search-add-row{ display:flex; gap:6px; margin-bottom:6px; }
  .search-add-row input{ flex:1; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--rule-soft); border-radius:9px; transition:border-color 0.15s ease; }
  .search-add-row input:focus{ outline:none; border-color:var(--stamp); }
  .place-result{ display:flex; gap:9px; padding:9px 11px; border:1px solid var(--rule-soft); border-radius:9px; margin-top:6px; cursor:pointer; transition:all 0.15s ease; }
  .place-result:hover{ background:var(--stamp-soft); border-color:var(--stamp); }
  .place-result-num{ flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--crest-red); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .place-result-main{ flex:1; min-width:0; }
  .place-result-name{ font-weight:700; font-size:13px; color:var(--stamp); }
  .place-result-addr{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .place-result-meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  #foodMap{ width:100%; height:1140px; border-radius:var(--radius); border:1px solid var(--rule-soft); background:var(--paper); }

  /* 왼쪽(검색창+검색결과) / 가운데(지도) / 오른쪽(카테고리 선택+저장한 목록) 3단 구성.
     좁은 화면에서는 세로로 쌓여요. 지도를 더 키운 뒤(세로 1.5배, 760px→1140px)
     지도 칸의 flex 비중도 같이 늘려서(1.5→2.3) 가로로도 더 넓게 차지하게 했다.
     검색 칸(fm-search-col)의 min-width를 0으로 두면 지도 칸이 더 많은 비중을
     가져가는 1300px 안팎 화면에서 검색창+검색 버튼 한 줄(search-add-row)이
     카드 폭보다 넓어져 버튼이 카드 밖으로 삐져나가고, 그 자리를 뒤에 그려지는
     지도 칸의 카드가 덮어써서 "검색" 버튼을 클릭할 수 없게 되는 문제가 있었다
     — 검색창+버튼이 항상 한 줄에 들어갈 최소 폭(300px)을 보장해서 고쳤다.
     같은 이유로 오른쪽 목록 칸(fm-list-col)도 min-width:0이면, 지도 칸이
     비중을 더 가져가는 화면 폭에서 목록 칸이 글자 하나 겨우 들어갈 정도로
     짓눌릴 수 있었다 — .spot-item-main이 flex:1; min-width:0이라 부모가
     좁아지는 대로 계속 줄어들고, .spot-item-title의 word-break:break-word가
     더 줄일 공간이 없으면 결국 한 글자씩 세로로 줄바꿈해버려서("동베르데"가
     세로로 한 글자씩 쌓이는 식) 제목이 읽을 수 없게 길쭉해지는 버그였다 —
     목록 카드(이름+카테고리 배지, 좋아요/별점 버튼)가 항상 한 줄에 들어갈
     최소 폭(260px)을 보장해서 고쳤다. */
  .fm-layout{ display:flex; gap:16px; align-items:flex-start; }
  .fm-search-col{ flex:0.85; min-width:300px; max-width:340px; }
  .fm-map-col{ flex:2.3; min-width:0; }
  .fm-list-col{ flex:1; min-width:260px; max-width:420px; }
  .fm-search-col .card, .fm-list-col .card{ max-height:calc(1140px + 2px); display:flex; flex-direction:column; }
  .fm-search-col #placeSearchResults{ overflow-y:auto; flex:1; min-height:0; }
  .fm-list-col #spotList{ overflow-y:auto; flex:1; min-height:0; }
  @media (max-width: 820px){
    .fm-layout{ flex-direction:column; }
    .fm-search-col, .fm-list-col{ max-width:none; min-width:0; }
    .fm-search-col .card, .fm-list-col .card{ max-height:none; }
    .fm-search-col #placeSearchResults, .fm-list-col #spotList{ overflow-y:visible; }
    /* #foodMap의 1140px 높이는 넓은 화면에서 지도를 키우려고 정한 값이라,
       휴대폰 화면(보통 이 페이지 높이는 세로 스크롤로 보게 됨)에서 그대로
       쓰면 지도 하나가 화면 몇 개 분량을 차지해버려서 검색/목록까지 스크롤이
       너무 길어진다 — 모바일에서는 420px로 줄여서 지도를 보고 바로 아래
       검색/추가 버튼, 목록까지 자연스럽게 스크롤할 수 있게 했다. */
    #foodMap{ height:420px; }
  }
  .add-mode-hint{ font-size:12.5px; color:var(--crest-red); font-weight:700; margin:8px 0 0; display:none; }
  body.fm-add-mode #foodMap{ cursor:crosshair; }
  body.fm-add-mode .add-mode-hint{ display:block; }

  .form-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; padding:14px; background:var(--paper); border-radius:11px; border:1px solid var(--rule-soft); }
  .form-row input[type=text], .form-row textarea{
    font-family:inherit; font-size:13.5px; padding:9px 11px; border:1px solid var(--rule-soft); border-radius:8px; resize:vertical; width:100%; background:#fff;
  }
  .form-row input[type=text]:focus, .form-row textarea:focus{ outline:none; border-color:var(--stamp); }
  .form-row textarea{ min-height:80px; }
  .form-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .spot-block{ border:1px solid var(--rule-soft); border-radius:12px; margin-bottom:8px; transition:box-shadow 0.15s ease, border-color 0.15s ease; }
  .spot-block:hover{ box-shadow:var(--shadow-md); border-color:var(--rule); }
  .spot-block:last-child{ margin-bottom:0; }
  /* flex-wrap:wrap + .spot-item-main의 min-width(0이 아닌 값)가 핵심 — 수정/삭제
     버튼까지 붙어 .spot-item-side가 필요로 하는 최소 폭(여러 버튼 + 간격, flex-
     shrink:0이라 더 안 줄어듦)이 카드 전체 폭보다 넓어지는 좁은 화면(태블릿
     가로폭이나 비좁은 노트북 창 등)에서, min-width:0짜리 main이 끝없이
     짓눌리다 못해 0px까지 줄어들고 제목이 한 글자씩 세로로 쌓이는("동베르데"가
     세로로 한 글자씩 늘어지는) 버그가 있었다. flex-wrap:wrap을 주면 공간이
     부족할 때 side가 아예 다음 줄로 줄바꿈되고, main은 항상 최소 폭이 확보된다.
     이름(상호명)·설명 칸에 더 넓은 폭을 주고 카드 높이는 더 줄여달라는 요청으로,
     이름·카테고리+설명을 각각 한 줄(말줄임표로 잘림)로 고정하고 — 전에는 이름
     옆에 카테고리가 붙어있었는데, 카테고리+설명을 이름 아래 둘째 줄로 내려서
     이름 줄이 가로 전체를 쓸 수 있게 했다 — 세로 패딩/줄 간격도 줄였다. */
  .spot-item{ display:flex; flex-wrap:wrap; gap:4px 12px; padding:10px 14px; cursor:pointer; border-radius:12px; }
  .spot-item:hover{ background:var(--stamp-soft); }
  .spot-item-main{ flex:1 1 160px; min-width:160px; }
  .spot-item-title{ font-weight:700; font-size:14px; color:var(--stamp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spot-item-sub{ display:flex; align-items:center; gap:6px; margin-top:2px; }
  .spot-item-cat{ font-size:10px; background:var(--stamp-soft); color:var(--stamp); border-radius:9px; padding:1px 8px; white-space:nowrap; flex-shrink:0; }
  .spot-item-desc{ flex:1; min-width:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spot-item-addr{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .spot-item-meta{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
  .spot-item-meta a{ color:var(--stamp); }
  /* 카드를 더 짧게 줄이기 위해, 좋아요/별점/수정/삭제를 세로로 쌓지 않고 한 줄에
     나란히(오른쪽 끝에) 배치해요. 주소·작성자·날짜·카카오맵 링크는 카드를
     클릭하면 지도가 그 위치로 이동하며 핀 팝업(togglePopup)에도 뜨지만, 지도가
     화면 밖(모바일에서 목록보다 위/스크롤 밖)에 있으면 그 변화가 안 보여서
     "눌러도 아무 반응이 없다"로 보일 수 있다 — 그래서 카드 자체에도 같은 정보를
     아코디언으로 펼쳐 보여준다(.spot-item-details, 지도 상태와 무관하게 항상
     바로 확인 가능). */
  .spot-item-side{ display:flex; flex-direction:row; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:5px; flex-shrink:0; max-width:100%; }
  .like-btn, .review-toggle-btn{ font-family:inherit; font-size:12px; font-weight:700; border:1px solid var(--rule-soft); background:#fff; color:var(--ink-soft); border-radius:999px; padding:4px 10px; cursor:pointer; white-space:nowrap; transition:all 0.15s ease; }
  .like-btn.liked{ background:rgba(238,46,34,0.08); border-color:var(--crest-red); color:var(--crest-red); }
  .review-toggle-btn:hover, .like-btn:hover{ border-color:var(--stamp); color:var(--stamp); }
  .spot-item-actions{ display:flex; gap:5px; }
  .spot-item-actions .btn.small{ font-size:11.5px; padding:5px 9px; }

  .spot-item-details{ display:none; padding:0 14px 12px; font-size:12px; color:var(--ink-soft); }
  .spot-block.open .spot-item-details{ display:block; }
  .spot-item-details .sid-row{ margin-top:3px; }
  .spot-item-details a{ color:var(--stamp); }

  .spot-reviews{ padding:4px 10px 16px; background:var(--paper); border-radius:0 0 12px 12px; }
  .review-row{ padding:8px 10px; border-bottom:1px dashed var(--rule-soft); }
  .review-row:last-child{ border-bottom:none; }
  .review-row-head{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .review-stars{ color:var(--brass); letter-spacing:1px; }
  .review-author{ font-size:12px; font-weight:700; }
  .review-date{ font-size:10.5px; color:var(--ink-soft); }
  .review-comment{ font-size:12.5px; margin-top:3px; white-space:pre-wrap; }
  .review-form{ display:flex; flex-direction:column; gap:8px; padding:12px; margin-top:4px; background:var(--paper-card); border:1px solid var(--rule-soft); border-radius:11px; }
  .star-picker{ font-size:22px; letter-spacing:2px; cursor:pointer; color:var(--brass); }
  .star-pick{ display:inline-block; }
  .review-comment-input{ font-family:inherit; font-size:12.5px; padding:8px 10px; border:1px solid var(--rule-soft); border-radius:8px; }
  .review-comment-input:focus{ outline:none; border-color:var(--stamp); }

  .popup-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .popup-title{ font-weight:700; color:var(--stamp); margin:0; }
  .popup-close{ cursor:pointer; color:var(--ink-soft); font-size:13px; }
  .popup-cat{ font-size:10.5px; background:var(--stamp-soft); color:var(--stamp); border-radius:9px; padding:1px 8px; display:inline-block; margin-top:4px; }
  .popup-desc{ font-size:12.5px; white-space:pre-wrap; margin:6px 0 0; }
  .popup-meta{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
  .popup-kakao-link{ display:inline-block; margin-top:6px; font-size:11.5px; font-weight:700; color:var(--stamp); }
  .popup-actions{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .popup-actions .btn{ padding:5px 9px; font-size:11.5px; }
  .popup-reviews{ margin-top:8px; border-top:1px solid var(--rule-soft); padding-top:8px; }
  .popup-reviews .review-row{ margin-bottom:6px; }
  .popup-reviews .review-form{ padding:9px; margin-top:4px; }
  .fm-popup{ background:#fff; border:1px solid var(--rule-soft); border-radius:12px; padding:11px 13px; width:240px; box-shadow:var(--shadow-md); max-height:420px; overflow-y:auto; }

  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding:14px 4px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 메인으로</a>
  <h1>맛집 공유지도</h1>
  <div class="sub">선생님들이 추천하는 맛집을 지도 위에 직접 찍어서 공유해요. 카카오맵에서 가게를 검색해 추가하거나, 지도를 직접 클릭해서 위치를 고를 수 있어요.</div>

  <div class="card" id="gateView" style="display:none;">
    <p class="hint">이 기능은 선생님 로그인 후에만 쓸 수 있어요.</p>
    <a class="btn" href="./login.html">로그인하러 가기</a>
  </div>
  <div class="card" id="pendingView" style="display:none;">
    <p class="hint">관리자 승인을 기다리고 있어요. 승인되면 바로 이용하실 수 있어요.</p>
  </div>

  <div id="mainView" style="display:none;">
    <div class="fm-layout">
      <div class="fm-search-col">
        <div class="card">
          <div class="card-head"><h2>장소 검색</h2></div>
          <p class="hint">카카오맵에서 가게 이름으로 검색해 추가할 위치를 찾아요.</p>
          <div class="search-add-row">
            <input type="text" id="placeSearchInput" placeholder="가게 이름으로 검색 (예: 교문분식)">
            <button type="button" class="btn small" id="btnPlaceSearch">검색</button>
          </div>
          <div id="placeSearchResults"></div>
        </div>
      </div>

      <div class="fm-map-col">
        <div class="card">
          <div class="card-head">
            <h2>지도</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn secondary small" id="btnSchoolArea">🏫 학교 주변</button>
              <button type="button" class="btn secondary small" id="btnMyLocation">📍 내 위치로</button>
              <button type="button" class="btn secondary small" id="btnToggleAdd">📍 지도 클릭해서 추가</button>
            </div>
          </div>
          <!-- 카테고리 필터는 지도 바로 위에 둬요 — 목록은 지도 오른쪽(fm-list-col)에

    label.style.cssText = 'font-size:11.5px; font-weight:700; color:var(--ink); background:#fff; border:1px solid var(--rule-soft); border-radius:999px; padding:2px 9px; box-shadow:0 1px 5px rgba(0,0,0,0.16); max-width:150px; overflow:hidden; text-overflow:ellipsis;';
    label.textContent = name;
    wrap.appendChild(badge);
    wrap.appendChild(label);
    wrap.addEventListener('click', (e) => { stopMapClick(e); onClick(); });
    return wrap;
  }

  // 검색 결과 핀들 — 새 검색을 하거나(renderSearchResultMarkers가 매번 먼저 지움), 결과 중
  // 하나를 골라 추가 폼으로 넘어가거나, 검색을 취소하면 지도에서 치워져요.
  let searchResultOverlays = [];
  // 마지막 검색 결과 전체(화면 밖이라 핀이 안 뜬 것까지 포함)를 기억해둬요 — 검색 직후엔
  // 지금 보이는 화면 기준으로만 핀을 꽂지만, 그 다음에 교사가 지도를 줌아웃/이동하면
  // 새로 보이는 범위에 맞춰 핀을 다시 계산해서 꽂아줘야 하기 때문이에요(바로 아래
  // 'idle' 리스너가 이 역할을 해요). 검색을 아예 취소하거나 결과가 없을 때는 빈 배열로
  // 리셋해서, 그 뒤 지도를 움직여도 이미 지운 핀이 되살아나지 않게 해요.
  let lastSearchResultData = [];
  function clearSearchResultOverlays(){
    searchResultOverlays.forEach(o => o.setMap(null));
    searchResultOverlays = [];
  }
  function renderSearchResultMarkers(data){
    lastSearchResultData = data;
    clearSearchResultOverlays();
    if(!map || !data.length) return;
    // 검색 결과가 전국 단위로 흩어져 있을 수 있어서, 결과를 다 지도에 꽂고
    // setBounds()로 화면을 맞추면 지도가 학교 근처에서 엉뚱하게 멀리 줌아웃돼버려요
    // (실제로 이게 "분명히 가까운 곳에 있는 가게인데 핀이 안 보인다"처럼 보이던 원인
    // 중 하나였어요 — 핀 자체는 찍히는데, 먼 결과들 때문에 화면이 다 같이 줌아웃돼서
    // 알아보기 힘들었던 거예요). 지금 실제로 보이는 지도 범위(map.getBounds()) 안에
    // 있는 결과만 핀으로 꽂고, 화면은 전혀 움직이지 않아요 — 목록(place-result)에는
    // 여전히 전체 결과가 번호와 함께 다 나오고, 번호는 항상 원래 data 배열 순서를
    // 그대로 쓰므로 화면 밖이라 핀이 안 보이는 결과를 목록에서 클릭해도
    // pickSearchResult()는 그대로 동작해요. 교사가 그 뒤 지도를 줌아웃/이동하면
    // 아래 'idle' 리스너가 이 함수를 다시 불러서, 새로 화면에 들어온 결과의 핀도
    // 마찬가지로 채워져요. 핀의 이름을 누르면(목록 클릭과 달리) 바로 추가 폼으로
    // 넘어가지 않고 onSearchPinClick()이 작은 팝업을 띄워요 — 이미 맛집 목록에 있는
    // 곳이면 그 기존 항목의 팝업(좋아요/별점/수정/제거)을, 아직 없으면 "맛집 목록에
    // 추가" 버튼 하나짜리 팝업을 보여줘요.
    const curBounds = map.getBounds();
    data.forEach((place, i) => {
      const pos = new kakao.maps.LatLng(Number(place.y), Number(place.x));
      if(!curBounds.contain(pos)) return;
      const overlay = new kakao.maps.CustomOverlay({
        position: pos,
        content: makeSearchMarkerEl(i + 1, place.place_name, () => onSearchPinClick(place)),
        yAnchor: 1, zIndex: 5
      });
      overlay.setMap(map);
      searchResultOverlays.push(overlay);
    });
  }

  el('btnMyLocation').addEventListener('click', () => {
    if(!navigator.geolocation){ alert('이 브라우저는 위치 정보를 지원하지 않아요.'); return; }
    navigator.geolocation.getCurrentPosition(
      pos => { if(map){ map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude)); map.setLevel(DEFAULT_MAP_LEVEL); } },
      () => alert('위치 정보를 가져오지 못했어요.')
    );
  });
  el('btnSchoolArea').addEventListener('click', () => {
    if(!map) return;
    map.setCenter(new kakao.maps.LatLng(SCHOOL_LATLNG.lat, SCHOOL_LATLNG.lng));
    map.setLevel(DEFAULT_MAP_LEVEL);
  });

  // ---------- 카카오맵 장소검색으로 추가 ----------
  el('btnPlaceSearch').addEventListener('click', doPlaceSearch);
  // 한글 입력 중(조합 중)에 Enter를 누르면 글자가 아직 다 합쳐지기 전에 검색이 먼저
  // 실행돼서 마지막 글자가 빠진 채로 검색되는 경우가 있어요(예: "홍익분식"을 다 치기
  // 전에 IME의 "조합 확정" Enter가 keydown을 같이 울려서 "홍익분"으로만 검색됨) —
  // isComposing일 때는 무시하고, 조합이 끝난 뒤의 Enter만 검색을 실행해요.
  el('placeSearchInput').addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    doPlaceSearch();
  });

  function fmtDistance(m){
    const n = Number(m);
    if(!n) return '';
    return n >= 1000 ? (n / 1000).toFixed(1) + 'km' : n + 'm';
  }

  // ---- 오타 재검색: 평음/격음(ㄱ↔ㅋ, ㄷ↔ㅌ, ㅂ↔ㅍ, ㅈ↔ㅊ) 혼동과, 마지막 한두 글자가
  // 덜 입력된 경우를 자동으로 다시 검색해봐요. "가츠토랑"(정확히는 "카츠토랑")처럼 흔히
  // 헷갈리는 초성 오타와, IME 조합 중 Enter로 잘린 입력을 둘 다 커버하려는 목적이에요 —
  // 실제 철자 교정 서비스가 아니라 이 두 가지 패턴만 기계적으로 시도해보는 수준이에요.
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const CHO_SWAP = { 0:15, 15:0, 3:16, 16:3, 7:17, 17:7, 12:14, 14:12 }; // ㄱ↔ㅋ, ㄷ↔ㅌ, ㅂ↔ㅍ, ㅈ↔ㅊ
  function decomposeHangul(ch){
    const code = ch.charCodeAt(0) - 0xAC00;
    if(code < 0 || code > 11171) return null;
    return { cho: Math.floor(code / 588), jung: Math.floor((code % 588) / 28), jong: code % 28 };
  }
  function composeHangul(cho, jung, jong){
    return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
  }
  function generateRetryKeywords(keyword){
    const variants = new Set();
    // 1) 음절 하나씩 평음/격음 초성을 바꿔본 변형 (최대 6개까지만 시도)
    for(let i = 0; i < keyword.length && variants.size < 6; i++){
      const d = decomposeHangul(keyword[i]);
      if(!d || !(d.cho in CHO_SWAP)) continue;
      const swapped = composeHangul(CHO_SWAP[d.cho], d.jung, d.jong);
      variants.add(keyword.slice(0, i) + swapped + keyword.slice(i + 1));
    }
    // 2) 마지막 1~2글자가 덜 입력됐을 가능성 — 뒷글자를 줄여서도 시도
    if(keyword.length > 2) variants.add(keyword.slice(0, -1));
    if(keyword.length > 3) variants.add(keyword.slice(0, -2));
    // 3) 띄어쓰기 차이 — "홍익 분식"으로 저장돼 있는데 "홍익분식"으로(또는 그
    //    반대로) 검색하는 경우를 커버해요. 공백을 아예 없앤 버전만 추가로 시도해요
    //    (어느 자리에 공백이 있었는지는 알 수 없지만, 카카오 검색 자체가 토큰
    //    단위로 매칭하기 때문에 공백을 없앤 한 글자 묶음으로도 대개 같은 결과를
    //    찾아줘요).
    if(/\s/.test(keyword)){
      const noSpace = keyword.replace(/\s+/g, '');
      if(noSpace) variants.add(noSpace);
    }
    variants.delete(keyword);
    return Array.from(variants);
  }
  // 정확한 이름(오타/띄어쓰기 변형 포함)으로도 전혀 못 찾았을 때 마지막으로 시도하는
  // "비슷한 이름" 검색이에요 — 키워드 앞 2글자(공백 제외)만으로 넓게 다시 찾아서,
  // 그중 학교에서 가까운 순으로 몇 개를 보여줘요. 완전히 다른 곳일 수도 있으니
  // "정확히 일치하는 결과가 없다"는 걸 안내 문구로 분명히 알려요.
  function similarSearchKeyword(keyword){
    const stripped = keyword.replace(/\s+/g, '');
    if(stripped.length < 2) return null;
    return stripped.slice(0, 2);
  }
  function keywordSearchPromise(keyword, opts){
    return new Promise(resolve => {
      placesService.keywordSearch(keyword, (data, status) => resolve({ data, status }), opts);
    });
  }
  function categorySearchPromise(code, opts){
    return new Promise(resolve => {
      placesService.categorySearch(code, (data, status) => resolve({ data, status }), opts);
    });
  }
  // 지도의 빈 곳(카카오 기본 지도 타일에 그려진 가게 아이콘/라벨)을 클릭했을 때,
  // "정확히 어떤 가게를 눌렀는지" 알려주는 공식 클릭 이벤트가 카카오맵 JS SDK엔
  // 없어서(클릭 좌표만 돌아옴) — 대신 그 좌표 근처(NEARBY_CLICK_RADIUS 이내)의
  // 실제 가게를 음식점(FD6)·카페(CE7) 두 카테고리로 찾아서 가장 가까운 것 하나를
  // "그 가게를 눌렀다"고 간주한다. 이 페이지가 다루는 11개 카테고리(한식~패스트푸드)는
  // 카카오 분류상 전부 이 두 그룹 코드 아래에 들어가 있어서 두 번이면 충분하다.
  const NEARBY_CLICK_RADIUS = 60;
  async function findNearestPlaceNear(latlng){
    const opts = { location: latlng, radius: NEARBY_CLICK_RADIUS, sort: kakao.maps.services.SortBy.DISTANCE };
    const [food, cafe] = await Promise.all([
      categorySearchPromise('FD6', opts),
      categorySearchPromise('CE7', opts)
    ]);
    const candidates = [];
    if(food.status === kakao.maps.services.Status.OK && food.data.length) candidates.push(food.data[0]);
    if(cafe.status === kakao.maps.services.Status.OK && cafe.data.length) candidates.push(cafe.data[0]);
    if(!candidates.length) return null;
    candidates.sort((a, b) => Number(a.distance) - Number(b.distance));
    return candidates[0];
  }

  function renderPlaceResults(results, noticeText){
    const noticeHtml = noticeText ? `<div class="empty-note" style="text-align:left; padding:0 0 8px;">${escapeHtml(noticeText)}</div>` : '';
    el('placeSearchResults').innerHTML = noticeHtml + results.map((place, i) => {
      const metaParts = [];
      if(place.category_name) metaParts.push(place.category_name.split(' > ').pop());
      if(place.distance) metaParts.push(fmtDistance(place.distance) + ' 거리');
      if(place.phone) metaParts.push(place.phone);
      return `
        <div class="place-result" data-idx="${i}">
          <div class="place-result-num">${i + 1}</div>
          <div class="place-result-main">
            <div class="place-result-name">${escapeHtml(place.place_name)}</div>
            <div class="place-result-addr">${escapeHtml(place.road_address_name || place.address_name)}</div>
            ${metaParts.length ? `<div class="place-result-meta">${escapeHtml(metaParts.join(' · '))}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
    el('placeSearchResults').querySelectorAll('.place-result').forEach(row => row.addEventListener('click', () => {
      pickSearchResult(results[Number(row.dataset.idx)]);
    }));
    renderSearchResultMarkers(results);
  }

  async function doPlaceSearch(){
    if(!placesService) return;
    const keyword = el('placeSearchInput').value.trim();
    if(!keyword) return;
    // 검색 자체을 반경으로 제한하지는 않아요(실제 있는 가게가 애매한 경계에서 걸러질
    // 위험) — 대신 sort: DISTANCE로 location(학교 좌표) 기준 가까운 결과가 먼저
    // 오게 해요. 기본값인 정확도(accuracy) 정렬만 쓰면, 전국에 같은 이름의 가게가
    // 여러 곳 있을 때 실제로 학교 근처에 있는 곳이 정확도 점수에서 밀려 상위 8개
    // 밖으로 빠지는 경우가 있었어요(예: "홍익분식" 검색 시 연남동 지점이 전혀 안
    // 뜨는 문제) — 거리 정렬로 바꾸면 학교에서 가까운 곳이 우선 올라와서 이 문제가
    // 줄어들어요. location은 여전히 고정된 학교 좌표를 써요(지도를 이미 다른 곳으로
    // 옮겨봤어도 거리 표시가 안 흔들리게 하려는 목적, 기존과 동일).
    const opts = map
      ? { location: new kakao.maps.LatLng(SCHOOL_LATLNG.lat, SCHOOL_LATLNG.lng), sort: kakao.maps.services.SortBy.DISTANCE }
      : {};
    const first = await keywordSearchPromise(keyword, opts);
    if(first.status === kakao.maps.services.Status.OK && first.data.length){
      renderPlaceResults(first.data.slice(0, 8), null);
      return;
    }
    // 결과가 없으면 오타/미완성 입력일 가능성을 감안해 변형 키워드를 차례로 재시도해요.
    for(const variant of generateRetryKeywords(keyword)){
      const retry = await keywordSearchPromise(variant, opts);
      if(retry.status === kakao.maps.services.Status.OK && retry.data.length){
        renderPlaceResults(retry.data.slice(0, 8), `'${keyword}' 검색 결과가 없어 '${variant}'(으)로 다시 찾았어요.`);
        return;
      }
    }
    // 정확한 이름도, 오타/띄어쓰기 변형도 전부 못 찾았으면 마지막으로 비슷한 이름을
    // 넓게 한 번 더 찾아봐요 — 정확한 매치가 아니라는 걸 안내 문구로 분명히 알려요.
    const similarKeyword = similarSearchKeyword(keyword);
    if(similarKeyword){
      const similar = await keywordSearchPromise(similarKeyword, opts);
      if(similar.status === kakao.maps.services.Status.OK && similar.data.length){
        renderPlaceResults(similar.data.slice(0, 8), `'${keyword}' 검색 결과가 없어요. 비슷한 이름의 장소를 보여드려요.`);
        return;
      }
    }
    el('placeSearchResults').innerHTML = '<div class="empty-note">검색 결과가 없어요. 철자를 확인하거나, 지도를 직접 클릭해서 추가해보세요.</div>';
    lastSearchResultData = [];
    clearSearchResultOverlays();
  }

  function pickSearchResult(place){
    // 검색 목록/지도 위의 다른 검색 핀들은 그대로 두고(다시 검색하기 전까지 유지),
    // 고른 곳으로 지도 위치만 옮기고 저장 폼만 새로 연다.
    resetAddState();
    pendingLatLng = { lat: Number(place.y), lng: Number(place.x) };
    pendingKakaoUrl = place.place_url || null;
    openAddForm();
    el('fName').value = place.place_name || '';
    el('fCategory').value = mapKakaoCategory(place.category_name || '');
    el('fAddress').value = place.road_address_name || place.address_name || '';
    if(map){
      const pos = new kakao.maps.LatLng(pendingLatLng.lat, pendingLatLng.lng);
      tempOverlay = new kakao.maps.CustomOverlay({ position: pos, content: makeOverlayEl(el('fCategory').value, place.place_name || ''), yAnchor: 1 });
      tempOverlay.setMap(map);
      map.setCenter(pos);
      map.setLevel(DEFAULT_MAP_LEVEL);
    }
  }

  // ---------- 지도 클릭해서 추가 ----------
  function renderCategoryDatalist(){
    const used = new Set(spots.map(s => s.category));
    const cats = Array.from(new Set(DEFAULT_CATEGORY_SUGGESTIONS.concat(Array.from(used))));
    el('fmCategoryOptions').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
  }

  function openAddForm(){
    editingId = null;
    el('fName').value = '';
    el('fCategory').value = '';
    el('fDesc').value = '';
    el('fAddress').value = '';
    setMsg('addFormMsg', '', '');
    el('addForm').style.display = 'flex';
  }

  function enterAddMode(){
    addMode = true;
    pendingLatLng = null;
    pendingKakaoUrl = null;
    document.body.classList.add('fm-add-mode');
    el('btnToggleAdd').textContent = '추가 취소';
    el('btnToggleAdd').classList.add('active-mode');
    el('addForm').style.display = 'none';
  }
  // 추가 모드/임시 핀/폼만 정리하고 검색 목록은 건드리지 않는 버전 — 검색 결과 목록에서
  // 다른 항목을 고를 때(pickSearchResult) 이걸 쓰면, 직전에 고르고 있던 항목의 임시 핀만
  // 지우고 목록·지도의 다른 검색 핀들은 그대로 남는다.
  function resetAddState(){
    addMode = false;
    pendingLatLng = null;
    pendingKakaoUrl = null;
    document.body.classList.remove('fm-add-mode');
    el('btnToggleAdd').textContent = '📍 지도 클릭해서 추가';
    el('btnToggleAdd').classList.remove('active-mode');
    if(tempOverlay){ tempOverlay.setMap(null); tempOverlay = null; }
    el('addForm').style.display = 'none';
  }
  function exitAddMode(){
    resetAddState();
    el('placeSearchResults').innerHTML = '';
    lastSearchResultData = [];
    clearSearchResultOverlays();
  }
  el('btnToggleAdd').addEventListener('click', () => {
    if(addMode){ exitAddMode(); } else { enterAddMode(); }
  });

  function onMapClick(mouseEvent){
    const latlng = mouseEvent.latLng;
    if(!addMode){
      // "지도 클릭해서 추가" 모드가 아닐 때 지도 빈 곳을 클릭하면, 검색을 거치지
      // 않아도 그 근처의 실제 가게 정보를 바로 보여줘요(없는 곳을 클릭했으면
      // 조용히 아무 일도 안 일어나요 — 추가하려면 여전히 "지도 클릭해서 추가"
      // 모드를 써야 함).
      if(placesService) findNearbyPlaceAndShowPopup(latlng);
      return;
    }
    pendingLatLng = { lat: latlng.getLat(), lng: latlng.getLng() };
    pendingKakaoUrl = null;
    if(tempOverlay) tempOverlay.setMap(null);
    tempOverlay = new kakao.maps.CustomOverlay({ position: latlng, content: makeOverlayEl(el('fCategory').value || '', ''), yAnchor: 1 });
    tempOverlay.setMap(map);
    document.body.classList.remove('fm-add-mode');
    el('btnToggleAdd').textContent = '추가 취소';
    openAddForm();
  }
  async function findNearbyPlaceAndShowPopup(latlng){
    const token = ++nearbyClickToken;
    const place = await findNearestPlaceNear(latlng);
    if(token !== nearbyClickToken) return; // 그사이 다른 클릭/검색이 있었으면 버림
    if(place) onSearchPinClick(place);
  }

  el('btnCancelForm').addEventListener('click', () => {
    exitAddMode();
    editingId = null;
  });

  el('btnSaveSpot').addEventListener('click', async () => {
    const name = el('fName').value.trim();
    const category = el('fCategory').value.trim() || '기타';
    const description = el('fDesc').value.trim();
    const address = el('fAddress').value.trim();
    if(!name){ setMsg('addFormMsg', '가게 이름을 입력해주세요.', 'error'); return; }
    if(!editingId && !pendingLatLng){ setMsg('addFormMsg', '지도를 클릭하거나 카카오맵 검색으로 위치를 먼저 선택해주세요.', 'error'); return; }

    const btn = el('btnSaveSpot');
    btn.disabled = true;
    if(editingId){
      const { error } = await sb.from('food_spots').update({ name, category, description, address }).eq('id', editingId);
      btn.disabled = false;
      if(error){ setMsg('addFormMsg', '저장하지 못했어요: ' + error.message, 'error'); return; }
    } else {
      const { error } = await sb.from('food_spots').insert({
        name, category, description, address,
        lat: pendingLatLng.lat, lng: pendingLatLng.lng,
        kakao_place_url: pendingKakaoUrl,
        author_id: myUid, author_name: myName
      });
      btn.disabled = false;
      if(error){ setMsg('addFormMsg', '저장하지 못했어요: ' + error.message, 'error'); return; }
    }
    exitAddMode();
    editingId = null;
    await loadSpots();
  });

  function openEditForm(spot){
    editingId = spot.id;
    exitAddMode();
    el('fName').value = spot.name;
    el('fCategory').value = spot.category;
    el('fDesc').value = spot.description || '';
    el('fAddress').value = spot.address || '';
    setMsg('addFormMsg', '', '');
    el('addForm').style.display = 'flex';
    el('addForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function deleteSpot(id){
    if(!confirm('이 맛집을 삭제할까요?')) return;
    const { error } = await sb.from('food_spots').delete().eq('id', id);
    if(error){ alert('삭제하지 못했어요: ' + error.message); return; }
    if(editingId === id){ editingId = null; el('addForm').style.display = 'none'; }
    if(openPopupSpotId === id) closePopup();
    await loadSpots();
  }

  // ---------- 좋아요 ----------
  async function toggleLike(spot){
    const liked = myLikedIds.has(spot.id);
    // 서버의 like_count는 트리거(food_spot_likes_sync)가 알아서 맞춰주니, 여기서는
    // 그 트리거가 할 일과 똑같이(+1/-1) 화면만 먼저 바꿔두고(낙관적 업데이트) 실제
    // insert/delete는 백그라운드로 보낸다 — 매번 다시 불러오지 않아도 즉시 반응한다.
    if(liked){
      myLikedIds.delete(spot.id);
      spot.like_count = Math.max(0, (spot.like_count || 0) - 1);
    } else {
      myLikedIds.add(spot.id);
      spot.like_count = (spot.like_count || 0) + 1;
    }
    renderList();
    refreshOpenPopupIfNeeded(spot.id);
    if(liked){
      const { error } = await sb.from('food_spot_likes').delete().eq('spot_id', spot.id).eq('user_id', myUid);
      if(error){ myLikedIds.add(spot.id); spot.like_count += 1; renderList(); }
    } else {
      const { error } = await sb.from('food_spot_likes').insert({ spot_id: spot.id, user_id: myUid });
      if(error){ myLikedIds.delete(spot.id); spot.like_count = Math.max(0, spot.like_count - 1); renderList(); }
    }
  }

  // ---------- 리뷰(별점+한줄평) ----------
  // 한 사람이 같은 맛집에 리뷰를 여러 개 남기면 평균 별점이 의미 없어지니(food_spot_reviews의
  // unique(spot_id, author_id) 제약과 짝을 맞춰), 저장은 항상 upsert예요 — 이미 남긴 리뷰가
  // 있으면 덮어쓰고, 없으면 새로 만들어요. insert/update를 분기할 필요가 없어서 더 단순해요.
  function ratingFor(spotId){
    const r = ratingStats[spotId];
    return r ? { avg: r.sum / r.count, count: r.count } : { avg: 0, count: 0 };
  }

  async function loadRatingStats(){
    const { data, error } = await sb.from('food_spot_reviews').select('spot_id, rating');
    ratingStats = {};
    if(error) return;
    (data || []).forEach(r => {
      const cur = ratingStats[r.spot_id] || { sum: 0, count: 0 };
      cur.sum += r.rating; cur.count += 1;
      ratingStats[r.spot_id] = cur;
    });
  }

  async function toggleReviews(spotId){
    const area = el('reviews-' + spotId);
    if(!area) return;
    const isOpen = area.style.display !== 'none';
    if(isOpen){ area.style.display = 'none'; return; }
    area.style.display = 'block';
    await loadAndRenderReviews(spotId, area);
  }

  // containerEl을 생략하면 목록(id="reviews-<spotId>")을 찾아 쓰고, 넘기면 그 엘리먼트에
  // 바로 그려요 — 지도 핀 팝업(buildPopupContent)이 같은 리뷰 UI를 재사용하면서도 목록의
  // id="reviews-<spotId>"와 겹치지 않게 하려는 용도예요(같은 id가 문서에 두 번 있으면
  // getElementById가 항상 첫 번째 것만 찾아서 팝업 쪽이 고장 나요).
  async function loadAndRenderReviews(spotId, containerEl){
    const { data, error } = await sb.from('food_spot_reviews').select('*').eq('spot_id', spotId).order('created_at', { ascending: false });
    reviewsCache[spotId] = error ? [] : (data || []);
    renderReviewsArea(spotId, containerEl);
  }

  function renderReviewsArea(spotId, containerEl){
    const area = containerEl || el('reviews-' + spotId);
    if(!area) return;
    const list = reviewsCache[spotId] || [];
    const mine = list.find(r => r.author_id === myUid);
    const sorted = [...list].sort((a, b) => (a.author_id === myUid ? -1 : b.author_id === myUid ? 1 : 0));
    const reviewRows = sorted.length
      ? sorted.map(r => `
          <div class="review-row">
            <div class="review-row-head">
              <span class="review-stars">${starsText(r.rating)}</span>
              <span class="review-author">${escapeHtml(r.author_name)}</span>
              <span class="review-date">${fmtDate(r.created_at)}</span>
            </div>
            ${r.comment ? `<div class="review-comment">${escapeHtml(r.comment)}</div>` : ''}
          </div>
        `).join('')
      : '<div class="empty-note">아직 리뷰가 없어요. 첫 리뷰를 남겨보세요!</div>';

    area.innerHTML = `
      <div class="review-list">${reviewRows}</div>
      <div class="review-form">
        <div class="star-picker"></div>
        <input type="text" class="review-comment-input" maxlength="140" placeholder="한줄 추천평 (선택)" value="${escapeHtml(mine ? (mine.comment || '') : '')}">
        <div class="form-actions">
          <button type="button" class="btn small btnSaveReview">${mine ? '내 리뷰 수정' : '리뷰 남기기'}</button>
          ${mine ? '<button type="button" class="btn secondary small btnDeleteReview">내 리뷰 삭제</button>' : ''}
        </div>
      </div>
    `;

    let selected = mine ? mine.rating : 0;
    const picker = area.querySelector('.star-picker');
    function paintStars(){
      picker.innerHTML = [1, 2, 3, 4, 5].map(n => `<span class="star-pick" data-val="${n}">${n <= selected ? '★' : '☆'}</span>`).join('');
      picker.querySelectorAll('.star-pick').forEach(s => s.addEventListener('click', () => {
        selected = Number(s.dataset.val);
        paintStars();
      }));
    }
    paintStars();

    area.querySelector('.btnSaveReview').addEventListener('click', async () => {
      if(!selected){ alert('별점을 선택해주세요.'); return; }
      const comment = area.querySelector('.review-comment-input').value.trim();
      const { error } = await sb.from('food_spot_reviews')
        .upsert({ spot_id: spotId, author_id: myUid, author_name: myName, rating: selected, comment }, { onConflict: 'spot_id,author_id' });
      if(error){ alert('저장하지 못했어요: ' + error.message); return; }
      await loadAndRenderReviews(spotId, area);
      await loadRatingStats();
      renderList();
      refreshOpenPopupIfNeeded(spotId);
    });

    const delBtn = area.querySelector('.btnDeleteReview');
    if(delBtn) delBtn.addEventListener('click', async () => {
      if(!confirm('내 리뷰를 삭제할까요?')) return;
      const { error } = await sb.from('food_spot_reviews').delete().eq('spot_id', spotId).eq('author_id', myUid);
      if(error){ alert('삭제하지 못했어요: ' + error.message); return; }
      await loadAndRenderReviews(spotId, area);
      await loadRatingStats();
      renderList();
      refreshOpenPopupIfNeeded(spotId);
    });
  }

  // ---------- 목록/필터 ----------
  function allCategories(){
    const set = new Set(spots.map(s => s.category));
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'ko'));
  }

  function renderCategoryPills(){
    const cats = allCategories();
    el('categoryPills').innerHTML = cats.map(c =>
      `<div class="cat-pill ${activeCategories.has(c) ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join('');
    el('categoryPills').querySelectorAll('.cat-pill').forEach(pill => pill.addEventListener('click', () => {
      const c = pill.dataset.cat;
      if(activeCategories.has(c)) activeCategories.delete(c); else activeCategories.add(c);
      renderCategoryPills();
      renderList();
      applyMarkerVisibility();
      fitFilteredBoundsCapped();
    }));
  }

  // 카테고리·내가 올린 곳만·좋아요한 곳만 필터를 바꿀 때, 지금 필터에 해당하는 핀들이
  // 다 보이도록 지도를 그 위치로 옮겨요("카테고리나 목록을 선택하면 그 위치로 지도
  // 이동해서 그 가게만 보여주고" 요청) — fitBoundsToSpots에 FILTERED_BOUNDS_MAX_LEVEL
  // 상한을 같이 넘겨서, 아주 먼 핀 하나가 포함됐다고 전국 단위로 줌아웃돼버리는 예전
  // 버그가 재현되지 않게 막는다. 필터를 전부 끄면 filteredSpots()가 전체 목록을
  // 돌려주므로, 이 경우 자연스럽게 "등록된 맛집 전체 보기"로 돌아간다.
  function fitFilteredBoundsCapped(){
    fitBoundsToSpots(filteredSpots(), { maxLevel: FILTERED_BOUNDS_MAX_LEVEL });
  }

  function filteredSpots(){
    const q = searchQuery.trim().toLowerCase();
    return spots.filter(s => {
      if(activeCategories.size && !activeCategories.has(s.category)) return false;
      if(myOnlyFilter && s.author_id !== myUid) return false;
      if(likedOnlyFilter && !myLikedIds.has(s.id)) return false;
      if(!q) return true;
      return [s.name, s.description, s.address, s.author_name].some(v => (v || '').toLowerCase().includes(q));
    });
  }

  // 목록에만 적용되는 정렬이에요 — 지도 마커는 어차피 겹쳐 보이는 순서가 중요하지 않아서
  // applyMarkerVisibility()는 filteredSpots()의 원래(최신순 로드) 순서를 그대로 써요.
  function sortedFilteredSpots(){
    const list = filteredSpots();
    if(sortMode === 'likes') return [...list].sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
    if(sortMode === 'rating') return [...list].sort((a, b) => ratingFor(b.id).avg - ratingFor(a.id).avg);
    if(sortMode === 'name') return [...list].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    return list; // latest — spots는 이미 created_at desc로 로드돼 있음
  }

  function applyMarkerVisibility(){
    if(!map) return;
    const visibleIds = new Set(filteredSpots().map(s => s.id));
    Object.keys(overlaysById).forEach(id => {
      overlaysById[id].setMap(visibleIds.has(id) ? map : null);
    });
  }

  function renderMyStatsLine(){
    if(!myOnlyFilter){ el('myStatsLine').innerHTML = ''; return; }
    const mine = spots.filter(s => s.author_id === myUid);
    const totalLikes = mine.reduce((sum, s) => sum + (s.like_count || 0), 0);
    const rated = mine.map(s => ratingFor(s.id)).filter(r => r.count);
    const avgRating = rated.length ? (rated.reduce((sum, r) => sum + r.avg, 0) / rated.length).toFixed(1) : '-';
    el('myStatsLine').innerHTML = `<div class="my-stats-line">내가 올린 맛집 <b>${mine.length}곳</b> · 받은 좋아요 <b>${totalLikes}개</b> · 평균 별점 <b>${avgRating}</b></div>`;
  }

  el('fmSearch').addEventListener('input', () => {
    searchQuery = el('fmSearch').value;
    renderList();
    applyMarkerVisibility();
  });
  el('fmSort').addEventListener('change', () => {
    sortMode = el('fmSort').value;
    renderList();
  });
  el('toggleMyOnly').addEventListener('click', () => {
    myOnlyFilter = !myOnlyFilter;
    el('toggleMyOnly').classList.toggle('active', myOnlyFilter);
    renderList();
    applyMarkerVisibility();
    fitFilteredBoundsCapped();
  });
  el('toggleLikedOnly').addEventListener('click', () => {
    likedOnlyFilter = !likedOnlyFilter;
    el('toggleLikedOnly').classList.toggle('active', likedOnlyFilter);
    renderList();
    applyMarkerVisibility();
    fitFilteredBoundsCapped();
  });

  function canManage(s){ return s.author_id === myUid || isAdmin; }

  function popupHtml(s){
    const liked = myLikedIds.has(s.id);
    const rating = ratingFor(s.id);
    return `
      <div class="popup-head"><span class="popup-title">${escapeHtml(s.name)}</span><span class="popup-close">✕</span></div>
      <div class="popup-cat">${escapeHtml(s.category)}</div>
      ${s.description ? `<div class="popup-desc">${escapeHtml(s.description)}</div>` : ''}
      ${s.address ? `<div class="popup-meta">📍 ${escapeHtml(s.address)}</div>` : ''}
      <div class="popup-meta">${escapeHtml(s.author_name)} · ${fmtDate(s.created_at)}</div>
      <div class="popup-meta">${liked ? '❤️' : '🤍'} ${s.like_count || 0} · ⭐ ${rating.count ? rating.avg.toFixed(1) : '-'} (${rating.count})</div>
      ${s.kakao_place_url ? `<a class="popup-kakao-link" href="${escapeHtml(s.kakao_place_url)}" target="_blank" rel="noopener">🗺️ 카카오맵에서 보기 (영업시간 확인)</a>` : ''}
      <div class="popup-actions">
        <button type="button" class="btn ${liked ? '' : 'secondary'} small btnPopupLike">${liked ? '❤️' : '🤍'} 좋아요</button>
        <button type="button" class="btn secondary small btnPopupReviewToggle">⭐ 별점 남기기</button>
        ${canManage(s) ? `
          <button type="button" class="btn secondary small btnPopupEdit">✏️ 수정</button>
        ` : ''}
      </div>
      <div class="popup-reviews" style="display:none;"></div>
    `;
  }

  function refreshOpenPopupIfNeeded(spotId){
    if(openPopupSpotId !== spotId || !popupOverlay) return;
    const s = spots.find(x => x.id === spotId);
    if(!s) return;
    popupOverlay.getContent().innerHTML = '';
    const content = buildPopupContent(s);
    popupOverlay.setContent(content);
  }

  // 지도 핀의 이름(팝업)을 눌렀을 때 바로 "맛집 목록에 추가/제거, 별점 남기기"를 할 수
  // 있게, 목록(renderList)에 있던 좋아요/수정/삭제/리뷰 액션을 팝업에도 그대로 붙여요 —
  // 리뷰 UI는 renderReviewsArea()를 그대로 재사용하되, 목록의 id="reviews-<id>"와 겹치지
  // 않게 이 팝업 안의 .popup-reviews 엘리먼트를 컨테이너로 직접 넘겨요.
  function buildPopupContent(s){
    const content = document.createElement('div');
    content.className = 'fm-popup';
    content.innerHTML = popupHtml(s);
    // 팝업 전체를 감싸는 루트 하나에 지도 자신의 click 전파를 막는 리스너를 한 번만
    // 달아요 — 안에서 어떤 버튼을 누르든(좋아요/별점/수정 등) 그 클릭이 지도의
    // 'click' 이벤트로도 전달돼 onMapClick()의 비동기 "근처 가게 찾기"가 실행되고,
    // 그 결과가 togglePopup()을 다시 호출하면서 방금 한 동작을 덮어써버리는 걸
    // 막기 위해서예요(makeOverlayEl의 stopMapClick과 같은 이유).
    content.addEventListener('click', stopMapClick);
    content.querySelector('.popup-close').addEventListener('click', closePopup);
    content.querySelector('.btnPopupLike').addEventListener('click', () => toggleLike(s));
    const reviewsArea = content.querySelector('.popup-reviews');
    content.querySelector('.btnPopupReviewToggle').addEventListener('click', async () => {
      const isOpen = reviewsArea.style.display !== 'none';
      if(isOpen){ reviewsArea.style.display = 'none'; return; }
      reviewsArea.style.display = 'block';
      await loadAndRenderReviews(s.id, reviewsArea);
    });
    if(canManage(s)){
      content.querySelector('.btnPopupEdit').addEventListener('click', () => { closePopup(); openEditForm(s); });
    }
    return content;
  }

  function togglePopup(spotId){
    if(openPopupSpotId === spotId){ closePopup(); return; }
    closePopup();
    const s = spots.find(x => x.id === spotId);
    if(!s || !map) return;
    popupOverlay = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(s.lat, s.lng), content: buildPopupContent(s), yAnchor: 1.3, zIndex: 10
    });
    popupOverlay.setMap(map);
    openPopupSpotId = spotId;
  }
  function closePopup(){
    if(popupOverlay){ popupOverlay.setMap(null); popupOverlay = null; }
    openPopupSpotId = null;
    openSearchPlaceUrl = null;
  }

  // 아직 저장되지 않은 카카오 검색 결과 핀(이름)을 눌렀을 때 — 이미 내가(또는 다른
  // 교사가) 같은 장소(kakao_place_url 기준)를 맛집 목록에 추가해뒀다면 새로 추가하는
  // 대신 그 기존 항목의 팝업(좋아요/별점/수정)을 그대로 열어주고, 아직 없다면
  // "맛집 목록에 추가" 버튼 하나짜리 작은 팝업을 띄워요.
  function findSpotByPlaceUrl(url){
    if(!url) return null;
    return spots.find(s => s.kakao_place_url === url) || null;
  }
  // kakao_place_url이 있으면 그걸로 먼저 찾고, 없으면(= 지도 클릭으로 좌표만
  // 저장된 맛집이라 kakao_place_url이 null인 경우) 상호명 완전 일치로 한 번 더
  // 찾는다 — "지도에서 가게를 클릭했는데 이미 등록된 곳인데도 '추가' 팝업이
  // 뜬다"는 보고의 실제 원인 중 하나: 근처 가게 조회(categorySearch)가 돌려주는
  // place_url은 항상 있지만, 그 가게가 애초에 지도 클릭으로(place_url 없이)
  // 등록됐다면 place_url만으로는 절대 매칭되지 않는다.
  function findExistingSpotForPlace(place){
    return findSpotByPlaceUrl(place.place_url)
      || spots.find(s => s.name === (place.place_name || '').trim())
      || null;
  }
  // 팝업의 "맛집 목록에 추가" 버튼은 누르는 즉시 저장해요 — 카카오 검색 결과에
  // 이름/주소/좌표/장소 링크가 이미 다 있으니 폼을 거쳐 다시 확인받을 필요가
  // 없다는 명시적 요청이었어요. 다만 카테고리는 자동 추정(mapKakaoCategory)이
  // 틀리는 경우가 있어서(예: "베이커리"처럼 이 페이지 기본 카테고리 목록에 아예
  // 없는 종류), 추정값을 미리 채워둔 채로 직접 타이핑해 고칠 수 있는 입력칸을
  // 팝업에 함께 둬요 — 추가 버튼을 누르는 순간의 입력값을 그대로 저장한다.
  async function quickAddFromSearchPin(place, category){
    const name = (place.place_name || '').trim();
    const address = place.road_address_name || place.address_name || '';
    const lat = Number(place.y), lng = Number(place.x);
    const { error } = await sb.from('food_spots').insert({
      name, category: (category || '').trim() || '기타', description: '', address, lat, lng,
      kakao_place_url: place.place_url || null,
      author_id: myUid, author_name: myName
    });
    if(error) return { ok: false, error: error.message };
    return { ok: true };
  }
  function buildSearchAddPopupContent(place){
    const content = document.createElement('div');
    content.className = 'fm-popup';
    const addr = place.road_address_name || place.address_name || '';
    const guessedCategory = mapKakaoCategory(place.category_name || '');
    content.innerHTML = `
      <div class="popup-head"><span class="popup-title">${escapeHtml(place.place_name || '')}</span><span class="popup-close">✕</span></div>
      ${addr ? `<div class="popup-meta">📍 ${escapeHtml(addr)}</div>` : ''}
      <input type="text" class="addPinCategoryInput" list="fmCategoryOptions" value="${escapeHtml(guessedCategory)}" placeholder="종류 (직접 입력 가능)" style="margin-top:8px; width:100%; font-family:inherit; font-size:12.5px; padding:6px 9px; border:1px solid var(--rule-soft); border-radius:8px;">
      <div class="popup-actions">
        <button type="button" class="btn small btnAddFromSearchPin">➕ 맛집 목록에 추가</button>
      </div>
    `;
    // buildPopupContent와 같은 이유 — 이 팝업 안(카테고리 입력칸 포커스 포함)을
    // 눌러도 지도 자신의 click으로 전달되지 않게 막아요.
    content.addEventListener('click', stopMapClick);
    content.querySelector('.popup-close').addEventListener('click', closePopup);
    content.querySelector('.btnAddFromSearchPin').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const category = content.querySelector('.addPinCategoryInput').value;
      btn.disabled = true;
      btn.textContent = '추가하는 중…';
      const result = await quickAddFromSearchPin(place, category);
      if(!result.ok){
        alert('추가하지 못했어요: ' + result.error);
        btn.disabled = false;
        btn.textContent = '➕ 맛집 목록에 추가';
        return;
      }
      closePopup();
      await loadSpots();
    });
    return content;
  }
  function onSearchPinClick(place){
    const existing = findExistingSpotForPlace(place);
    if(existing){
      if(map){ map.setCenter(new kakao.maps.LatLng(existing.lat, existing.lng)); }
      togglePopup(existing.id);
      return;
    }
    const key = place.place_url || place.place_name;
    if(openSearchPlaceUrl === key){ closePopup(); return; }
    closePopup();
    if(!map) return;
    popupOverlay = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(Number(place.y), Number(place.x)),
      content: buildSearchAddPopupContent(place), yAnchor: 1.3, zIndex: 10
    });
    popupOverlay.setMap(map);
    openSearchPlaceUrl = key;
  }

  function renderList(){
    renderMyStatsLine();
    const list = sortedFilteredSpots();
    if(!list.length){ el('spotList').innerHTML = '<div class="empty-note">조건에 맞는 맛집이 없어요.</div>'; return; }
    el('spotList').innerHTML = list.map(s => {
      const liked = myLikedIds.has(s.id);
      const rating = ratingFor(s.id);
      return `
        <div class="spot-block">
          <div class="spot-item" data-id="${s.id}">
            <div class="spot-item-main">
              <div class="spot-item-title">${escapeHtml(s.name)}</div>
              <div class="spot-item-sub">
                <span class="spot-item-cat">${escapeHtml(s.category)}</span>
                ${s.description ? `<span class="spot-item-desc">${escapeHtml(s.description)}</span>` : ''}
              </div>
            </div>
            <div class="spot-item-side">
              <button type="button" class="like-btn ${liked ? 'liked' : ''}" data-like="${s.id}">${liked ? '❤️' : '🤍'} ${s.like_count || 0}</button>
              <button type="button" class="review-toggle-btn" data-review="${s.id}">⭐ ${rating.count ? rating.avg.toFixed(1) : '-'} (${rating.count})</button>
              ${canManage(s) ? `
                <div class="spot-item-actions">
                  <button type="button" class="btn secondary small" data-edit="${s.id}">수정</button>
                  <button type="button" class="btn danger small" data-del="${s.id}">삭제</button>
                </div>
              ` : ''}
            </div>
          </div>
          <div class="spot-item-details">
            ${s.address ? `<div class="sid-row">📍 ${escapeHtml(s.address)}</div>` : ''}
            <div class="sid-row">${escapeHtml(s.author_name)} · ${fmtDate(s.created_at)}</div>
            ${s.kakao_place_url ? `<div class="sid-row"><a href="${escapeHtml(s.kakao_place_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🗺️ 카카오맵에서 보기 (영업시간 확인)</a></div>` : ''}
          </div>
          <div class="spot-reviews" id="reviews-${s.id}" style="display:none;"></div>
        </div>
      `;
    }).join('');

    el('spotList').querySelectorAll('.spot-item').forEach(row => row.addEventListener('click', (e) => {
      if(e.target.closest('button') || e.target.closest('a')) return;
      const block = row.closest('.spot-block');
      if(block) block.classList.toggle('open');
      const spot = spots.find(s => s.id === row.dataset.id);
      if(!spot || !map) return;
      map.setCenter(new kakao.maps.LatLng(spot.lat, spot.lng));
      map.setLevel(DEFAULT_MAP_LEVEL);
      togglePopup(spot.id);
    }));
    el('spotList').querySelectorAll('[data-like]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const spot = spots.find(s => s.id === btn.dataset.like);
      if(spot) toggleLike(spot);
    }));
    el('spotList').querySelectorAll('[data-review]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleReviews(btn.dataset.review);
    }));
    el('spotList').querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const spot = spots.find(s => s.id === btn.dataset.edit);
      if(spot) openEditForm(spot);
    }));
    el('spotList').querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSpot(btn.dataset.del);
    }));
  }

  function renderMarkers(){
    if(!map) return;
    Object.values(overlaysById).forEach(o => o.setMap(null));
    Object.keys(overlaysById).forEach(k => delete overlaysById[k]);
    spots.forEach(s => {
      if(typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
      const overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(s.lat, s.lng),
        content: makeOverlayEl(s.category, s.name, () => togglePopup(s.id)),
        yAnchor: 1
      });
      overlaysById[s.id] = overlay;
    });
    applyMarkerVisibility();
  }

  // list(좌표 있는 항목만) 전체가 들어오도록 지도 범위를 맞춰요. padding을 넉넉히 줘서
  // 핀들이 화면 가장자리에 딱 붙지 않고 "조금 축소된" 느낌으로 여유 있게 보이게 하고,
  // maxLevel이 주어지면 그보다 더 축소되지는 않도록 결과 레벨을 깎아요(아주 먼 핀 하나
  // 때문에 지도가 전국 단위로 멀리 줌아웃돼버리는 걸 막기 위함) — 카테고리/내가 올린
  // 곳만/좋아요한 곳만 필터를 고를 때만 쓴다. **최초 로드/새로고침에는 더 이상 쓰지
  // 않는다** — 한때 등록된 맛집 전체로 범위를 맞추는 걸 최초 로드 기본값으로 삼았다가,
  // 상한을 걸어도 "첫 화면이 '학교 주변'과 다르게 보인다"는 문제가 남아있어서(사용자:
  // "기본 화면과 새로고침 시 화면은 '학교 주변'을 클릭했을 때 나오는 것과 같게"), 최초
  // 로드는 이 함수를 아예 호출하지 않고 지도 생성 시의 고정값(SCHOOL_LATLNG,
  // DEFAULT_MAP_LEVEL — "🏫 학교 주변" 버튼과 완전히 동일한 값)을 그대로 쓰도록
  // 되돌렸다 — 등록된 맛집 전체를 보려면 교사가 직접 줌아웃하거나 카테고리 필터를
  // 쓰면 된다(그 경우는 이 함수가 여전히 담당한다).
  function fitBoundsToSpots(list, opts){
    if(!map) return false;
    const pts = list.filter(s => typeof s.lat === 'number' && typeof s.lng === 'number');
    if(!pts.length) return false;
    if(pts.length === 1){
      map.setCenter(new kakao.maps.LatLng(pts[0].lat, pts[0].lng));
      map.setLevel((opts && opts.maxLevel) ? Math.min(DEFAULT_MAP_LEVEL, opts.maxLevel) : DEFAULT_MAP_LEVEL);
      return true;
    }
    const bounds = new kakao.maps.LatLngBounds();
    pts.forEach(s => bounds.extend(new kakao.maps.LatLng(s.lat, s.lng)));
    map.setBounds(bounds, 48, 48, 48, 48);
    if(opts && opts.maxLevel && map.getLevel() > opts.maxLevel){
      map.setLevel(opts.maxLevel);
    }
    return true;
  }

  async function loadMyLikes(){
    const { data, error } = await sb.from('food_spot_likes').select('spot_id').eq('user_id', myUid);
    if(!error) myLikedIds = new Set((data || []).map(r => r.spot_id));
  }

  async function loadSpots(){
    const { data, error } = await sb.from('food_spots')
      .select('id, name, category, description, address, lat, lng, kakao_place_url, author_id, author_name, like_count, created_at')
      .order('created_at', { ascending: false });
    if(error){ setMsg('listMsg', '불러오지 못했어요: ' + error.message, 'error'); return; }
    spots = data || [];
    setMsg('listMsg', '', '');
    renderCategoryDatalist();
    renderCategoryPills();
    renderMarkers();
    renderList();
  }

  await loadMyLikes();
  await loadRatingStats();
  await loadSpots();
  // 폰트/레이아웃이 뒤늦게 자리잡으며 지도 컨테이너 크기가 처음 계산값과 달라질 수 있어서
  // 한 번 더 크기를 재계산해요 — 안 하면 지도가 일부만 채워진 채로 보일 수 있어요.
  if(map) setTimeout(() => map.relayout(), 200);
})();
</script>
